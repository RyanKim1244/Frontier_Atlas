name: Build and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy sympy mpmath
      - name: Tools for figures not yet in the cache (Asymptote, TeX, pdftocairo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends asymptote texlive-latex-base texlive-pictures texlive-latex-extra poppler-utils
      - name: Build the site from the pipeline
        run: python3 -I pipeline/atlas/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

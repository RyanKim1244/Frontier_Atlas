m whose optimal solutions are automatically integers."},{"field":"geometry","note":"Feasible regions are convex polyhedra and the simplex method walks along their edges, which makes questions about the diameters of polytopes, such as the Hirsch conjecture disproved by Santos in 2010, questions about this algorithm."}],"refs":["Chvátal, Linear Programming","Matoušek & Gärtner, Understanding and Using Linear Programming","Strang, Introduction to Linear Algebra"],"status":null,"aliases":["LP","linear optimisation","linear optimization","simplex method","LP duality","duality theorem","feasible region","corner point method","shadow price","complementary slackness","transportation problem","assignment problem"],"fields":["optimisation","linear-algebra","computer-science"],"stage":"school","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":9,"fixed":1}},{"id":"convex-optimisation","band":"numerics","title":"Convex optimisation","short":"Convex optimisation","pre":["convexity","lagrange-multipliers","inner-products"],"sum":"A convex optimisation problem minimises a convex function over a convex set, described by convex inequality constraints $f_i(x) \\le 0$ and linear equations $Ax = b$. Convexity makes every local minimum global, turns the first-order condition into a complete test for optimality, and gives a dual problem whose value equals the primal one under Slater's condition, which leads to the KKT conditions and to algorithms that provably find the optimum.","key":["\\text{minimise } f_0(x) \\ \\text{ subject to } \\ f_i(x) \\le 0\\ (i = 1, \\dots, m),\\ \\ Ax = b, \\qquad f_0, \\dots, f_m \\text{ convex}","f(y) \\ge f(x) + \\nabla f(x)^{\\mathsf T}(y - x) \\quad \\text{for all } x, y","g(\\lambda, \\nu) = \\inf_x L(x, \\lambda, \\nu) \\le p^\\star \\ \\ (\\lambda \\ge 0), \\qquad \\max_{\\lambda \\ge 0,\\,\\nu} g(\\lambda, \\nu) = p^\\star \\text{ under Slater's condition}"],"why":"Whether a problem is convex is the practical line between optimisation problems that can be solved reliably at scale and those that in general cannot; least squares, linear programs, support vector machines, portfolio selection and many control and signal-processing tasks are all convex.","msc":["90C25"],"links":[{"field":"statistics","note":"The lasso, logistic regression and maximum likelihood for exponential families are convex problems, so their estimates are global optima that standard solvers compute reliably."},{"field":"ai-research","note":"Support vector machines are trained by solving a convex quadratic program, and the KKT conditions explain why only the support vectors, the points on or inside the margin, determine the classifier."}],"refs":["Boyd & Vandenberghe, Convex Optimization","Rockafellar, Convex Analysis","Bertsekas, Convex Optimization Theory"],"status":null,"aliases":["convex optimization","convex programming","convex program","Lagrange duality","Lagrangian dual","KKT conditions","Karush-Kuhn-Tucker conditions","Slater's condition","strong duality","quadratic programming","semidefinite programming","interior-point method"],"fields":["optimisation","real-analysis"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":9,"fixed":0}},{"id":"gradient-descent","band":"numerics","title":"Gradient descent and stochastic optimisation","short":"Gradient descent","pre":["partial-derivatives","convexity"],"sum":"Gradient descent minimises a function by repeatedly stepping against its gradient, $x_{k+1} = x_k - \\eta\\,\\nabla f(x_k)$, the direction of steepest local decrease. With step $\\eta = 1/L$ for an $L$-smooth function each step lowers $f$ by at least $\\|\\nabla f(x_k)\\|^2/(2L)$; for $\\mu$-strongly convex functions the gap to the minimum shrinks geometrically at rate $1 - \\mu/L$. Stochastic gradient descent replaces the gradient by a cheap random estimate, which is how large machine-learning models are trained.","key":["x_{k+1} = x_k - \\eta\\,\\nabla f(x_k)","f\\!\\left(x - \\tfrac1L \\nabla f(x)\\right) \\le f(x) - \\tfrac{1}{2L}\\|\\nabla f(x)\\|^2","f(x_k) - f^\\star \\le \\left(1 - \\tfrac{\\mu}{L}\\right)^k \\big(f(x_0) - f^\\star\\big)"],"why":"It needs only gradients, which can be computed for functions of billions of variables, so it is the workhorse for fitting statistical models and training neural networks; its convergence theory explains why badly scaled problems are slow and how step sizes should be chosen.","msc":["90C30","65K10","62L20"],"links":[{"field":"statistics","note":"Logistic regression and other maximum-likelihood fits are computed by gradient methods, and stochastic gradient descent is a special case of the Robbins-Monro stochastic approximation scheme."},{"field":"numerical-analysis","note":"Gradient descent on $\\frac12 x^{\\mathsf T}Ax - b^{\\mathsf T}x$ with $A$ symmetric positive definite is an iterative solver for $Ax = b$, and its slow convergence for large condition numbers motivates the conjugate gradient method and preconditioning."}],"refs":["Nocedal & Wright, Numerical Optimization","Nesterov, Lectures on Convex Optimization","Boyd & Vandenberghe, Convex Optimization"],"status":null,"aliases":["steepest descent","gradient method","stochastic gradient descent","SGD","mini-batch gradient descent","learning rate","step size","descent lemma","momentum","Nesterov acceleration","condition number","Polyak-Lojasiewicz inequality"],"fields":["optimisation","ai-research","calculus"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":10,"fixed":1}},{"id":"primality","band":"computation","title":"Primality testing","short":"Primality testing","pre":["fermat-euler","quadratic-residues","algorithms"],"sum":"The Fermat test fails on Carmichael numbers such as $561$. Miller–Rabin is fast and probabilistic; Agrawal, Kayal and Saxena (2002) gave the first deterministic polynomial-time test.","key":["n \\nmid a,\\ a^{n-1} \\not\\equiv 1 \\pmod n \\ \\Longrightarrow\\ n \\text{ composite}"],"why":"Generating RSA keys requires finding large primes quickly.","msc":["11Y11"],"links":[{"field":"computer-science","note":"AKS answered a decades-old complexity question: PRIMES is in P."},{"field":"cryptography","note":"Key generation."}],"refs":["Crandall & Pomerance, Prime Numbers: A Computational Perspective"],"status":null,"aliases":["Miller-Rabin","AKS","Carmichael","pseudoprime"],"fields":["number-theory","computer-science"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":10,"fixed":0}},{"id":"rsa","band":"computation","title":"RSA and public-key cryptography","short":"RSA","pre":["fermat-euler","crt","mod-inverse"],"sum":"Rivest, Shamir and Adleman (1977): publish $n = pq$ and $e$, keep $d = e^{-1} \\bmod \\varphi(n)$. Encryption is $c = m^e \\bmod n$ and decryption $m = c^d \\bmod n$. Security rests on the difficulty of factoring $n$.","key":["m^{ed} \\equiv m \\pmod n \\quad \\text{when } ed \\equiv 1 \\pmod{\\varphi(n)}"],"why":"Number theory in daily use, and the reason factoring is studied so intensely.","msc":["94A60","11Y05"],"links":[{"field":"cryptography","note":"The first widely deployed public-key system."},{"field":"quantum-computing","note":"Shor's algorithm (1994) would factor $n$ in polynomial time on a large quantum computer."}],"refs":["Crandall & Pomerance, Prime Numbers: A Computational Perspective"],"status":null,"aliases":["public key","factoring"],"fields":["cryptography","number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":8,"fixed":0}},{"id":"discrete-log","band":"computation","title":"Discrete logarithms and Diffie–Hellman","short":"Discrete logarithm","pre":["order-primroot"],"sum":"Given a primitive root $g$ modulo $p$ and $h$, find $x$ with $g^x \\equiv h$. Diffie and Hellman (1976) used its difficulty for key exchange: Alice sends $g^a$, Bob $g^b$, both compute $g^{ab}$.","key":["g^x \\equiv h \\pmod p"],"why":"Baby-step giant-step solves it in about $\\sqrt p$ steps in any group; modulo $p$, index calculus is much faster, but for well-chosen elliptic curve groups nothing much faster than square root is known.","msc":["94A60","11Y16"],"links":[{"field":"cryptography","note":"Diffie–Hellman key exchange."},{"field":"quantum-computing","note":"Shor's algorithm also computes discrete logarithms."}],"refs":["Crandall & Pomerance, Prime Numbers: A Computational Perspective"],"status":null,"aliases":["Diffie-Hellman","baby-step giant-step"],"fields":["cryptography","number-theory","computer-science"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":8,"fixed":1}},{"id":"p-vs-np","band":"computation","title":"P versus NP","short":"P vs NP","pre":["graph-basics","algorithms","computability"],"sum":"Is every problem whose solutions can be checked in polynomial time also solvable in polynomial time? Most researchers expect $\\mathrm P \\ne \\mathrm{NP}$; the barrier results on relativisation, natural proofs and algebrisation show that broad classes of known techniques cannot settle it (the natural-proofs barrier assumes strong pseudorandom functions exist).","key":["\\mathrm P \\overset{?}{=} \\mathrm{NP}"],"why":"A Millennium Prize Problem; modern cryptography assumes the answer is no.","msc":["68Q15"],"links":[{"field":"cryptography","note":"Public-key cryptography needs one-way functions, which require $\\mathrm P \\ne \\mathrm{NP}$."},{"field":"logic","note":"Descriptive complexity recasts the question in finite model theory."}],"refs":["Sipser, Introduction to the Theory of Computation","Carlson, Jaffe & Wiles (eds.), The Millennium Prize Problems"],"status":"open","aliases":["NP-complete","complexity","Cook–Levin","Millennium"],"fields":["computer-science","logic"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":0,"research":1,"examples":0},"nprob":0,"lesson":{"minutes":16,"checks":5,"fixed":0}},{"id":"algorithms","band":"computation","title":"Algorithms and their complexity","short":"Algorithms","pre":["induction","asymptotics"],"sum":"An algorithm is a finite, unambiguous procedure that turns every valid input into the correct output after finitely many steps. Its time complexity counts how many basic operations it performs, as a function of the input size $n$, in the worst case; asymptotic notation then compares algorithms by growth rate, for example $O(\\log n)$ for binary search against $\\Theta(n\\log n)$ for merge sort and $\\Theta(n^2)$ for insertion sort.","key":["\\text{binary search in a sorted list of } n \\text{ items uses at most } \\lfloor \\log_2 n \\rfloor + 1 \\text{ comparisons}","T(n) = 2T(n/2) + \\Theta(n) \\implies T(n) = \\Theta(n \\log n)","\\text{every comparison sort needs at least } \\lceil \\log_2 n! \\rceil = \\Theta(n\\log n) \\text{ comparisons in the worst case}"],"why":"For a million items, an $n\\log_2 n$ algorithm does about $2\\times 10^7$ basic steps while an $n^2$ one does $10^{12}$: the difference between a fraction of a second and many minutes. Complexity analysis is how one predicts this before running anything, and it underlies questions such as whether factoring is hard enough to keep RSA safe.","msc":["68W40","68Q25"],"links":[{"field":"combinatorics","note":"Running times of recursive algorithms are recurrence relations, solved with the same telescoping, induction and generating-function methods used for counting problems."},{"field":"number-theory","note":"The Euclidean algorithm and fast modular exponentiation run in a number of steps proportional to the number of digits, which is what makes computational number theory practical."},{"field":"optimisation","note":"Dynamic programming solves discrete optimisation problems such as shortest routes and knapsack packing by combining optimal answers to smaller subproblems."}],"refs":["Cormen, Leiserson, Rivest & Stein, Introduction to Algorithms","Rosen, Discrete Mathematics and Its Applications","Kleinberg & Tardos, Algorithm Design"],"status":null,"aliases":["algorithm analysis","time complexity","running time","big-O analysis","divide and conquer","master theorem","sorting algorithms","binary search","dynamic programming","recursive algorithms"],"fields":["computer-science"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":12,"fixed":1}},{"id":"automata","band":"computation","title":"Finite automata and regular languages","short":"Automata","pre":["sets-relations","induction"],"sum":"A finite automaton reads a string one symbol at a time, moving between finitely many states, and accepts or rejects the string according to the state it ends in. The languages recognised this way, the regular languages, are exactly those described by regular expressions; because the machine has only finite memory, languages such as $\\{0^n1^n : n \\ge 0\\}$ are not regular, as the pumping lemma shows.","key":["M = (Q, \\Sigma, \\delta, q_0, F), \\quad L(M) = \\{ w \\in \\Sigma^* : \\delta^*(q_0, w) \\in F \\}","\\text{DFA} \\iff \\text{NFA} \\iff \\text{regular expression} \\quad \\text{(Kleene's theorem, subset construction)}","L \\text{ regular} \\implies \\exists p \\ge 1\\ \\forall w \\in L,\\ |w| \\ge p\\ \\exists x,y,z:\\ w = xyz,\\ |xy| \\le p,\\ |y| \\ge 1,\\ xy^iz \\in L\\ \\forall i \\ge 0"],"why":"Finite automata are the simplest model of a computer with bounded memory, and they are used directly in text search, lexical analysis in compilers, digital circuit design and protocol verification. They are also the first rung of the hierarchy of machine models that leads to Turing machines and the limits of computation.","msc":["68Q45"],"links":[{"field":"combinatorics","note":"Counting the strings of length $n$ accepted by an automaton reduces to powers of its transition matrix, so such counts always satisfy a linear recurrence and have rational generating functions."},{"field":"formal-verification","note":"Model checking represents system behaviours and specifications as automata and decides properties by product constructions and emptiness tests."},{"field":"algebra","note":"Each automaton generates a transition monoid, and the Myhill–Nerode theorem identifies the minimal automaton with the quotient of strings by an equivalence relation."}],"refs":["Sipser, Introduction to the Theory of Computation","Hopcroft, Motwani & Ullman, Introduction to Automata Theory, Languages, and Computation","Rosen, Discrete Mathematics and Its Applications"],"status":null,"aliases":["finite-state machine","DFA","NFA","deterministic finite automaton","nondeterministic finite automaton","regular language","regular expression","pumping lemma","Kleene's theorem","Myhill-Nerode theorem","subset construction"],"fields":["computer-science","logic"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":8,"fixed":1}},{"id":"computability","band":"computation","title":"Turing machines and computability","short":"Computability","pre":["automata"],"sum":"A Turing machine is a finite automaton equipped with an unbounded tape it can read, write and move along; by the Church–Turing thesis, it captures exactly what any algorithm can compute. Some well-posed problems have no algorithm at all: the halting problem, deciding whether a given machine halts on a given input, is undecidable, by a diagonal argument.","key":["\\mathrm{HALT} = \\{ \\langle M, w \\rangle : M \\text{ halts on input } w \\} \\text{ is recognisable but not decidable}","L \\text{ decidable} \\iff L \\text{ and } \\overline{L} \\text{ are both recognisable}","\\text{Rice: for every nontrivial property } P \\text{ of recognisable languages, } \\{\\langle M \\rangle : L(M) \\text{ has } P\\} \\text{ is undecidable}"],"why":"Computability draws the outer boundary of what computers can ever do, independent of speed or memory: no program can reliably detect whether arbitrary programs loop forever, and problems as concrete as solving Diophantine equations in integers turn out to have no general algorithm. The same diagonal idea underlies Gödel's incompleteness theorems.","msc":["03D10","68Q04"],"links":[{"field":"number-theory","note":"The Matiyasevich–Robinson–Davis–Putnam theorem shows that no algorithm decides whether a polynomial equation with integer coefficients has an integer solution, answering Hilbert's tenth problem negatively."},{"field":"algebra","note":"The Novikov–Boone theorem gives a finitely presented group whose word problem, deciding whether a word in the generators equals the identity, is undecidable."},{"field":"formal-verification","note":"Rice's theorem explains why program verifiers must either restrict the programs they accept, require human-supplied proofs, or sometimes answer 'unknown'."}],"refs":["Sipser, Introduction to the Theory of Computation","Hopcroft, Motwani & Ullman, Introduction to Automata Theory, Languages, and Computation","Boolos, Burgess & Jeffrey, Computability and Logic"],"status":null,"aliases":["Turing machine","halting problem","decidability","undecidable problem","Church-Turing thesis","recursively enumerable","recognisable language","Rice's theorem","universal Turing machine","busy beaver","recursion theory"],"fields":["computer-science","logic"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":6,"fixed":0}}],"events":[{"id":"plimpton","y":-1800,"label":"c. 1800 BC","title":"Plimpton 322","who":"Old Babylonian scribe","text":"A clay tablet listing Pythagorean triples.","nodes":["pythagorean"]},{"id":"euclid","y":-300,"label":"c. 300 BC","title":"Elements","who":"Euclid","text":"The Euclidean algorithm and the infinitude of primes.","nodes":["divisibility","fta"]},{"id":"sunzi","y":400,"label":"3rd–5th c.","title":"The remainder problem of the Sunzi Suanjing","who":"Sunzi","text":"Find a number leaving remainders $2, 3, 2$ on division by $3, 5, 7$: the origin of the Chinese remainder theorem.","nodes":["crt"]},{"id":"brahmagupta","y":628,"label":"628","title":"Brāhmasphuṭasiddhānta","who":"Brahmagupta","text":"Composition of solutions of $x^2 - dy^2 = k$.","nodes":["pell"]},{"id":"fermat-little","y":1640.8,"label":"1640","title":"Fermat's little theorem","who":"Pierre de Fermat","text":"Stated $a^{p-1} \\equiv 1 \\pmod p$ in a letter, without proof. In a December letter he also stated the two-squares theorem.","nodes":["fermat-euler","sums-of-squares"]},{"id":"gamma","y":1729,"label":"1729","title":"The gamma function","who":"Leonhard Euler","text":"Interpolated $n!$ to non-integers in letters to Goldbach.","nodes":["gamma"]},{"id":"basel","y":1735,"label":"1735","title":"The Basel problem: $\\zeta(2) = \\pi^2/6$","who":"Leonhard Euler","text":"Summed $\\sum 1/n^2$.","nodes":["series","zeta"]},{"id":"euler-product","y":1737,"label":"1737","title":"The Euler product","who":"Leonhard Euler","text":"$\\sum n^{-s} = \\prod_p (1-p^{-s})^{-1}$, and with it the divergence of $\\sum 1/p$.","nodes":["dirichlet-series","fta"]},{"id":"goldbach-letter","y":1742,"label":"1742","title":"Goldbach's letter to Euler","who":"Christian Goldbach","text":"Conjectured that every even number is a sum of two primes.","nodes":["goldbach"]},{"id":"euler-two-squares","y":1749,"label":"1749","title":"Proof of the two-squares theorem","who":"Leonhard Euler","text":"Proved that primes $p \\equiv 1 \\pmod 4$ are sums of two squares.","nodes":["sums-of-squares"]},{"id":"euler-totient","y":1763,"label":"1763","title":"Euler's theorem and the totient","who":"Leonhard Euler","text":"Generalised Fermat to $a^{\\varphi(n)} \\equiv 1 \\pmod n$.","nodes":["fermat-euler","arithmetic-functions"]},{"id":"lagrange-pell","y":1768,"label":"1768","title":"Pell's equation always solvable","who":"Joseph-Louis Lagrange","text":"Proved $x^2 - dy^2 = 1$ has a nontrivial solution for every non-square $d$.","nodes":["pell","continued-fractions"]},{"id":"lagrange-four","y":1770,"label":"1770","title":"Four squares; Waring's problem; Wilson's theorem","who":"Lagrange, Edward Waring","text":"Lagrange proved every integer is a sum of four squares. Waring's Meditationes Algebraicae stated the problem now named for him and published Wilson's theorem.","nodes":["waring","wilson","continued-fractions"]},{"id":"gauss-legendre","y":1792,"label":"1790s","title":"Conjecturing the prime number theorem","who":"Carl Friedrich Gauss, Adrien-Marie Legendre","text":"From tables, the density of primes near $x$ is about $1/\\log x$.","nodes":["pnt"]},{"id":"gauss-17","y":1796,"label":"1796","title":"The regular 17-gon","who":"Carl Friedrich Gauss","text":"Constructed it with ruler and compass using $\\mathbb Q(\\zeta_{17})$.","nodes":["cyclotomic"]},{"id":"disquisitiones","y":1801,"label":"1801","title":"Disquisitiones Arithmeticae","who":"Carl Friedrich Gauss","text":"Congruence notation, primitive roots, binary quadratic forms and the first complete proof of quadratic reciprocity.","nodes":["congruences","order-primroot","quadratic-residues","quadratic-forms"]},{"id":"fourier","y":1822,"label":"1822","title":"Théorie analytique de la chaleur","who":"Joseph Fourier","text":"Expanded functions in trigonometric series to solve the heat equation.","nodes":["fourier-poisson"]},{"id":"cauchy","y":1825,"label":"1825","title":"Cauchy's integral theorem","who":"Augustin-Louis Cauchy","text":"Founded complex contour integration, followed by the calculus of residues.","nodes":["holomorphic","residues"]},{"id":"mobius","y":1832,"label":"1832","title":"The Möbius function","who":"August Ferdinand Möbius","text":"Introduced $\\mu$ and the inversion formula.","nodes":["mobius"]},{"id":"dirichlet","y":1837,"label":"1837","title":"Primes in arithmetic progressions","who":"Peter Gustav Lejeune Dirichlet","text":"Introduced characters and $L$-functions and proved $L(1,\\chi) \\ne 0$.","nodes":["dirichlet-characters","l-functions"]},{"id":"class-number","y":1839,"label":"1839","title":"The class number formula","who":"Peter Gustav Lejeune Dirichlet","text":"Expressed $L(1,\\chi_D)$ through class numbers of quadratic forms.","nodes":["class-number-formula"]},{"id":"eisenstein","y":1844,"label":"1844","title":"Cubic reciprocity","who":"Gotthold Eisenstein","text":"Proved cubic reciprocity in $\\mathbb Z[\\omega]$.","nodes":["eisenstein-integers","cubic-characters"]},{"id":"lame","y":1844.5,"label":"1844","title":"Lamé's theorem","who":"Gabriel Lamé","text":"Bounded the number of steps of the Euclidean algorithm, an early complexity analysis.","nodes":["divisibility"]},{"id":"kummer","y":1847,"label":"1847","title":"Ideal numbers","who":"Ernst Kummer","text":"Restored unique factorization in cyclotomic rings with ideal numbers and proved Fermat's Last Theorem for regular primes.","nodes":["ideals","cyclotomic"]},{"id":"chebyshev","y":1850,"label":"1848–1850","title":"Chebyshev's estimates","who":"Pafnuty Chebyshev","text":"Showed $\\pi(x)\\log x / x$ stays between two constants.","nodes":["chebyshev","pnt"]},{"id":"riemann","y":1859,"label":"1859","title":"On the Number of Primes Less Than a Given Magnitude","who":"Bernhard Riemann","text":"Continued $\\zeta$ to the complex plane, proved the functional equation, linked zeros to primes and stated the Riemann hypothesis.","nodes":["zeta","continuation","functional-equation","nontrivial-zeros","explicit-formula","rh"]},{"id":"dedekind","y":1871,"label":"1871","title":"Ideals","who":"Richard Dedekind","text":"Defined ideals and proved unique factorization of ideals in rings of integers.","nodes":["ideals","dedekind-zeta"]},{"id":"mertens","y":1874,"label":"1874","title":"Mertens' theorems","who":"Franz Mertens","text":"Asymptotics for $\\sum 1/p$ and $\\prod (1-1/p)$.","nodes":["mertens"]},{"id":"lucas","y":1878,"label":"1878","title":"Lucas's theorem","who":"Édouard Lucas","text":"Binomial coefficients modulo a prime via base-$p$ digits.","nodes":["lucas"]},{"id":"mangoldt","y":1895,"label":"1895","title":"Proof of the explicit formula","who":"Hans von Mangoldt","text":"Proved Riemann's formula for $\\psi(x)$ as a sum over zeros.","nodes":["explicit-formula","chebyshev"]},{"id":"pnt-proof","y":1896,"label":"1896","title":"The prime number theorem","who":"Jacques Hadamard, Charles-Jean de la Vallée Poussin","text":"Proved $\\zeta(1+it) \\ne 0$ and hence $\\pi(x) \\sim x/\\log x$.","nodes":["pnt"]},{"id":"hensel","y":1897,"label":"1897","title":"p-adic numbers","who":"Kurt Hensel","text":"Introduced the $p$-adic numbers.","nodes":["hensel"]},{"id":"dlvp","y":1899,"label":"1899","title":"A zero-free region","who":"Charles-Jean de la Vallée Poussin","text":"No zeros in $\\sigma > 1 - c/\\log|t|$.","nodes":["zero-free-region"]},{"id":"lindelof","y":1908,"label":"1908","title":"The Lindelöf hypothesis","who":"Ernst Lindelöf","text":"Conjectured $\\zeta(\\tfrac12 + it) \\ll |t|^{\\varepsilon}$.","nodes":["lindelof"]},{"id":"hilbert-waring","y":1909,"label":"1909","title":"Waring's problem solved","who":"David Hilbert","text":"Proved that $g(k)$ is finite for every $k$.","nodes":["waring"]},{"id":"hardy","y":1914,"label":"1914","title":"Infinitely many zeros on the critical line","who":"G. H. Hardy","text":"Proved infinitely many zeros have real part $\\tfrac12$.","nodes":["nontrivial-zeros","rh"]},{"id":"weyl","y":1916,"label":"1916","title":"Equidistribution","who":"Hermann Weyl","text":"Proved $n^2\\alpha$ is equidistributed modulo 1 by differencing exponential sums.","nodes":["exponential-sums"]},{"id":"hecke","y":1918,"label":"1918","title":"Hecke L-functions","who":"Erich Hecke","text":"Defined $L$-functions of Größencharaktere and proved their functional equations.","nodes":["hecke-l"]},{"id":"brun","y":1919,"label":"1919","title":"Brun's theorem","who":"Viggo Brun","text":"The sum of reciprocals of twin primes converges.","nodes":["sieve-basics","twin-primes"]},{"id":"hardy-littlewood","y":1920,"label":"1920","title":"Partitio Numerorum","who":"G. H. Hardy, J. E. Littlewood","text":"Developed the circle method for Waring's problem and Goldbach.","nodes":["circle-method"]},{"id":"hasse","y":1933,"label":"1933","title":"The Hasse bound","who":"Helmut Hasse","text":"$|\\#E(\\mathbb F_p) - p - 1| \\le 2\\sqrt p$.","nodes":["elliptic-curves"]},{"id":"siegel","y":1935,"label":"1935","title":"Siegel's theorem","who":"Carl Ludwig Siegel","text":"Real exceptional zeros cannot be too close to $1$, with an ineffective constant.","nodes":["siegel-zeros","siegel-walfisz"]},{"id":"vinogradov","y":1937,"label":"1937","title":"Three primes","who":"I. M. Vinogradov","text":"Every sufficiently large odd number is a sum of three primes.","nodes":["ternary-goldbach"]},{"id":"linnik","y":1941,"label":"1941","title":"The large sieve","who":"Yuri Linnik","text":"Introduced the large sieve.","nodes":["large-sieve"]},{"id":"selberg","y":1947,"label":"1947","title":"The Selberg sieve","who":"Atle Selberg","text":"Optimised sieve weights by a quadratic form.","nodes":["selberg-sieve"]},{"id":"vk","y":1958,"label":"1958","title":"Vinogradov–Korobov zero-free region","who":"I. M. Vinogradov, N. M. Korobov","text":"The widest known zero-free region; it still shrinks with height.","nodes":["zero-free-region"]},{"id":"bv","y":1965,"label":"1965","title":"Bombieri–Vinogradov","who":"Enrico Bombieri, A. I. Vinogradov","text":"Primes in progressions on average over moduli up to $x^{1/2}$.","nodes":["bombieri-vinogradov"]},{"id":"montgomery","y":1973,"label":"1973","title":"Pair correlation of zeros","who":"Hugh Montgomery","text":"His conjectured spacing law matched random matrix statistics, as Freeman Dyson pointed out.","nodes":["pair-correlation"]},{"id":"dh","y":1976,"label":"1976","title":"New Directions in Cryptography","who":"Whitfield Diffie, Martin Hellman","text":"Public key exchange from discrete logarithms.","nodes":["discrete-log"]},{"id":"rsa","y":1977,"label":"1977","title":"RSA","who":"Ron Rivest, Adi Shamir, Leonard Adleman","text":"Public-key encryption based on factoring.","nodes":["rsa"]},{"id":"shor","y":1994,"label":"1994","title":"Shor's algorithm","who":"Peter Shor","text":"A quantum algorithm for factoring and discrete logarithms in polynomial time.","nodes":["rsa","discrete-log"]},{"id":"wiles","y":1995,"label":"1995","title":"Fermat's Last Theorem","who":"Andrew Wiles (with Richard Taylor)","text":"Proved via modularity of semistable elliptic curves.","nodes":["elliptic-curves"]},{"id":"clay","y":2000,"label":"2000","title":"Millennium Prize Problems","who":"Clay Mathematics Institute","text":"The Riemann hypothesis was named one of seven problems with a $1 million prize.","nodes":["rh"]},{"id":"keating-snaith","y":2000.5,"label":"2000","title":"Moments from random matrices","who":"Jon Keating, Nina Snaith","text":"Predicted the moments of $\\zeta$ on the critical line from random matrix theory.","nodes":["moments","pair-correlation"]},{"id":"aks","y":2002,"label":"2002","title":"PRIMES is in P","who":"Manindra Agrawal, Neeraj Kayal, Nitin Saxena","text":"A deterministic polynomial-time primality test.","nodes":["primality"]},{"id":"zhang","y":2013.3,"label":"2013","title":"Bounded gaps between primes","who":"Yitang Zhang","text":"Infinitely many prime gaps below $7 \\times 10^7$.","nodes":["bounded-gaps","bombieri-vinogradov"]},{"id":"helfgott","y":2013.4,"label":"2013","title":"Ternary Goldbach proved","who":"Harald Helfgott","text":"Every odd number greater than $5$ is a sum of three primes.","nodes":["ternary-goldbach"]},{"id":"maynard","y":2013.9,"label":"2013–2014","title":"Multidimensional sieve and Polymath8","who":"James Maynard; Polymath8","text":"A new sieve for bounded gaps; the collaborative project lowered the bound to $246$.","nodes":["bounded-gaps","selberg-sieve","twin-primes"]},{"id":"bettin-gonek","y":2017,"label":"2017","title":"Moments and the Riemann hypothesis","who":"Sandro Bettin, Steven Gonek","text":"A mollified second-moment conjecture implies RH.","nodes":["moments"]},{"id":"axiom-246","y":2026.62,"label":"Aug 2026","ai":true,"title":"The 246 theorem formally verified","who":"Axiom Math (AxiomProver)","text":"Reported as the first automatic formal verification of the bounded-gaps proof.","nodes":["bounded-gaps"],"url":"https://spectrum.ieee.org/axiom-math-246-theorem-formalization","src":"IEEE Spectrum"},{"id":"qrh-78","y":2026.745,"label":"30 Sep 2026","ai":true,"title":"Quasi-RH manuscript (7/8)","who":"OpenAI internal model","text":"Claims every Dirichlet $L$-function is zero-free in $\\operatorname{Re}s > \\tfrac78$, using Hecke $L$-functions over $\\mathbb Q(\\sqrt{-3})$, cubic theta sums and a Mellin continuation. Reported as Lean-verified.","nodes":["quasi-rh","hecke-l","cubic-characters","mellin"],"url":"https://www.quantamagazine.org/ai-proved-the-quasi-riemann-hypothesis-what-happens-now-20261019/","src":"Quanta Magazine"},{"id":"qrh-1112","y":2026.758,"label":"5 Oct 2026","ai":true,"title":"A second proof, with 11/12","who":"OpenAI internal model","text":"A different argument for $\\operatorname{Re}s > \\tfrac{11}{12}$, edited by people for readability.","nodes":["quasi-rh"],"url":"https://www.emergentmind.com/openai-math-explorer/results/003","src":"Emergent Mind"},{"id":"release","y":2026.761,"label":"6 Oct 2026","ai":true,"title":"372 proof claims released; Siegel zeros excluded","who":"OpenAI","text":"372 result families released on GitHub, including a short paper excluding Siegel zeros. Three manuscripts were withdrawn the next day over a sign error.","nodes":["no-siegel","siegel-zeros"],"url":"https://www.science.org/content/article/a function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); }); }
async function onSession(session) {
  const uid = session && session.user ? session.user.id : null;
  S.session = session || null;
  if (uid === S.uid && S.community === "on") return;
  S.uid = uid; S.myVotes = new Set();

  renderAcct();

  refreshCommunity();
  if (["account", "review"].includes(S.route && S.route.name)) route();
}
let rtTimer = null;
function onRealtime(ev) {
  const row = ev.new && ev.new.id ? ev.new : ev.old || {};
  if (ev.eventType === "DELETE" && row.id) dropPost(row.id);
  clearTimeout(rtTimer);
  rtTimer = setTimeout(() => {
    const t = ev.new && ev.new.target;
    const jobs = [loadCounts()];
    if (t && S.loads["t:" + t]) jobs.push(ensureTarget(t, true));
    if (ev.new && ev.new.kind === "proposal" && S.loads.proposals) jobs.push(ensureProposals(true));
    if (ev.new && ev.new.kind === "problem") jobs.push(ensureSubmissions(true));
    if (ev.new && ev.new.parent && S.loads.proposals) jobs.push(ensureProposals(true));

async function connect() {

  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) { S.community = "off"; subsDone(); sbDone(); renderAcct(); refreshCommunity(); return; }
  renderAcct();
  try { if (!window.supabase) await loadScript("vendor/supabase-2.117.3.js"); }
  catch (e) { S.community = "off"; subsDone(); sbDone(); renderAcct(); refreshCommunity(); return; }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { flowType: "pkce", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
  const { data } = await S.sb.auth.getSession();
  if (q.has("code") || q.has("error")) {
    let back = ""; try { back = sessionStorage.getItem(RETURN_KEY) || ""; sessionStorage.removeItem(RETURN_KEY); } catch (e) {}

  await onSession(data && data.session);
  sbDone();
  S.sb.auth.onAuthStateChange((event, session) => { setTimeout(() => onSession(session), 0); });

}

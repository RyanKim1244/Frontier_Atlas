eness and regularity are open.","key":["\\partial_t u + (u\\cdot\\nabla)u = \\nu\\Delta u - \\nabla p,\\qquad \\nabla\\cdot u = 0"],"why":"A Millennium Prize Problem about the basic equations of fluid flow.","msc":["35Q30","76D05"],"links":[{"field":"physics","note":"These are the equations of viscous incompressible fluids."},{"field":"ai-research","note":"In 2025 Google DeepMind and collaborators used neural-network solvers to find unstable self-similar blow-up candidates for related fluid equations."}],"refs":["Carlson, Jaffe & Wiles (eds.), The Millennium Prize Problems"],"status":"open","aliases":["fluid","blow-up","regularity","Millennium"],"fields":["pde","physics"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":0,"research":1,"examples":0},"nprob":0,"lesson":{"minutes":16,"checks":5,"fixed":1}},{"id":"heat-equation","band":"pde","title":"The heat equation","short":"Heat equation","pre":["partial-derivatives","fourier-series"],"sum":"The heat equation $u_t = k\\,u_{xx}$ (in higher dimensions $u_t = k\\Delta u$) describes how temperature, or any diffusing quantity, evolves: each point moves towards the average of its neighbours. On an interval it is solved by Fourier series, with the $n$-th mode decaying like $e^{-kn^2\\pi^2t/L^2}$; on the whole line the solution is the initial data convolved with a Gaussian, the heat kernel, which is also the density of Brownian motion.","key":["u_t = k\\,u_{xx},\\quad u(0,t) = u(L,t) = 0 \\;\\Longrightarrow\\; u(x,t) = \\sum_{n=1}^\\infty b_n\\, e^{-k n^2\\pi^2 t/L^2}\\sin\\frac{n\\pi x}{L}","u(x,t) = \\int_{-\\infty}^{\\infty} \\frac{1}{\\sqrt{4\\pi k t}}\\,e^{-(x-y)^2/(4kt)}\\,f(y)\\,dy \\quad\\text{on } \\mathbb R","\\max_{\\overline{Q_T}} u = \\max_{\\text{parabolic boundary}} u \\quad\\text{(weak maximum principle)}"],"why":"Besides heat conduction it governs diffusion of chemicals, the spread of probability for random walks and Brownian motion, the Black–Scholes model of option prices (after a change of variables), and smoothing filters in image processing. It is the model example of a parabolic PDE, where solutions smooth out instantly and the past cannot be recovered from the present.","msc":["35K05"],"links":[{"field":"harmonic-analysis","note":"Fourier invented his series to solve the heat equation, and the heat kernel is a standard approximate identity used to sum Fourier series and prove inversion theorems."},{"field":"numerical-analysis","note":"The explicit finite-difference scheme for $u_t = ku_{xx}$ is stable only when $k\\Delta t/\\Delta x^2 \\le \\tfrac12$, the classic example of a stability restriction, which implicit schemes such as Crank–Nicolson avoid."},{"field":"differential-geometry","note":"The heat equation on a Riemannian manifold links the geometry to the spectrum of the Laplacian, and heat-kernel methods give proofs of the Atiyah–Singer index theorem."}],"refs":["Strauss, Partial Differential Equations: An Introduction","Evans, Partial Differential Equations","Boyce, DiPrima & Meade, Elementary Differential Equations and Boundary Value Problems"],"status":null,"aliases":["diffusion equation","heat conduction","Fourier's law","heat kernel","fundamental solution","Gaussian kernel","separation of variables","maximum principle","parabolic PDE","insulated boundary","Neumann condition","Dirichlet condition","backward heat equation"],"fields":["pde","physics","probability"],"stage":"undergraduate","np":{"textbook":12,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":12,"lesson":{"minutes":24,"checks":11,"fixed":0}},{"id":"wave-equation","band":"pde","title":"The wave equation","short":"Wave equation","pre":["partial-derivatives","fourier-series"],"sum":"The wave equation $u_{tt} = c^2u_{xx}$ (in space $u_{tt} = c^2\\Delta u$) governs vibrating strings, sound, light and many other waves. On a line every solution is a sum $F(x - ct) + G(x + ct)$ of two shapes moving in opposite directions at speed $c$ (d'Alembert), so disturbances travel at finite speed and keep their sharpness; on a string with fixed ends the solution is a sum of standing waves with frequencies $nc/(2L)$, and energy is conserved.","key":["u(x,t) = \\frac{f(x - ct) + f(x + ct)}{2} + \\frac{1}{2c}\\int_{x - ct}^{x + ct} g(s)\\,ds","u(x,t) = \\sum_{n=1}^\\infty \\sin\\frac{n\\pi x}{L}\\left(A_n\\cos\\frac{n\\pi ct}{L} + B_n\\sin\\frac{n\\pi ct}{L}\\right)","E(t) = \\frac12\\int \\left(u_t^2 + c^2u_x^2\\right)dx = \\text{constant}"],"why":"It is the basic model of every kind of wave: the pitch of a guitar string, sound in air, seismic waves, electromagnetic waves (each component of the electric and magnetic fields in vacuum satisfies it, with $c$ the speed of light). Its finite speed of propagation and conservation of energy, in contrast with the smoothing of the heat equation, are the defining features of hyperbolic PDEs.","msc":["35L05"],"links":[{"field":"harmonic-analysis","note":"Standing waves on a string are Fourier modes, so the overtone series of a musical note is the Fourier sine series of the string's initial shape and velocity."},{"field":"numerical-analysis","note":"Explicit difference schemes for the wave equation are stable only under the Courant–Friedrichs–Lewy condition $c\\,\\Delta t \\le \\Delta x$: the numerical domain of dependence must contain the true one."},{"field":"differential-geometry","note":"On a curved spacetime the wave operator is the Laplace–Beltrami operator of a Lorentzian metric, and in the high-frequency limit waves travel along null geodesics, which is how general relativity describes light rays."}],"refs":["Strauss, Partial Differential Equations: An Introduction","Evans, Partial Differential Equations","Stein & Shakarchi, Fourier Analysis: An Introduction"],"status":null,"aliases":["d'Alembert's formula","vibrating string","wave equation in one dimension","standing waves","normal modes","harmonics","overtones","domain of dependence","finite speed of propagation","Huygens' principle","Kirchhoff's formula","hyperbolic PDE","spherical waves","CFL condition"],"fields":["pde","physics"],"stage":"undergraduate","np":{"textbook":19,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":19,"lesson":{"minutes":22,"checks":10,"fixed":0}},{"id":"laplace-equation","band":"pde","title":"Laplace's equation and harmonic functions","short":"Laplace's equation","pre":["partial-derivatives","vector-calculus","fourier-series"],"sum":"Laplace's equation $\\Delta u = u_{xx}+u_{yy}(+u_{zz}) = 0$ describes equilibrium states: steady temperatures, electrostatic potentials in charge-free regions, ideal fluid potentials. Its solutions, harmonic functions, equal their own averages over circles and spheres, so they have no interior maxima and are uniquely determined by their boundary values.","key":["\\Delta u = \\sum_{i=1}^n \\frac{\\partial^2 u}{\\partial x_i^2} = 0","u(p) = \\frac{1}{2\\pi}\\int_0^{2\\pi} u\\big(p + r(\\cos\\theta,\\sin\\theta)\\big)\\,d\\theta","\\max_{\\overline{\\Omega}} u = \\max_{\\partial\\Omega} u \\quad (\\Omega \\text{ bounded},\\ u \\in C(\\overline{\\Omega}))"],"why":"It is the model elliptic PDE: steady-state heat flow, electrostatics and gravitation are all governed by it, and in the plane harmonic functions are exactly the real parts of holomorphic functions, which ties PDE to complex analysis.","msc":["35J05","31A05","31B05"],"links":[{"field":"probability","note":"The solution of the Dirichlet problem at a point is the expected boundary value where a Brownian motion started there first exits the domain."},{"field":"numerical-analysis","note":"Finite-difference discretisation turns Laplace's equation into the 'average of the four neighbours' linear system, the standard test problem for Jacobi, Gauss–Seidel and multigrid iterations."}],"refs":["Evans, Partial Differential Equations","Strauss, Partial Differential Equations: An Introduction","Boyce, DiPrima & Meade, Elementary Differential Equations and Boundary Value Problems"],"status":null,"aliases":["Laplace equation","harmonic function","Laplacian","Dirichlet problem","potential theory","mean value property","maximum principle","Poisson kernel","Poisson's equation"],"fields":["pde","physics","complex-analysis"],"stage":"undergraduate","np":{"textbook":24,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":24,"lesson":{"minutes":20,"checks":9,"fixed":1}},{"id":"calculus-of-variations","band":"pde","title":"The calculus of variations","short":"Calculus of variations","pre":["partial-derivatives","lagrange-multipliers","integration-techniques"],"sum":"The calculus of variations finds functions that minimise or make stationary an integral $J[y] = \\int_a^b F(x, y, y')\\,dx$, such as a length, a travel time or an energy. The key fact is that any smooth minimiser must solve the Euler–Lagrange differential equation, which turns the search over all curves into solving an ODE (or a PDE for surfaces).","key":["\\frac{\\partial F}{\\partial y} - \\frac{d}{dx}\\frac{\\partial F}{\\partial y'} = 0","F_x = 0 \\;\\Longrightarrow\\; F - y'\\,\\frac{\\partial F}{\\partial y'} = \\text{const}","\\delta \\int_{t_0}^{t_1} \\big(T - V\\big)\\,dt = 0 \\;\\Longrightarrow\\; m\\ddot{x} = -V'(x)"],"why":"It produces the shortest paths, minimal surfaces and equilibrium shapes of geometry and engineering, and it is the language of physics: Newton's laws, geodesics and field equations are Euler–Lagrange equations of an action.","msc":["49K05"],"links":[{"field":"differential-geometry","note":"Geodesics on a surface or Riemannian manifold are the extremals of the length or energy functional, and minimal surfaces are critical points of area."},{"field":"optimisation","note":"Discretising a variational problem gives a finite-dimensional optimisation problem, and convexity of the integrand is what guarantees that stationary points are global minima in both settings."}],"refs":["Gelfand & Fomin, Calculus of Variations","Evans, Partial Differential Equations"],"status":null,"aliases":["variational calculus","Euler-Lagrange equation","Euler–Lagrange equation","Beltrami identity","brachistochrone","principle of least action","Hamilton's principle","functional","first variation","isoperimetric problem","direct method"],"fields":["pde","physics","real-analysis"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":10,"fixed":0}},{"id":"normed-spaces","band":"functional","title":"Normed and Banach spaces","short":"Banach spaces","pre":["metric-spaces","vector-spaces"],"sum":"A norm $\\|\\cdot\\|$ on a real or complex vector space measures the size of vectors, subject to positivity, homogeneity and the triangle inequality; it makes the space a metric space with $d(x,y)=\\|x-y\\|$. A Banach space is a normed space that is complete, so that Cauchy sequences, and absolutely convergent series, converge. In finite dimensions all norms are equivalent and every normed space is complete; in infinite dimensions the choice of norm matters, and linear maps are continuous exactly when they are bounded.","key":["\\|x+y\\|\\le\\|x\\|+\\|y\\|,\\qquad \\|\\lambda x\\|=|\\lambda|\\,\\|x\\|,\\qquad \\|x\\|=0\\iff x=0","T \\text{ linear: } T \\text{ continuous} \\iff \\|T\\|=\\sup_{\\|x\\|\\le1}\\|Tx\\|< \\infty","X \\text{ Banach} \\iff \\Big(\\sum_n\\|x_n\\|< \\infty \\implies \\sum_n x_n \\text{ converges}\\Big)"],"why":"Most of analysis happens in spaces of functions, and a norm is what makes \"close to\", \"converges\" and \"approximately\" meaningful there; completeness is what lets existence proofs (fixed points, series solutions, limits of approximations) produce an actual object.","msc":["46B20"],"links":[{"field":"numerical-analysis","note":"Error estimates and condition numbers are stated in operator norms, such as $\\kappa(A)=\\|A\\|\\,\\|A^{-1}\\|$, which bounds how relative errors in data are amplified when solving $Ax=b$."},{"field":"differential-equations","note":"The Picard–Lindelöf existence theorem applies the contraction mapping principle in the Banach space $C[a,b]$ with the sup norm."},{"field":"pde","note":"Weak solutions of partial differential equations are found in Banach spaces of functions such as Sobolev spaces, where completeness lets approximate solutions converge to a genuine one."}],"refs":["Kreyszig, Introductory Functional Analysis with Applications","Folland, Real Analysis: Modern Techniques and Their Applications","Brezis, Functional Analysis, Sobolev Spaces and Partial Differential Equations"],"status":null,"aliases":["normed space","normed vector space","Banach space","complete normed space","norm","operator norm","bounded linear operator","equivalent norms","sup norm","l^p norm","Riesz lemma"],"fields":["functional-analysis","real-analysis","linear-algebra"],"stage":"undergraduate","np":{"textbook":6,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":6,"lesson":{"minutes":25,"checks":9,"fixed":0}},{"id":"hilbert-spaces","band":"functional","title":"Hilbert spaces","short":"Hilbert spaces","pre":["normed-spaces","inner-products"],"sum":"A Hilbert space is a vector space with an inner product $\\langle x,y\\rangle$ that is complete for the norm $\\|x\\|=\\sqrt{\\langle x,x\\rangle}$, such as $\\mathbb{C}^n$, the sequence space $\\ell^2$ or the function space $L^2$. Completeness plus the parallelogram law give nearest points in closed convex sets and orthogonal projections onto closed subspaces; from these follow the Riesz representation theorem and expansions $x=\\sum\\langle x,e_n\\rangle e_n$ in an orthonormal basis, with Parseval's identity.","key":["\\|x+y\\|^2+\\|x-y\\|^2=2\\|x\\|^2+2\\|y\\|^2","H=M\\oplus M^{\\perp}\\quad\\text{for every closed subspace } M","f\\in H^*\\ \\Longrightarrow\\ \\exists!\\,y\\in H:\\ f(x)=\\langle x,y\\rangle,\\ \\ \\|f\\|=\\|y\\|","\\|x\\|^2=\\sum_n|\\langle x,e_n\\rangle|^2\\quad\\text{for an orthonormal basis } (e_n)"],"why":"Hilbert spaces carry Euclidean geometry (angles, orthogonality, best approximation) into infinite dimensions; they are the setting of Fourier series, least-squares approximation, quantum mechanics, and the weak formulation of partial differential equations.","msc":["46C05"],"links":[{"field":"pde","note":"Weak solutions of elliptic equations such as $-\\Delta u=f$ with $u=0$ on the boundary are obtained from the Riesz representation theorem (or the Lax–Milgram theorem) in the Sobolev Hilbert space $H^1_0$."},{"field":"harmonic-analysis","note":"Fourier series are expansions in the orthonormal basis $e^{inx}/\\sqrt{2\\pi}$ of $L^2[-\\pi,\\pi]$, and Parseval's identity says that $f\\mapsto(\\langle f,e_n\\rangle)_n$ is an isometry of $L^2[-\\pi,\\pi]$ onto $\\ell^2(\\mathbb{Z})$; its analogue for the Fourier transform on $\\mathbb{R}$ is Plancherel's theorem."},{"field":"probability","note":"For square-integrable random variables, the conditional expectation $E[X\\mid\\mathcal G]$ is the orthogonal projection of $X$ onto the closed subspace of $\\mathcal G$-measurable variables in $L^2$."}],"refs":["Kreyszig, Introductory Functional Analysis with Applications","Brezis, Functional Analysis, Sobolev Spaces and Partial Differential Equations","Young, An Introduction to Hilbert Space"],"status":null,"aliases":["Hilbert space","inner product space","pre-Hilbert space","projection theorem","orthogonal projection","Riesz representation theorem","orthonormal basis","Parseval identity","Bessel inequality","Riesz-Fischer theorem","l^2","L^2 space"],"fields":["functional-analysis","linear-algebra","physics"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":8,"fixed":0}},{"id":"hahn-banach","band":"functional","title":"The Hahn–Banach theorem and dual spaces","short":"Hahn–Banach","pre":["normed-spaces","dual-spaces"],"sum":"The Hahn–Banach theorem says that a linear functional dominated by a sublinear function on a subspace extends to the whole space with the same domination; in a normed space, every bounded functional on a subspace extends to the whole space with the same norm. Its consequences are that the dual space $X^*$ separates points, that $\\|x\\|=\\max_{\\|f\\|\\le1}|f(x)|$, and, in geometric form, that disjoint convex sets (one of them open) can be separated by a closed hyperplane.","key":["f\\le p \\text{ on } M,\\ p \\text{ sublinear} \\ \\Longrightarrow\\ \\exists F \\text{ linear on } X:\\ F|_M=f,\\ F\\le p","g\\in M^*\\ \\Longrightarrow\\ \\exists G\\in X^*:\\ G|_M=g,\\ \\|G\\|=\\|g\\|","\\|x\\|=\\max\\{|f(x)|: f\\in X^*,\\ \\|f\\|\\le1\\}"],"why":"Without it the dual space of a general normed space could be trivial and duality arguments would be empty; with it one gets weak topologies, the bidual embedding, separation of convex sets (the basis of duality in optimisation) and existence results such as Banach limits.","msc":["46A22"],"links":[{"field":"optimisation","note":"The separation form underlies duality in convex optimisation: Farkas' lemma, Lagrange multipliers for convex programs and the KKT conditions all come from separating a convex set from a point or another convex set."},{"field":"logic","note":"In full generality the theorem is not provable in ZF alone, but it follows from the ultrafilter lemma (equivalently the Boolean prime ideal theorem), which is strictly weaker than the axiom of choice; in reverse mathematics, Brown and Simpson showed that over $\\mathsf{RCA}_0$ the Hahn–Banach theorem for separable Banach spaces is equivalent to $\\mathsf{WKL}_0$."}],"refs":["Brezis, Functional Analysis, Sobolev Spaces and Partial Differential Equations","Kreyszig, Introductory Functional Analysis with Applications","Folland, Real Analysis: Modern Techniques and Their Applications"],"status":null,"aliases":["Hahn-Banach theorem","Hahn-Banach extension theorem","Hahn-Banach separation theorem","dominated extension theorem","sublinear functional","supporting hyperplane","separating hyperplane","dual space","bidual","canonical embedding","Banach limit"],"fields":["functional-analysis"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":8,"fixed":0}},{"id":"compact-operators","band":"functional","title":"Compact operators and the Fredholm alternative","short":"Compact operators","pre":["hilbert-spaces","spectral-theorem","arzela-ascoli"],"sum":"A bounded operator between Banach spaces is compact if it maps bounded sets to sets with compact closure; examples are finite-rank operators, their norm limits, and integral operators with continuous or square-integrable kernels. Compact operators behave like matrices: a compact self-adjoint operator on a Hilbert space has an orthonormal basis of eigenvectors with eigenvalues tending to $0$, and for $\\lambda\\ne0$ the Fredholm alternative holds: $Tu-\\lambda u=f$ is solvable for every $f$ exactly when $Tu=\\lambda u$ has only the solution $u=0$.","key":["T\\ \\text{compact},\\ \\lambda\\neq0:\\quad \\ker(T-\\lambda I)=\\{0\\}\\iff \\operatorname{ran}(T-\\lambda I)=H","\\operatorname{ran}(T-\\lambda I)=\\ker(T^*-\\bar\\lambda I)^{\\perp},\\qquad \\dim\\ker(T-\\lambda I)=\\dim\\ker(T^*-\\bar\\lambda I)< \\infty","T=T^*\\ \\text{compact}\\ \\Longrightarrow\\ Tx=\\sum_n\\lambda_n\\langle x,e_n\\rangle e_n,\\quad \\lambda_n\\in\\mathbb{R},\\ \\lambda_n\\to0"],"why":"Boundary value problems and integral equations are usually turned into equations $u-\\lambda Tu=f$ with $T$ compact; the Fredholm alternative then gives existence from uniqueness, and the spectral theorem gives eigenfunction expansions such as Fourier series and the vibration modes of a drum.","msc":["47B07","47A53"],"links":[{"field":"differential-equations","note":"A regular Sturm–Liouville problem is inverted by an integral operator with a continuous symmetric Green's function, which is compact and self-adjoint, so its eigenfunctions form an orthonormal basis of $L^2$."},{"field":"numerical-analysis","note":"Nyström and Galerkin methods replace a compact integral operator by finite-rank approximations, and convergence of the approximate solutions rests on compactness and the Fredholm alternative."},{"field":"physics","note":"Quantum Hamiltonians with compact resolvent, such as a particle in a box or the harmonic oscillator, have purely discrete energy levels, given by the spectral theorem for compact self-adjoint operators."}],"refs":["Brezis, Functional Analysis, Sobolev Spaces and Partial Differential Equations","Kreyszig, Introductory Functional Analysis with Applications","Reed & Simon, Methods of Modern Mathematical Physics I: Functional Analysis"],"status":null,"aliases":["compact operator","completely continuous operator","Fredholm alternative","Fredholm operator","Riesz-Schauder theory","Hilbert-Schmidt operator","integral operator","spectral theorem for compact self-adjoint operators","Fredholm integral equation","Volterra operator"],"fields":["functional-analysis","pde"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":30,"checks":8,"fixed":0}},{"id":"vectors-plane","band":"linalg","title":"Vectors in the plane and in space","short":"Vectors","pre":["euclid-basics"],"sum":"A vector is a quantity with a length and a direction, written in coordinates as a pair or triple of numbers and added component by component. The dot product $\\mathbf u \\cdot \\mathbf v = |\\mathbf u||\\mathbf v|\\cos\\theta$ measures angles and is zero exactly for perpendicular vectors; in space, the cross product is a vector perpendicular to both factors whose length is the area of the parallelogram they span.","key":["\\mathbf u \\cdot \\mathbf v = u_1v_1 + u_2v_2 + u_3v_3 = |\\mathbf u|\\,|\\mathbf v|\\cos\\theta","|\\mathbf u \\cdot \\mathbf v| \\le |\\mathbf u|\\,|\\mathbf v|, \\qquad |\\mathbf u + \\mathbf v| \\le |\\mathbf u| + |\\mathbf v|","\\mathbf u \\times \\mathbf v = (u_2v_3 - u_3v_2,\\ u_3v_1 - u_1v_3,\\ u_1v_2 - u_2v_1), \\qquad |\\mathbf u \\times \\mathbf v| = |\\mathbf u|\\,|\\mathbf v|\\sin\\theta"],"why":"Vectors describe displacements, velocities and forces, and they turn geometry problems about midpoints, angles and areas into calculations.","msc":["15A72","51N20"],"links":[{"field":"physics","note":"Forces, velocities and fields are vectors; the work done by a force is a dot product and torque is a cross product."},{"field":"computer-science","note":"Computer graphics uses dot products for lighting and cross products for surface normals and for deciding which way a triangle faces."},{"field":"calculus","note":"The gradient of a function of several variables is a vector pointing in the direction of steepest increase, and directional derivatives are dot products with it."}],"refs":["Strang, Introduction to Linear Algebra","Apostol, Calculus, Volume 1"],"status":null,"aliases":["vector","dot product","scalar product","cross product","vector product","position vector","Cauchy-Schwarz inequality","triangle inequality","Lagrange's identity","vector geometry"],"fields":["linear-algebra","geometry"],"stage":"school","np":{"textbook":5,"olympiad":2,"bridge":0,"research":0,"examples":0},"nprob":7,"lesson":{"minutes":15,"checks":10,"fixed":0}},{"id":"linear-systems","band":"linalg","title":"Systems of linear equations and Gaussian elimination","short":"Linear systems","pre":[],"sum":"A system of linear equations asks for numbers $x_1, \\dots, x_n$ that satisfy several equations of the form $a_1x_1 + \\cdots + a_nx_n = b$ at once. Gaussian elimination solves any such system using row operations that do not change the solutions, and the outcome is always one of three: no solution, exactly one, or infinitely many.","key":["a_{i1}x_1 + a_{i2}x_2 + \\cdots + a_{in}x_n = b_i \\qquad (i = 1, \\dots, m)","R_i \\leftrightarrow R_j, \\qquad R_i \\to cR_i\\ (c \\ne 0), \\qquad R_i \\to R_i + cR_j\\ (i \\ne j)","\\text{consistent system: } \\#\\text{free variables} = n - \\#\\text{pivots}"],"why":"Solving linear systems is the most common computation in applied mathematics, from fitting curves to data and analysing electrical circuits to the enormous systems inside engineering simulations.","msc":["15A06","65F05"],"links":[{"field":"computer-science","note":"Gaussian elimination is the basic direct algorithm of numerical linear algebra; for $n$ equations in $n$ unknowns it needs on the order of $n^3$ arithmetic operations."},{"field":"cryptography","note":"The quadratic sieve and the number field sieve for factoring integers end by solving a huge sparse linear system modulo $2$, which combines many relations into a perfect square."},{"field":"physics","note":"Kirchhoff's laws turn an electrical network of resistors and sources into a linear system for the unknown currents."}],"refs":["Strang, Introduction to Linear Algebra","Lay, Linear Algebra and Its Applications","Anton, Elementary Linear Algebra"],"status":null,"aliases":["simultaneous equations","Gaussian elimination","row reduction","row echelon form","Gauss–Jordan elimination","augmented matrix","free variables"],"fields":["linear-algebra"],"stage":"school","np":{"textbook":28,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":28,"lesson":{"minutes":20,"checks":12,"fixed":0}},{"id":"matrices","band":"linalg","title":"Matrices and matrix multiplication","short":"Matrices","pre":["linear-systems","vectors-plane"],"sum":"A matrix is a rectangular array of numbers; an $m \\times n$ matrix $A$ turns a vector $\\mathbf x \\in \\mathbb R^n$ into $A\\mathbf x \\in \\mathbb R^m$, a combination of its columns. Matrix multiplication is defined so that $(AB)\\mathbf x = A(B\\mathbf x)$: the product means doing $B$ first and then $A$, which is why it is associative but not commutative.","key":["(AB)_{ij} = \\sum_{k=1}^{n} a_{ik}b_{kj}","(AB)C = A(BC), \\qquad AB \\ne BA \\text{ in general}","(AB)^{-1} = B^{-1}A^{-1}"],"why":"Matrices are the common language of linear systems, geometric transformations, networks and Markov chains, and matrix multiplication is among the most heavily optimised operations in scientific computing and machine learning.","msc":["15A09"],"links":[{"field":"computer-science","note":"Computer graphics composes rotations, scalings and projections as matrix products, and the complexity of multiplying $n \\times n$ matrices (Strassen's algorithm and its successors) is a central question in algorithms."},{"field":"combinatorics","note":"If $A$ is the adjacency matrix of a graph, the $(i, j)$ entry of $A^k$ counts the walks of length $k$ from vertex $i$ to vertex $j$."},{"field":"probability","note":"A Markov chain is described by a transition matrix $P$, and the distribution after $k$ steps is obtained by multiplying the initial distribution by $P^k$."}],"refs":["Strang, Introduction to Linear Algebra","Lay, Linear Algebra and Its Applications","Hoffman & Kunze, Linear Algebra"],"status":null,"aliases":["matrix product","matrix algebra","inverse matrix","transpose","identity matrix","matrix of a transformation"],"fields":["linear-algebra"],"stage":"undergraduate","np":{"textbook":30,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":35,"lesson":{"minutes":21,"checks":11,"fixed":1}},{"id":"vector-spaces","band":"linalg","title":"Vector spaces and subspaces","short":"Vector spaces","pre":["matrices"],"sum":"A vector space over a field $F$ is a set whose elements can be added and multiplied by scalars from $F$, subject to the familiar rules of arithmetic for arrows in the plane. Column vectors, matrices, polynomials, functions and the solutions of homogeneous linear equations are all vector spaces, and a subspace is a subset that contains $\\mathbf 0$ and is closed under the two operations.","key":["W \\subseteq V \\text{ is a subspace} \\iff \\mathbf 0 \\in W \\text{ and } \\mathbf u + \\mathbf w,\\ c\\mathbf w \\in W \\text{ for all } \\mathbf u, \\mathbf w \\in W,\\ c \\in F","N(A) = \\{\\mathbf x \\in F^n : A\\mathbf x = \\mathbf 0\\} \\text{ is a subspace of } F^n","\\operatorname{span}(\\mathbf v_1, \\dots, \\mathbf v_k) = \\{c_1\\mathbf v_1 + \\cdots + c_k\\mathbf v_k : c_i \\in F\\}"],"why":"Recognising a vector space lets one body of theory (bases, dimension, linear maps) apply at once to geometry, polynomials, differential equations, error-correcting codes and quantum states.","msc":["15A03"],"links":[{"field":"differential-equations","note":"The solutions of a homogeneous linear differential equation form a vector space, so the general solution is a linear combination of a few basic solutions."},{"field":"quantum-computing","note":"The states of a quantum system are vectors in a complex vector space, and superposition of states is vector addition."},{"field":"algebra","note":"A field extension $L \\supseteq K$ makes $L$ a vector space over $K$, and its dimension, the degree $[L:K]$, is a basic invariant in field and Galois theory."}],"refs":["Axler, Linear Algebra Done Right","Halmos, Finite-Dimensional Vector Spaces","Hoffman & Kunze, Linear Algebra"],"status":null,"aliases":["linear space","subspace","linear subspace","span","linear combination","null space","column space","vector space axioms"],"fields":["linear-algebra"],"stage":"undergraduate","np":{"textbook":20,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":20,"lesson":{"minutes":23,"checks":8,"fixed":0}},{"id":"basis-dimension","band":"linalg","title":"Linear independence, bases and dimension","short":"Basis & dimension","pre":["vector-spaces"],"sum":"Vectors are linearly independent when no nontrivial combination of them is $\\mathbf 0$, and a basis is an independent list that spans the space, so that every vector has unique coordinates. All bases of a finite-dimensional space have the same length, its dimension: the number of independent parameters needed to describe a vector.","key":["c_1\\mathbf v_1 + \\cdots + c_k\\mathbf v_k = \\mathbf 0 \\implies c_1 = \\cdots = c_k = 0","\\mathbf u_1, \\dots, \\mathbf u_k \\text{ independent in } \\operatorname{span}(\\mathbf w_1, \\dots, \\mathbf w_m) \\implies k \\le m","\\dim F^n = n, \\qquad \\dim P_n = n + 1, \\qquad \\dim M_{m \\times n} = mn"],"why":"Dimension is the precise form of 'degrees of freedom': it counts the free parameters of a solution set, shows that certain configurations cannot be too large, and gives the degree of a field extension.","msc":["15A03"],"links":[{"field":"algebra","note":"The degree $[L:K]$ of a field extension is the dimension of $L$ as a vector space over $K$, and the tower law $[M:K] = [M:L][L:K]$ comes from multiplying bases."},{"field":"combinatorics","note":"The linear algebra method bounds the size of a family of sets by showing that associated vectors are independent in a space of known dimension, as in the Oddtown theorem."},{"field":"quantum-computing","note":"A system of $n$ qubits has a state space of dimension $2^n$, with the $2^n$ bit strings as a basis, which is why simulating quantum circuits on classical computers is expensive in general."}],"refs":["Axler, Linear Algebra Done Right","Halmos, Finite-Dimensional Vector Spaces","Strang, Introduction to Linear Algebra"],"status":null,"aliases":["linear independence","linear dependence","basis","dimension","coordinates","spanning set","Steinitz exchange lemma","finite-dimensional"],"fields":["linear-algebra"],"stage":"undergraduate","np":{"textbook":15,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":16,"lesson":{"minutes":23,"checks":9,"fixed":1}},{"id":"linear-maps","band":"linalg","title":"Linear maps and the rank–nullity theorem","short":"Linear maps","pre":["basis-dimension"],"sum":"A linear map $T : V \\to W$ between vector spaces respects addition and scalar multiplication; from $F^n$ to $F^m$ these are exactly the maps $\\mathbf x \\mapsto A\\mathbf x$. Its kernel (the vectors sent to $\\mathbf 0$) and its image (the vectors reached) are subspaces, and the rank–nullity theorem says that their dimensions add up to $\\dim V$.","key":["T(a\\mathbf u + b\\mathbf v) = aT\\mathbf u + bT\\mathbf v","\\dim V = \\dim\\ker T + \\dim\\operatorname{im} T","T \\text{ injective} \\iff \\ker T = \\{\\mathbf 0\\}"],"why":"Rank–nullity turns questions of existence and uniqueness into a dimension count: for a square matrix, $A\\mathbf x = \\mathbf b$ is solvable for every $\\mathbf b$ exactly when $A\\mathbf x = \\mathbf 0$ has only the zero solution.","msc":["15A04","15A03"],"links":[{"field":"differential-equations","note":"A linear differential operator such as $y \\mapsto y'' + y$ is a linear map; the general solution of $Ly = f$ is one particular solution plus the kernel of $L$."},{"field":"geometry","note":"Rotations, reflections, projections and shears are linear maps of the plane or space, and composing them corresponds to multiplying their matrices."},{"field":"computer-science","note":"A linear error-correcting code is the image of an injective linear map $\\mathbb F_2^k \\to \\mathbb F_2^n$, and also the kernel of a parity-check matrix; rank–nullity relates the two descriptions."}],"refs":["Axler, Linear Algebra Done Right","Strang, Introduction to Linear Algebra","Hoffman & Kunze, Linear Algebra"],"status":null,"aliases":["linear transformation","rank–nullity theorem","kernel","image","range","null space","rank","nullity","fundamental theorem of linear maps"],"fields":["linear-algebra"],"stage":"undergraduate","np":{"textbook":13,"olympiad":2,"bridge":0,"research":0,"examples":0},"nprob":15,"lesson":{"minutes":24,"checks":8,"fixed":0}},{"id":"determinants","band":"linalg","title":"Determinants","short":"Determinants","pre":["matrices","linear-maps"],"sum":"The determinant $\\det A$ of a square matrix is a single number that measures how the linear map $x \\mapsto Ax$ scales volume, with a sign recording whether orientation is kept or reversed. It is the unique function of the columns that is linear in each column, is zero whenever two columns are equal, and equals $1$ on the identity; the one fact to remember is that $A$ is invertible exactly when $\\det A \\neq 0$.","key":["\\det A=\\sum_{\\sigma\\in S_n}\\operatorname{sgn}(\\sigma)\\prod_{i=1}^{n} a_{\\sigma(i)\\,i}","\\det(AB)=\\det A\\,\\det B","A\\ \\text{invertible}\\iff \\det A\\neq 0"],"why":"Determinants decide invertibility in one computation, define the characteristic polynomial $\\det(\\lambda I-A)$ whose roots are the eigenvalues, and supply the Jacobian factor in the change-of-variables formula for multiple integrals.","msc":["15A15"],"links":[{"field":"calculus","note":"The Jacobian determinant is the local volume-scaling factor in the change-of-variables formula for multiple integrals."},{"field":"geometry","note":"Signed areas and volumes, orientation, and tests for collinearity or coplanarity of points are all determinants."},{"field":"combinatorics","note":"The matrix-tree theorem counts spanning trees of a graph as a determinant, and Lindström–Gessel–Viennot counts non-intersecting lattice paths the same way."}],"refs":["Axler, Linear Algebra Done Right","Strang, Introduction to Linear Algebra","Hoffman & Kunze, Linear Algebra"],"status":null,"aliases":["determinant","det","Leibniz formula","Laplace expansion","cofactor expansion","signed volume"],"fields":["linear-algebra"],"stage":"undergraduate","np":{"textbook":11,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":16,"lesson":{"minutes":17,"checks":12,"fixed":1}},{"id":"eigen","band":"linalg","title":"Eigenvalues and eigenvectors","short":"Eigenvalues","pre":["determinants","polynomials-roots"],"sum":"An eigenvector of a square matrix $A$ is a nonzero vector $v$ that $A$ only stretches: $Av = \\lambda v$ for a number $\\lambda$, the eigenvalue. The eigenvalues are exactly the roots of the characteristic polynomial $\\det(\\lambda I - A)$ (for a real matrix, the non-real roots are its eigenvalues over $\\mathbb C$), and along eigenvectors the matrix acts like plain multiplication, so powers and other functions of $A$ become easy there.","key":["Av=\\lambda v,\\qquad v\\neq 0","\\lambda \\text{ is an eigenvalue of } A \\iff p_A(\\lambda)=\\det(\\lambda I-A)=0","\\operatorname{tr}A=\\lambda_1+\\dots+\\lambda_n,\\qquad \\det A=\\lambda_1\\lambda_2\\cdots\\lambda_n\\qquad(\\lambda_i\\in\\mathbb C \\text{ with algebraic multiplicity})"],"why":"Eigenvalues and eigenvectors govern long-run behaviour: the growth rate of a linear recurrence such as Fibonacci, the stability of a linear system $x' = Ax$, the stationary distribution of a Markov chain and the vibration frequencies of a mechanical system are all read off from them.","msc":["15A18"],"links":[{"field":"differential-equations","note":"The system $x' = Ax$ has solutions $e^{\\lambda t}v$ for each eigenpair, and every solution tends to $0$ exactly when every eigenvalue has negative real part."},{"field":"probability","note":"A stationary distribution of a Markov chain is a left eigenvector of the transition matrix for the eigenvalue $1$, and the second-largest eigenvalue modulus controls the speed of mixing."},{"field":"physics","note":"Normal modes of vibration and the energy levels of a quantum system are eigenvectors and eigenvalues of the governing linear operator."}],"refs":["Axler, Linear Algebra Done Right","Strang, Introduction to Linear Algebra","Horn & Johnson, Matrix Analysis"],"status":null,"aliases":["eigenvalue","eigenvector","characteristic polynomial","eigenspace","spectrum","characteristic root","latent root"],"fields":["linear-algebra"],"stage":"undergraduate","np":{"textbook":24,"olympiad":3,"bridge":0,"research":0,"examples":0},"nprob":27,"lesson":{"minutes":18,"checks":11,"fixed":3}},{"id":"diagonalization","band":"linalg","title":"Diagonalisation","short":"Diagonalisation","pre":["eigen"],"sum":"A square matrix $A$ is diagonalisable if $A = PDP^{-1}$ with $D$ diagonal and $P$ invertible; the columns of $P$ are then a basis of eigenvectors and the diagonal of $D$ lists the eigenvalues. In that basis $A$ just scales each coordinate, so $A^k = PD^kP^{-1}$; over $\\mathbb C$ the only obstruction is an eigenvalue whose eigenspace is smaller than its algebraic multiplicity.","key":["A=PDP^{-1},\\qquad D=\\operatorname{diag}(\\lambda_1,\\dots,\\lambda_n)","A^k=PD^kP^{-1}","A\\ \\text{diagonalisable over }\\mathbb C\\iff \\dim\\ker(A-\\lambda I)=\\text{algebraic multiplicity of }\\lambda\\ \\text{for every eigenvalue }\\lambda"],"why":"Diagonalisation turns powers, exponentials and other functions of a matrix into the same functions of numbers, which gives closed formulas for linear recurrences, explicit solutions of systems $x' = Ax$, and the long-run behaviour of Markov chains.","msc":["15A18","15A21"],"links":[{"field":"differential-equations","note":"If $A = PDP^{-1}$, the system $x' = Ax$ decouples in the coordinates $y = P^{-1}x$ into independent equations $y_i' = \\lambda_i y_i$."},{"field":"combinatorics","note":"Closed formulas for linear recurrences and for the number of walks of length $k$ in a graph come from diagonalising the companion or adjacency matrix."},{"field":"probability","note":"Diagonalising a transition matrix gives its $k$-step transition probabilities and shows how fast a Markov chain approaches equilibrium."}],"refs":["Axler, Linear Algebra Done Right","Strang, Introduction to Linear Algebra","Hoffman & Kunze, Linear Algebra"],"status":null,"aliases":["diagonalization","diagonalizable matrix","eigendecomposition","eigenbasis","similar to a diagonal matrix","geometric multiplicity","algebraic multiplicity"],"fields":["linear-algebra"],"stage":"undergraduate","np":{"textbook":16,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":16,"lesson":{"minutes":17,"checks":12,"fixed":2}},{"id":"inner-products","band":"linalg","title":"Inner products and orthogonality","short":"Inner products","pre":["basis-dimension"],"sum":"An inner product $\\langle u, v\\rangle$ on a vector space generalises the dot product: it is linear in the first argument, symmetric (conjugate-symmetric over $\\mathbb C$) and positive definite, and it defines lengths $\\|v\\| = \\sqrt{\\langle v, v\\rangle}$ and angles. Orthogonality, $\\langle u, v\\rangle = 0$, is the key notion: in an orthonormal basis coordinates are just inner products, and the closest point of a subspace is the orthogonal projection.","key":["|\\langle u,v\\rangle|\\le \\|u\\|\\,\\|v\\|","v=\\sum_{i=1}^{n}\\langle v,e_i\\rangle\\, e_i\\quad\\text{for an orthonormal basis } e_1,\\dots,e_n","V=W\\oplus W^{\\perp},\\qquad \\|v-P_Wv\\|=\\min_{w\\in W}\\|v-w\\|"],"why":"Inner products bring Euclidean geometry (length, angle, perpendicularity, best approximation) into any vector space, including spaces of functions, which is the basis of least-squares fitting, Fourier series and the state spaces of quantum mechanics.","msc":["15A63","46C05"],"links":[{"field":"harmonic-analysis","note":"Fourier series expand a function in the orthonormal system $e^{2\\pi i k x}$ with respect to $\\langle f, g\\rangle = \\int_0^1 f\\bar g$, and Parseval's identity is Pythagoras in infinitely many dimensions."},{"field":"quantum-computing","note":"Quantum states are unit vectors in a complex inner product space, and the probability of a measurement outcome is $|\\langle \\phi, \\psi\\rangle|^2$."},{"field":"probability","note":"Covariance is an inner product on mean-zero random variables with finite variance (identifying variables that are equal with probability $1$), so correlation is the cosine of an angle and uncorrelated means orthogonal."}],"refs":["Axler, Linear Algebra Done Right","Strang, Introduction to Linear Algebra","Halmos, Finite-Dimensional Vector Spaces"],"status":null,"aliases":["inner product space","dot product","scalar product","orthogonality","orthonormal basis","Gram–Schmidt","orthogonal projection","orthogonal complement","least squares"],"fields":["linear-algebra","geometry"],"stage":"undergraduate","np":{"textbook":33,"olympiad":2,"bridge":0,"research":0,"examples":0},"nprob":35,"lesson":{"minutes":18,"checks":11,"fixed":1}},{"id":"spectral-theorem","band":"linalg","title":"The spectral theorem","short":"Spectral theorem","pre":["diagonalization","inner-products"],"sum":"The spectral theorem says that every real symmetric matrix $A$ can be diagonalised by an orthogonal change of basis: $A = QDQ^{\\mathsf T}$ with $Q$ orthogonal and $D$ real diagonal. Equivalently, its eigenvalues are real and it has an orthonormal basis of eigenvectors, so the map $x\\mapsto Ax$ is a stretch along perpendicular axes; the same holds for complex Hermitian matrices with a unitary $Q$.","key":["A=A^{\\mathsf T}\\ \\Longrightarrow\\ A=QDQ^{\\mathsf T},\\qquad Q^{\\mathsf T}Q=I,\\ D\\ \\text{real diagonal}","A=\\sum_{i=1}^{n}\\lambda_i\\, q_iq_i^{\\mathsf T}","\\max_{\\|x\\|=1} x^{\\mathsf T}Ax=\\lambda_{\\max},\\qquad \\min_{\\|x\\|=1}x^{\\mathsf T}Ax=\\lambda_{\\min}"],"why":"Symmetric and Hermitian matrices are everywhere (Hessians, covariance matrices, adjacency matrices of graphs, quantum observables), and the spectral theorem reduces each of them to independent one-dimensional pieces: principal axes of a conic, principal components of data, normal modes of a vibrating system.","msc":["15A18","47B15"],"links":[{"field":"calculus","note":"The second-derivative test in several variables diagonalises the symmetric Hessian matrix: a critical point is a local minimum when all its eigenvalues are positive."},{"field":"probability","note":"A covariance matrix is symmetric and positive semidefinite, and its orthonormal eigenvectors are the principal components used in principal component analysis."},{"field":"physics","note":"Observables in quantum mechanics are self-adjoint operators whose real eigenvalues are the possible measurement results, and the principal axes of inertia of a rigid body are the eigenvectors of its inertia tensor."}],"refs":["Axler, Linear Algebra Done Right","Strang, Introduction to Linear Algebra","Horn & Johnson, Matrix Analysis"],"status":null,"aliases":["spectral theorem for symmetric matrices","principal axis theorem","orthogonal diagonalisation","Hermitian matrix","self-adjoint operator","Rayleigh quotient","spectral decomposition"],"fields":["linear-algebra"],"stage":"undergraduate","np":{"textbook":20,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":20,"lesson":{"minutes":18,"checks":11,"fixed":0}},{"id":"svd","band":"linalg","title":"The singular value decomposition","short":"SVD","pre":["spectral-theorem"],"sum":"Every real $m\\times n$ matrix factors as $A = U\\Sigma V^{\\mathsf T}$ with $U$, $V$ orthogonal and $\\Sigma$ an $m\\times n$ diagonal matrix with diagonal entries $\\sigma_1 \\ge \\sigma_2 \\ge \\dots \\ge 0$, the singular values. Geometrically, $A$ sends an orthonormal basis $v_i$ of the input space to perpendicular vectors $\\sigma_iu_i$; keeping only the $k$ largest singular values gives a best approximation of $A$ of rank at most $k$, in both the operator norm and the Frobenius norm (Eckart–Young).","key":["A=U\\Sigma V^{\\mathsf T},\\qquad Av_i=\\sigma_iu_i,\\qquad A=\\sum_{i=1}^{r}\\sigma_i\\,u_iv_i^{\\mathsf T}","\\sigma_i=\\sqrt{\\lambda_i(A^{\\mathsf T}A)},\\qquad \\|A\\|=\\max_{\\|x\\|=1}\\|Ax\\|=\\sigma_1","\\min_{\\operatorname{rank}B\\le k}\\|A-B\\|=\\sigma_{k+1}\\ \\ (0\\le k<\\min(m,n)),\\ \\text{attained at } A_k=\\sum_{i\\le k}\\sigma_iu_iv_i^{\\mathsf T}"],"why":"The SVD is the workhorse of numerical linear algebra and data science: it computes ranks and least-squares solutions stably, compresses images and data by low-rank approximation, and underlies principal component analysis and recommender systems.","msc":["15A18","15A23"],"links":[{"field":"probability","note":"Principal component analysis takes the SVD of a centred $N\\times d$ data matrix (one row per observation): the right singular vectors are the directions of greatest variance and $\\sigma_i^2/(N-1)$ are the variances along them."},{"field":"quantum-computing","note":"The Schmidt decomposition of a two-part quantum state is the SVD of its coefficient matrix, and the state is entangled exactly when more than one singular value is nonzero."},{"field":"ai-research","note":"Low-rank approximation by truncated SVD is used to compress neural-network weight matrices and to analyse the effective rank of learned representations."}],"refs":["Trefethen & Bau, Numerical Linear Algebra","Strang, Introduction to Linear Algebra","Golub & Van Loan, Matrix Computations"],"status":null,"aliases":["singular value decomposition","singular values","singular vectors","Eckart–Young theorem","low-rank approximation","Moore–Penrose pseudoinverse","truncated SVD"],"fields":["linear-algebra","computer-science"],"stage":"undergraduate","np":{"textbook":14,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":14,"lesson":{"minutes":18,"checks":11,"fixed":1}},{"id":"jordan","band":"linalg","title":"Jordan normal form","short":"Jordan form","pre":["diagonalization"],"sum":"Every complex square matrix is similar to a Jordan matrix: a block diagonal matrix whose blocks $J_k(\\lambda)$ have an eigenvalue $\\lambda$ on the diagonal and $1$s just above it. The Jordan form is unique up to the order of the blocks, so it classifies matrices up to similarity; it is diagonal exactly when the matrix is diagonalisable, and the block sizes are read off from the dimensions of $\\ker(A-\\lambda I)^j$.","key":["P^{-1}AP=J=\\operatorname{diag}\\big(J_{k_1}(\\lambda_1),\\dots,J_{k_s}(\\lambda_s)\\big),\\qquad J_k(\\lambda)=\\lambda I_k+N,\\ N^k=0","\\#\\{\\text{blocks } J_k(\\lambda) \\text{ with } k\\ge j\\}=\\dim\\ker(A-\\lambda I)^j-\\dim\\ker(A-\\lambda I)^{j-1}","J_k(\\lambda)^m=\\sum_{j=0}^{k-1}\\binom{m}{j}\\lambda^{m-j}N^j"],"why":"Jordan form is the complete answer to the question of when two matrices represent the same linear map in different bases, and it explains the terms $t^je^{\\lambda t}$ and $m^j\\lambda^m$ that appear in differential equations and recurrences with repeated characteristic roots.","msc":["15A21"],"links":[{"field":"differential-equations","note":"A Jordan block of size $k$ in $x' = Ax$ produces solutions $t^je^{\\lambda t}$ with $j < k$, which is why repeated characteristic roots give polynomial factors."},{"field":"dynamics","note":"The iterates $A^m x$ of a linear map tend to $0$ for every $x$ exactly when all eigenvalues satisfy $|\\lambda| < 1$, and Jordan blocks show the transient polynomial growth $m^j|\\lambda|^m$ along the way."},{"field":"algebra","note":"Jordan form is the structure theorem for finitely generated modules over the principal ideal domain $\\mathbb C[t]$, applied to $\\mathbb C^n$ with $t$ acting as $A$; it also lists the conjugacy classes of the group $GL_n(\\mathbb C)$."}],"refs":["Axler, Linear Algebra Done Right","Hoffman & Kunze, Linear Algebra","Horn & Johnson, Matrix Analysis"],"status":null,"aliases":["Jordan canonical form","Jordan normal form","Jordan block","generalized eigenvector","generalised eigenspace","nilpotent matrix","similarity classification"],"fields":["linear-algebra"],"stage":"undergraduate","np":{"textbook":0,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":1,"lesson":{"minutes":20,"checks":12,"fixed":2}},{"id":"dual-spaces","band":"linalg","title":"Dual spaces and quotient spaces","short":"Duality","pre":["linear-maps"],"sum":"The dual space $V^*$ of a vector space $V$ over $F$ is the space of linear functionals $V \\to F$, and the quotient $V/U$ is the space of cosets $v+U$, obtained by declaring vectors of a subspace $U$ to be zero. For finite-dimensional $V$ both have predictable dimensions, and the transpose of a matrix turns out to be the dual map, which is why row rank equals column rank.","key":["\\dim V^* = \\dim V,\\qquad \\dim U^0 = \\dim V/U = \\dim V - \\dim U \\qquad (\\dim V < \\infty)","V/\\operatorname{null} T \\;\\cong\\; \\operatorname{range} T \\qquad (\\text{first isomorphism theorem})","\\operatorname{null} T' = (\\operatorname{range} T)^0,\\qquad \\mathcal{M}(T') = \\mathcal{M}(T)^{\\mathsf{T}} \\ \\ (\\text{dual bases})"],"why":"Linear functionals are how one measures vectors: coordinates, evaluations of a polynomial at a point, integrals, and gradients of functions are all elements of a dual space, and quotients are the standard way to build new spaces by ignoring a subspace.","msc":["15A03","15A04"],"links":[{"field":"functional-analysis","note":"In infinite dimensions the dual space of a normed space is restricted to continuous functionals, and the Hahn–Banach and Riesz representation theorems describe it."},{"field":"differential-geometry","note":"The cotangent space at a point of a manifold is the dual of the tangent space, and the differential $df$ of a function is a covector field."},{"field":"physics","note":"In quantum mechanics a bra $\\langle\\phi|$ is the linear functional on state vectors defined by the inner product, and in relativity covectors carry lower indices."}],"refs":["Axler, Linear Algebra Done Right","Halmos, Finite-Dimensional Vector Spaces","Dummit & Foote, Abstract Algebra"],"status":null,"aliases":["dual space","linear functional","covector","dual basis","annihilator","dual map","transpose","double dual","quotient space","coset","first isomorphism theorem"],"fields":["linear-algebra"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":5,"fixed":1}},{"id":"tensor-products","band":"linalg","title":"Tensor products and exterior algebra","short":"Tensors & exterior algebra","pre":["dual-spaces","determinants"],"sum":"The tensor product $V\\otimes W$ is the vector space that turns bilinear maps out of $V\\times W$ into linear maps; if $e_i$ and $f_j$ are bases, the $e_i\\otimes f_j$ form a basis, so $\\dim(V\\otimes W) = \\dim V\\cdot\\dim W$. The exterior power $\\Lambda^k V$ does the same for alternating multilinear maps, with $v\\wedge w = -w\\wedge v$, and its top degree $\\Lambda^n V$ is one-dimensional with the determinant as its scaling factor.","key":["\\operatorname{Bil}(V\\times W, U) \\;\\cong\\; \\mathcal{L}(V\\otimes W, U),\\qquad \\dim (V\\otimes W) = \\dim V \\cdot \\dim W","\\dim \\Lambda^k V = \\binom{n}{k},\\qquad v_1\\wedge\\cdots\\wedge v_n = \\det(A)\\; e_1\\wedge\\cdots\\wedge e_n","V^*\\otimes W \\;\\cong\\; \\mathcal{L}(V,W) \\quad (\\text{finite dimensions})"],"why":"Tensors are the language for anything multilinear: bilinear forms, the metric and curvature of a space, stress in a material, and the joint state of two quantum systems, while the exterior algebra underlies determinants, oriented volume and differential forms.","msc":["15A69","15A75"],"links":[{"field":"differential-geometry","note":"A Riemannian metric is a symmetric tensor field of type $(0,2)$, and differential $k$-forms are sections of the $k$-th exterior power of the cotangent bundle."},{"field":"quantum-computing","note":"The state space of $n$ qubits is the tensor product of $n$ copies of $\\mathbb{C}^2$, and an entangled state is exactly a tensor that is not a pure tensor."},{"field":"representation-theory","note":"Tensor products, symmetric powers and exterior powers of representations are the basic ways of building new representations from old ones."}],"refs":["Axler, Linear Algebra Done Right","Dummit & Foote, Abstract Algebra","Lee, Introduction to Smooth Manifolds"],"status":null,"aliases":["tensor product","tensor","multilinear map","universal property","Kronecker product","pure tensor","simple tensor","tensor rank","exterior algebra","wedge product","Grassmann algebra","alternating form","Plücker relation"],"fields":["linear-algebra","algebra","physics"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":7,"fixed":1}},{"id":"least-squares","band":"linalg","title":"Orthogonal projection, least squares and QR","short":"Least squares","pre":["inner-products","linear-maps"],"sum":"When $Ax=b$ has no solution, the least-squares solution $\\hat x$ minimises $\\|Ax-b\\|$; geometrically $A\\hat x$ is the orthogonal projection of $b$ onto the column space of $A$, so the error $b-A\\hat x$ is perpendicular to every column. This gives the normal equations $A^{\\mathsf{T}}A\\hat x = A^{\\mathsf{T}}b$, and in practice one solves them stably through a QR factorisation $A=QR$.","key":["\\|b - A\\hat x\\| = \\min_x \\|b-Ax\\| \\iff A^{\\mathsf{T}}(b - A\\hat x) = 0 \\iff A^{\\mathsf{T}}A\\,\\hat x = A^{\\mathsf{T}}b","P = A(A^{\\mathsf{T}}A)^{-1}A^{\\mathsf{T}},\\qquad P^2 = P = P^{\\mathsf{T}}\\qquad(\\text{independent columns})","A = QR,\\ Q^{\\mathsf{T}}Q = I,\\ R \\text{ upper triangular} \\;\\Longrightarrow\\; R\\hat x = Q^{\\mathsf{T}}b"],"why":"Least squares is how a model is fitted to more measurements than unknowns, from a straight line through data points to GPS positioning and the calibration of instruments, and the projection picture behind it reappears in Fourier series and statistics.","msc":["65F20","62J05"],"links":[{"field":"optimisation","note":"Minimising $\\|Ax-b\\|^2$ is the model convex quadratic problem, and Gauss–Newton methods for nonlinear fitting solve a linear least-squares problem at every step."},{"field":"functional-analysis","note":"The projection theorem in Hilbert spaces says the closest point of a closed subspace is the orthogonal projection, which is the infinite-dimensional form of the normal equations."},{"field":"harmonic-analysis","note":"The partial sums of a Fourier series are the least-squares best approximations by trigonometric polynomials, because they are orthogonal projections in $L^2$."}],"refs":["Strang, Introduction to Linear Algebra","Trefethen & Bau, Numerical Linear Algebra","Boyd & Vandenberghe, Introduction to Applied Linear Algebra"],"status":null,"aliases":["least squares","method of least squares","normal equations","orthogonal projection","projection matrix","line of best fit","QR decomposition","Gram–Schmidt","Householder reflection","overdetermined system","linear regression"],"fields":["linear-algebra","statistics","numerical-analysis"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":6,"fixed":1}},{"id":"groups","band":"abstract","title":"Groups and symmetry","short":"Groups","pre":[],"sum":"A group is a set with an associative operation, an identity and inverses. Lagrange's theorem, group actions and orbit counting (Burnside) are the first tools.","key":["|H| \\text{ divides } |G|\\ \\ (H \\le G,\\ G \\text{ finite})\\ \\ \\text{(Lagrange)}","\\#\\text{orbits} = \\frac1{|G|}\\sum_{g\\in G}|\\operatorname{Fix}(g)|\\ \\ (G \\text{ finite, acting on a finite set } X)\\ \\ \\text{(Burnside)}"],"why":"Symmetry is group theory; Fermat's little theorem is Lagrange's theorem for $(\\mathbb Z/p)^\\times$.","msc":["20-01","20B05"],"links":[{"field":"physics","note":"Symmetry groups classify particles and conservation laws."},{"field":"number-theory","note":"Unit groups mod $n$ and class groups are where groups first meet arithmetic."}],"refs":["Artin, Algebra"],"status":null,"aliases":["group theory","Lagrange","Burnside","symmetry"],"fields":["algebra"],"stage":"undergraduate","np":{"textbook":3,"olympiad":5,"bridge":0,"research":3,"examples":0},"nprob":8,"lesson":{"minutes":25,"checks":11,"fixed":1}},{"id":"group-homomorphisms","band":"abstract","title":"Homomorphisms, normal subgroups and quotient groups","short":"Quotient groups","pre":["groups"],"sum":"A homomorphism is a map between groups that respects the operation, $\\varphi(ab) = \\varphi(a)\\varphi(b)$. Its kernel is a normal subgroup, and conversely every normal subgroup $N$ of $G$ lets the cosets of $N$ form a quotient group $G/N$. The first isomorphism theorem ties these together: the image of a homomorphism is the quotient of $G$ by its kernel.","key":["\\varphi(ab) = \\varphi(a)\\varphi(b)","N \\trianglelefteq G \\iff gNg^{-1} = N \\text{ for all } g \\in G","G/\\ker\\varphi \\cong \\operatorname{im}\\varphi"],"why":"Quotients let you study a group by collapsing part of it: $\\mathbb Z/n\\mathbb Z$ is $\\mathbb Z$ modulo $n\\mathbb Z$, and the sign of a permutation identifies $S_n/A_n$ with $\\{\\pm 1\\}$. The same pattern of map, kernel and quotient runs through rings, vector spaces and topology.","msc":["20-01","20A05"],"links":[{"field":"number-theory","note":"Residue rings $\\mathbb Z/n\\mathbb Z$ are quotients of $\\mathbb Z$, and isomorphisms such as the Chinese remainder theorem are first-isomorphism-theorem statements."},{"field":"linear-algebra","note":"The determinant is a homomorphism from invertible matrices to nonzero scalars with kernel $SL_n$, and $|G| = |\\ker\\varphi|\\,|\\operatorname{im}\\varphi|$ is the group analogue of rank–nullity."},{"field":"topology","note":"Quotients of the fundamental group appear throughout topology; for example the first homology group of a path-connected space is the fundamental group divided by its commutator subgroup."}],"refs":["Dummit & Foote, Abstract Algebra","Artin, Algebra","Herstein, Topics in Algebra"],"status":null,"aliases":["group homomorphism","kernel","normal subgroup","quotient group","factor group","first isomorphism theorem","isomorphism"],"fields":["algebra"],"stage":"undergraduate","np":{"textbook":0,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":1,"lesson":{"minutes":19,"checks":8,"fixed":0}},{"id":"group-actions","band":"abstract","title":"Group actions and the Sylow theorems","short":"Group actions & Sylow","pre":["group-homomorphisms"],"sum":"A group acts on a set when each group element permutes the set, compatibly with the group law. Orbits and stabilisers are linked by $|G \\cdot x| = |G|/|G_x|$; this gives Burnside's lemma for counting objects up to symmetry and, when a group acts on itself or on its subsets, the class equation and the Sylow theorems on subgroups of prime-power order.","key":["|G \\cdot x| = [G : G_x] = \\frac{|G|}{|G_x|}","\\#\\{\\text{orbits}\\} = \\frac{1}{|G|}\\sum_{g \\in G} |\\operatorname{Fix}(g)|","|G| = p^a m,\\ p \\nmid m \\implies n_p \\equiv 1 \\pmod p \\text{ and } n_p \\mid m"],"why":"Actions turn symmetry into counting: they count necklaces and colourings up to rotation, and applied to a group itself they force structure, for example that every group of order $15$ is cyclic.","msc":["20D20"],"links":[{"field":"combinatorics","note":"Burnside's lemma and its refinement, Pólya enumeration, count colourings, necklaces and graphs up to symmetry."},{"field":"geometry","note":"Symmetry groups of polyhedra and of tilings act on vertices, edges and faces, and orbit–stabiliser computes their orders."},{"field":"number-theory","note":"Counting necklaces of prime length with Burnside's lemma proves Fermat's little theorem, and Galois groups act on the roots of polynomials."}],"refs":["Dummit & Foote, Abstract Algebra","Artin, Algebra","Rotman, An Introduction to the Theory of Groups"],"status":null,"aliases":["group action","orbit","stabiliser","orbit-stabiliser theorem","Burnside's lemma","Cauchy-Frobenius lemma","class equation","Sylow theorems","Sylow subgroup","Cauchy's theorem","p-group"],"fields":["algebra"],"stage":"undergraduate","np":{"textbook":0,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":1,"lesson":{"minutes":21,"checks":9,"fixed":1}},{"id":"rings","band":"abstract","title":"Rings, ideals and quotient rings","short":"Rings","pre":["groups","congruences"],"sum":"A ring is a set with an addition and a multiplication obeying the usual laws, such as $\\mathbb Z$, $\\mathbb Z/n\\mathbb Z$, polynomials and matrices. Ideals are the subsets one can divide out by: $R/I$ is again a ring, generalising congruence modulo $n$. For a commutative ring, the quotient is a field exactly when $I$ is maximal, and an integral domain exactly when $I$ is prime.","key":["a \\in I,\\ r \\in R \\implies ra \\in I","R/\\ker\\varphi \\cong \\operatorname{im}\\varphi","R \\text{ commutative}: \\quad R/I \\text{ is a field} \\iff I \\text{ is maximal}"],"why":"Quotient rings build new number systems from old ones: $\\mathbb C \\cong \\mathbb R[x]/(x^2 + 1)$, and every finite field is a quotient of a polynomial ring over $\\mathbb Z/p\\mathbb Z$.","msc":["13-01","13A15"],"links":[{"field":"number-theory","note":"Ideals in rings of algebraic integers restore unique factorisation where it fails for elements, and congruences modulo $n$ are computations in $\\mathbb Z/n\\mathbb Z$."},{"field":"algebraic-geometry","note":"The solutions of a system of polynomial equations are studied through the ideal the polynomials generate and the quotient ring of polynomial functions on the solution set."},{"field":"cryptography","note":"RSA works in $\\mathbb Z/n\\mathbb Z$, and lattice-based schemes compute in polynomial quotient rings such as $(\\mathbb Z/q\\mathbb Z)[x]/(x^n + 1)$."}],"refs":["Dummit & Foote, Abstract Algebra","Atiyah & Macdonald, Introduction to Commutative Algebra","Artin, Algebra"],"status":null,"aliases":["ring","commutative ring","ideal","quotient ring","factor ring","integral domain","zero divisor","unit","maximal ideal","prime ideal","principal ideal domain","ring homomorphism"],"fields":["algebra"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":8,"fixed":2}},{"id":"fields-ext","band":"abstract","title":"Fields and field extensions","short":"Field extensions","pre":["rings","polynomials-roots","basis-dimension"],"sum":"If $K \\subseteq L$ are fields, then $L$ is a vector space over $K$, and its dimension $[L : K]$ is the degree of the extension. Adjoining an algebraic element $\\alpha$ whose minimal polynomial has degree $n$ gives $K(\\alpha) \\cong K[x]/(m_\\alpha)$, of degree $n$, and degrees multiply in towers of fields.","key":["[K(\\alpha) : K] = \\deg m_\\alpha","K(\\alpha) \\cong K[x]/(m_\\alpha)","[M : K] = [M : L]\\,[L : K]"],"why":"Degree arguments settle classical problems: doubling the cube and trisecting a $60^\\circ$ angle with ruler and compass are impossible because $\\sqrt[3]{2}$ and $\\cos 20^\\circ$ have degree $3$ over $\\mathbb Q$.","msc":["12F05"],"links":[{"field":"geometry","note":"A length constructible with ruler and compass has degree a power of $2$ over $\\mathbb Q$, which rules out doubling the cube and trisecting general angles."},{"field":"number-theory","note":"Number fields are finite extensions of $\\mathbb Q$, and their degrees and bases are the starting point of algebraic number theory."},{"field":"cryptography","note":"Arithmetic in $\\mathbb F_p[x]/(f)$ for an irreducible $f$, the construction of this lesson over a finite field, is the arithmetic of AES and of many codes."}],"refs":["Dummit & Foote, Abstract Algebra","Stewart, Galois Theory","Artin, Algebra"],"status":null,"aliases":["field extension","degree of an extension","algebraic element","minimal polynomial","simple extension","tower law","splitting field","Kronecker's construction","ruler and compass constructions"],"fields":["algebra"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":8,"fixed":1}},{"id":"finite-fields","band":"abstract","title":"Finite fields","short":"Finite fields","pre":["fields-ext","order-primroot"],"sum":"A finite field has $p^n$ elements for some prime $p$, and for every prime power $q$ there is exactly one field $\\mathbb F_q$ with $q$ elements up to isomorphism: the splitting field of $x^q - x$ over $\\mathbb F_p$. Its nonzero elements form a cyclic group, and the Frobenius map $a \\mapsto a^p$ is an automorphism.","key":["|F| = p^n, \\quad n = [F : \\mathbb F_p]","x^q - x = \\prod_{a \\in \\mathbb F_q} (x - a)","\\mathbb F_q^\\times \\cong \\mathbb Z/(q-1)\\mathbb Z"],"why":"Finite fields are the arithmetic of error-correcting codes such as Reed–Solomon codes, of the AES cipher and elliptic-curve cryptography, and of many combinatorial constructions.","msc":["12E20","11T06"],"links":[{"field":"cryptography","note":"AES computes in $\\mathbb F_{2^8}$, and Diffie–Hellman and elliptic-curve schemes rely on the difficulty of discrete logarithms in groups built from $\\mathbb F_q$."},{"field":"computer-science","note":"Reed–Solomon codes evaluate polynomials of degree less than $k$ at $n$ points of $\\mathbb F_q$; since a nonzero such polynomial has fewer than $k$ roots, two different codewords differ in at least $n - k + 1$ places."},{"field":"combinatorics","note":"Finite fields give projective planes of every prime-power order and explicit constructions of Sidon sets and extremal graphs."}],"refs":["Lidl & Niederreiter, Introduction to Finite Fields and their Applications","Ireland & Rosen, A Classical Introduction to Modern Number Theory","Dummit & Foote, Abstract Algebra"],"status":null,"aliases":["Galois field","GF(q)","F_q","Frobenius automorphism","primitive element","characteristic of a field","irreducible polynomials over a finite field"],"fields":["algebra","number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":4,"bridge":0,"research":0,"examples":0},"nprob":4,"lesson":{"minutes":22,"checks":11,"fixed":2}},{"id":"galois","band":"abstract","title":"Galois theory","short":"Galois theory","pre":["fields-ext","group-actions"],"sum":"The Galois group of a Galois extension $L/K$ is the group of automorphisms of $L$ that fix $K$; for the splitting field of a polynomial it permutes the roots. The fundamental theorem matches subgroups of the Galois group with intermediate fields, and in characteristic $0$ a polynomial is solvable by radicals exactly when its Galois group is solvable, which is why there is no general formula for quintics.","key":["|\\operatorname{Gal}(L/K)| = [L : K] \\text{ for } L/K \\text{ Galois}","H \\longleftrightarrow L^H, \\qquad [L^H : K] = [G : H]","f \\text{ solvable by radicals} \\iff \\operatorname{Gal}(f) \\text{ solvable} \\quad (\\operatorname{char} K = 0)"],"why":"It explains which polynomial equations have formulas in radicals and which regular polygons can be constructed, and Galois groups of number fields are central objects of modern number theory.","msc":["12F10","11R32"],"links":[{"field":"number-theory","note":"Galois groups of cyclotomic fields are $(\\mathbb Z/n\\mathbb Z)^\\times$, their quadratic subfields give a proof of quadratic reciprocity, and Frobenius elements describe how unramified primes split in Galois number fields."},{"field":"geometry","note":"A regular $n$-gon is constructible with ruler and compass exactly when the Galois group of $\\mathbb Q(e^{2\\pi i/n})$ has order a power of $2$, which explains Gauss's $17$-gon."},{"field":"topology","note":"For a connected, locally path-connected, semilocally simply connected space, connected covering spaces (with base points) correspond to subgroups of the fundamental group, and normal subgroups give the coverings whose deck groups are the quotients, mirroring the Galois correspondence."}],"refs":["Stewart, Galois Theory","Dummit & Foote, Abstract Algebra","E. Artin, Galois Theory"],"status":null,"aliases":["Galois group","fundamental theorem of Galois theory","Galois correspondence","Galois extension","fixed field","solvable group","solvability by radicals","Abel–Ruffini theorem","insolvability of the quintic"],"fields":["algebra"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":26,"checks":7,"fixed":5}},{"id":"solvable-groups","band":"abstract","title":"Solvable and nilpotent groups","short":"Solvable groups","pre":["group-homomorphisms","group-actions"],"sum":"A group is solvable if it can be built from abelian groups in finitely many layers: its derived series $G \\trianglerighteq G' \\trianglerighteq G'' \\trianglerighteq \\cdots$ of commutator subgroups reaches the trivial group. Nilpotent groups are the stronger case in which repeatedly commutating with the whole group, $\\gamma_{i+1} = [\\gamma_i, G]$, reaches the identity; every finite $p$-group is nilpotent, and $S_n$ is solvable only for $n\\le 4$.","key":["G^{(0)} = G,\\quad G^{(i+1)} = [G^{(i)}, G^{(i)}];\\qquad G \\text{ solvable} \\iff G^{(k)} = 1 \\text{ for some } k","N \\trianglelefteq G:\\quad G \\text{ solvable} \\iff N \\text{ and } G/N \\text{ solvable}","\\text{abelian} \\Rightarrow \\text{nilpotent} \\Rightarrow \\text{solvable},\\qquad |G| = p^n \\Rightarrow G \\text{ nilpotent}"],"why":"Solvability is exactly the group-theoretic condition in Galois's criterion for solving a polynomial equation by radicals, and since $A_5$ is not solvable, the general quintic has no formula in radicals.","msc":["20D10","20D15","20F16","20F18"],"links":[{"field":"representation-theory","note":"Burnside's theorem that groups of order $p^aq^b$ are solvable was first proved with character theory, and solvable and nilpotent Lie algebras are the subject of Lie's and Engel's theorems."},{"field":"number-theory","note":"A Galois extension of number fields has solvable Galois group exactly when it is a tower of abelian extensions, and abelian extensions are what class field theory describes."}],"refs":["Dummit & Foote, Abstract Algebra","Rotman, An Introduction to the Theory of Groups","Isaacs, Finite Group Theory"],"status":null,"aliases":["solvable group","soluble group","nilpotent group","derived series","commutator subgroup","derived subgroup","lower central series","upper central series","perfect group","nilpotency class","subnormal series"],"fields":["algebra"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":7,"fixed":1}},{"id":"ufds","band":"abstract","title":"Euclidean domains, PIDs and unique factorisation","short":"Unique factorisation domains","pre":["rings","fta"],"sum":"A unique factorisation domain (UFD) is an integral domain in which every nonzero non-unit is a product of irreducibles, uniquely up to order and units, as in $\\mathbb{Z}$. Euclidean domains (with a division algorithm) are principal ideal domains (every ideal is generated by one element), and PIDs are UFDs; the ring $\\mathbb{Z}[\\sqrt{-5}]$, where $6 = 2\\cdot3 = (1+\\sqrt{-5})(1-\\sqrt{-5})$, shows that unique factorisation can fail.","key":["\\text{Euclidean domain} \\;\\Rightarrow\\; \\text{PID} \\;\\Rightarrow\\; \\text{UFD} \\;\\Rightarrow\\; \\text{integral domain}","\\text{in a UFD (in particular a PID):}\\quad p \\text{ irreducible} \\iff p \\text{ prime}","R \\text{ a UFD} \\;\\Longrightarrow\\; R[x] \\text{ a UFD}\\qquad(\\text{Gauss})"],"why":"Unique factorisation in rings like the Gaussian integers $\\mathbb{Z}[i]$ turns Diophantine equations such as $x^2+1 = y^3$ into factor-matching problems, and its failure in other rings of integers is what led Kummer and Dedekind to invent ideals.","msc":["13F15","13F07","13F10"],"links":[{"field":"algebraic-geometry","note":"A Noetherian domain is a UFD exactly when every height-one prime ideal is principal, and the coordinate ring of a variety is a UFD only when its divisor class group vanishes."},{"field":"computer-science","note":"Computer algebra systems compute greatest common divisors and factorisations of polynomials over $\\mathbb{Z}$ and finite fields, relying on the fact that these polynomial rings are UFDs."}],"refs":["Dummit & Foote, Abstract Algebra","Ireland & Rosen, A Classical Introduction to Modern Number Theory","Artin, Algebra"],"status":null,"aliases":["unique factorisation domain","unique factorization domain","UFD","factorial ring","principal ideal domain","PID","Euclidean domain","Euclidean ring","irreducible element","prime element","associates","Gauss's lemma"],"fields":["algebra","number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":7,"fixed":0}},{"id":"modules","band":"abstract","title":"Modules and the structure theorem over a PID","short":"Modules","pre":["ufds","linear-maps"],"sum":"A module over a ring $R$ is what a vector space becomes when the scalars form a ring instead of a field; abelian groups are exactly $\\mathbb{Z}$-modules, and a linear operator $T$ on a vector space makes it an $F[x]$-module. Over a principal ideal domain every finitely generated module is a direct sum $R^r\\oplus R/(a_1)\\oplus\\cdots\\oplus R/(a_m)$ with $a_1\\mid a_2\\mid\\cdots\\mid a_m$, which at once classifies finitely generated abelian groups and gives the rational and Jordan canonical forms.","key":["M \\;\\cong\\; R^r \\oplus R/(a_1)\\oplus\\cdots\\oplus R/(a_m),\\qquad a_1\\mid a_2\\mid\\cdots\\mid a_m \\text{ nonzero non-units}","P A Q = \\operatorname{diag}(d_1,\\dots,d_k,0,\\dots,0),\\quad d_1\\mid d_2\\mid\\cdots,\\quad d_1d_2\\cdots d_j = \\gcd(j\\times j \\text{ minors of } A)","V_T \\cong F[x]/(f_1)\\oplus\\cdots\\oplus F[x]/(f_m),\\qquad f_m = \\text{minimal polynomial},\\ \\ f_1\\cdots f_m = \\text{characteristic polynomial}"],"why":"One theorem with one algorithm (the Smith normal form) classifies finite abelian groups, computes the homology groups of a space from its cell structure, and produces the Jordan form of a matrix.","msc":["13C05","20K01"],"links":[{"field":"topology","note":"Integral homology groups are finitely generated abelian groups computed by putting the boundary matrices of a cell complex into Smith normal form, which separates the Betti numbers from the torsion."},{"field":"representation-theory","note":"A representation of a group $G$ over a field $F$ is the same thing as a module over the group algebra $F[G]$, so module theory is the language of representation theory."},{"field":"number-theory","note":"The ideal class group of a number field and the group of points of an elliptic curve over $\\mathbb{Q}$ are finitely generated abelian groups, described by the structure theorem."}],"refs":["Dummit & Foote, Abstract Algebra","Atiyah & Macdonald, Introduction to Commutative Algebra","Artin, Algebra"],"status":null,"aliases":["module","R-module","free module","torsion module","finitely generated module","structure theorem for modules over a PID","Smith normal form","invariant factors","elementary divisors","classification of finitely generated abelian groups","rational canonical form"],"fields":["algebra","linear-algebra"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":7,"fixed":1}},{"id":"noetherian-rings","band":"abstract","title":"Noetherian rings and Hilbert's basis theorem","short":"Noetherian rings","pre":["rings","modules"],"sum":"A commutative ring is Noetherian if every ideal is finitely generated, or equivalently if every ascending chain of ideals $I_1 \\subseteq I_2 \\subseteq \\cdots$ eventually stops. Hilbert's basis theorem says that $R[x]$ is Noetherian whenever $R$ is, so every ideal of $k[x_1, \\dots, x_n]$ has finitely many generators and every system of polynomial equations is equivalent to a finite one.","key":["I_1 \\subseteq I_2 \\subseteq \\cdots \\implies I_N = I_{N+1} = \\cdots \\text{ for some } N","R \\text{ Noetherian} \\implies R[x_1, \\dots, x_n] \\text{ Noetherian}","R \\text{ Noetherian},\\ I \\text{ an ideal} \\implies R/I \\text{ Noetherian}"],"why":"It is the finiteness condition behind most of commutative algebra and algebraic geometry: it guarantees that zero sets of polynomials have finite descriptions and that procedures such as Buchberger's Gröbner basis algorithm terminate.","msc":["13E05"],"links":[{"field":"number-theory","note":"Rings of integers of number fields are Noetherian, which is one of the three conditions in the definition of a Dedekind domain, where ideals factor uniquely into prime ideals."},{"field":"computer-science","note":"Termination of Buchberger's algorithm for Gröbner bases, the core of computer algebra systems, follows from the ascending chain condition on monomial ideals."}],"refs":["Atiyah & Macdonald, Introduction to Commutative Algebra","Dummit & Foote, Abstract Algebra","Eisenbud, Commutative Algebra with a View Toward Algebraic Geometry"],"status":null,"aliases":["Noetherian ring","Hilbert's basis theorem","Hilbert basis theorem","ascending chain condition","ACC on ideals","finitely generated ideal","Noetherian module","maximal condition","Dickson's lemma"],"fields":["algebra","algebraic-geometry"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":8,"fixed":0}},{"id":"categories-functors","band":"abstract","title":"Categories, functors and natural transformations","short":"Categories","pre":["groups","vector-spaces","topological-spaces"],"sum":"A category consists of objects and composable arrows (morphisms) with identities, subject to associativity; a functor maps objects to objects and arrows to arrows, preserving composition; a natural transformation $\\eta\\colon F \\Rightarrow G$ is a family of arrows $\\eta_X\\colon F(X) \\to G(X)$ compatible with every arrow $f\\colon X \\to Y$. The one idea to remember: study objects through the maps between them, and call a construction natural when it commutes with all maps.","key":["(h \\circ g) \\circ f = h \\circ (g \\circ f), \\qquad f \\circ \\mathrm{id}_X = f = \\mathrm{id}_Y \\circ f","\\eta_Y \\circ F(f) = G(f) \\circ \\eta_X \\quad \\text{for all } f\\colon X \\to Y","\\mathrm{Nat}\\big(\\mathrm{Hom}(A,-), F\\big) \\cong F(A) \\quad \\text{(Yoneda)}"],"why":"Functoriality turns topology into algebra: because the fundamental group is a functor, the disc cannot retract onto its boundary circle. Universal properties and the Yoneda lemma explain why products, tensor products and free objects are unique up to uni

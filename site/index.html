<style>
/* Layout: a field guide. Warm paper, serif reading text, sans for apparatus. Concept pages carry a margin column;
   problems are cards whose answers stay folded until asked for. */
:root {
  --paper: #fbfaf6; --raise: #ffffff; --sunk: #f2efe7; --ink: #1d1c19; --ink-2: #4e4b44; --ink-3: #7c786e;
  --rule: #e6e2d8; --rule-2: #cdc7b9; --accent: #a13d1d; --accent-tint: rgba(161, 61, 29, 0.08); --link: #8f3518;
  --good: #2c7a4b; --good-tint: rgba(44, 122, 75, 0.10); --warn: #946200; --warn-tint: rgba(148, 98, 0, 0.11); --bad: #b3261e;
  --a-foundations: #3462c4; --a-analysis: #11866e; --a-analytic: #c3452a; --a-algebraic: #96408e; --a-combinatorial: #b07800; --a-computation: #5a6c80; --a-frontier: #1d1c19; --a-discrete: #12799a; --a-olyalg: #5f7f1c; --a-geometry: #8a5a2b; --a-precalc: #5b9a6a; --a-calculus: #13875a; --a-realanalysis: #0b5c49; --a-linalg: #a8468e; --a-abstract: #7a4fb0; --a-probability: #c2700f; --a-logic: #6b5aa6; --a-complex: #0f8f86; --a-harmonic: #2f7fb0; --a-odes: #1e8f4e; --a-dynamics: #b4532a; --a-pde: #a8432f; --a-functional: #4a6fa5; --a-lie: #8c3f9e; --a-topology: #a0522d; --a-diffgeo: #7a5c00; --a-statistics: #c0306a; --a-numerics: #4b7a8a;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif; --sans: "Public Sans", -apple-system, "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #161512; --raise: #1d1c18; --sunk: #221f1a; --ink: #ece8de; --ink-2: #b9b3a6; --ink-3: #8b8578; --rule: #2e2b25; --rule-2: #413d35;
  --accent: #ee8a63; --accent-tint: rgba(238, 138, 99, 0.12); --link: #f09872; --good: #6cc792; --good-tint: rgba(108, 199, 146, 0.12); --warn: #e8b552; --warn-tint: rgba(232, 181, 82, 0.13); --bad: #ff8a7c;
  --a-foundations: #7fa4f5; --a-analysis: #52cdb0; --a-analytic: #f2805f; --a-algebraic: #da80cf; --a-combinatorial: #e6b440; --a-computation: #98a9bd; --a-frontier: #ece8de; --a-discrete: #5cc3e2; --a-olyalg: #a9cc5e; --a-geometry: #d6a372; --a-precalc: #92d0a0; --a-calculus: #4fcf98; --a-realanalysis: #7fc8b4; --a-linalg: #ee8fd2; --a-abstract: #b99bf2; --a-probability: #f2aa55; color-scheme: dark; } } --a-logic: #b2a4ea; --a-complex: #5ad0c6; --a-harmonic: #78bde8; --a-odes: #64d08f; --a-dynamics: #ef9a73; --a-pde: #f08a74; --a-functional: #92b2e6; --a-lie: #d08ae0; --a-topology: #e09a70; --a-diffgeo: #e0c25a; --a-statistics: #f07fa8; --a-numerics: #8fc0cf;
:root[data-theme="dark"] {
  --paper: #161512; --raise: #1d1c18; --sunk: #221f1a; --ink: #ece8de; --ink-2: #b9b3a6; --ink-3: #8b8578; --rule: #2e2b25; --rule-2: #413d35;
  --accent: #ee8a63; --accent-tint: rgba(238, 138, 99, 0.12); --link: #f09872; --good: #6cc792; --good-tint: rgba(108, 199, 146, 0.12); --warn: #e8b552; --warn-tint: rgba(232, 181, 82, 0.13); --bad: #ff8a7c;
  --a-foundations: #7fa4f5; --a-analysis: #52cdb0; --a-analytic: #f2805f; --a-algebraic: #da80cf; --a-combinatorial: #e6b440; --a-computation: #98a9bd; --a-frontier: #ece8de; --a-discrete: #5cc3e2; --a-olyalg: #a9cc5e; --a-geometry: #d6a372; --a-precalc: #92d0a0; --a-calculus: #4fcf98; --a-realanalysis: #7fc8b4; --a-linalg: #ee8fd2; --a-abstract: #b99bf2; --a-probability: #f2aa55; color-scheme: dark; } --a-logic: #b2a4ea; --a-complex: #5ad0c6; --a-harmonic: #78bde8; --a-odes: #64d08f; --a-dynamics: #ef9a73; --a-pde: #f08a74; --a-functional: #92b2e6; --a-lie: #d08ae0; --a-topology: #e09a70; --a-diffgeo: #e0c25a; --a-statistics: #f07fa8; --a-numerics: #8fc0cf;
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 18px; line-height: 1.58; font-optical-sizing: auto; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 500; letter-spacing: -0.01em; }
p { margin: 0 0 14px; }
a { color: var(--link); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.sans { font-family: var(--sans); } .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .small { font-family: var(--sans); font-size: 13px; }
.eyebrow { font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

/* header */
.top { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--paper); }
.top .wrap { display: flex; align-items: center; gap: 8px 26px; min-height: 58px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font-family: var(--serif); font-size: 21px; font-weight: 500; }
.brand svg { flex: none; }
.brand span { text-box: trim-both cap alphabetic; }
@supports not (text-box: trim-both cap alphabetic) { .brand svg { transform: translateY(-2px); } }
.nav { display: flex; gap: 2px 18px; flex-wrap: wrap; font-family: var(--sans); font-size: 14.5px; }
.nav a { color: var(--ink-2); text-decoration: none; padding: 6px 0; position: relative; }
.nav a.on { color: var(--ink); font-weight: 600; }
.nav a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
.nav a small { font-family: var(--mono); font-size: 11.5px; color: var(--accent); margin-left: 4px; }
.topsearch { margin-left: auto; } .topsearch input { width: 210px; }
main { padding-block: 40px 84px; min-height: 60vh; overflow-x: clip; }

/* inputs */
input[type="text"], input[type="search"], select, textarea { background: var(--raise); border: 1px solid var(--rule-2); border-radius: 4px; padding: 8px 11px; font-family: var(--sans); font-size: 15px; }
textarea { width: 100%; min-height: 96px; resize: vertical; line-height: 1.5; }
.btn { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: 4px; padding: 8px 15px; font-family: var(--sans); font-weight: 600; font-size: 14px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link); font-family: var(--sans); font-size: 13.5px; cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent); text-underline-offset: 3px; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 4px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-right: 1px solid var(--rule-2); background: var(--raise); padding: 5px 12px; font-family: var(--sans); font-size: 13px; cursor: pointer; color: var(--ink-2); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button .n { font-family: var(--mono); font-size: 11.5px; opacity: 0.7; margin-left: 5px; }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.hero h1 { font-size: clamp(36px, 5.2vw, 56px); line-height: 1.04; font-weight: 400; letter-spacing: -0.02em; }
.hero h1 em { font-style: italic; color: var(--accent); }
.hero .lede { font-size: 19px; color: var(--ink-2); margin-top: 20px; max-width: 34em; }
.search-big { display: flex; margin-top: 26px; max-width: 520px; border: 1px solid var(--ink); border-radius: 4px; background: var(--raise); overflow: hidden; }
.search-big input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; padding: 12px 14px; }
.search-big button { border: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); font-weight: 600; padding: 0 18px; cursor: pointer; }
.frontier { border-left: 3px solid var(--accent); padding-left: 20px; }
.frontier ol { list-style: none; padding: 0; margin: 10px 0 8px; }
.frontier li { padding: 10px 0; border-bottom: 1px solid var(--rule); }
.frontier li:last-child { border-bottom: 0; }
.frontier .d { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.frontier .t { font-size: 17px; line-height: 1.35; display: block; margin-top: 2px; }
.ledger { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 48px; }
.ledger div { background: var(--raise); border: 1px solid var(--rule); border-top: 3px solid var(--accent); border-radius: 0 0 4px 4px; padding: 22px 16px 20px; text-align: center; }
.ledger b { font-family: var(--serif); font-weight: 400; font-size: 48px; line-height: 1; display: block; font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.01em; }
.ledger span { display: block; margin-top: 8px; font-family: var(--sans); font-size: 13px; color: var(--ink-3); }
.section { margin-top: 64px; }
.section-h { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--rule-2); padding-bottom: 8px; }
.section-h h2 { font-size: 28px; }
.section .sub { color: var(--ink-2); max-width: 44em; margin-top: 10px; }
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; margin-top: 18px; }
.area { background: var(--raise); border: 1px solid var(--rule); border-top: 3px solid var(--c); padding: 14px 16px 12px; border-radius: 0 0 4px 4px; }
.area h3 { font-size: 20px; } .area h3 a { color: var(--ink); text-decoration: none; } .area h3 a:hover { text-decoration: underline; }
.area p { font-size: 15px; color: var(--ink-2); margin: 6px 0 10px; line-height: 1.45; }
.area .nums { font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); }
.area ul { list-style: none; padding: 0; margin: 8px 0 0; font-size: 15px; }
.area li { padding: 2px 0; }

/* tags */
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans); font-size: 12.5px; padding: 1px 8px; border: 1px solid var(--rule-2); border-radius: 3px; color: var(--ink-2); text-decoration: none; background: var(--raise); white-space: nowrap; line-height: 1.6; }
a.tag:hover { border-color: var(--ink-3); color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--c); flex: none; }
.tag.msc { font-family: var(--mono); font-size: 11.5px; }
.tag.open { border-color: var(--accent); color: var(--accent); }
.tag.claimed { border-color: var(--warn); color: var(--warn); background: var(--warn-tint); }
.tag.solved { border-color: var(--good); color: var(--good); background: var(--good-tint); }
.tag.ai { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tag.prize { font-family: var(--mono); font-size: 11.5px; }

/* map */
.map-box { overflow-x: auto; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: var(--raise); }
.map-box svg { display: block; }
.mlabel { font-family: var(--sans); font-size: 11.5px; fill: var(--ink-2); paint-order: stroke; stroke: var(--raise); stroke-width: 3px; stroke-linejoin: round; }
.mnode { cursor: pointer; } .mnode:hover .mlabel, .mnode:focus .mlabel { fill: var(--ink); text-decoration: underline; }
.medge { fill: none; stroke: var(--rule-2); stroke-width: 0.9; }
.dim .mnode { opacity: 0.2; } .dim .medge { opacity: 0.18; }
.dim .mnode.on { opacity: 1; } .dim .medge.on { opacity: 1; stroke: var(--accent); stroke-width: 1.3; }
.mnode.done .mlabel { fill: var(--good); }
.mnode.ghost .mlabel { fill: var(--ink-3); font-style: italic; }
.mnode.focus .mlabel { font-weight: 700; fill: var(--ink); }
.medge.ghost { stroke-dasharray: 3 3; }
.fnode { cursor: pointer; } .fnode:hover circle, .fnode:focus circle { stroke: var(--accent); stroke-width: 2.4; }
.fcount { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); }
.flabel { font-family: var(--sans); font-size: 13px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--raise); stroke-width: 4px; stroke-linejoin: round; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--sans); font-size: 13px; color: var(--ink-2); margin-top: 12px; align-items: center; }
.legend svg { vertical-align: -2px; margin-right: 6px; }
.maptools { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; font-family: var(--sans); font-size: 14px; margin: 16px 0 12px; }
.maptools select { max-width: 100%; }
.caption { font-family: var(--sans); font-size: 13px; color: var(--ink-3); margin-top: 8px; }

/* concept list */
.page-h h1 { font-size: 40px; font-weight: 400; }
.page-h p { color: var(--ink-2); max-width: 44em; margin-top: 8px; }
.filters { display: grid; gap: 8px; margin-top: 16px; font-family: var(--sans); font-size: 13px; color: var(--ink-3); }
.filters .row { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; }
.filters .row > span:first-child { min-width: 58px; }
.fbtn { font-family: var(--sans); font-size: 13px; padding: 2px 10px; border-radius: 3px; border: 1px solid var(--rule-2); background: var(--raise); cursor: pointer; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.fbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.area-h { margin-top: 38px; display: flex; align-items: baseline; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--rule-2); }
.area-h h2 { font-size: 23px; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 18px; padding: 13px 0; border-bottom: 1px solid var(--rule); }
.crow h3 { font-size: 19px; } .crow h3 a { color: var(--ink); text-decoration: none; } .crow h3 a:hover { text-decoration: underline; }
.crow .desc { grid-column: 1 / 2; color: var(--ink-2); font-size: 16px; line-height: 1.5; }
.crow .meta { grid-column: 1 / 3; margin-top: 4px; }
.crow .count { font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); white-space: nowrap; text-align: right; }

/* concept page */
.crumbs { font-family: var(--sans); font-size: 13px; color: var(--ink-3); } .crumbs a { color: var(--ink-3); }
.chead { margin-top: 18px; max-width: 820px; }
.chead .eyebrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chead h1 { font-size: clamp(32px, 4.6vw, 48px); line-height: 1.1; font-weight: 400; margin-top: 8px; }
.chead .sum { font-size: 20px; color: var(--ink-2); margin-top: 16px; }
.chead .tags { margin-top: 16px; }
.cgrid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 56px; margin-top: 34px; align-items: start; }
.block { margin-top: 36px; } .block:first-child { margin-top: 0; }
.block > h2 { font-size: 24px; margin-bottom: 12px; }
.key { border-left: 3px solid var(--rule-2); padding: 2px 0 2px 18px; overflow-x: auto; }
.aside { font-size: 15.5px; }
.aside .block { margin-top: 26px; } .aside .block:first-child { margin-top: 0; }
.aside .block > h2 { font-family: var(--sans); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 6px; }
.aside ul { list-style: none; padding: 0; margin: 0; }
.aside li { padding: 5px 0; border-bottom: 1px solid var(--rule); line-height: 1.4; }
.aside .note-s { display: block; font-family: var(--sans); font-size: 13px; color: var(--ink-3); margin-top: 2px; line-height: 1.45; }
.meter { height: 4px; background: var(--rule); margin: 8px 0 6px; } .meter i { display: block; height: 100%; background: var(--good); }
/* lessons */
.lesson-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-family: var(--sans); font-size: 13px; color: var(--ink-3); padding: 10px 0 14px; border-bottom: 1px solid var(--rule); margin-bottom: 18px; }
.lesson-meta span:nth-child(2) { flex: 1 1 320px; }
.lesson-body { max-width: 44em; }
.lesson-body p { margin: 0 0 14px; }
.lb-intro p { font-size: 19px; color: var(--ink); }
.lb-h { font-size: 22px; margin: 30px 0 10px; scroll-margin-top: 80px; }
.lb-k { font-family: var(--sans); font-size: 11.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.lb-box { border: 1px solid var(--rule); border-left: 3px solid var(--c, var(--rule-2)); background: var(--raise); border-radius: 0 4px 4px 0; padding: 12px 16px 4px; margin: 16px 0; overflow-x: auto; }
.lb-def { --c: var(--a-foundations); } .lb-thm { --c: var(--accent); } .lb-pit { --c: var(--warn); } .lb-ex { --c: var(--good); }
.lb-proof { margin: -6px 0 18px; padding: 4px 0 0 16px; border-left: 1px dashed var(--rule-2); overflow-x: auto; }
.lb-proof .qed { text-align: right; color: var(--ink-3); margin-top: -10px; }
.lb-example { background: var(--sunk); border-radius: 4px; padding: 12px 16px; margin: 18px 0; overflow-x: auto; }
.lb-example > .linkbtn { margin-bottom: 4px; }
.lb-src { margin-top: 26px; font-size: 15px; color: var(--ink-2); } .lb-src ul { margin: 4px 0 0; padding-left: 18px; }
.rlist { margin: 0 0 14px; padding-left: 22px; } .rlist li { margin: 3px 0; }
.toc-block ul li { border: 0; padding: 3px 0; } .toc { text-align: left; font-size: 14px; text-decoration: none; }
@media (min-width: 901px) { .aside { position: sticky; top: 78px; max-height: calc(100vh - 96px); overflow-y: auto; } }

/* problems */
.ptools { display: grid; gap: 10px; padding: 4px 0 14px; border-bottom: 1px solid var(--rule-2); font-family: var(--sans); font-size: 13px; color: var(--ink-3); }
.ptools .row { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.pcard { background: var(--raise); border: 1px solid var(--rule); border-radius: 4px; padding: 16px 18px 14px; margin-top: 14px; }
.pcard.solvedc { border-left: 3px solid var(--good); }
.pcard-h { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); }
.pcard-h .pt { font-family: var(--sans); font-weight: 700; font-size: 13.5px; color: var(--ink); text-decoration: none; }
.pcard-h a.pt:hover { text-decoration: underline; }
.pcard-h .kind { font-family: var(--sans); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.lvl { display: inline-flex; gap: 2px; align-items: center; } .lvl i { width: 5px; height: 11px; background: var(--rule-2); display: inline-block; } .lvl i.f { background: var(--ink-2); }
.pcard .q { margin: 10px 0 12px; overflow-wrap: anywhere; }

ential laws, and the half-life of a decay $e^{-kt}$ is $(\\ln 2)/k$."}],"refs":["Maor, e: The Story of a Number","Spivak, Calculus","Courant & Robbins, What Is Mathematics?"],"status":null,"aliases":["exponential function","logarithm","natural logarithm","ln","Euler's number e","laws of logarithms","change of base","exponential growth","compound interest"],"fields":["calculus","algebra"],"stage":"school","np":{"textbook":24,"olympiad":21,"bridge":0,"research":0,"examples":0},"nprob":45,"lesson":{"minutes":14,"checks":11,"fixed":0}},{"id":"trig","band":"precalc","title":"Trigonometric functions","short":"Trigonometry","pre":["functions","euclid-basics"],"sum":"Cosine and sine are the coordinates of the point $P(\\theta)$ reached by travelling a distance $\\theta$ around the unit circle from $(1, 0)$; for acute angles they agree with the ratios of sides in a right triangle. The addition formulas, from which most other identities follow, come from the fact that rotations preserve distances.","key":["P(\\theta) = (\\cos\\theta, \\sin\\theta), \\qquad \\cos^2\\theta + \\sin^2\\theta = 1","\\sin(\\alpha + \\beta) = \\sin\\alpha\\cos\\beta + \\cos\\alpha\\sin\\beta","\\cos(\\alpha + \\beta) = \\cos\\alpha\\cos\\beta - \\sin\\alpha\\sin\\beta"],"why":"They convert between angles and lengths in triangles, and they are the basic periodic functions, used to describe rotations, oscillations and waves.","msc":["33B10","26A09"],"links":[{"field":"physics","note":"Simple harmonic motion, alternating current and waves are described by sines and cosines of $\\omega t$."},{"field":"harmonic-analysis","note":"Fourier series write a periodic function as a sum of sines and cosines of multiples of a basic frequency."},{"field":"complex-analysis","note":"Euler's formula $e^{i\\theta} = \\cos\\theta + i\\sin\\theta$ turns the addition formulas into the rule $e^{i\\alpha}e^{i\\beta} = e^{i(\\alpha + \\beta)}$."}],"refs":["Gelfand & Saul, Trigonometry","Andreescu & Feng, 103 Trigonometry Problems"],"status":null,"aliases":["trigonometry","sine","cosine","tangent","unit circle","radian","addition formulas","double angle formulas","law of cosines","law of sines"],"fields":["calculus","geometry"],"stage":"school","np":{"textbook":0,"olympiad":32,"bridge":0,"research":0,"examples":0},"nprob":32,"lesson":{"minutes":15,"checks":11,"fixed":0}},{"id":"ap-gp","band":"precalc","title":"Arithmetic and geometric sequences","short":"Arithmetic & geometric sequences","pre":["functions"],"sum":"An arithmetic progression adds a fixed difference $d$ at each step; a geometric progression multiplies by a fixed ratio $r$. Their sums have closed forms, found by pairing terms from the two ends (arithmetic) or by multiplying by $r$ and subtracting (geometric), and a geometric series with $|r| < 1$ has a finite sum even with infinitely many terms.","key":["a_n = a_1 + (n - 1)d, \\qquad a_1 + a_2 + \\cdots + a_n = \\dfrac{n(a_1 + a_n)}{2}","b_n = b_1 r^{n-1}, \\qquad b_1 + b_1 r + \\cdots + b_1 r^{n-1} = b_1\\dfrac{1 - r^n}{1 - r} \\quad (r \\ne 1)","\\sum_{k=0}^{\\infty} b_1 r^k = \\dfrac{b_1}{1 - r} \\quad (|r| < 1)"],"why":"They model steady additive and multiplicative change, such as instalments, interest and repeated halving, and the geometric series is the benchmark against which other infinite series are compared.","msc":["11B25","40A05"],"links":[{"field":"number-theory","note":"Dirichlet's theorem says that an arithmetic progression $a, a + d, a + 2d, \\ldots$ with $\\gcd(a, d) = 1$ contains infinitely many primes."},{"field":"combinatorics","note":"Van der Waerden's theorem gives arbitrarily long arithmetic progressions inside one colour class of any colouring of the positive integers with finitely many colours, and Szemerédi's theorem gives them in every set of positive upper density."},{"field":"real-analysis","note":"The ratio and root tests decide the convergence of many series by comparing them with a geometric series."}],"refs":["Gelfand & Shen, Algebra","Graham, Knuth & Patashnik, Concrete Mathematics"],"status":null,"aliases":["arithmetic progression","geometric progression","arithmetic sequence","geometric sequence","AP","GP","geometric series","arithmetic series","common difference","common ratio","repeating decimal"],"fields":["algebra"],"stage":"school","np":{"textbook":0,"olympiad":9,"bridge":0,"research":0,"examples":0},"nprob":9,"lesson":{"minutes":14,"checks":9,"fixed":1}},{"id":"series","band":"calculus","title":"Series and convergence","short":"Series","pre":["seq-limits"],"sum":"When an infinite series converges, and how fast. $\\sum 1/n^s$ converges for real $s>1$ and diverges at $s=1$; that boundary is where the zeta function's story begins.","key":["\\sum_{n \\ge 1} \\frac{1}{n^s} < \\infty \\iff s > 1 \\quad (s \\in \\mathbb{R})"],"why":"Convergence questions decide where Dirichlet series define functions at all.","msc":["40A05"],"links":[],"refs":["Stein & Shakarchi, Complex Analysis"],"status":null,"aliases":["convergence","p-series"],"fields":["real-analysis"],"stage":"undergraduate","np":{"textbook":27,"olympiad":48,"bridge":0,"research":0,"examples":0},"nprob":75,"lesson":{"minutes":22,"checks":11,"fixed":0}},{"id":"limits","band":"calculus","title":"Limits of functions","short":"Limits","pre":["functions"],"sum":"$\\lim_{x\\to a} f(x) = L$ means that $f(x)$ is as close to $L$ as you like for all $x$ close enough to $a$, with $x \\ne a$; the value of $f$ at $a$ plays no role. The epsilon–delta definition makes this precise, and the limit laws and the squeeze theorem do most of the computing.","key":["\\lim_{x\\to a} f(x) = L \\iff \\forall \\varepsilon > 0\\ \\exists \\delta > 0:\\ 0 < |x - a| < \\delta \\implies |f(x) - L| < \\varepsilon","\\lim_{x\\to a}\\big(f(x) + g(x)\\big) = L + M, \\qquad \\lim_{x\\to a} f(x)g(x) = LM","\\lim_{x\\to 0}\\dfrac{\\sin x}{x} = 1"],"why":"Derivatives, integrals, continuity and infinite sums are all defined as limits, so this is the idea on which the whole of calculus rests.","msc":["26A03"],"links":[{"field":"real-analysis","note":"Real analysis is built on the epsilon–delta definition, extending it to sequences, series and uniform convergence of functions."},{"field":"probability","note":"The law of large numbers and the central limit theorem are limit statements about averages of many random variables."},{"field":"computer-science","note":"Running times of algorithms are compared through limits of ratios as the input size tends to infinity."}],"refs":["Spivak, Calculus","Apostol, Calculus, Volume 1","Courant & John, Introduction to Calculus and Analysis, Volume I"],"status":null,"aliases":["limit","limit of a function","epsilon-delta definition","one-sided limit","limit at infinity","squeeze theorem","sandwich theorem","limit laws","sin x over x"],"fields":["calculus"],"stage":"school","np":{"textbook":9,"olympiad":12,"bridge":0,"research":0,"examples":0},"nprob":21,"lesson":{"minutes":15,"checks":8,"fixed":0}},{"id":"continuity","band":"calculus","title":"Continuity and the intermediate value theorem","short":"Continuity","pre":["limits"],"sum":"A function is continuous at $a$ when $\\lim_{x\\to a} f(x) = f(a)$: small changes in the input produce small changes in the output. The intermediate value theorem says that a function continuous on $[a, b]$ takes every value between $f(a)$ and $f(b)$; its proof needs the completeness of the real numbers.","key":["f \\text{ is continuous at } a \\iff \\lim_{x\\to a} f(x) = f(a)","f \\text{ continuous on } [a, b],\\ f(a) < y < f(b) \\implies \\exists\\, c \\in (a, b):\\ f(c) = y","f \\text{ continuous on } [a, b] \\implies f \\text{ attains a largest and a smallest value on } [a, b]"],"why":"Continuity lets finitely many values tell you about a whole function: it guarantees that equations have solutions, that optimisation problems on closed intervals have answers, and that bisection finds roots.","msc":["26A15"],"links":[{"field":"topology","note":"Topology defines continuity through open sets, and the intermediate value theorem becomes the statement that a continuous image of a connected space is connected."},{"field":"computer-science","note":"Bisection, the simplest root-finding algorithm, is the intermediate value theorem turned into a procedure that halves the search interval at each step."},{"field":"differential-equations","note":"Peano's existence theorem says that if $f$ is continuous near $(x_0, y_0)$, then $y' = f(x, y)$ with $y(x_0) = y_0$ has a solution on some interval around $x_0$, though not necessarily a unique one."}],"refs":["Spivak, Calculus","Abbott, Understanding Analysis"],"status":null,"aliases":["continuous function","intermediate value theorem","IVT","Bolzano's theorem","extreme value theorem","bisection method","removable discontinuity","jump discontinuity","fixed point","universal chord theorem"],"fields":["calculus","real-analysis"],"stage":"school","np":{"textbook":70,"olympiad":21,"bridge":0,"research":0,"examples":0},"nprob":91,"lesson":{"minutes":15,"checks":10,"fixed":2}},{"id":"derivative","band":"calculus","title":"The derivative","short":"Derivative","pre":["limits"],"sum":"The derivative $f'(a)$ is the instantaneous rate of change of $f$ at $a$: the limit of the slopes of chords through $(a, f(a))$ as the second point approaches the first. Geometrically it is the slope of the tangent line, and the idea to remember is that near $a$ a differentiable function looks like a straight line of slope $f'(a)$.","key":["f'(a) = \\lim_{h \\to 0} \\frac{f(a+h) - f(a)}{h}","f(a+h) = f(a) + f'(a)\\,h + E(h), \\qquad \\frac{E(h)}{h} \\to 0 \\ (h \\to 0)","f \\text{ differentiable at } a \\implies f \\text{ continuous at } a"],"why":"Velocity, acceleration, growth rates and marginal cost are all derivatives, and the derivative is the basic tool for optimisation, approximation and differential equations.","msc":["26A24"],"links":[{"field":"physics","note":"Velocity and acceleration are the first and second derivatives of position, so Newton's second law F = ma is an equation involving a second derivative."},{"field":"differential-equations","note":"A differential equation is a relation between an unknown function and its derivatives, such as y' = ky for growth and decay."},{"field":"real-analysis","note":"Real analysis makes the limit in the definition rigorous and studies how badly differentiability can fail, down to continuous functions with no derivative anywhere."}],"refs":["Spivak, Calculus","Apostol, Calculus, Volume 1","Stewart, Calculus: Early Transcendentals"],"status":null,"aliases":["differentiation","rate of change","slope of the tangent","difference quotient","instantaneous velocity","differentiable function"],"fields":["calculus"],"stage":"school","np":{"textbook":21,"olympiad":7,"bridge":0,"research":0,"examples":0},"nprob":28,"lesson":{"minutes":16,"checks":8,"fixed":0}},{"id":"diff-rules","band":"calculus","title":"Rules of differentiation","short":"Differentiation rules","pre":["derivative","exp-log","trig"],"sum":"A short list of rules (linearity, the product, quotient and chain rules, and the derivatives of powers, exponentials, logarithms and trigonometric functions) lets you differentiate any formula built from elementary functions without going back to limits. The rule to understand deeply is the chain rule: rates of change multiply along a chain of dependencies.","key":["(fg)' = f'g + fg', \\qquad \\left(\\frac fg\\right)' = \\frac{f'g - fg'}{g^2}","(f \\circ g)'(x) = f'(g(x))\\,g'(x)","\\frac{d}{dx}x^r = rx^{r-1} \\ (x > 0), \\quad \\frac{d}{dx}e^x = e^x, \\quad \\frac{d}{dx}\\ln x = \\frac1x \\ (x > 0), \\quad \\frac{d}{dx}\\sin x = \\cos x"],"why":"These rules turn differentiation into routine algebra, which is what makes optimisation, related rates, Taylor expansions and the solution of differential equations practical; read backwards they give the main methods of integration.","msc":["26A24"],"links":[{"field":"ai-research","note":"Training a neural network by backpropagation is the chain rule applied systematically through a long composition of simple functions."},{"field":"physics","note":"Differentiating the energy E = ½mv² + V(x) of a moving particle with the chain rule gives E′ = v(ma + V′(x)), so Newton's law ma = −V′(x) implies that energy is conserved."}],"refs":["Spivak, Calculus","Apostol, Calculus, Volume 1","Stewart, Calculus: Early Transcendentals"],"status":null,"aliases":["product rule","quotient rule","chain rule","power rule","implicit differentiation","logarithmic differentiation","derivative of inverse function","table of derivatives"],"fields":["calculus"],"stage":"school","np":{"textbook":0,"olympiad":12,"bridge":0,"research":0,"examples":0},"nprob":12,"lesson":{"minutes":16,"checks":8,"fixed":0}},{"id":"mvt","band":"calculus","title":"The mean value theorem","short":"Mean value theorem","pre":["derivative","continuity"],"sum":"If $f$ is continuous on $[a, b]$ and differentiable on $(a, b)$, then at some point $c$ strictly inside the interval the instantaneous rate of change equals the average rate: $f'(c) = \\frac{f(b) - f(a)}{b - a}$. It is the bridge that turns information about $f'$ into information about $f$, and it rests on Rolle's theorem and the extreme value theorem.","key":["f'(c) = \\frac{f(b) - f(a)}{b - a} \\quad \\text{for some } c \\in (a, b)","f(a) = f(b) \\implies f'(c) = 0 \\text{ for some } c \\in (a, b) \\quad \\text{(Rolle)}","|f'| \\le M \\text{ on an interval } I \\implies |f(x) - f(y)| \\le M|x - y| \\text{ for } x, y \\in I"],"why":"It justifies the facts used everywhere in calculus (zero derivative means constant, positive derivative means increasing) and is the engine behind L'Hôpital's rule, Taylor's theorem, the fundamental theorem of calculus and most error estimates.","msc":["26A24"],"links":[{"field":"differential-equations","note":"If the partial derivative of f(t, y) with respect to y is bounded, the mean value theorem makes f Lipschitz in y, which is the hypothesis of the standard uniqueness theorem for y' = f(t, y)."},{"field":"number-theory","note":"Liouville's theorem, that an algebraic number α of degree d ≥ 2 satisfies |α − p/q| > c/q^d for some c > 0 and all fractions p/q, is proved by applying the mean value theorem to the minimal polynomial of α."},{"field":"complex-analysis","note":"The equality form fails for complex-valued functions (e^{it} on [0, 2π] has average rate of change 0 while |f'| = 1), but the inequality |f(b) − f(a)| ≤ |b − a| max|f'| along a segment survives and is a standard estimate for holomorphic functions."}],"refs":["Spivak, Calculus","Rudin, Principles of Mathematical Analysis","Abbott, Understanding Analysis"],"status":null,"aliases":["MVT","Lagrange mean value theorem","Rolle's theorem","Cauchy mean value theorem","Fermat's theorem on stationary points","interior extremum theorem"],"fields":["calculus","real-analysis"],"stage":"undergraduate","np":{"textbook":8,"olympiad":23,"bridge":0,"research":0,"examples":0},"nprob":31,"lesson":{"minutes":16,"checks":8,"fixed":0}},{"id":"deriv-applications","band":"calculus","title":"Applications of the derivative","short":"Optimisation & curve sketching","pre":["diff-rules","mvt"],"sum":"The sign of $f'$ tells where $f$ rises and falls, and the sign of $f''$ tells which way its graph bends; together they locate maxima, minima and inflection points. An optimisation problem is solved by writing the quantity as a function of one variable on its natural domain, finding the critical points, and comparing the values there with the values at the endpoints.","key":["f'(c) = 0,\\ f''(c) > 0 \\implies f \\text{ has a strict local minimum at } c","\\text{a continuous } f \\text{ on } [a, b] \\text{ attains its maximum at an endpoint or at a critical point}","f'' > 0 \\text{ on an interval} \\implies \\text{the graph of } f \\text{ is convex there}"],"why":"Finding the best value of a quantity (least cost, greatest area, shortest time) is one of the main practical uses of calculus, and sign tables of $f'$ and $f''$ turn a formula into an accurate picture.","msc":["26A06"],"links":[{"field":"physics","note":"Fermat's principle that light takes the path of least time, combined with the first derivative test, yields Snell's law of refraction."},{"field":"computer-science","note":"Newton's method, which replaces a curve by its tangent line to find roots, is a standard algorithm of scientific computing."}],"refs":["Stewart, Calculus: Early Transcendentals","Spivak, Calculus","Courant & John, Introduction to Calculus and Analysis I"],"status":null,"aliases":["optimisation","optimization","curve sketching","maxima and minima","critical point","stationary point","first derivative test","second derivative test","inflection point","concavity"],"fields":["calculus"],"stage":"school","np":{"textbook":0,"olympiad":18,"bridge":0,"research":0,"examples":0},"nprob":18,"lesson":{"minutes":15,"checks":9,"fixed":1}},{"id":"lhopital","band":"calculus","title":"Indeterminate forms and L'Hôpital's rule","short":"L'Hôpital's rule","pre":["mvt","diff-rules"],"sum":"Limits of the forms $\\frac00$ and $\\frac\\infty\\infty$ are not determined by the limits of numerator and denominator separately. L'Hôpital's rule says that, for such a quotient with $g' \\ne 0$ near the limit point, $\\lim f/g = \\lim f'/g'$ whenever the limit of $f'/g'$ exists (finite or infinite); the other indeterminate forms $0\\cdot\\infty$, $\\infty - \\infty$, $1^\\infty$, $0^0$ and $\\infty^0$ are first rewritten as quotients.","key":["\\lim_{x \\to a}\\frac{f(x)}{g(x)} = \\lim_{x \\to a}\\frac{f'(x)}{g'(x)} \\quad \\text{if } f, g \\to 0 \\text{ (or } |g| \\to \\infty\\text{)}, \\ g' \\ne 0 \\text{ near } a, \\text{ and the right side exists in } [-\\infty, \\infty]","f^g = e^{g\\ln f}: \\quad 1^\\infty,\\ 0^0,\\ \\infty^0 \\ \\text{reduce to the form } 0\\cdot\\infty"],"why":"It settles the limits that compare growth rates, for instance that $\\ln x$ grows more slowly than every positive power of $x$ and every power more slowly than $e^x$, which are used constantly in asymptotic analysis.","msc":["26A24"],"links":[{"field":"computer-science","note":"Comparing running times such as n log n and n^1.1 comes down to limits of quotients of the kind the rule evaluates."},{"field":"number-theory","note":"The rule shows that li(x) and x/ln x are asymptotically equal, so the two usual forms of the prime number theorem are equivalent."}],"refs":["Spivak, Calculus","Rudin, Principles of Mathematical Analysis","Stewart, Calculus: Early Transcendentals"],"status":null,"aliases":["L'Hospital's rule","l'Hôpital's rule","Bernoulli's rule","indeterminate forms","0/0","infinity over infinity"],"fields":["calculus"],"stage":"undergraduate","np":{"textbook":0,"olympiad":3,"bridge":0,"research":0,"examples":0},"nprob":3,"lesson":{"minutes":16,"checks":9,"fixed":0}},{"id":"riemann-integral","band":"calculus","title":"The definite integral","short":"Definite integral","pre":["limits"],"sum":"The definite integral $\\int_a^b f(x)\\,dx$ is the signed area between the graph of $f$ and the $x$-axis, defined by squeezing it between lower and upper sums of rectangles; equivalently, it is the limit of Riemann sums $\\sum f(t_i)\\,\\Delta x_i$ as the subdivision gets finer. Monotone and continuous functions on a closed interval are integrable, and the integral is linear, monotone and additive over intervals.","key":["\\int_a^b f(x)\\,dx = \\lim_{n \\to \\infty}\\sum_{i=1}^n f\\!\\left(a + i\\,\\tfrac{b - a}{n}\\right)\\frac{b - a}{n} \\quad (f \\text{ continuous})","L(f, P) \\le \\int_a^b f(x)\\,dx \\le U(f, P) \\quad \\text{for every partition } P","\\int_a^c f + \\int_c^b f = \\int_a^b f"],"why":"Areas, volumes, work, distance travelled at a varying speed, probabilities from densities and averages of functions are all integrals, and the definition as a limit of sums is what tells you how to set them up.","msc":["26A42"],"links":[{"field":"probability","note":"A continuous random variable is described by a density, and the probability of an interval is the integral of the density over it."},{"field":"physics","note":"Work, mass, charge and displacement are integrals of a varying force, density or velocity."},{"field":"number-theory","note":"Comparing sums with integrals, for example the harmonic sum with ln n, is a basic estimate in analytic number theory."}],"refs":["Spivak, Calculus","Apostol, Calculus, Volume 1","Abbott, Understanding Analysis"],"status":null,"aliases":["Riemann integral","Darboux integral","Riemann sum","upper and lower sums","area under a curve","integrability"],"fields":["calculus","real-analysis"],"stage":"school","np":{"textbook":47,"olympiad":23,"bridge":0,"research":0,"examples":0},"nprob":70,"lesson":{"minutes":17,"checks":8,"fixed":0}},{"id":"ftc","band":"calculus","title":"The fundamental theorem of calculus","short":"Fundamental theorem of calculus","pre":["riemann-integral","derivative","mvt"],"sum":"Differentiation and integration undo each other. If $f$ is continuous, the accumulated area $F(x) = \\int_a^x f(t)\\,dt$ has derivative $f(x)$; and if $G$ is any antiderivative of an integrable $f$, then $\\int_a^b f(x)\\,dx = G(b) - G(a)$.","key":["\\frac{d}{dx}\\int_a^x f(t)\\,dt = f(x) \\quad (f \\text{ continuous})","\\int_a^b G'(x)\\,dx = G(b) - G(a) \\quad (G' \\text{ integrable})"],"why":"It replaces the limit of sums that defines an integral by the far easier task of finding an antiderivative, and it is why the total change of a quantity can be computed from its rate of change.","msc":["26A06"],"links":[{"field":"physics","note":"Displacement is the integral of velocity and the work done equals the change in kinetic energy, both instances of integrating a derivative."},{"field":"differential-equations","note":"Solving y' = f(x), and separable equations more generally, is integration made possible by the theorem."},{"field":"probability","note":"A distribution function is the integral of its density, so by the first form of the theorem the density is the derivative of the distribution function at every point where the density is continuous."}],"refs":["Spivak, Calculus","Apostol, Calculus, Volume 1","Courant & John, Introduction to Calculus and Analysis I"],"status":null,"aliases":["FTC","Newton–Leibniz formula","antiderivative","primitive","indefinite integral","evaluation theorem","differentiating an integral"],"fields":["calculus"],"stage":"school","np":{"textbook":11,"olympiad":7,"bridge":0,"research":0,"examples":0},"nprob":18,"lesson":{"minutes":16,"checks":8,"fixed":2}},{"id":"integration-techniques","band":"calculus","title":"Techniques of integration","short":"Integration techniques","pre":["ftc","diff-rules"],"sum":"Techniques of integration are the methods for finding antiderivatives in closed form: substitution reverses the chain rule, integration by parts reverses the product rule, and partial fractions and trigonometric substitutions reduce harder integrands to a short table of known ones. Once an antiderivative $F$ of $f$ is found, the fundamental theorem of calculus gives $\\int_a^b f = F(b) - F(a)$.","key":["\\int_a^b f(g(x))\\,g'(x)\\,dx = \\int_{g(a)}^{g(b)} f(u)\\,du","\\int_a^b u\\,v'\\,dx = \\Big[u\\,v\\Big]_a^b - \\int_a^b u'\\,v\\,dx","\\frac{1}{(x-p)(x-q)} = \\frac{1}{p-q}\\left(\\frac{1}{x-p} - \\frac{1}{x-q}\\right), \\quad p \\ne q"],"why":"Areas, volumes, probabilities, work and the solutions of differential equations all come down to evaluating integrals, and these few methods handle most of the integrals with elementary answers that one meets in practice. Integration by parts in particular reappears throughout analysis, from Taylor's remainder to the gamma function.","msc":["26A36"],"links":[{"field":"differential-equations","note":"Solving separable and linear first-order equations amounts to computing two antiderivatives, usually by substitution or partial fractions."},{"field":"physics","note":"Work, centres of mass, moments of inertia and potentials are computed as integrals that are evaluated with these techniques."},{"field":"probability","note":"Expectations of continuous random variables are integrals; for example the mean $1/\\lambda$ of an exponential variable with rate $\\lambda$ comes from one integration by parts."}],"refs":["Spivak, Calculus","Apostol, Calculus, Vol. 1","Stewart, Calculus"],"status":null,"aliases":["antiderivatives","integration by substitution","u-substitution","integration by parts","partial fractions","trigonometric substitution","reduction formula"],"fields":["calculus"],"stage":"school","np":{"textbook":0,"olympiad":20,"bridge":0,"research":0,"examples":0},"nprob":20,"lesson":{"minutes":20,"checks":11,"fixed":2}},{"id":"improper-integrals","band":"calculus","title":"Improper integrals","short":"Improper integrals","pre":["integration-techniques"],"sum":"An improper integral is an integral over an unbounded interval, or of a function that is unbounded near an endpoint, defined as a limit of ordinary integrals: $\\int_a^\\infty f = \\lim_{b \\to \\infty} \\int_a^b f$. It converges when the limit exists and is finite. The basic yardstick is the $p$-test, and most convergence questions are settled by comparing with $x^{-p}$.","key":["\\int_a^\\infty f(x)\\,dx = \\lim_{b\\to\\infty} \\int_a^b f(x)\\,dx","\\int_1^\\infty \\frac{dx}{x^p} \\text{ converges} \\iff p > 1, \\qquad \\int_0^1 \\frac{dx}{x^p} \\text{ converges} \\iff p < 1","0 \\le f \\le g,\\ \\int_a^\\infty g < \\infty \\implies \\int_a^\\infty f < \\infty"],"why":"Many of the most important integrals in mathematics run over infinite ranges: the Gaussian integral, the gamma function, Fourier and Laplace transforms, and the expected values of continuous random variables. The integral test also turns questions about infinite series into questions about integrals.","msc":["26A42","40A10"],"links":[{"field":"probability","note":"A probability density must have total integral 1 over the real line, and expectations such as the mean of an exponential distribution are improper integrals."},{"field":"special-functions","note":"The gamma, beta and zeta functions are defined or represented by convergent improper integrals."},{"field":"number-theory","note":"The integral test and comparisons like the sum of 1/(n log n) against the integral of 1/(x log x) are basic tools for estimating sums over integers and primes."}],"refs":["Spivak, Calculus","Apostol, Mathematical Analysis","Abbott, Understanding Analysis"],"status":null,"aliases":["improper integral","integral over an infinite interval","convergent integral","p-test","comparison test for integrals","integral test","Dirichlet integral"],"fields":["calculus","real-analysis"],"stage":"undergraduate","np":{"textbook":12,"olympiad":14,"bridge":0,"research":0,"examples":0},"nprob":26,"lesson":{"minutes":18,"checks":11,"fixed":1}},{"id":"taylor","band":"calculus","title":"Taylor polynomials and Taylor's theorem","short":"Taylor's theorem","pre":["mvt","diff-rules"],"sum":"The Taylor polynomial of degree $n$ of $f$ at $a$ is the unique polynomial of degree at most $n$ whose value and first $n$ derivatives at $a$ agree with those of $f$. Taylor's theorem measures the error: if $|f^{(n+1)}| \\le M$ between $a$ and $x$, the error is at most $\\frac{M}{(n+1)!}|x - a|^{n+1}$, so near $a$ the polynomial is a very good approximation.","key":["P_n(x) = \\sum_{k=0}^{n} \\frac{f^{(k)}(a)}{k!}(x-a)^k","f(x) - P_n(x) = \\frac{f^{(n+1)}(\\xi)}{(n+1)!}(x-a)^{n+1} \\quad \\text{for some } \\xi \\text{ between } a \\text{ and } x","f(x) = P_n(x) + o\\big((x-a)^n\\big) \\quad (x \\to a)"],"why":"Taylor expansions are how functions such as $\\sin$, $e^x$ and $\\ln$ are computed, how limits and asymptotic formulas are found, and how physicists linearise a problem near equilibrium. The remainder estimate is what turns a heuristic approximation into a proof with an explicit error.","msc":["26A24","41A58"],"links":[{"field":"physics","note":"Small-oscillation and linear approximations, such as replacing sin(theta) by theta for a pendulum, are first-order Taylor expansions with a controlled error."},{"field":"computer-science","note":"Numerical methods for derivatives, integrals and differential equations are designed and analysed by matching Taylor expansions, and library routines evaluate functions by truncated expansions."},{"field":"number-theory","note":"Taylor's theorem with remainder gives irrationality proofs, such as that of e, and asymptotic expansions used in analytic number theory."}],"refs":["Spivak, Calculus","Apostol, Calculus, Vol. 1","Rudin, Principles of Mathematical Analysis"],"status":null,"aliases":["Taylor polynomial","Maclaurin polynomial","Taylor expansion","Lagrange remainder","Peano remainder","Taylor's formula"],"fields":["calculus","real-analysis"],"stage":"undergraduate","np":{"textbook":13,"olympiad":15,"bridge":0,"research":0,"examples":0},"nprob":28,"lesson":{"minutes":18,"checks":10,"fixed":1}},{"id":"power-series","band":"calculus","title":"Power series","short":"Power series","pre":["series","taylor"],"sum":"A power series $\\sum c_n (x - a)^n$ is a polynomial of infinite degree. It converges absolutely inside an interval $|x - a| < R$ and diverges outside it, where the radius $R$ is determined by how fast the coefficients grow. Inside that interval the sum can be differentiated and integrated term by term, so it behaves like a polynomial and is its own Taylor series.","key":["f(x) = \\sum_{n=0}^\\infty c_n (x - a)^n, \\qquad \\frac{1}{R} = \\limsup_{n\\to\\infty} |c_n|^{1/n}","f'(x) = \\sum_{n=1}^\\infty n\\,c_n (x - a)^{n-1} \\quad (|x - a| < R)","c_n = \\frac{f^{(n)}(a)}{n!}"],"why":"Power series are how $e^x$, $\\sin x$ and $\\cos x$ are defined rigorously and computed, how many differential equations are solved, and, as generating functions, how sequences in combinatorics are counted. They are also the gateway to complex analysis, where they explain the radius of convergence completely.","msc":["30B10","40A30"],"links":[{"field":"combinatorics","note":"Generating functions encode a sequence as the coefficients of a power series, so that recurrences become algebraic equations."},{"field":"complex-analysis","note":"Holomorphic functions are exactly those given locally by convergent power series, and the Taylor series at a point converges on the largest disc about that point to which the function extends holomorphically."},{"field":"differential-equations","note":"Linear equations with analytic coefficients have power-series solutions near ordinary points (and Frobenius series near regular singular points); this is how Legendre, Airy and Bessel functions arise."}],"refs":["Rudin, Principles of Mathematical Analysis","Spivak, Calculus","Abbott, Understanding Analysis"],"status":null,"aliases":["power series","radius of convergence","interval of convergence","Cauchy–Hadamard formula","termwise differentiation","analytic function","Maclaurin series"],"fields":["calculus","real-analysis"],"stage":"undergraduate","np":{"textbook":28,"olympiad":19,"bridge":1,"research":0,"examples":0},"nprob":48,"lesson":{"minutes":20,"checks":8,"fixed":1}},{"id":"partial-derivatives","band":"calculus","title":"Partial derivatives and the gradient","short":"Partial derivatives","pre":["diff-rules","vectors-plane"],"sum":"A partial derivative of a function of several variables is its ordinary derivative in one variable while the others are held fixed. The partial derivatives assemble into the gradient vector $\\nabla f$, which, for a differentiable $f$, gives the rate of change in every direction by a dot product, points (when nonzero) in the direction of steepest increase, and is perpendicular to the level sets.","key":["\\frac{\\partial f}{\\partial x}(a,b) = \\lim_{h\\to 0}\\frac{f(a+h,b) - f(a,b)}{h}","\\nabla f = \\Big(\\frac{\\partial f}{\\partial x_1}, \\dots, \\frac{\\partial f}{\\partial x_n}\\Big), \\qquad D_{\\mathbf u} f(\\mathbf a) = \\nabla f(\\mathbf a)\\cdot\\mathbf u","\\frac{d}{dt} f(\\mathbf r(t)) = \\nabla f(\\mathbf r(t)) \\cdot \\mathbf r'(t)"],"why":"Almost every quantity in science depends on more than one variable, and partial derivatives are how its sensitivity to each one is measured. Gradients drive optimisation, from Lagrange multipliers to the gradient descent that trains neural networks, and the laws of physics are written as partial differential equations.","msc":["26B05"],"links":[{"field":"pde","note":"Partial differential equations such as the heat, wave and Laplace equations are relations between the partial derivatives of an unknown function."},{"field":"ai-research","note":"Neural networks are trained by gradient descent, moving parameters against the gradient of a loss function computed by the multivariable chain rule (backpropagation)."},{"field":"physics","note":"A conservative force is minus the gradient of a potential energy, and thermodynamics is largely a calculus of partial derivatives with specified variables held fixed."}],"refs":["Apostol, Calculus, Vol. 2","Marsden & Tromba, Vector Calculus","Courant & John, Introduction to Calculus and Analysis, Vol. 2"],"status":null,"aliases":["partial derivative","gradient","directional derivative","multivariable chain rule","tangent plane","Hessian","Clairaut's theorem","Schwarz's theorem","critical point"],"fields":["calculus"],"stage":"undergraduate","np":{"textbook":38,"olympiad":9,"bridge":0,"research":0,"examples":0},"nprob":47,"lesson":{"minutes":20,"checks":9,"fixed":1}},{"id":"multiple-integrals","band":"calculus","title":"Multiple integrals and change of variables","short":"Multiple integrals","pre":["ftc","partial-derivatives","determinants"],"sum":"A double or triple integral adds up a quantity over a region of the plane or of space, as a limit of sums over small rectangles or boxes. Fubini's theorem computes it as iterated one-variable integrals, and the change of variables formula lets you switch to coordinates adapted to the region, at the cost of a factor $|\\det DT|$ that measures how the substitution stretches area or volume.","key":["\\iint_{[a,b]\\times[c,d]} f\\,dA = \\int_a^b\\!\\!\\int_c^d f(x,y)\\,dy\\,dx = \\int_c^d\\!\\!\\int_a^b f(x,y)\\,dx\\,dy","\\iint_{T(D)} f(x,y)\\,dx\\,dy = \\iint_D f(T(u,v))\\,\\big|\\det DT(u,v)\\big|\\,du\\,dv","dx\\,dy = r\\,dr\\,d\\theta, \\qquad dV = \\rho^2\\sin\\varphi\\,d\\rho\\,d\\varphi\\,d\\theta"],"why":"Masses, centres of mass, moments of inertia, probabilities of events involving several random variables, and fluxes are all multiple integrals. The polar-coordinate computation of $\\int_{-\\infty}^\\infty e^{-x^2}\\,dx = \\sqrt\\pi$ is how the constant $\\frac{1}{\\sqrt{2\\pi}}$ in the normal density is found.","msc":["26B15"],"links":[{"field":"probability","note":"Probabilities and expectations for jointly continuous random variables are double or triple integrals of a joint density, and changes of variables give the densities of sums and ratios."},{"field":"physics","note":"Mass, centre of mass, moments of inertia and gravitational or electric potentials of extended bodies are computed as triple integrals, usually in cylindrical or spherical coordinates."},{"field":"special-functions","note":"Changing variables in a double integral proves Gamma(1/2) = sqrt(pi) and the relation between the beta and gamma functions."}],"refs":["Apostol, Calculus, Vol. 2","Marsden & Tromba, Vector Calculus","Spivak, Calculus on Manifolds"],"status":null,"aliases":["double integral","triple integral","iterated integral","Fubini's theorem","change of variables","Jacobian","polar coordinates","spherical coordinates","Gaussian integral"],"fields":["calculus"],"stage":"undergraduate","np":{"textbook":24,"olympiad":18,"bridge":0,"research":0,"examples":0},"nprob":42,"lesson":{"minutes":20,"checks":9,"fixed":2}},{"id":"vector-calculus","band":"calculus","title":"Line integrals and the theorems of Green, Stokes and Gauss","short":"Vector calculus","pre":["multiple-integrals"],"sum":"Vector calculus integrates vector fields along curves (work, circulation) and across surfaces (flux), and its three great theorems, Green's, Stokes' and the divergence theorem of Gauss, each say that the integral of a derivative over a region equals an integral over the region's boundary. They are the higher-dimensional versions of the fundamental theorem of calculus.","key":["\\oint_{\\partial D} P\\,dx + Q\\,dy = \\iint_D \\Big(\\frac{\\partial Q}{\\partial x} - \\frac{\\partial P}{\\partial y}\\Big)\\,dA","\\oint_{\\partial S} \\mathbf F\\cdot d\\mathbf r = \\iint_S (\\nabla\\times\\mathbf F)\\cdot\\mathbf n\\,dS","\\iint_{\\partial E} \\mathbf F\\cdot\\mathbf n\\,dS = \\iiint_E \\nabla\\cdot\\mathbf F\\,dV"],"why":"Maxwell's equations of electromagnetism, the conservation laws of fluid dynamics and the heat equation are all derived and usually stated with these theorems. In mathematics, Green's theorem gives Cauchy's theorem in complex analysis, and the general Stokes theorem for differential forms is a basic tool of differential geometry and topology.","msc":["26B20","26B12"],"links":[{"field":"pde","note":"Conservation laws such as the heat, continuity and Navier–Stokes equations are derived by applying the divergence theorem to an arbitrary small region."},{"field":"complex-analysis","note":"Green's theorem combined with the Cauchy–Riemann equations gives a short proof of Cauchy's integral theorem for functions with continuous derivative."},{"field":"topology","note":"A curl-free field that is not a gradient, such as the winding field around a puncture, detects a hole in the domain; this is the simplest example of de Rham cohomology."}],"refs":["Marsden & Tromba, Vector Calculus","Schey, Div, Grad, Curl, and All That","Apostol, Calculus, Vol. 2"],"status":null,"aliases":["line integral","surface integral","flux","circulation","Green's theorem","Stokes' theorem","divergence theorem","Gauss's theorem","curl","divergence","conservative field"],"fields":["calculus","physics"],"stage":"undergraduate","np":{"textbook":21,"olympiad":4,"bridge":0,"research":0,"examples":0},"nprob":25,"lesson":{"minutes":20,"checks":10,"fixed":4}},{"id":"lagrange-multipliers","band":"calculus","title":"Constrained optimisation and Lagrange multipliers","short":"Lagrange multipliers","pre":["partial-derivatives"],"sum":"To find the largest or smallest value of $f(\\mathbf x)$ among the points satisfying a constraint $g(\\mathbf x) = c$, look among the points where the two gradients are parallel, $\\nabla f = \\lambda \\nabla g$, together with any points of the constraint set where $\\nabla g = \\mathbf 0$. Geometrically, at a constrained extremum the level set of $f$ touches the constraint set tangentially; when the optimum depends smoothly on $c$, the multiplier $\\lambda$ is the rate at which the optimal value changes with $c$.","key":["\\nabla f(\\mathbf a) = \\lambda\\, \\nabla g(\\mathbf a), \\qquad g(\\mathbf a) = c \\qquad (\\nabla g(\\mathbf a) \\ne \\mathbf 0)","\\mathcal L(\\mathbf x, \\lambda) = f(\\mathbf x) - \\lambda\\,\\bigl(g(\\mathbf x) - c\\bigr), \\qquad \\nabla_{\\mathbf x,\\lambda}\\, \\mathcal L = \\mathbf 0","\\nabla f(\\mathbf a) = \\lambda_1 \\nabla g_1(\\mathbf a) + \\dots + \\lambda_m \\nabla g_m(\\mathbf a) \\quad \\text{for } m \\text{ constraints with independent gradients}"],"why":"It turns a constrained optimisation problem into a system of equations, which is how one finds optimal designs, equilibrium states of physical systems and maximum-entropy probability distributions, and it gives a quick route to many inequalities.","msc":[],"links":[{"field":"linear-algebra","note":"Maximising $\\mathbf x^{T} A \\mathbf x$ on the unit sphere leads to $A\\mathbf x = \\lambda \\mathbf x$, so the extreme values of a quadratic form are the extreme eigenvalues of its symmetric matrix."},{"field":"physics","note":"Maximising entropy subject to fixed total probability and fixed mean energy produces the Boltzmann distribution, with the inverse temperature appearing as a Lagrange multiplier."},{"field":"ai-research","note":"Constrained training objectives and support vector machines are analysed through Lagrangians and their inequality-constraint extension, the Karush–Kuhn–Tucker conditions."}],"refs":["Apostol, Calculus, Volume II","Marsden & Tromba, Vector Calculus","Stewart, Calculus"],"status":null,"aliases":["Lagrange multiplier","method of Lagrange multipliers","constrained extremum","constrained optimization","Lagrangian"],"fields":["calculus"],"stage":"undergraduate","np":{"textbook":0,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":1,"lesson":{"minutes":17,"checks":10,"fixed":0}},{"id":"real-numbers","band":"realanalysis","title":"The real numbers and completeness","short":"Completeness of the reals","pre":[],"sum":"The real numbers form an ordered field with one extra property that the rationals lack: every nonempty set of reals that is bounded above has a least upper bound, its supremum. This completeness axiom fills the gaps in $\\mathbb Q$ (such as the missing $\\sqrt2$), and every existence theorem of analysis, from the intermediate value theorem to the convergence of monotone sequences, ultimately rests on it.","key":["S \\subseteq \\mathbb R,\\ S \\ne \\varnothing,\\ S \\text{ bounded above} \\;\\Longrightarrow\\; \\sup S \\text{ exists in } \\mathbb R","s = \\sup S \\iff \\bigl(x \\le s \\text{ for all } x \\in S\\bigr) \\text{ and } \\bigl(\\forall \\varepsilon > 0\\ \\exists x \\in S:\\ x > s - \\varepsilon\\bigr)","\\forall x \\in \\mathbb R\\ \\exists n \\in \\mathbb N:\\ n > x \\qquad \\text{(Archimedean property)}"],"why":"Without completeness, $x^2 - 2$ would change sign on $[1, 2]$ without ever being zero, increasing bounded sequences need not converge, and numbers such as $\\sqrt2$, $e$ and $\\pi$ would not exist; completeness is what makes calculus work.","msc":["26A03"],"links":[{"field":"logic","note":"Dedekind cuts and Cauchy sequences construct $\\mathbb R$ from $\\mathbb Q$ inside set theory, and the completeness axiom is the one axiom of the reals that is not first-order."},{"field":"number-theory","note":"The Archimedean property and the pigeonhole principle give Dirichlet's approximation theorem, the starting point of Diophantine approximation, and completing $\\mathbb Q$ with other absolute values gives the $p$-adic numbers."},{"field":"topology","note":"Completeness is what makes intervals connected and closed bounded intervals compact, the two properties of the line that topology generalises."}],"refs":["Rudin, Principles of Mathematical Analysis","Abbott, Understanding Analysis","Spivak, Calculus"],"status":null,"aliases":["least upper bound property","supremum","infimum","completeness axiom","Archimedean property","Dedekind completeness","real number system"],"fields":["real-analysis"],"stage":"undergraduate","np":{"textbook":38,"olympiad":9,"bridge":0,"research":0,"examples":0},"nprob":47,"lesson":{"minutes":20,"checks":10,"fixed":2}},{"id":"seq-limits","band":"realanalysis","title":"Convergence of sequences","short":"Convergent sequences","pre":["real-numbers"],"sum":"A sequence $(a_n)$ converges to $L$ if for every $\\varepsilon > 0$ there is an $N$ such that $|a_n - L| < \\varepsilon$ for all $n \\ge N$: however small a tolerance you name, the terms eventually stay within it. Limits are unique and respect arithmetic, and by the completeness of $\\mathbb R$ every bounded monotone sequence converges, every bounded sequence has a convergent subsequence, and a sequence converges exactly when it is Cauchy.","key":["a_n \\to L \\iff \\forall \\varepsilon > 0\\ \\exists N\\ \\forall n \\ge N:\\ |a_n - L| < \\varepsilon","(a_n) \\text{ increasing and bounded above} \\;\\Longrightarrow\\; a_n \\to \\sup_n a_n","(a_n) \\text{ converges} \\iff \\forall \\varepsilon > 0\\ \\exists N\\ \\forall m, n \\ge N:\\ |a_m - a_n| < \\varepsilon"],"why":"Derivatives, integrals, infinite sums and numbers such as $e$ and $\\sqrt 2$ are all defined as limits of sequences, so this definition is the foundation on which the rest of analysis is built.","msc":["40A05","26A03"],"links":[{"field":"computer-science","note":"Iterative algorithms such as Newton's method are judged by how fast their sequences of approximations converge; the Babylonian square-root iteration roughly doubles the number of correct digits at each step."},{"field":"probability","note":"The laws of large numbers say that sequences of sample averages converge, in senses built on this definition, to the expected value."},{"field":"number-theory","note":"Irrational numbers are studied through sequences of rational approximations, such as continued fraction convergents, and the speed of convergence measures how well a number can be approximated."}],"refs":["Abbott, Understanding Analysis","Rudin, Principles of Mathematical Analysis","Bartle & Sherbert, Introduction to Real Analysis"],"status":null,"aliases":["limit of a sequence","epsilon-N definition","monotone convergence theorem","Bolzano–Weierstrass theorem","Cauchy sequence","Cauchy criterion"],"fields":["real-analysis"],"stage":"undergraduate","np":{"textbook":46,"olympiad":26,"bridge":0,"research":0,"examples":0},"nprob":72,"lesson":{"minutes":17,"checks":9,"fixed":0}},{"id":"metric-spaces","band":"realanalysis","title":"Metric spaces","short":"Metric spaces","pre":["seq-limits"],"sum":"A metric space is a set $X$ with a distance function $d$ that is zero exactly when the two points coincide (and positive otherwise), symmetric, and satisfies the triangle inequality. Once distance is available, convergence, open and closed sets, continuity and Cauchy sequences all make sense, whether the points are vectors, functions, strings or $p$-adic integers. In a complete metric space every contraction has a unique fixed point (Banach's theorem), which is a basic tool for proving that equations have solutions.","key":["d(x, y) \\ge 0,\\quad d(x, y) = 0 \\iff x = y,\\quad d(x, y) = d(y, x),\\quad d(x, z) \\le d(x, y) + d(y, z)","x_n \\to x \\iff d(x_n, x) \\to 0, \\qquad U \\text{ open} \\iff \\forall x \\in U\\ \\exists r > 0:\\ B(x, r) \\subseteq U","X \\text{ complete},\\ d(Tx, Ty) \\le q\\, d(x, y),\\ 0 \\le q < 1 \\;\\Longrightarrow\\; \\exists!\\, x^* \\in X:\\ Tx^* = x^*"],"why":"Metric spaces let one theory of limits cover numbers, vectors and functions at once; the contraction principle is the core of the standard proofs of the existence theorem for differential equations and of the inverse function theorem, and it explains the convergence of many numerical iterations.","msc":["54E35","54E50"],"links":[{"field":"number-theory","note":"The $p$-adic distance $|x - y|_p = p^{-v_p(x - y)}$ makes integers close when their difference is divisible by a high power of $p$; completing $\\mathbb Q$ for it gives the $p$-adic numbers."},{"field":"computer-science","note":"The Hamming distance between strings measures how many symbols differ, and error-correcting codes are sets of strings that are far apart in this metric."},{"field":"geometry","note":"Changing the metric on $\\mathbb R^2$ changes the shape of circles, from the round Euclidean disc to the diamond of the taxicab metric and the square of the maximum metric."}],"refs":["Sutherland, Introduction to Metric and Topological Spaces","Rudin, Principles of Mathematical Analysis","Kaplansky, Set Theory and Metric Spaces"],"status":null,"aliases":["metric","distance function","triangle inequality","complete metric space","Banach fixed-point theorem","contraction mapping principle"],"fields":["real-analysis","topology"],"stage":"undergraduate","np":{"textbook":44,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":49,"lesson":{"minutes":20,"checks":10,"fixed":1}},{"id":"compactness","band":"realanalysis","title":"Compactness","short":"Compactness","pre":["metric-spaces","continuity"],"sum":"A metric space $K$ is compact if every sequence in $K$ has a subsequence converging to a point of $K$; equivalently, every cover of $K$ by open sets has a finite subcover. In $\\mathbb R^n$ the compact sets are exactly the closed and bounded ones (Heine–Borel). Continuous real functions on a nonempty compact set are bounded, attain a maximum and a minimum, and are uniformly continuous.","key":["K \\text{ compact} \\iff \\text{every sequence in } K \\text{ has a subsequence converging in } K \\quad (K \\text{ a metric space})","K \\subseteq \\mathbb R^n:\\quad K \\text{ compact} \\iff K \\text{ closed and bounded}","f : K \\to \\mathbb R \\text{ continuous},\\ K \\ne \\varnothing \\text{ compact} \\;\\Longrightarrow\\; \\exists\\, a, b \\in K:\\ f(a) = \\max_K f,\\ f(b) = \\min_K f"],"why":"Compactness is what guarantees that optimisation problems have solutions and that local estimates can be made global; it is behind the extreme value theorem, the integrability of continuous functions, and countless existence proofs.","msc":["54D30"],"links":[{"field":"logic","note":"The compactness theorem of first-order logic (a set of sentences has a model if every finite subset does) is named for the same finite-subcover phenomenon and is equivalent to the compactness of a certain topological space."},{"field":"combinatorics","note":"Compactness arguments such as König's lemma pass from finite to infinite statements, for example from $k$-colourings of every finite subgraph to a $k$-colouring of an infinite graph."},{"field":"linear-algebra","note":"Compactness of the unit sphere in $\\mathbb R^n$ shows that all norms on a finite-dimensional space are equivalent and that a symmetric matrix attains its largest eigenvalue as the maximum of $\\mathbf x^T A \\mathbf x$ on the sphere."}],"refs":["Rudin, Principles of Mathematical Analysis","Abbott, Understanding Analysis","Munkres, Topology"],"status":null,"aliases":["compact set","Heine–Borel theorem","sequential compactness","extreme value theorem","open cover","Heine–Cantor theorem","finite subcover"],"fields":["real-analysis","topology"],"stage":"undergraduate","np":{"textbook":25,"olympiad":6,"bridge":0,"research":0,"examples":0},"nprob":31,"lesson":{"minutes":18,"checks":9,"fixed":2}},{"id":"uniform-convergence","band":"realanalysis","title":"Uniform convergence","short":"Uniform convergence","pre":["seq-limits","series","continuity"],"sum":"A sequence of functions $f_n$ converges uniformly to $f$ on a set $E$ when the worst-case error $\\sup_{x \\in E}|f_n(x) - f(x)|$ tends to $0$, so that one $N$ works for every point at once. Unlike pointwise convergence, uniform convergence preserves continuity and lets limits pass through integrals over bounded intervals.","key":["f_n \\to f \\text{ uniformly on } E \\iff \\sup_{x \\in E} |f_n(x) - f(x)| \\to 0","f_n \\text{ continuous},\\ f_n \\to f \\text{ uniformly} \\implies f \\text{ continuous}","|f_k(x)| \\le M_k \\text{ on } E,\\ \\sum_k M_k < \\infty \\implies \\sum_k f_k \\text{ converges uniformly on } E"],"why":"It is the condition to check before swapping a limit with an integral, a sum or another limit, which is how power series, Fourier series and approximate solutions of differential equations are handled rigorously.","msc":["40A30"],"links":[{"field":"complex-analysis","note":"A limit of holomorphic functions that is uniform on compact sets is holomorphic (Weierstrass), which is how functions defined by series, such as the zeta function, are shown to be analytic."},{"field":"harmonic-analysis","note":"A Fourier series whose coefficients are absolutely summable converges uniformly by the M-test, so it sums to a continuous function; finer convergence questions for Fourier series shaped much of analysis."},{"field":"differential-equations","note":"Picard iteration produces approximations that converge uniformly to the solution of an initial value problem, which is how existence of solutions is proved."}],"refs":["Rudin, Principles of Mathematical Analysis","Abbott, Understanding Analysis","Spivak, Calculus"],"status":null,"aliases":["uniform limit","sup-norm convergence","Weierstrass M-test","pointwise versus uniform convergence","uniformly Cauchy"],"fields":["real-analysis"],"stage":"undergraduate","np":{"textbook":38,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":39,"lesson":{"minutes":20,"checks":11,"fixed":1}},{"id":"lebesgue","band":"realanalysis","title":"Measure and the Lebesgue integral","short":"Lebesgue integral","pre":["riemann-integral","compactness"],"sum":"Lebesgue measure extends length from intervals to a vast class of subsets of $\\mathbb R$ while keeping countable additivity, and the Lebesgue integral is built by slicing the range of a function rather than its domain. The payoff is a theory in which limits and integrals can be interchanged under simple hypotheses, above all the dominated convergence theorem.","key":["m^*(A) = \\inf\\Big\\{ \\sum_{k=1}^\\infty \\ell(I_k) : A \\subseteq \\bigcup_{k=1}^\\infty I_k,\\ I_k \\text{ open intervals} \\Big\\}","\\int f\\,d\\mu = \\sup\\Big\\{ \\int s\\,d\\mu : 0 \\le s \\le f,\\ s \\text{ simple} \\Big\\} \\quad (f \\ge 0)","f_n \\text{ measurable},\\ f_n \\to f \\text{ a.e.},\\ |f_n| \\le g,\\ \\int g\\,d\\mu < \\infty \\implies \\int f_n\\,d\\mu \\to \\int f\\,d\\mu"],"why":"It is the integral of modern analysis and probability: $L^p$ spaces, Fourier analysis, partial differential equations and the definition of expectation all rest on it, mainly because its convergence theorems make limiting arguments routine.","msc":["28A25","28A12"],"links":[{"field":"harmonic-analysis","note":"The Riesz–Fischer theorem, that $L^2$ is complete, makes Fourier coefficients an isometry from $L^2$ of the circle onto square-summable sequences (Parseval's identity)."},{"field":"pde","note":"Weak solutions and Sobolev spaces are defined through Lebesgue integrals, and the completeness of $L^p$ spaces is what makes existence proofs work."},{"field":"physics","note":"The wave functions of quantum mechanics are elements of $L^2$, the space of functions whose square is Lebesgue integrable."}],"refs":["Folland, Real Analysis: Modern Techniques and Their Applications","Stein & Shakarchi, Real Analysis: Measure Theory, Integration, and Hilbert Spaces","Royden, Real Analysis"],"status":null,"aliases":["Lebesgue measure","measure theory","outer measure","dominated convergence theorem","monotone convergence theorem","Fatou's lemma","almost everywhere","null set"],"fields":["real-analysis","probability"],"stage":"graduate","np":{"textbook":24,"olympiad":2,"bridge":1,"research":0,"examples":0},"nprob":27,"lesson":{"minutes":24,"checks":13,"fixed":3}},{"id":"complex-numbers","band":"complex","title":"Complex numbers and functions","short":"Complex numbers","pre":["trig"],"sum":"$e^{i\\theta} = \\cos\\theta + i\\sin\\theta$; multiplication rotates and scales the plane. The variable of the zeta function is complex, $s = \\sigma + it$, and its real part $\\sigma$ is what the main conjectures are about.","key":["e^{i\\theta} = \\cos\\theta + i \\sin\\theta"],"why":"Writing $n^{-s} = n^{-\\sigma} e^{-it\\log n}$ turns arithmetic into oscillation.","msc":["30"],"links":[{"field":"physics","note":"Complex exponentials are the language of waves and quantum amplitudes."}],"refs":["Ahlfors, Complex Analysis"],"status":null,"aliases":[],"fields":["complex-analysis","algebra"],"stage":"school","np":{"textbook":21,"olympiad":47,"bridge":0,"research":0,"examples":0},"nprob":68,"lesson":{"minutes":20,"checks":9,"fixed":2}},{"id":"holomorphic","band":"complex","title":"Holomorphic functions and Cauchy's theorem","short":"Cauchy's theorem","pre":["complex-numbers","series","derivative"],"sum":"A complex-differentiable function on a simply connected domain has zero integral around closed loops, and Cauchy's integral formula recovers its values and all derivatives from boundary values. Holomorphic functions are locally power series.","key":["f^{(n)}(a) = \\frac{n!}{2\\pi i} \\oint_{|z-a|=r} \\frac{f(z)}{(z-a)^{n+1}}\\,dz \\quad (\\overline{D}(a,r) \\subset \\Omega)"],"why":"Rigidity of holomorphic functions is why the zeta function's values on a line control it everywhere.","msc":["30E20"],"links":[{"field":"complex-analysis","note":"The core theorem of the field; the Complex analysis strand will start here."}],"refs":["Ahlfors, Complex Analysis","Stein & Shakarchi, Complex Analysis"],"status":null,"aliases":["Cauchy integral formula"],"fields":["complex-analysis"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":30,"checks":10,"fixed":1}},{"id":"residues","band":"complex","title":"Residues and the argument principle","short":"Residue theorem","pre":["holomorphic"],"sum":"The integral of a meromorphic function around a positively oriented simple closed contour avoiding its poles equals $2\\pi i$ times the sum of the residues inside. The argument principle and Rouché's theorem count zeros inside a contour, which is how zeros of $\\zeta$ are counted.","key":["\\frac{1}{2\\pi i}\\oint_C \\frac{f'(z)}{f(z)}\\,dz = \\#\\text{zeros} - \\#\\text{poles} \\quad (\\text{inside } C, \\text{ with multiplicity; } f \\text{ meromorphic, no zeros or poles on } C, C \\text{ positively oriented})"],"why":"Perron's formula and the explicit formula are residue computations.","msc":["30E20"],"links":[{"field":"physics","note":"Contour integration evaluates the real integrals of scattering theory and signal analysis."}],"refs":["Ahlfors, Complex Analysis","Stein & Shakarchi, Complex Analysis"],"status":null,"aliases":["Rouche","argument principle"],"fields":["complex-analysis"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":28,"checks":11,"fixed":1}},{"id":"continuation","band":"complex","title":"Analytic continuation","short":"Analytic continuation","pre":["holomorphic"],"sum":"A holomorphic function is determined on a connected domain by its values on any small disc. $\\sum z^n$ converges only for $|z|<1$, but its sum $1/(1-z)$ continues to all $z \\ne 1$.","key":["\\sum_{n\\ge0} z^n = \\frac{1}{1-z} \\quad (|z| < 1)"],"why":"Values like $\\zeta(-1) = -\\tfrac1{12}$ come from continuation, not from summing the series.","msc":["30B40"],"links":[{"field":"physics","note":"Zeta-function regularization assigns finite values to divergent sums in quantum field theory; the Casimir effect uses $\\zeta(-3) = \\tfrac{1}{120}$."}],"refs":["Ahlfors, Complex Analysis"],"status":null,"aliases":[],"fields":["complex-analysis"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":26,"checks":11,"fixed":0}},{"id":"gamma","band":"complex","title":"The gamma function","short":"Gamma function","pre":["continuation","series","improper-integrals"],"sum":"$\\Gamma(s) = \\int_0^\\infty x^{s-1}e^{-x}\\,dx$ extends the factorial, $\\Gamma(n) = (n-1)!$, to a meromorphic function with poles at $0, -1, -2, \\dots$. Euler introduced it in 1729.","key":["\\Gamma(s+1) = s\\,\\Gamma(s), \\qquad \\Gamma(s)\\Gamma(1-s) = \\frac{\\pi}{\\sin \\pi s}"],"why":"It is the factor that makes the zeta function's functional equation symmetric.","msc":["33B15"],"links":[{"field":"probability","note":"Gamma and chi-squared distributions, and Stirling's formula for $n!$."},{"field":"special-functions","note":"The first special function; Beta, zeta and hypergeometric functions are built around it."}],"refs":["Stein & Shakarchi, Complex Analysis"],"status":null,"aliases":["factorial","Stirling","beta function"],"fields":["special-functions","complex-analysis"],"stage":"undergraduate","np":{"textbook":0,"olympiad":2,"bridge":1,"research":0,"examples":0},"nprob":3},{"id":"fourier-poisson","band":"harmonic","title":"Fourier analysis and Poisson summation","short":"Poisson summation","pre":["series","complex-numbers","riemann-integral","trig"],"sum":"Poisson summation says $

ples":0},"nprob":24,"lesson":{"minutes":15,"checks":11,"fixed":0}},{"id":"asymptotics","band":"analytic","title":"Asymptotic notation","short":"Asymptotics","pre":["series","limits"],"sum":"$f = O(g)$ and $f \\ll g$ mean $|f| \\le Cg$ for some constant $C$ and all sufficiently large $x$ (or all $x$ in a stated range); $f \\sim g$ means $f/g \\to 1$ and $f = o(g)$ means $f/g \\to 0$, as $x \\to \\infty$. Number theory statements are mostly sharp asymptotics with error terms.","key":["\\pi(x) \\sim \\frac{x}{\\log x}, \\qquad \\sum_{n \\le x} \\frac1n = \\log x + \\gamma + O\\!\\left(\\frac1x\\right)"],"why":"Reading and comparing error terms is most of the skill in analytic number theory.","msc":[],"links":[],"refs":["Apostol, Introduction to Analytic Number Theory","Montgomery & Vaughan, Multiplicative Number Theory I"],"status":null,"aliases":["big O","little o","Vinogradov notation"],"fields":["real-analysis","number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":15,"bridge":1,"research":0,"examples":0},"nprob":16,"lesson":{"minutes":22,"checks":10,"fixed":2}},{"id":"partial-summation","band":"analytic","title":"Abel summation and Euler–Maclaurin","short":"Partial summation","pre":["asymptotics","riemann-integral"],"sum":"Abel summation converts a sum $\\sum a_n f(n)$ into an integral against the partial sums $A(t)=\\sum_{n\\le t} a_n$. Euler–Maclaurin compares $\\sum f(n)$ with $\\int f$ and gives constants such as Euler's $\\gamma$.","key":["\\sum_{n \\le x} a_n f(n) = A(x) f(x) - \\int_1^x A(t)\\, f'(t)\\, dt \\quad (x \\ge 1,\\ f \\in C^1[1,x])"],"why":"It moves information between counting primes and weighting them by $\\log p$.","msc":[],"links":[],"refs":["Apostol, Introduction to Analytic Number Theory"],"status":null,"aliases":["Abel summation","Euler-Maclaurin","Euler constant"],"fields":["real-analysis","number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":4,"bridge":1,"research":0,"examples":0},"nprob":5,"lesson":{"minutes":24,"checks":12,"fixed":3}},{"id":"mellin","band":"analytic","title":"The Mellin transform and Perron's formula","short":"Mellin transform","pre":["gamma","residues"],"sum":"The Mellin transform $\\int_0^\\infty f(x)\\,x^{s-1}\\,dx$ moves between functions of $x$ and Dirichlet-series-like functions of $s$. Perron's formula recovers partial sums $\\sum_{n \\le x} a_n$ from $\\sum a_n n^{-s}$ by a contour integral.","key":["\\sum_{n \\le x} a_n = \\frac{1}{2\\pi i}\\int_{c - i\\infty}^{c+i\\infty} \\Bigl(\\sum_n \\frac{a_n}{n^s}\\Bigr) \\frac{x^s}{s}\\, ds"],"why":"The 2026 quasi-RH manuscript lists a Mellin continuation as a key step.","msc":[],"links":[{"field":"harmonic-analysis","note":"The Fourier transform on the multiplicative group $(0,\\infty)$."}],"refs":["Apostol, Introduction to Analytic Number Theory","Montgomery & Vaughan, Multiplicative Number Theory I"],"status":null,"aliases":["Perron formula"],"fields":["harmonic-analysis","complex-analysis"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":2,"research":0,"examples":0},"nprob":2},{"id":"dirichlet-series","band":"analytic","title":"Dirichlet series and Euler products","short":"Euler products","pre":["series","mobius","fta"],"sum":"Series $\\sum a_n n^{-s}$. When $a_n$ is multiplicative the series factors over primes; for $a_n = 1$ this is Euler's 1737 product, an analytic restatement of unique factorization.","key":["\\sum_{n \\ge 1}\\frac{1}{n^s} = \\prod_p \\frac{1}{1 - p^{-s}} \\qquad (\\operatorname{Re} s > 1)"],"why":"The product shows $\\sum 1/p$ diverges and ties primes to the poles and zeros of a function.","msc":["30B50","11M41"],"links":[{"field":"probability","note":"$\\prod_p (1 - p^{-2}) = 6/\\pi^2$ is the probability that a random integer is squarefree."}],"refs":["Apostol, Introduction to Analytic Number Theory"],"status":null,"aliases":["Euler product"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":1,"research":0,"examples":0},"nprob":1},{"id":"zeta","band":"analytic","title":"The Riemann zeta function","short":"Zeta function","pre":["dirichlet-series","continuation","gamma"],"sum":"$\\zeta(s) = \\sum n^{-s}$ for $\\operatorname{Re}s > 1$ continues to all of $\\mathbb C$ except a simple pole at $s = 1$. Euler found $\\zeta(2) = \\pi^2/6$ in 1735; Riemann's 1859 paper made $\\zeta$ a function of a complex variable.","key":["\\zeta(2k) = \\frac{(-1)^{k+1} B_{2k} (2\\pi)^{2k}}{2\\,(2k)!}, \\qquad \\zeta(-n) = -\\frac{B_{n+1}}{n+1}"],"why":"Its zeros encode the primes.","msc":["11M06"],"links":[{"field":"physics","note":"Zeta regularization in quantum field theory and string theory."},{"field":"special-functions","note":"Values at integers are Bernoulli numbers and powers of $\\pi$."}],"refs":["Titchmarsh, The Theory of the Riemann Zeta-Function","Edwards, Riemann's Zeta Function"],"status":null,"aliases":["Riemann zeta","Bernoulli numbers","Basel problem"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":2,"research":0,"examples":0},"nprob":2},{"id":"functional-equation","band":"analytic","title":"Functional equation and trivial zeros","short":"Functional equation","pre":["zeta","fourier-poisson","mellin"],"sum":"The completed function $\\xi(s) = \\tfrac12 s(s-1)\\pi^{-s/2}\\Gamma(s/2)\\zeta(s)$ satisfies $\\xi(s) = \\xi(1-s)$. So nontrivial zeros are symmetric about $\\operatorname{Re}s = \\tfrac12$, and $\\zeta$ has trivial zeros at $-2, -4, -6, \\dots$.","key":["\\xi(s) = \\xi(1-s)"],"why":"Symmetry means any zero-free region near $\\operatorname{Re}s=1$ gives one near $\\operatorname{Re}s=0$.","msc":["11M06"],"links":[],"refs":["Titchmarsh, The Theory of the Riemann Zeta-Function","Davenport, Multiplicative Number Theory"],"status":null,"aliases":["xi function","trivial zeros"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":2,"research":0,"examples":0},"nprob":2},{"id":"chebyshev","band":"analytic","title":"Chebyshev and von Mangoldt functions","short":"Chebyshev functions","pre":["arithmetic-functions","partial-summation"],"sum":"$\\Lambda(n) = \\log p$ if $n = p^k$ and $0$ otherwise; $\\psi(x) = \\sum_{n \\le x} \\Lambda(n)$ counts primes with weight $\\log p$. Chebyshev (1848–1850) showed $\\psi(x) \\asymp x$.","key":["\\psi(x) = \\sum_{n \\le x} \\Lambda(n) = \\log \\operatorname{lcm}(1, 2, \\dots, \\lfloor x \\rfloor)","-\\frac{\\zeta'(s)}{\\zeta(s)} = \\sum_{n \\ge 1} \\frac{\\Lambda(n)}{n^s}"],"why":"$\\psi$ is the natural prime-counting function for analysis: the prime number theorem is $\\psi(x) \\sim x$.","msc":["11N05"],"links":[],"refs":["Apostol, Introduction to Analytic Number Theory","Davenport, Multiplicative Number Theory"],"status":null,"aliases":["von Mangoldt","psi function","theta function primes"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"mertens","band":"analytic","title":"Mertens' theorems","short":"Mertens' theorems","pre":["chebyshev"],"sum":"Mertens (1874) proved $\\sum_{p \\le x} \\frac{\\log p}{p} = \\log x + O(1)$, $\\sum_{p\\le x}\\frac1p = \\log\\log x + M + o(1)$, and $\\prod_{p \\le x}(1 - 1/p) \\sim e^{-\\gamma}/\\log x$, all without the prime number theorem.","key":["\\prod_{p \\le x}\\Bigl(1 - \\frac1p\\Bigr) \\sim \\frac{e^{-\\gamma}}{\\log x}"],"why":"These are the estimates sieve methods start from.","msc":["11N05"],"links":[],"refs":["Montgomery & Vaughan, Multiplicative Number Theory I","Apostol, Introduction to Analytic Number Theory"],"status":null,"aliases":["Meissel-Mertens constant"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"pnt","band":"analytic","title":"The prime number theorem","short":"Prime number theorem","pre":["chebyshev","zeta","residues","mellin"],"sum":"$\\pi(x) \\sim x/\\log x$, conjectured by Gauss and Legendre in the 1790s and proved in 1896 by Hadamard and de la Vallée Poussin. The key step is that $\\zeta(1+it) \\ne 0$.","key":["\\pi(x) \\sim \\operatorname{li}(x) = \\int_2^x \\frac{dt}{\\log t}"],"why":"The size of the error $\\pi(x) - \\operatorname{li}(x)$ is controlled by the zeros of $\\zeta$.","msc":["11N05"],"links":[],"refs":["Apostol, Introduction to Analytic Number Theory","Davenport, Multiplicative Number Theory"],"status":null,"aliases":["PNT","prime counting function"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":4,"research":0,"examples":0},"nprob":4},{"id":"nontrivial-zeros","band":"analytic","title":"Nontrivial zeros and the Riemann–von Mangoldt formula","short":"Nontrivial zeros","pre":["functional-equation","residues"],"sum":"Zeros in the critical strip $0 < \\operatorname{Re}s < 1$ are the nontrivial zeros. The number with $0 < \\operatorname{Im} s \\le T$ is $N(T) = \\frac{T}{2\\pi}\\log\\frac{T}{2\\pi e} + O(\\log T)$. The first is $\\tfrac12 + 14.134725\\ldots\\,i$.","key":["N(T) = \\frac{T}{2\\pi}\\log\\frac{T}{2\\pi e} + \\frac78 + O(\\log T)"],"why":"Hardy (1914) showed infinitely many lie on the critical line.","msc":["11M26"],"links":[{"field":"computer-science","note":"Large-scale computations have checked that the first $10^{13}$ zeros lie on the line."}],"refs":["Titchmarsh, The Theory of the Riemann Zeta-Function","Edwards, Riemann's Zeta Function"],"status":null,"aliases":["critical strip","critical line","N(T)"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":4,"research":1,"examples":0},"nprob":5},{"id":"explicit-formula","band":"analytic","title":"The explicit formula","short":"Explicit formula","pre":["nontrivial-zeros","chebyshev","mellin"],"sum":"Riemann's formula, proved by von Mangoldt in 1895, writes $\\psi(x)$ exactly as a sum over the zeros $\\rho$. A zero $\\rho = \\beta + i\\gamma$ contributes a term of size $x^{\\beta}$.","key":["\\psi(x) = x - \\sum_{\\rho} \\frac{x^{\\rho}}{\\rho} - \\log 2\\pi - \\tfrac12 \\log\\bigl(1 - x^{-2}\\bigr)"],"why":"It is why every statement about zeros is a statement about primes.","msc":["11M26","11N05"],"links":[{"field":"harmonic-analysis","note":"Primes and zeros are dual, like a function and its Fourier transform."}],"refs":["Davenport, Multiplicative Number Theory","Montgomery & Vaughan, Multiplicative Number Theory I"],"status":null,"aliases":["von Mangoldt formula","Riemann explicit formula"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":3,"research":0,"examples":0},"nprob":3},{"id":"zero-free-region","band":"analytic","title":"Zero-free regions","short":"Zero-free regions","pre":["explicit-formula","pnt"],"sum":"Regions near $\\operatorname{Re}s=1$ with no zeros. De la Vallée Poussin (1899) found $\\sigma > 1 - c/\\log|t|$, and Vinogradov and Korobov (1958) a wider region, but in all of them the width shrinks to $0$ as $|t| \\to \\infty$. The classical proof uses $3 + 4\\cos\\theta + \\cos 2\\theta \\ge 0$.","key":["\\sigma > 1 - \\frac{c}{\\log |t|}","3 + 4\\cos\\theta + \\cos 2\\theta = 2(1+\\cos\\theta)^2 \\ge 0"],"why":"The width of the zero-free region is exactly the strength of the prime number theorem's error term.","msc":["11M26"],"links":[],"refs":["Davenport, Multiplicative Number Theory","Montgomery & Vaughan, Multiplicative Number Theory I","Titchmarsh, The Theory of the Riemann Zeta-Function"],"status":null,"aliases":["de la Vallee Poussin","Vinogradov-Korobov"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":3,"research":0,"examples":0},"nprob":3},{"id":"dirichlet-characters","band":"analytic","title":"Dirichlet characters","short":"Dirichlet characters","pre":["order-primroot","arithmetic-functions","crt"],"sum":"Homomorphisms $\\chi: (\\mathbb Z/q\\mathbb Z)^\\times \\to \\mathbb C^\\times$, extended by $0$. There are $\\varphi(q)$ of them, and orthogonality isolates a residue class. A character is primitive if it is not induced from a smaller modulus.","key":["\\frac{1}{\\varphi(q)}\\sum_{\\chi \\bmod q} \\overline{\\chi}(a)\\,\\chi(n) = \\begin{cases} 1 & n \\equiv a \\\\ 0 & \\text{otherwise}\\end{cases}"],"why":"Characters are how one picks out primes in a single arithmetic progression.","msc":[],"links":[{"field":"algebra","note":"Characters of a finite abelian group; the simplest case of harmonic analysis on groups."}],"refs":["Davenport, Multiplicative Number Theory","Ireland & Rosen, A Classical Introduction to Modern Number Theory"],"status":null,"aliases":["character","primitive character","conductor"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":2,"research":0,"examples":0},"nprob":2},{"id":"gauss-sums","band":"analytic","title":"Gauss sums","short":"Gauss sums","pre":["dirichlet-characters"],"sum":"$g(\\chi) = \\sum_{a \\bmod q} \\chi(a) e^{2\\pi i a/q}$. For primitive $\\chi$, $|g(\\chi)| = \\sqrt q$. For the quadratic character modulo a prime, $g^2 = \\left(\\frac{-1}{p}\\right) p$, which gives a proof of quadratic reciprocity.","key":["|g(\\chi)|^2 = q \\quad (\\chi \\text{ primitive mod } q)"],"why":"Gauss sums connect multiplicative characters to additive ones and appear in every functional equation of an $L$-function.","msc":["11L05"],"links":[{"field":"harmonic-analysis","note":"A finite Fourier transform of a character."}],"refs":["Ireland & Rosen, A Classical Introduction to Modern Number Theory","Davenport, Multiplicative Number Theory"],"status":null,"aliases":["quadratic Gauss sum"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"l-functions","band":"analytic","title":"Dirichlet L-functions and primes in progressions","short":"Dirichlet L-functions","pre":["dirichlet-characters","dirichlet-series","zeta"],"sum":"$L(s,\\chi) = \\sum \\chi(n) n^{-s} = \\prod_p (1-\\chi(p)p^{-s})^{-1}$. Dirichlet (1837) proved $L(1,\\chi) \\ne 0$ for $\\chi \\ne \\chi_0$, so every progression $a \\bmod q$ with $\\gcd(a,q)=1$ has infinitely many primes.","key":["\\sum_{\\substack{p \\le x \\\\ p \\equiv a \\ (q)}} \\frac{1}{p} = \\frac{1}{\\varphi(q)} \\log\\log x + O(1)"],"why":"The template for every later $L$-function.","msc":["11M06","11N13"],"links":[],"refs":["Davenport, Multiplicative Number Theory","Apostol, Introduction to Analytic Number Theory"],"status":null,"aliases":["Dirichlet theorem","arithmetic progressions"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":1,"research":0,"examples":0},"nprob":1},{"id":"class-number-formula","band":"analytic","title":"Dirichlet's class number formula","short":"Class number formula","pre":["l-functions","quadratic-forms"],"sum":"Dirichlet (1839) expressed $L(1,\\chi_D)$ through the class number of forms of discriminant $D$. For $D < -4$, $L(1,\\chi_D) = \\pi h(D)/\\sqrt{|D|}$.","key":["L(1, \\chi_D) = \\frac{2\\pi\\, h(D)}{w \\sqrt{|D|}} \\quad (D < 0)"],"why":"It turns the non-vanishing of $L(1,\\chi)$ into the positivity of a class number, and links Siegel zeros to small class numbers.","msc":["11R29"],"links":[{"field":"algebra","note":"Class numbers of imaginary quadratic fields."}],"refs":["Davenport, Multiplicative Number Theory","Cox, Primes of the Form x² + ny²"],"status":null,"aliases":["analytic class number formula"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"siegel-zeros","band":"analytic","title":"Siegel zeros and the Landau–Siegel problem","short":"Siegel zeros","pre":["l-functions","zero-free-region","class-number-formula"],"sum":"A real character $\\chi$ might have $L(\\beta,\\chi) = 0$ with $\\beta$ extremely close to $1$. Siegel (1935) proved $1 - \\beta \\gg_\\varepsilon q^{-\\varepsilon}$, but the constant cannot be computed. Excluding such zeros was a central open problem.","key":["1 - \\beta \\;\\gg_\\varepsilon\\; q^{-\\varepsilon}"],"why":"A Siegel zero would make primes unevenly spread among residue classes and class numbers unexpectedly small.","msc":["11M20"],"links":[],"refs":["Davenport, Multiplicative Number Theory","Iwaniec & Kowalski, Analytic Number Theory"],"status":null,"aliases":["exceptional zero","Landau-Siegel","Siegel theorem"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"siegel-walfisz","band":"analytic","title":"The Siegel–Walfisz theorem","short":"Siegel–Walfisz","pre":["siegel-zeros","explicit-formula"],"sum":"For any fixed $A$, primes up to $x$ split evenly among residue classes modulo $q \\le (\\log x)^A$, with error $O(x e^{-c\\sqrt{\\log x}})$. The constant is ineffective because it relies on Siegel's theorem.","key":["\\psi(x; q, a) = \\frac{x}{\\varphi(q)} + O_A\\!\\bigl(x\\, e^{-c\\sqrt{\\log x}}\\bigr), \\quad q \\le (\\log x)^A"],"why":"It is the input for Vinogradov's three-primes theorem and for Bombieri–Vinogradov.","msc":["11N13"],"links":[],"refs":["Davenport, Multiplicative Number Theory","Iwaniec & Kowalski, Analytic Number Theory"],"status":null,"aliases":[],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"sieve-basics","band":"analytic","title":"Sieves from Eratosthenes to Brun","short":"Elementary sieves","pre":["mobius","mertens"],"sum":"The sieve of Eratosthenes, written with inclusion–exclusion, is the Legendre identity. Brun (1919) truncated it and proved $\\sum 1/p$ over twin primes converges, the first result on twin primes.","key":["\\pi(x) - \\pi(\\sqrt x) + 1 = \\sum_{d \\mid P(\\sqrt x)} \\mu(d) \\Bigl\\lfloor \\frac{x}{d} \\Bigr\\rfloor"],"why":"Sieves estimate how many integers survive after removing residue classes, which is the right question for twin primes and Goldbach.","msc":["11N35"],"links":[{"field":"combinatorics","note":"Inclusion–exclusion with truncation."},{"field":"computer-science","note":"The sieve of Eratosthenes is still the fastest way to list primes up to a bound."}],"refs":["Friedlander & Iwaniec, Opera de Cribro","Montgomery & Vaughan, Multiplicative Number Theory I"],"status":null,"aliases":["Eratosthenes","Brun sieve","Legendre identity"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":9,"research":0,"examples":0},"nprob":9},{"id":"selberg-sieve","band":"analytic","title":"The Selberg sieve","short":"Selberg sieve","pre":["sieve-basics"],"sum":"Selberg (1947) replaced $\\mu(d)$ by weights $\\lambda_d$ chosen to minimise a quadratic form, giving sharp upper bounds such as $\\pi(x+y) - \\pi(x) \\le (2+o(1))\\,y/\\log y$.","key":["\\sum_{n \\le x}\\Bigl(\\sum_{d \\mid n} \\lambda_d\\Bigr)^2, \\qquad \\lambda_1 = 1"],"why":"The same idea, applied with many linear forms at once, is the engine of Maynard's 2013 proof of bounded gaps.","msc":["11N35"],"links":[],"refs":["Friedlander & Iwaniec, Opera de Cribro"],"status":null,"aliases":["Lambda squared sieve"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":6,"research":0,"examples":0},"nprob":6},{"id":"large-sieve","band":"analytic","title":"The large sieve","short":"Large sieve","pre":["gauss-sums","fourier-poisson"],"sum":"An inequality bounding a trigonometric polynomial at well-spaced points (Linnik, 1941). With characters it says no sequence can be badly distributed in many residue classes at once.","key":["\\sum_{q \\le Q}\\ \\sum_{\\substack{a \\bmod q \\\\ (a,q)=1}} \\Bigl|\\sum_{n \\le N} a_n e\\!\\left(\\tfrac{an}{q}\\right)\\Bigr|^2 \\le (N + Q^2)\\sum_n |a_n|^2"],"why":"The key input of Bombieri–Vinogradov.","msc":["11N35"],"links":[{"field":"harmonic-analysis","note":"A dual form of Bessel's inequality for almost-orthogonal vectors."}],"refs":["Iwaniec & Kowalski, Analytic Number Theory","Montgomery & Vaughan, Multiplicative Number Theory I"],"status":null,"aliases":[],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":1,"research":0,"examples":0},"nprob":1},{"id":"bombieri-vinogradov","band":"analytic","title":"The Bombieri–Vinogradov theorem","short":"Bombieri–Vinogradov","pre":["large-sieve","siegel-walfisz"],"sum":"Primes are well distributed in residue classes on average over moduli $q \\le x^{1/2}/(\\log x)^B$, as strong as GRH would give on average. Proved by Bombieri and by A. I. Vinogradov in 1965.","key":["\\sum_{q \\le Q}\\ \\max_{(a,q)=1} \\Bigl|\\psi(x;q,a) - \\frac{x}{\\varphi(q)}\\Bigr| \\ll_A \\frac{x}{(\\log x)^A}"],"why":"Level of distribution $1/2$; Zhang's 2013 breakthrough went slightly past it for smooth moduli.","msc":["11N13"],"links":[],"refs":["Iwaniec & Kowalski, Analytic Number Theory","Davenport, Multiplicative Number Theory"],"status":null,"aliases":["level of distribution"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":6,"research":0,"examples":0},"nprob":6},{"id":"bounded-gaps","band":"analytic","title":"Bounded gaps between primes","short":"Bounded prime gaps","pre":["bombieri-vinogradov","selberg-sieve","prime-patterns"],"sum":"Zhang (2013) proved $\\liminf (p_{n+1} - p_n) < 7 \\times 10^7$. Maynard (late 2013) gave a simpler multidimensional sieve, and the Polymath8 project brought the bound to $246$.","key":["\\liminf_{n\\to\\infty} (p_{n+1} - p_n) \\le 246"],"why":"The twin prime conjecture asks for $2$.","msc":["11N05"],"links":[{"field":"formal-verification","note":"In August 2026 AxiomProver was reported to have formally verified the proof of the bound 246."},{"field":"ai-research","note":"Polymath8 was a large open online collaboration, a precedent for community research."}],"refs":["Friedlander & Iwaniec, Opera de Cribro"],"status":null,"aliases":["Zhang","Maynard","Polymath8","246"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":5,"research":0,"examples":0},"nprob":5},{"id":"exponential-sums","band":"analytic","title":"Exponential sums and Weyl differencing","short":"Exponential sums","pre":["fourier-poisson","congruences"],"sum":"Sums $\\sum e(f(n))$ with $e(x) = e^{2\\pi i x}$. Weyl (1916) showed $n^2\\alpha$ is equidistributed modulo $1$ for irrational $\\alpha$ by squaring the sum (differencing). Complete sums such as $\\sum_{n \\bmod p} e(n^2/p)$ have size exactly $\\sqrt p$.","key":["\\Bigl|\\sum_{n=0}^{p-1} e\\!\\left(\\frac{n^2}{p}\\right)\\Bigr| = \\sqrt p"],"why":"Cancellation in exponential sums is the currency of the circle method and of subconvexity.","msc":["11L07"],"links":[{"field":"dynamics","note":"Weyl's equidistribution theorem is an early ergodic result."},{"field":"harmonic-analysis","note":"Oscillatory sums and van der Corput estimates."}],"refs":["Iwaniec & Kowalski, Analytic Number Theory","Vaughan, The Hardy–Littlewood Method"],"status":null,"aliases":["Weyl sums","equidistribution"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":7,"research":0,"examples":0},"nprob":7},{"id":"circle-method","band":"analytic","title":"The Hardy–Littlewood circle method","short":"Circle method","pre":["exponential-sums","fourier-poisson"],"sum":"Count solutions of additive equations by writing the count as $\\int_0^1 S(\\alpha)^k e(-N\\alpha)\\,d\\alpha$ and splitting $[0,1]$ into major arcs near rationals and minor arcs. Developed by Hardy and Littlewood from 1920.","key":["r(N) = \\int_0^1 S(\\alpha)^k\\, e(-N\\alpha)\\, d\\alpha, \\qquad S(\\alpha) = \\sum_{n \\le N} e(n\\alpha)"],"why":"It proves Waring's problem asymptotics and the ternary Goldbach theorem.","msc":["11P55"],"links":[{"field":"harmonic-analysis","note":"Fourier analysis on $\\mathbb R/\\mathbb Z$ with arithmetic structure."}],"refs":["Vaughan, The Hardy–Littlewood Method"],"status":null,"aliases":["major arcs","minor arcs","Hardy-Littlewood"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":5,"research":0,"examples":0},"nprob":5},{"id":"ternary-goldbach","band":"analytic","title":"Ternary Goldbach","short":"Ternary Goldbach","pre":["circle-method","siegel-walfisz"],"sum":"Vinogradov (1937) proved every sufficiently large odd number is a sum of three primes. Helfgott (2013) lowered 'sufficiently large' to every odd number greater than $5$.","key":["N = p_1 + p_2 + p_3 \\quad (N > 5 \\text{ odd})"],"why":"The binary Goldbach conjecture for even numbers remains open.","msc":["11P32"],"links":[{"field":"computer-science","note":"Helfgott's proof combined analysis with large computer verifications of small cases."}],"refs":["Vaughan, The Hardy–Littlewood Method"],"status":null,"aliases":["Vinogradov three primes","Helfgott"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":3,"research":0,"examples":0},"nprob":3},{"id":"waring","band":"analytic","title":"Waring's problem","short":"Waring's problem","pre":["circle-method"],"sum":"Waring (1770) asserted every positive integer is a sum of a bounded number $g(k)$ of $k$-th powers; Hilbert proved it in 1909. Lagrange's four-square theorem (1770) gives $g(2)=4$, and $g(3) = 9$, $g(4) = 19$.","key":["g(2) = 4,\\quad g(3) = 9,\\quad g(4) = 19"],"why":"The circle method computes how many representations there are, not just that one exists.","msc":["11P05"],"links":[{"field":"combinatorics","note":"Additive bases of the integers."}],"refs":["Vaughan, The Hardy–Littlewood Method","Hardy & Wright, An Introduction to the Theory of Numbers"],"status":null,"aliases":["four squares","Lagrange four square"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"moments","band":"analytic","title":"Moments, mollifiers and amplifiers","short":"Moments & amplifiers","pre":["l-functions","explicit-formula"],"sum":"Averages of $|\\zeta|^{2k}$ or of $L$-values over families carry information about zeros. Bettin and Gonek (2017) showed a conjecture on mollified second moments implies the Riemann hypothesis. In October 2026 a follow-up paper used amplified moments to refine the quasi-RH bound.","key":["\\int_0^T |\\zeta(\\tfrac12 + it)|^2\\, dt \\sim T \\log T"],"why":"Amplifiers single out one member of a family, the natural tool for hunting an exceptional zero.","msc":["11M06"],"links":[{"field":"probability","note":"Keating and Snaith (2000) predicted the constants in moments using random matrix theory."}],"refs":["Iwaniec & Kowalski, Analytic Number Theory","Titchmarsh, The Theory of the Riemann Zeta-Function"],"status":null,"aliases":["mollifier","amplifier","moment conjecture"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":3,"research":0,"examples":0},"nprob":3},{"id":"zero-density","band":"analytic","title":"Zero-density estimates","short":"Zero density","pre":["zero-free-region","moments"],"sum":"$N(\\sigma, T)$ counts zeros with real part at least $\\sigma$ and height at most $T$. Density theorems show $N(\\sigma,T) \\ll T^{A(1-\\sigma)+\\varepsilon}$: zeros off the line, if any, are rare.","key":["N(\\sigma, T) \\ll T^{A(1-\\sigma)} (\\log T)^B"],"why":"Density hypotheses give primes in short intervals almost as well as RH would.","msc":["11M26"],"links":[],"refs":["Iwaniec & Kowalski, Analytic Number Theory","Titchmarsh, The Theory of the Riemann Zeta-Function"],"status":null,"aliases":["density hypothesis","Ingham"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":4,"research":0,"examples":0},"nprob":4},{"id":"lindelof","band":"analytic","title":"Lindelöf hypothesis and subconvexity","short":"Lindelöf hypothesis","pre":["functional-equation","exponential-sums"],"sum":"Lindelöf (1908) conjectured $\\zeta(\\tfrac12+it) \\ll |t|^{\\varepsilon}$. The functional equation and convexity give exponent $\\tfrac14$; any improvement is called subconvexity.","key":["\\zeta(\\tfrac12 + it) \\ll_\\varepsilon |t|^{\\varepsilon}"],"why":"Implied by RH, and itself enough for many applications.","msc":["11M06"],"links":[],"refs":["Titchmarsh, The Theory of the Riemann Zeta-Function","Iwaniec & Kowalski, Analytic Number Theory"],"status":"open","aliases":["subconvexity","convexity bound"],"fields":["number-theory"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"pair-correlation","band":"analytic","title":"Pair correlation and random matrices","short":"Pair correlation","pre":["nontrivial-zeros","explicit-formula"],"sum":"Montgomery (1973) studied spacings between zeros and conjectured their pair correlation is $1 - \\left(\\frac{\\sin \\pi u}{\\pi u}\\right)^2$. Dyson recognised this as the eigenvalue statistics of large random Hermitian matrices.","key":["1 - \\Bigl(\\frac{\\sin \\pi u}{\\pi u}\\Bigr)^2"],"why":"Zeros behave like energy levels of a chaotic quantum system, a hint toward the Hilbert–Pólya idea.","msc":["11M26"],"links":[{"field":"physics","note":"The same statistics describe energy levels of heavy nuclei and quantum chaotic systems."},{"field":"probability","note":"The GUE ensemble of random matrix theory."},{"field":"computer-science","note":"Odlyzko's computations of zeros near the $10^{20}$-th confirmed the prediction numerically."}],"refs":["Iwaniec & Kowalski, Analytic Number Theory"],"status":"open","aliases":["Montgomery","GUE","Dyson","random matrix theory"],"fields":["number-theory"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"rh","band":"analytic","title":"The Riemann hypothesis","short":"Riemann hypothesis","pre":["nontrivial-zeros","explicit-formula"],"sum":"Every nontrivial zero of $\\zeta$ has real part $\\tfrac12$. Stated by Riemann in 1859, one of Hilbert's 1900 problems and a Clay Millennium Problem since 2000. Open as of October 2026.","key":["\\zeta(\\rho) = 0,\\ 0 < \\operatorname{Re}\\rho < 1 \\ \\Longrightarrow\\ \\operatorname{Re}\\rho = \\tfrac12","\\psi(x) = x + O(\\sqrt x \\log^2 x)"],"why":"It is equivalent to the best possible error term in the prime number theorem.","msc":["11M26"],"links":[{"field":"physics","note":"The Hilbert–Pólya idea: zeros as eigenvalues of a self-adjoint operator."}],"refs":["Edwards, Riemann's Zeta Function","Titchmarsh, The Theory of the Riemann Zeta-Function"],"status":"open","aliases":["RH","Millennium problem"],"fields":["number-theory"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":10,"research":1,"examples":0},"nprob":11},{"id":"grh","band":"analytic","title":"The generalized Riemann hypothesis","short":"Generalized RH","pre":["rh","l-functions"],"sum":"All nontrivial zeros of every Dirichlet $L$-function lie on $\\operatorname{Re}s=\\tfrac12$. GRH would give primes in progressions with square-root error and make many algorithms provably fast.","key":["L(\\rho,\\chi) = 0,\\ 0<\\operatorname{Re}\\rho<1 \\ \\Longrightarrow\\ \\operatorname{Re}\\rho = \\tfrac12"],"why":"Bombieri–Vinogradov is GRH on average.","msc":["11M26"],"links":[{"field":"computer-science","note":"Under GRH the Miller–Rabin test becomes deterministic with bases up to $2(\\log n)^2$."}],"refs":["Davenport, Multiplicative Number Theory","Iwaniec & Kowalski, Analytic Number Theory"],"status":"open","aliases":["GRH","extended Riemann hypothesis"],"fields":["number-theory"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"quasi-rh","band":"analytic","title":"The quasi-Riemann hypothesis","short":"Quasi-RH","pre":["zero-free-region","hecke-l","cubic-characters","mellin"],"sum":"There is a fixed $\\theta < 1$ with no zeros in $\\operatorname{Re}s > \\theta$. An OpenAI manuscript dated 30 September 2026 claims every Dirichlet $L$-function, $\\zeta$ included, is zero-free in $\\operatorname{Re}s > \\tfrac78$, using n–Kubilius","normal order"],"fields":["number-theory","probability"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":1,"examples":0},"nprob":1},{"id":"gaussian-integers","band":"algebraic","title":"Gaussian integers","short":"Gaussian integers","pre":["quadratic-residues","fta"],"sum":"$\\mathbb Z[i]$ has unique factorization with norm $N(a+bi) = a^2 + b^2$. A prime $p \\equiv 1 \\pmod 4$ splits as $\\pi\\bar\\pi$, $p \\equiv 3 \\pmod 4$ stays prime, and $2 = -i(1+i)^2$ ramifies.","key":["p = a^2 + b^2 = (a+bi)(a-bi) \\iff p \\equiv 1 \\pmod 4 \\ \\text{or}\\ p = 2"],"why":"The cleanest proof of the two-squares theorem, and the first number ring beyond $\\mathbb Z$.","msc":["11R11"],"links":[{"field":"geometry","note":"The square lattice in the plane."}],"refs":["Ireland & Rosen, A Classical Introduction to Modern Number Theory","Marcus, Number Fields"],"status":null,"aliases":["Z[i]","Gaussian primes"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"eisenstein-integers","band":"algebraic","title":"Eisenstein integers","short":"Eisenstein integers","pre":["quadratic-residues","fta"],"sum":"$\\mathbb Z[\\omega]$ with $\\omega = e^{2\\pi i/3}$ is the ring of integers of $\\mathbb Q(\\sqrt{-3})$. It has unique factorization, six units, and norm $a^2 - ab + b^2$; primes $p \\equiv 1 \\pmod 3$ split.","key":["N(a + b\\omega) = a^2 - ab + b^2"],"why":"The arena of cubic reciprocity, and of the 2026 quasi-RH manuscript.","msc":["11R11"],"links":[{"field":"geometry","note":"The hexagonal lattice."}],"refs":["Ireland & Rosen, A Classical Introduction to Modern Number Theory"],"status":null,"aliases":["Z[omega]","Q(sqrt -3)"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"ideals","band":"algebraic","title":"Ideals and rings of integers","short":"Ideals","pre":["gaussian-i complex-analysis","note":"Inversion is the conformal map $z \\mapsto 1/\\bar z$."}],"refs":["Chen, Euclidean Geometry in Mathematical Olympiads","Coxeter & Greitzer, Geometry Revisited"],"status":null,"aliases":["inversion","homothety","spiral similarity","projective"],"fields":["geometry"],"stage":"olympiad","np":{"textbook":0,"olympiad":11,"bridge":0,"research":0,"examples":0},"nprob":11},{"id":"analytic-geometry","band":"geometry","title":"Coordinates, vectors and complex numbers","short":"Coordinates & complex","pre":["euclid-basics","complex-numbers"],"sum":"Place the figure in coordinates, use vectors, complex numbers on the unit circle, or barycentric coordinates, and compute.","key":["a,b,c,d \\text{ on the unit circle: } ab \\parallel cd \\iff ab = cd"],"why":"Computation is a guaranteed fallback; choosing the frame that keeps it short is the skill.","msc":["51N20"],"links":[{"field":"algebra","note":"Bashing a configuration is solving a polynomial system, which Gröbner bases automate."}],"refs":["Chen, Euclidean Geometry in Mathematical Olympiads"],"status":null,"aliases":["complex bash","barycentric","coordinates","vectors"],"fields":["geometry","algebra"],"stage":"olympiad","np":{"textbook":0,"olympiad":27,"bridge":0,"research":0,"examples":0},"nprob":27},{"id":"geo-inequalities","band":"geometry","title":"Geometric inequalities and extremal geometry","short":"Geometric inequalities","pre":["euclid-basics","amgm"],"sum":"Inequalities among lengths, areas and angles of figures: the triangle inequality, Euler's $R \\ge 2r$, the isoperimetric inequality, Erdős–Mordell.","key":["R \\ge 2r","PA+PB+PC \\ge 2(PD+PE+PF)\\ \\ \\text{(Erdős–Mordell)}","4\\pi A \\le L^2"],"why":"The isoperimetric inequality is the model for a large part of geometric analysis.","msc":["51M16","52A40"],"links":[{"field":"real-analysis","note":"The isoperimetric inequality is a variational problem."}],"refs":["Coxeter & Greitzer, Geometry Revisited"],"status":null,"aliases":["isoperimetric","Erdős–Mordell","triangle inequality"],"fields":["geometry","real-analysis"],"stage":"olympiad","np":{"textbook":0,"olympiad":19,"bridge":0,"research":0,"examples":0},"nprob":19},{"id":"probability-basics","band":"probability","title":"Probability spaces and conditional probability","short":"Probability basics","pre":["counting"],"sum":"A probability space assigns to each event a number between $0$ and $1$, with total $1$ and additivity over disjoint events; when all outcomes are equally likely, probability is counting. Conditional probability $P(A \\mid B) = P(A \\cap B)/P(B)$ updates probabilities once we learn that $B$ happened, and Bayes' theorem reverses the direction of conditioning.","key":["P(A \\cup B) = P(A) + P(B) - P(A \\cap B)","P(A \\mid B) = \\frac{P(A \\cap B)}{P(B)}","P(B \\mid A) = \\frac{P(A \\mid B)\\,P(B)}{P(A)}"],"why":"Conditional reasoning decides how much a positive medical test or a piece of evidence should change our beliefs, and untrained intuition about it is often badly wrong.","msc":["60A05","60-01"],"links":[{"field":"combinatorics","note":"The probabilistic method proves that combinatorial objects exist by showing that a random one has the required property with positive probability, often via the union bound."},{"field":"computer-science","note":"Randomised algorithms, hashing and the analysis of average running times are built on probability spaces and conditional probability."},{"field":"ai-research","note":"Bayes' theorem is the update rule of Bayesian inference, used in probabilistic models, spam filters and much of machine learning."}],"refs":["Grinstead & Snell, Introduction to Probability","Blitzstein & Hwang, Introduction to Probability","Feller, An Introduction to Probability Theory and Its Applications, Vol. 1"],"status":null,"aliases":["probability","sample space","event","probability axioms","conditional probability","independence","law of total probability","Bayes' theorem","Bayes' rule"],"fields":["probability"],"stage":"school","np":{"textbook":5,"olympiad":8,"bridge":0,"research":0,"examples":0},"nprob":13,"lesson":{"minutes":20,"checks":9,"fixed":0}},{"id":"random-variables","band":"probability","title":"Random variables and expectation","short":"Expectation","pre":["probability-basics"],"sum":"A random variable is a number determined by the outcome of a random experiment; formally it is a function $X:\\Omega\\to\\mathbb R$ on a probability space. Its expectation $\\mathbb E[X]$ is the probability-weighted average of its values, and the one idea to remember is linearity: $\\mathbb E[X+Y]=\\mathbb E[X]+\\mathbb E[Y]$ always, even when $X$ and $Y$ are dependent.","key":["\\mathbb E[X]=\\sum_x x\\,\\Pr(X=x)","\\mathbb E[aX+bY]=a\\,\\mathbb E[X]+b\\,\\mathbb E[Y]","\\operatorname{Var}(X)=\\mathbb E\\big[(X-\\mathbb E X)^2\\big]=\\mathbb E[X^2]-(\\mathbb E[X])^2"],"why":"Writing a count as a sum of indicator variables turns hard counting problems into sums of easy probabilities. Expectation is also the language of fair prices, average running times of algorithms and the probabilistic method.","msc":[],"links":[{"field":"combinatorics","note":"Indicator variables and linearity of expectation count fixed points, records and monochromatic subgraphs, and drive the probabilistic method."},{"field":"computer-science","note":"Average-case running times of algorithms such as quicksort and hashing are expectations computed with indicators."}],"refs":["Blitzstein & Hwang, Introduction to Probability","Grimmett & Stirzaker, Probability and Random Processes","Feller, An Introduction to Probability Theory and Its Applications, Vol. 1"],"status":null,"aliases":["expected value","expectation","mean","linearity of expectation","indicator variable","variance","standard deviation"],"fields":["probability"],"stage":"school","np":{"textbook":5,"olympiad":12,"bridge":0,"research":0,"examples":0},"nprob":17,"lesson":{"minutes":18,"checks":9,"fixed":2}},{"id":"distributions","band":"probability","title":"Discrete and continuous distributions","short":"Distributions","pre":["random-variables","exp-log","riemann-integral"],"sum":"The distribution of a random variable records how its probability is spread over the real line: by a probability mass function for a discrete variable, by a density $f$ with $\\Pr(a\\le X\\le b)=\\int_a^b f$ for a continuous one, and by the distribution function $F_X(x)=\\Pr(X\\le x)$ in every case. A small family of named distributions (binomial, geometric, Poisson, uniform, exponential, normal) covers most models, and each comes from a simple mechanism.","key":["\\Pr(X=k)=\\binom nk p^k(1-p)^{n-k}\\ \\ \\text{(binomial)},\\qquad \\Pr(X=k)=e^{-\\lambda}\\frac{\\lambda^k}{k!}\\ \\ \\text{(Poisson)}","\\Pr(a\\le X\\le b)=\\int_a^b f(x)\\,dx,\\qquad \\mathbb E[X]=\\int_{-\\infty}^{\\infty} x f(x)\\,dx","f(x)=\\frac{1}{\\sigma\\sqrt{2\\pi}}\\,e^{-(x-\\mu)^2/(2\\sigma^2)}\\ \\ \\text{(normal } N(\\mu,\\sigma^2))"],"why":"Recognising the mechanism behind a random quantity (independent trials, rare events, memoryless waiting, sums of many small effects) tells you its distribution, and with it every probability you might want. Radioactive decay, queues, measurement errors and polling all run on these few families.","msc":["60E05"],"links":[{"field":"physics","note":"Radioactive decay times are exponential, counts of decays are Poisson, and the Maxwell velocity distribution is normal in each coordinate."},{"field":"computer-science","note":"Simulation software generates samples from a prescribed distribution by transforming uniform random numbers, for example by inverse transform sampling."},{"field":"number-theory","note":"Assuming a uniform form of the unproved Hardy–Littlewood prime tuples conjecture, Gallagher showed that the number of primes in $(n, n+\\lambda\\ln x]$, for $n\\le x$ chosen at random, tends to a Poisson distribution with mean $\\lambda$ as $x\\to\\infty$."}],"refs":["Ross, A First Course in Probability","Blitzstein & Hwang, Introduction to Probability","Grimmett & Stirzaker, Probability and Random Processes"],"status":null,"aliases":["probability distribution","probability mass function","probability density function","density","cumulative distribution function","CDF","binomial distribution","geometric distribution","Poisson distribution","uniform distribution","exponential distribution","normal distribution","Gaussian"],"fields":["probability"],"stage":"undergraduate","np":{"textbook":0,"olympiad":2,"bridge":0,"research":0,"examples":0},"nprob":2,"lesson":{"minutes":20,"checks":9,"fixed":1}},{"id":"limit-theorems","band":"probability","title":"The law of large numbers and the central limit theorem","short":"LLN & CLT","pre":["distributions","limits"],"sum":"Let $X_1, X_2, \\dots$ be independent with a common distribution of mean $\\mu$ and finite variance $\\sigma^2>0$, and let $S_n = X_1 + \\dots + X_n$. The law of large numbers says the average $\\bar X_n = S_n/n$ converges to $\\mu$; the central limit theorem says its fluctuations are of size $\\sigma/\\sqrt n$ and approximately normal, whatever the distribution of the $X_i$.","key":["\\Pr\\big(|\\bar X_n-\\mu|\\ge\\varepsilon\\big)\\le\\frac{\\sigma^2}{n\\varepsilon^2}\\longrightarrow 0","\\Pr\\Big(\\frac{S_n-n\\mu}{\\sigma\\sqrt n}\\le x\\Big)\\longrightarrow\\Phi(x)=\\frac1{\\sqrt{2\\pi}}\\int_{-\\infty}^x e^{-t^2/2}\\,dt"],"why":"They are why an average of many measurements can be trusted, why an opinion poll of $n$ people has a margin of error of about $1/\\sqrt n$, why Monte Carlo simulation works, and why the bell curve appears everywhere.","msc":["60F05","60F15"],"links":[{"field":"number-theory","note":"The Erdős–Kac theorem is a central limit theorem for the number of distinct prime factors of a random integer up to $x$, with mean and variance $\\ln\\ln x$."},{"field":"computer-science","note":"Monte Carlo estimates converge by the law of large numbers, with error of order $1/\\sqrt n$ by the central limit theorem."},{"field":"physics","note":"Diffusion and Brownian motion arise as the central limit of many small independent displacements."}],"refs":["Feller, An Introduction to Probability Theory and Its Applications, Vol. 1","Grimmett & Stirzaker, Probability and Random Processes","Durrett, Probability: Theory and Examples"],"status":null,"aliases":["law of large numbers","LLN","weak law","strong law","central limit theorem","CLT","Chebyshev's inequality","Markov's inequality","de Moivre–Laplace theorem","normal approximation","Berry–Esseen"],"fields":["probability"],"stage":"undergraduate","np":{"textbook":0,"olympiad":1,"bridge":1,"research":0,"examples":0},"nprob":2,"lesson":{"minutes":20,"checks":10,"fixed":3}},{"id":"markov-chains","band":"probability","title":"Markov chains","short":"Markov chains","pre":["random-variables","matrices"],"sum":"A Markov chain is a random process in which the next state depends only on the current state, through fixed transition probabilities $p_{ij}$ collected in a stochastic matrix $P$. The distribution after $n$ steps is $\\mu_0 P^n$, and if some power of $P$ has all entries positive, the chain forgets its starting point and converges to the unique stationary distribution $\\pi = \\pi P$.","key":["\\Pr(X_n=j\\mid X_0=i)=(P^n)_{ij}","\\pi P=\\pi,\\qquad \\pi_i\\ge 0,\\quad \\sum_i\\pi_i=1","h_i = 1+\\sum_j p_{ij}h_j\\quad (i\\notin A),\\qquad h_i=0\\quad (i\\in A)"],"why":"Markov chains model queues, genetics, board games and card shuffling, and they power PageRank and Markov chain Monte Carlo. Their long-run behaviour is an eigenvector problem and their waiting times solve linear systems.","msc":["60J10"],"links":[{"field":"computer-science","note":"PageRank is the stationary distribution of a random walk on the web graph, and Markov chain Monte Carlo samples from complicated distributions by running a chain."},{"field":"physics","note":"The Metropolis algorithm simulates statistical-mechanics models by a Markov chain whose stationary distribution is the Boltzmann distribution."},{"field":"combinatorics","note":"Random walks on graphs and card-shuffling chains connect mixing times to eigenvalues of graphs and to approximate counting."}],"refs":["Norris, Markov Chains","Levin, Peres & Wilmer, Markov Chains and Mixing Times","Grimmett & Stirzaker, Probability and Random Processes"],"status":null,"aliases":["Markov process","transition matrix","stochastic matrix","stationary distribution","invariant distribution","random walk","ergodic theorem","gambler's ruin","first-step analysis","hitting time"],"fields":["probability","linear-algebra"],"stage":"undergraduate","np":{"textbook":6,"olympiad":2,"bridge":0,"research":0,"examples":0},"nprob":8,"lesson":{"minutes":21,"checks":9,"fixed":0}},{"id":"primality","band":"computation","title":"Primality testing","short":"Primality testing","pre":["fermat-euler","quadratic-residues"],"sum":"The Fermat test fails on Carmichael numbers such as $561$. Miller–Rabin is fast and probabilistic; Agrawal, Kayal and Saxena (2002) gave the first deterministic polynomial-time test.","key":["a^{n-1} \\not\\equiv 1 \\pmod n \\ \\Longrightarrow\\ n \\text{ composite}"],"why":"Generating RSA keys requires finding large primes quickly.","msc":["11Y11"],"links":[{"field":"computer-science","note":"AKS answered a decades-old complexity question: PRIMES is in P."},{"field":"cryptography","note":"Key generation."}],"refs":["Crandall & Pomerance, Prime Numbers: A Computational Perspective"],"status":null,"aliases":["Miller-Rabin","AKS","Carmichael","pseudoprime"],"fields":["number-theory","computer-science"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"rsa","band":"computation","title":"RSA and public-key cryptography","short":"RSA","pre":["fermat-euler","crt","mod-inverse"],"sum":"Rivest, Shamir and Adleman (1977): publish $n = pq$ and $e$, keep $d = e^{-1} \\bmod \\varphi(n)$. Encryption is $c = m^e \\bmod n$ and decryption $m = c^d \\bmod n$. Security rests on the difficulty of factoring $n$.","key":["m^{ed} \\equiv m \\pmod n \\quad \\text{when } ed \\equiv 1 \\pmod{\\varphi(n)}"],"why":"Number theory in daily use, and the reason factoring is studied so intensely.","msc":["94A60","11Y05"],"links":[{"field":"cryptography","note":"The first widely deployed public-key system."},{"field":"quantum-computing","note":"Shor's algorithm (1994) would factor $n$ in polynomial time on a large quantum computer."}],"refs":["Crandall & Pomerance, Prime Numbers: A Computational Perspective"],"status":null,"aliases":["public key","factoring"],"fields":["cryptography","number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"discrete-log","band":"computation","title":"Discrete logarithms and Diffie–Hellman","short":"Discrete logarithm","pre":["order-primroot"],"sum":"Given a primitive root $g$ modulo $p$ and $h$, find $x$ with $g^x \\equiv h$. Diffie and Hellman (1976) used its difficulty for key exchange: Alice sends $g^a$, Bob $g^b$, both compute $g^{ab}$.","key":["g^x \\equiv h \\pmod p"],"why":"Baby-step giant-step solves it in about $\\sqrt p$ steps; nothing much faster is known for well-chosen groups.","msc":["94A60","11Y16"],"links":[{"field":"cryptography","note":"Diffie–Hellman key exchange."},{"field":"quantum-computing","note":"Shor's algorithm also computes discrete logarithms."}],"refs":["Crandall & Pomerance, Prime Numbers: A Computational Perspective"],"status":null,"aliases":["Diffie-Hellman","baby-step giant-step"],"fields":["cryptography","number-theory","computer-science"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0},{"id":"p-vs-np","band":"computation","title":"P versus NP","short":"P vs NP","pre":["graph-basics"],"sum":"Is every problem whose solutions can be checked in polynomial time also solvable in polynomial time? Most researchers expect $\\mathrm P \\ne \\mathrm{NP}$; known proof techniques (relativisation, natural proofs, algebrisation) provably cannot settle it.","key":["\\mathrm P \\overset{?}{=} \\mathrm{NP}"],"why":"A Millennium Prize Problem; modern cryptography assumes the answer is no.","msc":["68Q15"],"links":[{"field":"cryptography","note":"Public-key cryptography needs one-way functions, which require $\\mathrm P \\ne \\mathrm{NP}$."},{"field":"logic","note":"Descriptive complexity recasts the question in finite model theory."}],"refs":["Sipser, Introduction to the Theory of Computation","Carlson, Jaffe & Wiles (eds.), The Millennium Prize Problems"],"status":"open","aliases":["NP-complete","complexity","Cook–Levin","Millennium"],"fields":["computer-science","logic"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":0,"research":1,"examples":0},"nprob":1}],"events":[{"id":"plimpton","y":-1800,"label":"c. 1800 BC","title":"Plimpton 322","who":"Old Babylonian scribe","text":"A clay tablet listing Pythagorean triples.","nodes":["pythagorean"]},{"id":"euclid","y":-300,"label":"c. 300 BC","title":"Elements","who":"Euclid","text":"The Euclidean algorithm and the infinitude of primes.","nodes":["divisibility","fta"]},{"id":"sunzi","y":400,"label":"3rd–5th c.","title":"The remainder problem of the Sunzi Suanjing","who":"Sunzi","text":"Find a number leaving remainders $2, 3, 2$ on division by $3, 5, 7$: the origin of the Chinese remainder theorem.","nodes":["crt"]},{"id":"brahmagupta","y":628,"label":"628","title":"Brāhmasphuṭasiddhānta","who":"Brahmagupta","text":"Composition of solutions of $x^2 - dy^2 = k$.","nodes":["pell"]},{"id":"fermat-little","y":1640.8,"label":"1640","title":"Fermat's little theorem","who":"Pierre de Fermat","text":"Stated $a^{p-1} \\equiv 1 \\pmod p$ in a letter, without proof. In a December letter he also stated the two-squares theorem.","nodes":["fermat-euler","sums-of-squares"]},{"id":"gamma","y":1729,"label":"1729","title":"The gamma function","who":"Leonhard Euler","text":"Interpolated $n!$ to non-integers in letters to Goldbach.","nodes":["gamma"]},{"id":"basel","y":1735,"label":"1735","title":"The Basel problem: $\\zeta(2) = \\pi^2/6$","who":"Leonhard Euler","text":"Summed $\\sum 1/n^2$.","nodes":["series","zeta"]},{"id":"euler-product","y":1737,"label":"1737","title":"The Euler product","who":"Leonhard Euler","text":"$\\sum n^{-s} = \\prod_p (1-p^{-s})^{-1}$, and with it the divergence of $\\sum 1/p$.","nodes":["dirichlet-series","fta"]},{"id":"goldbach-letter","y":1742,"label":"1742","title":"Goldbach's letter to Euler","who":"Christian Goldbach","text":"Conjectured that every even number is a sum of two primes.","nodes":["goldbach"]},{"id":"euler-two-squares","y":1749,"label":"1749","title":"Proof of the two-squares theorem","who":"Leonhard Euler","text":"Proved that primes $p \\equiv 1 \\pmod 4$ are sums of two squares.","nodes":["sums-of-squares"]},{"id":"euler-totient","y":1763,"label":"1763","title":"Euler's theorem and the totient","who":"Leonhard Euler","text":"Generalised Fermat to $a^{\\varphi(n)} \\equiv 1 \\pmod n$.","nodes":["fermat-euler","arithmetic-functions"]},{"id":"lagrange-pell","y":1768,"label":"1768","title":"Pell's equation always solvable","who":"Joseph-Louis Lagrange","text":"Proved $x^2 - dy^2 = 1$ has a nontrivial solution for every non-square $d$.","nodes":["pell","continued-fractions"]},{"id":"lagrange-four","y":1770,"label":"1770","title":"Four squares; Waring's problem; Wilson's theorem","who":"Lagrange, Edward Waring","text":"Lagrange proved every integer is a sum of four squares. Waring's Meditationes Algebraicae stated the problem now named for him and published Wilson's theorem.","nodes":["waring","wilson","continued-fractions"]},{"id":"gauss-legendre","y":1792,"label":"1790s","title":"Conjecturing the prime number theorem","who":"Carl Friedrich Gauss, Adrien-Marie Legendre","text":"From tables, the density of primes near $x$ is about $1/\\log x$.","nodes":["pnt"]},{"id":"gauss-17","y":1796,"label":"1796","title":"The regular 17-gon","who":"Carl Friedrich Gauss","text":"Constructed it with ruler and compass using $\\mathbb Q(\\zeta_{17})$.","nodes":["cyclotomic"]},{"id":"disquisitiones","y":1801,"label":"1801","title":"Disquisitiones Arithmeticae","who":"Carl Friedrich Gauss","text":"Congruence notation, primitive roots, binary quadratic forms and the first complete proof of quadratic reciprocity.","nodes":["congruences","order-primroot","quadratic-residues","quadratic-forms"]},{"id":"fourier","y":1822,"label":"1822","title":"Théorie analytique de la chaleur","who":"Joseph Fourier","text":"Expanded functions in trigonometric series to solve the heat equation.","nodes":["fourier-poisson"]},{"id":"cauchy","y":1825,"label":"1825","title":"Cauchy's integral theorem","who":"Augustin-Louis Cauchy","text":"Founded complex contour integration, followed by the calculus of residues.","nodes":["holomorphic","residues"]},{"id":"mobius","y":1832,"label":"1832","title":"The Möbius function","who":"August Ferdinand Möbius","text":"Introduced $\\mu$ and the inversion formula.","nodes":["mobius"]},{"id":"dirichlet","y":1837,"label":"1837","title":"Primes in arithmetic progressions","who":"Peter Gustav Lejeune Dirichlet","text":"Introduced characters and $L$-functions and proved $L(1,\\chi) \\ne 0$.","nodes":["dirichlet-characters","l-functions"]},{"id":"class-number","y":1839,"label":"1839","title":"The class number formula","who":"Peter Gustav Lejeune Dirichlet","text":"Expressed $L(1,\\chi_D)$ through class numbers of quadratic forms.","nodes":["class-number-formula"]},{"id":"eisenstein","y":1844,"label":"1844","title":"Cubic reciprocity","who":"Gotthold Eisenstein","text":"Proved cubic reciprocity in $\\mathbb Z[\\omega]$.","nodes":["eisenstein-integers","cubic-characters"]},{"id":"lame","y":1844.5,"label":"1844","title":"Lamé's theorem","who":"Gabriel Lamé","text":"Bounded the number of steps of the Euclidean algorithm, an early complexity analysis.","nodes":["divisibility"]},{"id":"kummer","y":1847,"label":"1847","title":"Ideal numbers","who":"Ernst Kummer","text":"Restored unique factorization in cyclotomic rings with ideal numbers and proved Fermat's Last Theorem for regular primes.","nodes":["ideals","cyclotomic"]},{"id":"chebyshev","y":1850,"label":"1848–1850","title":"Chebyshev's estimates","who":"Pafnuty Chebyshev","text":"Showed $\\pi(x)\\log x / x$ stays between two constants.","nodes":["chebyshev","pnt"]},{"id":"riemann","y":1859,"label":"1859","title":"On the Number of Primes Less Than a Given Magnitude","who":"Bernhard Riemann","text":"Continued $\\zeta$ to the complex plane, proved the functional equation, linked zeros to primes and stated the Riemann hypothesis.","nodes":["zeta","continuation","functional-equation","nontrivial-zeros","explicit-formula","rh"]},{"id":"dedekind","y":1871,"label":"1871","title":"Ideals","who":"Richard Dedekind","text":"Defined ideals and proved unique factorization of ideals in rings of integers.","nodes":["ideals","dedekind-zeta"]},{"id":"mertens","y":1874,"label":"1874","title":"Mertens' theorems","who":"Franz Mertens","text":"Asymptotics for $\\sum 1/p$ and $\\prod (1-1/p)$.","nodes":["mertens"]},{"id":"lucas","y":1878,"label":"1878","title":"Lucas's theorem","who":"Édouard Lucas","text":"Binomial coefficients modulo a prime via base-$p$ digits.","nodes":["lucas"]},{"id":"mangoldt","y":1895,"label":"1895","title":"Proof of the explicit formula","who":"Hans von Mangoldt","text":"Proved Riemann's formula for $\\psi(x)$ as a sum over zeros.","nodes":["explicit-formula","chebyshev"]},{"id":"pnt-proof","y":1896,"label":"1896","title":"The prime number theorem","who":"Jacques Hadamard, Charles-Jean de la Vallée Poussin","text":"Proved $\\zeta(1+it) \\ne 0$ and hence $\\pi(x) \\sim x/\\log x$.","nodes":["pnt"]},{"id":"hensel","y":1897,"label":"1897","title":"p-adic numbers","who":"Kurt Hensel","text":"Introduced the $p$-adic numbers.","nodes":["hensel"]},{"id":"dlvp","y":1899,"label":"1899","title":"A zero-free region","who":"Charles-Jean de la Vallée Poussin","text":"No zeros in $\\sigma > 1 - c/\\log|t|$.","nodes":["zero-free-region"]},{"id":"lindelof","y":1908,"label":"1908","title":"The Lindelöf hypothesis","who":"Ernst Lindelöf","text":"Conjectured $\\zeta(\\tfrac12 + it) \\ll |t|^{\\varepsilon}$.","nodes":["lindelof"]},{"id":"hilbert-waring","y":1909,"label":"1909","title":"Waring's problem solved","who":"David Hilbert","text":"Proved that $g(k)$ is finite for every $k$.","nodes":["waring"]},{"id":"hardy","y":1914,"label":"1914","title":"Infinitely many zeros on the critical line","who":"G. H. Hardy","text":"Proved infinitely many zeros have real part $\\tfrac12$.","nodes":["nontrivial-zeros","rh"]},{"id":"weyl","y":1916,"label":"1916","title":"Equidistribution","who":"Hermann Weyl","text":"Proved $n^2\\alpha$ is equidistributed modulo 1 by differencing exponential sums.","nodes":["exponential-sums"]},{"id":"hecke","y":1918,"label":"1918","title":"Hecke L-functions","who":"Erich Hecke","text":"Defined $L$-functions of Größencharaktere and proved their functional equations.","nodes":["hecke-l"]},{"id":"brun","y":1919,"label":"1919","title":"Brun's theorem","who":"Viggo Brun","text":"The sum of reciprocals of twin primes converges.","nodes":["sieve-basics","twin-primes"]},{"id":"hardy-littlewood","y":1920,"label":"1920","title":"Partitio Numerorum","who":"G. H. Hardy, J. E. Littlewood","text":"Developed the circle method for Waring's problem and Goldbach.","nodes":["circle-method"]},{"id":"hasse","y":1933,"label":"1933","title":"The Hasse bound","who":"Helmut Hasse","text":"$|\\#E(\\mathbb F_p) - p - 1| \\le 2\\sqrt p$.","nodes":["elliptic-curves"]},{"id":"siegel","y":1935,"label":"1935","title":"Siegel's theorem","who":"Carl Ludwig Siegel","text":"Real exceptional zeros cannot be too close to $1$, with an ineffective constant.","nodes":["siegel-zeros","siegel-walfisz"]},{"id":"vinogradov","y":1937,"label":"1937","title":"Three primes","who":"I. M. Vinogradov","text":"Every sufficiently large odd number is a sum of three primes.","nodes":["ternary-goldbach"]},{"id":"linnik","y":1941,"label":"1941","title":"The large sieve","who":"Yuri Linnik","text":"Introduced the large sieve.","nodes":["large-sieve"]},{"id":"selberg","y":1947,"label":"1947","title":"The Selberg sieve","who":"Atle Selberg","text":"Optimised sieve weights by a quadratic form.","nodes":["selberg-sieve"]},{"id":"vk","y":1958,"label":"1958","title":"Vinogradov–Korobov zero-free region","who":"I. M. Vinogradov, N. M. Korobov","text":"The widest known zero-free region; it still shrinks with height.","nodes":["zero-free-region"]},{"id":"bv","y":1965,"label":"1965","title":"Bombieri–Vinogradov","who":"Enrico Bombieri, A. I. Vinogradov","text":"Primes in progressions on average over moduli up to $x^{1/2}$.","nodes":["bombieri-vinogradov"]},{"id":"montgomery","y":1973,"label":"1973","title":"Pair correlation of zeros","who":"Hugh Montgomery","text":"His conjectured spacing law matched random matrix statistics, as Freeman Dyson pointed out.","nodes":["pair-correlation"]},{"id":"dh","y":1976,"label":"1976","title":"New Directions in Cryptography","who":"Whitfield Diffie, Martin Hellman","text":"Public key exchange from discrete logarithms.","nodes":["discrete-log"]},{"id":"rsa","y":1977,"label":"1977","title":"RSA","who":"Ron Rivest, Adi Shamir, Leonard Adleman","text":"Public-key encryption based on factoring.","nodes":["rsa"]},{"id":"shor","y":1994,"label":"1994","title":"Shor's algorithm","who":"Peter Shor","text":"A quantum algorithm for factoring and discrete logarithms in polynomial time.","nodes":["rsa","discrete-log"]},{"id":"wiles","y":1995,"label":"1995","title":"Fermat's Last Theorem","who":"Andrew Wiles (with Richard Taylor)","text":"Proved via modularity of semistable elliptic curves.","nodes":["elliptic-curves"]},{"id":"clay","y":2000,"label":"2000","title":"Millennium Prize Problems","who":"Clay Mathematics Institute","tex     ["How long we keep it", "Until you delete your account. Deleting it from your account page removes your profile, posts, replies, votes and progress immediately; copies in the database provider's backups expire on its backup schedule."],
    ["Age", "You must be 14 or older to create an account."],
    ["Your rights", ["From your account page you can change your public name, download your data and delete your account. For anything else, contact ", contactLine(), "."]]
  ]);
}
function viewTerms() {
  return legal("Terms of Use", "23 October 2026", [
    ["Using the site", "Frontier Atlas is free to read. Lessons are written by AI and checked by a second AI and by computation; they can still contain errors. Problem statements come from the sources credited on each page."],

  ]);
}

/* ---------- boot: connect to the backend if configured ---------- */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); }); }
async function onSession(session) {
  const uid = session && session.user ? session.user.id : null;
  S.session = session || null;
  if (uid === S.uid && S.community === "on") return;
  S.uid = uid; S.myVotes = new Set();
  await loadMe();
  S.community = "on";
  document.getElementById("nav-review").hidden = !S.isAdmin;
  renderAcct();
  if (S.uid) { syncProgress(); const ids = Object.keys(S.posts); loadMyVotes(ids).then(refreshCommunity); }
  S.loads = {}; loadCounts().catch(() => {}); ensureSubmissions().then(refreshCommunity).catch(() => {}).finally(() => subsDone());
  refreshCommunity();
  if (["account", "review"].includes(S.route && S.route.name)) route();
}
let rtTimer = null;
function onRealtime(ev) {
  const row = ev.new && ev.new.id ? ev.new : ev.old || {};
  if (ev.eventType === "DELETE" && row.id) dropPost(row.id);
  clearTimeout(rtTimer);
  rtTimer = setTimeout(() => {
    const t = ev.new && ev.new.target;
    const jobs = [loadCounts()];
    if (t && S.loads["t:" + t]) jobs.push(ensureTarget(t, true));
    if (ev.new && ev.new.kind === "proposal" && S.loads.proposals) jobs.push(ensureProposals(true));
    if (ev.new && ev.new.kind === "problem") jobs.push(ensureSubmissions(true));
    if (ev.new && ev.new.parent && S.loads.proposals) jobs.push(ensureProposals(true));
    Promise.all(jobs.map(j => j.catch(() => {}))).then(refreshCommunity);
  }, 400);
}
async function connect() {
  const q = new URLSearchParams(location.search);
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey) { S.community = "off"; subsDone(); sbDone(); renderAcct(); refreshCommunity(); return; }
  renderAcct();
  try { if (!window.supabase) await loadScript("vendor/supabase-2.117.3.js"); }
  catch (e) { S.community = "off"; subsDone(); sbDone(); renderAcct(); refreshCommunity(); return; }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { flowType: "pkce", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
  const { data } = await S.sb.auth.getSession();
  if (q.has("code") || q.has("error")) {
    let back = ""; try { back = sessionStorage.getItem(RETURN_KEY) || ""; sessionStorage.removeItem(RETURN_KEY); } catch (e) {}
    history.replaceState(null, "", location.pathname + (back || location.hash));
    if (q.has("error")) toast("Sign-in was cancelled or failed.");
    if (back) route();
  }
  await onSession(data && data.session);
  sbDone();
  S.sb.auth.onAuthStateChange((event, session) => { setTimeout(() => onSession(session), 0); });
  S.sb.channel("posts").on("postgres_changes", { event: "*", schema: "public", table: "posts" }, onRealtime).subscribe();
}

/* ---------- boot ---------- */
route();
connect();

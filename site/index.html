u_2\\!\\binom{m+n}{m} = \\#\\{\\text{carries when adding } m,n \\text{ in base } 2\\}"],"why":"Digit problems test whether you can translate a statement about writing into a statement about arithmetic.","msc":["11A63"],"links":[{"field":"computer-science","note":"Base-$2$ representations are machine arithmetic; carries and digit sums govern algorithms from addition to the Fast Fourier Transform."}],"refs":["Niven, Zuckerman & Montgomery, An Introduction to the Theory of Numbers","Andreescu, Andrica & Feng, 104 Number Theory Problems"],"status":null,"aliases":["digit sum","decimal digits","binary"],"fields":["number-theory"],"stage":"school","np":{"textbook":2,"olympiad":5,"bridge":0,"research":3,"examples":0},"nprob":7,"lesson":{"minutes":16,"checks":12,"fixed":0}},{"id":"vieta-jumping","band":"foundations","title":"Vieta jumping","short":"Vieta jumping","pre":["diophantine","polynomials-roots"],"sum":"For a symmetric quadratic condition such as $a^2+b^2 = k(ab+1)$, the second root $a' = kb - a$ of the quadratic in $a$ is again an integer. Replacing $(a,b)$ by $(a',b)$ gives a descent that must end at a small solution.","key":["a + a' = kb,\\qquad a a' = b^2 - k"],"why":"It is the elementary shadow of the action of an automorphism group on the integer points of a conic, the same structure behind Markov numbers.","msc":["11D09"],"links":[{"field":"algebra","note":"The move is a reflection in the automorphism group of a binary quadratic form."},{"field":"geometry","note":"Each jump moves between integer points on a hyperbola."}],"refs":["Andreescu, Andrica & Feng, 104 Number Theory Problems","Engel, Problem-Solving Strategies"],"status":null,"aliases":["root flipping","descent"],"fields":["number-theory","algebra"],"stage":"olympiad","np":{"textbook":0,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":5,"lesson":{"minutes":17,"checks":12,"fixed":0}},{"id":"lte-zsigmondy","band":"foundations","title":"Lifting the exponent and Zsigmondy's theorem","short":"LTE & Zsigmondy","pre":["p-adic-valuation","order-primroot"],"sum":"For an odd prime $p \\mid a-b$, $p \\nmid ab$, the lifting-the-exponent lemma gives $\\nu_p(a^n-b^n)$ exactly. Zsigmondy's theorem says $a^n-b^n$ has a prime factor not dividing any earlier $a^k-b^k$, with a short list of exceptions.","key":["\\nu_p(a^n - b^n) = \\nu_p(a-b) + \\nu_p(n)","\\text{exceptions: } 2^6-1,\\ \\ n=2,\\ a+b=2^k"],"why":"Together they settle almost any problem of the form $n^k \\mid a^n \\pm 1$.","msc":["11A41","11A51"],"links":[{"field":"algebra","note":"Primitive prime divisors of $a^n-b^n$ are primes $p$ for which $a/b$ has order exactly $n$ modulo $p$, so Zsigmondy is a statement about cyclotomic polynomials."}],"refs":["Andreescu, Andrica & Feng, 104 Number Theory Problems"],"status":null,"aliases":["LTE","primitive prime divisor","Bang"],"fields":["number-theory"],"stage":"olympiad","np":{"textbook":0,"olympiad":4,"bridge":0,"research":0,"examples":0},"nprob":4,"lesson":{"minutes":18,"checks":16,"fixed":2}},{"id":"binomial-factorial","band":"foundations","title":"Primes in factorials and binomial coefficients","short":"Factorials & binomials","pre":["p-adic-valuation"],"sum":"Legendre's formula gives the exponent of $p$ in $n!$; Kummer's theorem says the exponent of $p$ in $\\binom{m+n}{m}$ is the number of carries when $m$ and $n$ are added in base $p$.","key":["\\nu_p(n!) = \\sum_{k\\ge1}\\left\\lfloor \\frac{n}{p^k}\\right\\rfloor = \\frac{n - s_p(n)}{p-1}"],"why":"Integrality of factorial ratios, Chebyshev's bounds for primes and many Erdős problems all start here.","msc":["11B65","05A10"],"links":[{"field":"combinatorics","note":"Binomial coefficients count subsets; their arithmetic is a meeting point of the two subjects."}],"refs":["Niven, Zuckerman & Montgomery, An Introduction to the Theory of Numbers","Erdős & Graham, Old and New Problems and Results in Combinatorial Number Theory"],"status":null,"aliases":["Legendre's formula","Kummer's theorem","central binomial coefficient"],"fields":["number-theory","combinatorics"],"stage":"olympiad","np":{"textbook":0,"olympiad":5,"bridge":0,"research":31,"examples":0},"nprob":5,"lesson":{"minutes":17,"checks":14,"fixed":0}},{"id":"integer-polynomials","band":"foundations","title":"Polynomials with integer coefficients","short":"Integer polynomials","pre":["divisibility","congruences"],"sum":"For $P \\in \\mathbb Z[x]$, $a-b \\mid P(a)-P(b)$. This single fact, with factorisation, Gauss's lemma and the behaviour of roots modulo primes, drives most olympiad polynomial problems.","key":["a - b \\mid P(a) - P(b)","\\#\\{t : P^{(k)}(t)=t\\} \\le \\deg P \\ \\ (\\deg P>1)"],"why":"Polynomials are where algebra and number theory first share problems; the prime divisors of $P(n)$ lead to Chebotarev's density theorem.","msc":["11C08","12D05"],"links":[{"field":"algebra","note":"Irreducibility criteria and Gauss's lemma are ring theory in $\\mathbb Z[x]$."}],"refs":["Andreescu, Andrica & Feng, 104 Number Theory Problems"],"status":null,"aliases":["polynomial","Schur's theorem on prime divisors"],"fields":["number-theory","algebra"],"stage":"olympiad","np":{"textbook":0,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":5,"lesson":{"minutes":17,"checks":14,"fixed":0}},{"id":"integer-functional-eq","band":"foundations","title":"Functional equations on the integers","short":"Integer functional equations","pre":["divisibility","fta"],"sum":"Find all $f:\\mathbb Z\\to\\mathbb Z$ (or on $\\mathbb N$, $\\mathbb Q^+$) with a divisibility or multiplicative condition. Typical moves are plugging in primes, comparing valuations and proving $f$ is multiplicative.","key":["f(m)-f(n) \\text{ divisible by } f(m-n)"],"why":"They train the habit of extracting structure from a single identity, which is how characters and multiplicative functions are classified.","msc":["39B52","11A25"],"links":[{"field":"algebra","note":"Solutions are often group homomorphisms, for example from $(\\mathbb Q^+,\\times)$ to itself."}],"refs":["Engel, Problem-Solving Strategies"],"status":null,"aliases":["functional equation","bonza"],"fields":["number-theory","algebra"],"stage":"olympiad","np":{"textbook":0,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":5,"lesson":{"minutes":15,"checks":11,"fixed":0}},{"id":"asymptotics","band":"analytic","title":"Asymptotic notation","short":"Asymptotics","pre":["series","limits"],"sum":"$f = O(g)$ and $f \\ll g$ mean $|f| \\le Cg$ for some constant $C$ and all sufficiently large $x$ (or all $x$ in a stated range); $f \\sim g$ means $f/g \\to 1$ and $f = o(g)$ means $f/g \\to 0$, as $x \\to \\infty$. Number theory statements are mostly sharp asymptotics with error terms.","key":["\\pi(x) \\sim \\frac{x}{\\log x}, \\qquad \\sum_{n \\le x} \\frac1n = \\log x + \\gamma + O\\!\\left(\\frac1x\\right)"],"why":"Reading and comparing error terms is most of the skill in analytic number theory.","msc":[],"links":[],"refs":["Apostol, Introduction to Analytic Number Theory","Montgomery & Vaughan, Multiplicative Number Theory I"],"status":null,"aliases":["big O","little o","Vinogradov notation"],"fields":["real-analysis","number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":10,"fixed":2}},{"id":"partial-summation","band":"analytic","title":"Abel summation and Euler–Maclaurin","short":"Partial summation","pre":["asymptotics","riemann-integral"],"sum":"Abel summation converts a sum $\\sum a_n f(n)$ into an integral against the partial sums $A(t)=\\sum_{n\\le t} a_n$. Euler–Maclaurin compares $\\sum f(n)$ with $\\int f$ and gives constants such as Euler's $\\gamma$.","key":["\\sum_{n \\le x} a_n f(n) = A(x) f(x) - \\int_1^x A(t)\\, f'(t)\\, dt \\quad (x \\ge 1,\\ f \\in C^1[1,x])"],"why":"It moves information between counting primes and weighting them by $\\log p$.","msc":[],"links":[],"refs":["Apostol, Introduction to Analytic Number Theory"],"status":null,"aliases":["Abel summation","Euler-Maclaurin","Euler constant"],"fields":["real-analysis","number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":24,"checks":12,"fixed":3}},{"id":"mellin","band":"analytic","title":"The Mellin transform and Perron's formula","short":"Mellin transform","pre":["gamma","residues"],"sum":"The Mellin transform $\\int_0^\\infty f(x)\\,x^{s-1}\\,dx$ moves between functions of $x$ and Dirichlet-series-like functions of $s$. Perron's formula recovers partial sums $\\sum_{n \\le x} a_n$ from $\\sum a_n n^{-s}$ by a contour integral.","key":["\\sum_{n \\le x} a_n = \\frac{1}{2\\pi i}\\int_{c - i\\infty}^{c+i\\infty} \\Bigl(\\sum_n \\frac{a_n}{n^s}\\Bigr) \\frac{x^s}{s}\\, ds \\qquad (c > \\max(0,\\sigma_a),\\ x \\notin \\mathbb Z)"],"why":"The 2026 quasi-RH manuscript lists a Mellin continuation as a key step.","msc":[],"links":[{"field":"harmonic-analysis","note":"The Fourier transform on the multiplicative group $(0,\\infty)$."}],"refs":["Apostol, Introduction to Analytic Number Theory","Montgomery & Vaughan, Multiplicative Number Theory I"],"status":null,"aliases":["Perron formula"],"fields":["harmonic-analysis","complex-analysis"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":7,"fixed":0}},{"id":"dirichlet-series","band":"analytic","title":"Dirichlet series and Euler products","short":"Euler products","pre":["series","mobius","fta"],"sum":"Series $\\sum a_n n^{-s}$. When $a_n$ is multiplicative the series factors over primes; for $a_n = 1$ this is Euler's 1737 product, an analytic restatement of unique factorization.","key":["\\sum_{n \\ge 1}\\frac{1}{n^s} = \\prod_p \\frac{1}{1 - p^{-s}} \\qquad (\\operatorname{Re} s > 1)"],"why":"The product shows $\\sum 1/p$ diverges and ties primes to the poles and zeros of a function.","msc":["30B50","11M41"],"links":[{"field":"probability","note":"$\\prod_p (1 - p^{-2}) = 6/\\pi^2$ is the probability that a random integer is squarefree."}],"refs":["Apostol, Introduction to Analytic Number Theory"],"status":null,"aliases":["Euler product"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":18,"checks":7,"fixed":0}},{"id":"zeta","band":"analytic","title":"The Riemann zeta function","short":"Zeta function","pre":["dirichlet-series","continuation","gamma"],"sum":"$\\zeta(s) = \\sum n^{-s}$ for $\\operatorname{Re}s > 1$ continues to all of $\\mathbb C$ except a simple pole at $s = 1$. Euler found $\\zeta(2) = \\pi^2/6$ in 1735; Riemann's 1859 paper made $\\zeta$ a function of a complex variable.","key":["\\zeta(2k) = \\frac{(-1)^{k+1} B_{2k} (2\\pi)^{2k}}{2\\,(2k)!}, \\qquad \\zeta(-n) = -\\frac{B_{n+1}}{n+1} \\quad (n \\ge 1)"],"why":"Its zeros encode the primes.","msc":["11M06"],"links":[{"field":"physics","note":"Zeta regularization in quantum field theory and string theory."},{"field":"special-functions","note":"Values at integers are Bernoulli numbers and powers of $\\pi$."}],"refs":["Titchmarsh, The Theory of the Riemann Zeta-Function","Edwards, Riemann's Zeta Function"],"status":null,"aliases":["Riemann zeta","Bernoulli numbers","Basel problem"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":10,"fixed":1}},{"id":"functional-equation","band":"analytic","title":"Functional equation and trivial zeros","short":"Functional equation","pre":["zeta","fourier-poisson","mellin"],"sum":"The completed function $\\xi(s) = \\tfrac12 s(s-1)\\pi^{-s/2}\\Gamma(s/2)\\zeta(s)$ satisfies $\\xi(s) = \\xi(1-s)$. So nontrivial zeros are symmetric about $\\operatorname{Re}s = \\tfrac12$, and $\\zeta$ has trivial zeros at $-2, -4, -6, \\dots$.","key":["\\xi(s) = \\xi(1-s)"],"why":"Symmetry means any zero-free region near $\\operatorname{Re}s=1$ gives one near $\\operatorname{Re}s=0$.","msc":["11M06"],"links":[],"refs":["Titchmarsh, The Theory of the Riemann Zeta-Function","Davenport, Multiplicative Number Theory"],"status":null,"aliases":["xi function","trivial zeros"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":10,"fixed":0}},{"id":"chebyshev","band":"analytic","title":"Chebyshev and von Mangoldt functions","short":"Chebyshev functions","pre":["arithmetic-functions","partial-summation"],"sum":"$\\Lambda(n) = \\log p$ if $n = p^k$ and $0$ otherwise; $\\psi(x) = \\sum_{n \\le x} \\Lambda(n)$ counts primes with weight $\\log p$. Chebyshev (1848–1850) showed $\\psi(x) \\asymp x$.","key":["\\psi(x) = \\sum_{n \\le x} \\Lambda(n) = \\log \\operatorname{lcm}(1, 2, \\dots, \\lfloor x \\rfloor)","-\\frac{\\zeta'(s)}{\\zeta(s)} = \\sum_{n \\ge 1} \\frac{\\Lambda(n)}{n^s}"],"why":"$\\psi$ is the natural prime-counting function for analysis: the prime number theorem is $\\psi(x) \\sim x$.","msc":["11N05"],"links":[],"refs":["Apostol, Introduction to Analytic Number Theory","Davenport, Multiplicative Number Theory"],"status":null,"aliases":["von Mangoldt","psi function","theta function primes"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":18,"checks":9,"fixed":0}},{"id":"mertens","band":"analytic","title":"Mertens' theorems","short":"Mertens' theorems","pre":["chebyshev"],"sum":"Mertens (1874) proved $\\sum_{p \\le x} \\frac{\\log p}{p} = \\log x + O(1)$, $\\sum_{p\\le x}\\frac1p = \\log\\log x + M + o(1)$, and $\\prod_{p \\le x}(1 - 1/p) \\sim e^{-\\gamma}/\\log x$, all without the prime number theorem.","key":["\\prod_{p \\le x}\\Bigl(1 - \\frac1p\\Bigr) \\sim \\frac{e^{-\\gamma}}{\\log x}"],"why":"These are the estimates sieve methods start from.","msc":["11N05"],"links":[],"refs":["Montgomery & Vaughan, Multiplicative Number Theory I","Apostol, Introduction to Analytic Number Theory"],"status":null,"aliases":["Meissel-Mertens constant"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":9,"fixed":0}},{"id":"pnt","band":"analytic","title":"The prime number theorem","short":"Prime number theorem","pre":["chebyshev","zeta","residues","mellin"],"sum":"$\\pi(x) \\sim x/\\log x$, conjectured by Gauss and Legendre in the 1790s and proved in 1896 by Hadamard and de la Vallée Poussin. The key step is that $\\zeta(1+it) \\ne 0$.","key":["\\pi(x) \\sim \\operatorname{li}(x) = \\int_2^x \\frac{dt}{\\log t}"],"why":"The size of the error $\\pi(x) - \\operatorname{li}(x)$ is controlled by the zeros of $\\zeta$.","msc":["11N05"],"links":[],"refs":["Apostol, Introduction to Analytic Number Theory","Davenport, Multiplicative Number Theory"],"status":null,"aliases":["PNT","prime counting function"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":8,"fixed":0}},{"id":"nontrivial-zeros","band":"analytic","title":"Nontrivial zeros and the Riemann–von Mangoldt formula","short":"Nontrivial zeros","pre":["functional-equation","residues"],"sum":"Zeros in the critical strip $0 < \\operatorname{Re}s < 1$ are the nontrivial zeros. The number with $0 < \\operatorname{Im} s \\le T$ is $N(T) = \\frac{T}{2\\pi}\\log\\frac{T}{2\\pi e} + O(\\log T)$. The first is $\\tfrac12 + 14.134725\\ldots\\,i$.","key":["N(T) = \\frac{T}{2\\pi}\\log\\frac{T}{2\\pi e} + \\frac78 + O(\\log T)"],"why":"Hardy (1914) showed infinitely many lie on the critical line.","msc":["11M26"],"links":[{"field":"computer-science","note":"Large-scale computations have checked that the first $10^{13}$ zeros lie on the line."}],"refs":["Titchmarsh, The Theory of the Riemann Zeta-Function","Edwards, Riemann's Zeta Function"],"status":null,"aliases":["critical strip","critical line","N(T)"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":1,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":9,"fixed":2}},{"id":"explicit-formula","band":"analytic","title":"The explicit formula","short":"Explicit formula","pre":["nontrivial-zeros","chebyshev","mellin"],"sum":"Riemann's explicit formula, proved by von Mangoldt in 1895, has a cleaner version that writes $\\psi(x)$ exactly as a sum over the zeros $\\rho$. A zero $\\rho = \\beta + i\\gamma$ contributes a term of size $x^{\\beta}/|\\rho|$.","key":["\\psi_0(x) = x - \\sum_{\\rho} \\frac{x^{\\rho}}{\\rho} - \\log 2\\pi - \\tfrac12 \\log\\bigl(1 - x^{-2}\\bigr)"],"why":"It is why every statement about zeros is a statement about primes.","msc":["11M26","11N05"],"links":[{"field":"harmonic-analysis","note":"Primes and zeros are dual, like a function and its Fourier transform."}],"refs":["Davenport, Multiplicative Number Theory","Montgomery & Vaughan, Multiplicative Number Theory I"],"status":null,"aliases":["von Mangoldt formula","Riemann explicit formula"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":9,"fixed":1}},{"id":"zero-free-region","band":"analytic","title":"Zero-free regions","short":"Zero-free regions","pre":["explicit-formula","pnt"],"sum":"Regions near $\\operatorname{Re}s=1$ with no zeros. De la Vallée Poussin (1899) found $\\sigma > 1 - c/\\log|t|$, and Vinogradov and Korobov (1958) a wider region, but in all of them the width shrinks to $0$ as $|t| \\to \\infty$. The classical proof uses $3 + 4\\cos\\theta + \\cos 2\\theta \\ge 0$.","key":["\\sigma > 1 - \\frac{c}{\\log |t|}","3 + 4\\cos\\theta + \\cos 2\\theta = 2(1+\\cos\\theta)^2 \\ge 0"],"why":"The width of the zero-free region is exactly the strength of the prime number theorem's error term.","msc":["11M26"],"links":[],"refs":["Davenport, Multiplicative Number Theory","Montgomery & Vaughan, Multiplicative Number Theory I","Titchmarsh, The Theory of the Riemann Zeta-Function"],"status":null,"aliases":["de la Vallee Poussin","Vinogradov-Korobov"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":7,"fixed":0}},{"id":"dirichlet-characters","band":"analytic","title":"Dirichlet characters","short":"Dirichlet characters","pre":["order-primroot","arithmetic-functions","crt"],"sum":"Homomorphisms $\\chi: (\\mathbb Z/q\\mathbb Z)^\\times \\to \\mathbb C^\\times$, extended by $0$. There are $\\varphi(q)$ of them, and orthogonality isolates a residue class. A character is primitive if it is not induced from a smaller modulus.","key":["\\frac{1}{\\varphi(q)}\\sum_{\\chi \\bmod q} \\overline{\\chi}(a)\\,\\chi(n) = \\begin{cases} 1 & n \\equiv a \\pmod q \\\\ 0 & \\text{otherwise}\\end{cases} \\qquad (\\gcd(a,q)=1)"],"why":"Characters are how one picks out primes in a single arithmetic progression.","msc":[],"links":[{"field":"algebra","note":"Characters of a finite abelian group; the simplest case of harmonic analysis on groups."}],"refs":["Davenport, Multiplicative Number Theory","Ireland & Rosen, A Classical Introduction to Modern Number Theory"],"status":null,"aliases":["character","primitive character","conductor"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":9,"fixed":1}},{"id":"gauss-sums","band":"analytic","title":"Gauss sums","short":"Gauss sums","pre":["dirichlet-characters"],"sum":"$g(\\chi) = \\sum_{a \\bmod q} \\chi(a) e^{2\\pi i a/q}$. For primitive $\\chi$, $|g(\\chi)| = \\sqrt q$. For the quadratic character modulo an odd prime $p$, $g^2 = \\left(\\frac{-1}{p}\\right) p$, which gives a proof of quadratic reciprocity.","key":["|g(\\chi)|^2 = q \\quad (\\chi \\text{ primitive mod } q)"],"why":"Gauss sums connect multiplicative characters to additive ones and appear in every functional equation of an $L$-function.","msc":["11L05"],"links":[{"field":"harmonic-analysis","note":"A finite Fourier transform of a character."}],"refs":["Ireland & Rosen, A Classical Introduction to Modern Number Theory","Davenport, Multiplicative Number Theory"],"status":null,"aliases":["quadratic Gauss sum"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":9,"fixed":0}},{"id":"l-functions","band":"analytic","title":"Dirichlet L-functions and primes in progressions","short":"Dirichlet L-functions","pre":["dirichlet-characters","dirichlet-series","zeta"],"sum":"$L(s,\\chi) = \\sum \\chi(n) n^{-s} = \\prod_p (1-\\chi(p)p^{-s})^{-1}$. Dirichlet (1837) proved $L(1,\\chi) \\ne 0$ for $\\chi \\ne \\chi_0$, so every progression $a \\bmod q$ with $\\gcd(a,q)=1$ has infinitely many primes.","key":["\\sum_{\\substack{p \\le x \\\\ p \\equiv a \\ (q)}} \\frac{1}{p} = \\frac{1}{\\varphi(q)} \\log\\log x + O(1), \\qquad \\gcd(a,q)=1"],"why":"The template for every later $L$-function.","msc":["11M06","11N13"],"links":[],"refs":["Davenport, Multiplicative Number Theory","Apostol, Introduction to Analytic Number Theory"],"status":null,"aliases":["Dirichlet theorem","arithmetic progressions"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":9,"fixed":0}},{"id":"class-number-formula","band":"analytic","title":"Dirichlet's class number formula","short":"Class number formula","pre":["l-functions","quadratic-forms"],"sum":"Dirichlet (1839) expressed $L(1,\\chi_D)$ through the class number of forms of discriminant $D$. For $D < -4$, $L(1,\\chi_D) = \\pi h(D)/\\sqrt{|D|}$.","key":["L(1, \\chi_D) = \\frac{2\\pi\\, h(D)}{w \\sqrt{|D|}} \\quad (D < 0)"],"why":"It turns the non-vanishing of $L(1,\\chi)$ into the positivity of a class number, and links Siegel zeros to small class numbers.","msc":["11R29"],"links":[{"field":"algebra","note":"Class numbers of imaginary quadratic fields."}],"refs":["Davenport, Multiplicative Number Theory","Cox, Primes of the Form x² + ny²"],"status":null,"aliases":["analytic class number formula"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":11,"fixed":0}},{"id":"siegel-zeros","band":"analytic","title":"Siegel zeros and the Landau–Siegel problem","short":"Siegel zeros","pre":["l-functions","zero-free-region","class-number-formula"],"sum":"A real character $\\chi$ might have $L(\\beta,\\chi) = 0$ with $\\beta$ extremely close to $1$. Siegel (1935) proved $1 - \\beta \\gg_\\varepsilon q^{-\\varepsilon}$, but the constant cannot be computed. Excluding such zeros is a central open problem; a 2026 exclusion is so far only a claim.","key":["1 - \\beta \\;\\gg_\\varepsilon\\; q^{-\\varepsilon}"],"why":"A Siegel zero would make primes unevenly spread among residue classes and class numbers unexpectedly small.","msc":["11M20"],"links":[],"refs":["Davenport, Multiplicative Number Theory","Iwaniec & Kowalski, Analytic Number Theory"],"status":null,"aliases":["exceptional zero","Landau-Siegel","Siegel theorem"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":7,"fixed":2}},{"id":"siegel-walfisz","band":"analytic","title":"The Siegel–Walfisz theorem","short":"Siegel–Walfisz","pre":["siegel-zeros","explicit-formula"],"sum":"For any fixed $A$, primes up to $x$ split evenly among residue classes modulo $q \\le (\\log x)^A$, with error $O(x e^{-c\\sqrt{\\log x}})$. The constant is ineffective because it relies on Siegel's theorem.","key":["\\psi(x; q, a) = \\frac{x}{\\varphi(q)} + O_A\\!\\bigl(x\\, e^{-c\\sqrt{\\log x}}\\bigr), \\quad q \\le (\\log x)^A,\\ \\gcd(a,q)=1"],"why":"It is the input for Vinogradov's three-primes theorem and for Bombieri–Vinogradov.","msc":["11N13"],"links":[],"refs":["Davenport, Multiplicative Number Theory","Iwaniec & Kowalski, Analytic Number Theory"],"status":null,"aliases":[],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":5,"fixed":0}},{"id":"sieve-basics","band":"analytic","title":"Sieves from Eratosthenes to Brun","short":"Elementary sieves","pre":["mobius","mertens"],"sum":"The sieve of Eratosthenes, written with inclusion–exclusion, is the Legendre identity. Brun (1919) truncated it and proved $\\sum 1/p$ over twin primes converges, the first result on twin primes.","key":["\\pi(x) - \\pi(\\sqrt x) + 1 = \\sum_{d \\mid P(\\sqrt x)} \\mu(d) \\Bigl\\lfloor \\frac{x}{d} \\Bigr\\rfloor"],"why":"Sieves estimate how many integers survive after removing residue classes, which is the right question for twin primes and Goldbach.","msc":["11N35"],"links":[{"field":"combinatorics","note":"Inclusion–exclusion with truncation."},{"field":"computer-science","note":"The sieve of Eratosthenes is still the fastest way to list primes up to a bound."}],"refs":["Friedlander & Iwaniec, Opera de Cribro","Montgomery & Vaughan, Multiplicative Number Theory I"],"status":null,"aliases":["Eratosthenes","Brun sieve","Legendre identity"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":9,"fixed":0}},{"id":"selberg-sieve","band":"analytic","title":"The Selberg sieve","short":"Selberg sieve","pre":["sieve-basics"],"sum":"Selberg (1947) replaced $\\mu(d)$ by weights $\\lambda_d$ chosen to minimise a quadratic form, giving sharp upper bounds such as $\\pi(x+y) - \\pi(x) \\le (2+o(1))\\,y/\\log y$.","key":["\\sum_{n \\le x}\\Bigl(\\sum_{d \\mid n} \\lambda_d\\Bigr)^2, \\qquad \\lambda_1 = 1"],"why":"The same idea, applied with many linear forms at once, is the engine of Maynard's 2013 proof of bounded gaps.","msc":["11N35"],"links":[],"refs":["Friedlander & Iwaniec, Opera de Cribro"],"status":null,"aliases":["Lambda squared sieve"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":7,"fixed":1}},{"id":"large-sieve","band":"analytic","title":"The large sieve","short":"Large sieve","pre":["gauss-sums","fourier-poisson"],"sum":"An inequality bounding a trigonometric polynomial at well-spaced points (Linnik, 1941). With characters it says no sequence can be badly distributed in many residue classes at once.","key":["\\sum_{q \\le Q}\\ \\sum_{\\substack{a \\bmod q \\\\ (a,q)=1}} \\Bigl|\\sum_{n \\le N} a_n e\\!\\left(\\tfrac{an}{q}\\right)\\Bigr|^2 \\le (N + Q^2)\\sum_n |a_n|^2"],"why":"The key input of Bombieri–Vinogradov.","msc":["11N35"],"links":[{"field":"harmonic-analysis","note":"A dual form of Bessel's inequality for almost-orthogonal vectors."}],"refs":["Iwaniec & Kowalski, Analytic Number Theory","Montgomery & Vaughan, Multiplicative Number Theory I"],"status":null,"aliases":[],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":9,"fixed":0}},{"id":"bombieri-vinogradov","band":"analytic","title":"The Bombieri–Vinogradov theorem","short":"Bombieri–Vinogradov","pre":["large-sieve","siegel-walfisz"],"sum":"Primes are well distributed in residue classes on average over moduli $q \\le x^{1/2}/(\\log x)^B$, as strong as GRH would give on average. Proved by Bombieri and by A. I. Vinogradov in 1965.","key":["\\sum_{q \\le Q}\\ \\max_{(a,q)=1} \\Bigl|\\psi(x;q,a) - \\frac{x}{\\varphi(q)}\\Bigr| \\ll_A \\frac{x}{(\\log x)^A}, \\qquad Q = x^{1/2}(\\log x)^{-B(A)}"],"why":"Level of distribution $1/2$; Zhang's 2013 breakthrough went slightly past it for smooth moduli.","msc":["11N13"],"links":[],"refs":["Iwaniec & Kowalski, Analytic Number Theory","Davenport, Multiplicative Number Theory"],"status":null,"aliases":["level of distribution"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":8,"fixed":1}},{"id":"bounded-gaps","band":"analytic","title":"Bounded gaps between primes","short":"Bounded prime gaps","pre":["bombieri-vinogradov","selberg-sieve","prime-patterns"],"sum":"Zhang (2013) proved $\\liminf (p_{n+1} - p_n) < 7 \\times 10^7$. Maynard (late 2013) gave a simpler multidimensional sieve, and the Polymath8 project brought the bound to $246$.","key":["\\liminf_{n\\to\\infty} (p_{n+1} - p_n) \\le 246"],"why":"The twin prime conjecture asks for $2$.","msc":["11N05"],"links":[{"field":"formal-verification","note":"In August 2026 AxiomProver was reported to have formally verified the proof of the bound 246."},{"field":"ai-research","note":"Polymath8 was a large open online collaboration, a precedent for community research."}],"refs":["Friedlander & Iwaniec, Opera de Cribro"],"status":null,"aliases":["Zhang","Maynard","Polymath8","246"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":7,"fixed":2}},{"id":"exponential-sums","band":"analytic","title":"Exponential sums and Weyl differencing","short":"Exponential sums","pre":["fourier-poisson","congruences"],"sum":"Sums $\\sum e(f(n))$ with $e(x) = e^{2\\pi i x}$. Weyl (1916) showed $n^2\\alpha$ is equidistributed modulo $1$ for irrational $\\alpha$ by squaring the sum (differencing). Complete sums such as $\\sum_{n \\bmod p} e(n^2/p)$ for an odd prime $p$ have size exactly $\\sqrt p$.","key":["\\Bigl|\\sum_{n=0}^{p-1} e\\!\\left(\\frac{n^2}{p}\\right)\\Bigr| = \\sqrt p \\quad (p \\text{ an odd prime})"],"why":"Cancellation in exponential sums is the currency of the circle method and of subconvexity.","msc":["11L07"],"links":[{"field":"dynamics","note":"Weyl's equidistribution theorem is an early ergodic result."},{"field":"harmonic-analysis","note":"Oscillatory sums and van der Corput estimates."}],"refs":["Iwaniec & Kowalski, Analytic Number Theory","Vaughan, The Hardy–Littlewood Method"],"status":null,"aliases":["Weyl sums","equidistribution"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":9,"fixed":0}},{"id":"circle-method","band":"analytic","title":"The Hardy–Littlewood circle method","short":"Circle method","pre":["exponential-sums","fourier-poisson"],"sum":"Count solutions of additive equations by writing the count as $\\int_0^1 S(\\alpha)^k e(-N\\alpha)\\,d\\alpha$ and splitting $[0,1]$ into major arcs near rationals and minor arcs. Developed by Hardy and Littlewood from 1920.","key":["r(N) = \\int_0^1 S(\\alpha)^k\\, e(-N\\alpha)\\, d\\alpha, \\qquad S(\\alpha) = \\sum_{n \\le N,\\ n \\in \\mathcal A} e(n\\alpha)"],"why":"It proves Waring's problem asymptotics and the ternary Goldbach theorem.","msc":["11P55"],"links":[{"field":"harmonic-analysis","note":"Fourier analysis on $\\mathbb R/\\mathbb Z$ with arithmetic structure."}],"refs":["Vaughan, The Hardy–Littlewood Method"],"status":null,"aliases":["major arcs","minor arcs","Hardy-Littlewood"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":9,"fixed":2}},{"id":"ternary-goldbach","band":"analytic","title":"Ternary Goldbach","short":"Ternary Goldbach","pre":["circle-method","siegel-walfisz"],"sum":"Vinogradov (1937) proved every sufficiently large odd number is a sum of three primes. Helfgott (2013) lowered 'sufficiently large' to every odd number greater than $5$.","key":["N = p_1 + p_2 + p_3 \\quad (N > 5 \\text{ odd})"],"why":"The binary Goldbach conjecture for even numbers remains open.","msc":["11P32"],"links":[{"field":"computer-science","note":"Helfgott's proof combined analysis with large computer verifications of small cases."}],"refs":["Vaughan, The Hardy–Littlewood Method"],"status":null,"aliases":["Vinogradov three primes","Helfgott"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":8,"fixed":2}},{"id":"waring","band":"analytic","title":"Waring's problem","short":"Waring's problem","pre":["circle-method"],"sum":"Waring (1770) asserted every positive integer is a sum of a bounded number $g(k)$ of $k$-th powers; Hilbert proved it in 1909. Lagrange's four-square theorem (1770) gives $g(2)=4$, and $g(3) = 9$, $g(4) = 19$.","key":["g(2) = 4,\\quad g(3) = 9,\\quad g(4) = 19"],"why":"The circle method computes how many representations there are, not just that one exists.","msc":["11P05"],"links":[{"field":"combinatorics","note":"Additive bases of the integers."}],"refs":["Vaughan, The Hardy–Littlewood Method","Hardy & Wright, An Introduction to the Theory of Numbers"],"status":null,"aliases":["four squares","Lagrange four square"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":9,"fixed":0}},{"id":"moments","band":"analytic","title":"Moments, mollifiers and amplifiers","short":"Moments & amplifiers","pre":["l-functions","explicit-formula"],"sum":"Averages of $|\\zeta|^{2k}$ or of $L$-values over families carry information about zeros. Bettin and Gonek (2017) showed a conjecture on mollified second moments implies the Riemann hypothesis. In October 2026 a follow-up preprint claimed to refine the quasi-RH bound using amplified moments.","key":["\\int_0^T |\\zeta(\\tfrac12 + it)|^2\\, dt \\sim T \\log T"],"why":"Amplifiers single out one member of a family, the natural tool for hunting an exceptional zero.","msc":["11M06"],"links":[{"field":"probability","note":"Keating and Snaith (2000) predicted the constants in moments using random matrix theory."}],"refs":["Iwaniec & Kowalski, Analytic Number Theory","Titchmarsh, The Theory of the Riemann Zeta-Function"],"status":null,"aliases":["mollifier","amplifier","moment conjecture"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":7,"fixed":1}},{"id":"zero-density","band":"analytic","title":"Zero-density estimates","short":"Zero density","pre":["zero-free-region","moments"],"sum":"$N(\\sigma, T)$ counts zeros with real part at least $\\sigma$ and height at most $T$. Density theorems show $N(\\sigma,T) \\ll T^{A(1-\\sigma)+\\varepsilon}$: zeros off the line, if any, are rare.","key":["N(\\sigma, T) \\ll T^{A(1-\\sigma)} (\\log T)^B"],"why":"Density hypotheses give primes in short intervals almost as well as RH would.","msc":["11M26"],"links":[],"refs":["Iwaniec & Kowalski, Analytic Number Theory","Titchmarsh, The Theory of the Riemann Zeta-Function"],"status":null,"aliases":["density hypothesis","Ingham"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":24,"checks":9,"fixed":1}},{"id":"lindelof","band":"analytic","title":"Lindelöf hypothesis and subconvexity","short":"Lindelöf hypothesis","pre":["functional-equation","exponential-sums"],"sum":"Lindelöf (1908) conjectured $\\zeta(\\tfrac12+it) \\ll |t|^{\\varepsilon}$. The functional equation and convexity give exponent $\\tfrac14$; any improvement is called subconvexity.","key":["\\zeta(\\tfrac12 + it) \\ll_\\varepsilon |t|^{\\varepsilon}"],"why":"Implied by RH, and itself enough for many applications.","msc":["11M06"],"links":[],"refs":["Titchmarsh, The Theory of the Riemann Zeta-Function","Iwaniec & Kowalski, Analytic Number Theory"],"status":"open","aliases":["subconvexity","convexity bound"],"fields":["number-theory"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":8,"fixed":0}},{"id":"pair-correlation","band":"analytic","title":"Pair correlation and random matrices","short":"Pair correlation","pre":["nontrivial-zeros","explicit-formula"],"sum":"Montgomery (1973) studied spacings between zeros and conjectured their pair correlation is $1 - \\left(\\frac{\\sin \\pi u}{\\pi u}\\right)^2$. Dyson recognised this as the eigenvalue statistics of large random Hermitian matrices.","key":["1 - \\Bigl(\\frac{\\sin \\pi u}{\\pi u}\\Bigr)^2"],"why":"Zeros behave like energy levels of a chaotic quantum system, a hint toward the Hilbert–Pólya idea.","msc":["11M26"],"links":[{"field":"physics","note":"The same statistics describe energy levels of heavy nuclei and quantum chaotic systems."},{"field":"probability","note":"The GUE ensemble of random matrix theory."},{"field":"computer-science","note":"Odlyzko's computations of zeros near the $10^{20}$-th confirmed the prediction numerically."}],"refs":["Iwaniec & Kowalski, Analytic Number Theory"],"status":"open","aliases":["Montgomery","GUE","Dyson","random matrix theory"],"fields":["number-theory"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":7,"fixed":1}},{"id":"rh","band":"analytic","title":"The Riemann hypothesis","short":"Riemann hypothesis","pre":["nontrivial-zeros","explicit-formula"],"sum":"Every nontrivial zero of $\\zeta$ has real part $\\tfrac12$. Stated by Riemann in 1859, one of Hilbert's 1900 problems and a Clay Millennium Problem since 2000. Open as of October 2026.","key":["\\zeta(\\rho) = 0,\\ 0 < \\operatorname{Re}\\rho < 1 \\ \\Longrightarrow\\ \\operatorname{Re}\\rho = \\tfrac12","\\text{RH} \\Longrightarrow \\psi(x) = x + O(\\sqrt x \\log^2 x)"],"why":"It is equivalent to the best possible error term in the prime number theorem.","msc":["11M26"],"links":[{"field":"physics","note":"The Hilbert–Pólya idea: zeros as eigenvalues of a self-adjoint operator."}],"refs":["Edwards, Riemann's Zeta Function","Titchmarsh, The Theory of the Riemann Zeta-Function"],"status":"open","aliases":["RH","Millennium problem"],"fields":["number-theory"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":10,"research":1,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":6,"fixed":0}},{"id":"grh","band":"analytic","title":"The generalized Riemann hypothesis","short":"Generalized RH","pre":["rh","l-functions"],"sum":"All nontrivial zeros of every Dirichlet $L$-function lie on $\\operatorname{Re}s=\\tfrac12$. GRH would give primes in progressions with square-root error and make many algorithms provably fast.","key":["L(\\rho,\\chi) = 0,\\ 0<\\operatorname{Re}\\rho<1 \\ \\Longrightarrow\\ \\operatorname{Re}\\rho = \\tfrac12"],"why":"Bombieri–Vinogradov is GRH on average.","msc":["11M26"],"links":[{"field":"computer-science","note":"Under GRH the Miller–Rabin test becomes deterministic with bases up to $2(\\log n)^2$."}],"refs":["Davenport, Multiplicative Number Theory","Iwaniec & Kowalski, Analytic Number Theory"],"status":"open","aliases":["GRH","extended Riemann hypothesis"],"fields":["number-theory"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":6,"fixed":0}},{"id":"quasi-rh","band":"analytic","title":"The quasi-Riemann hypothesis","short":"Quasi-RH","pre":["zero-free-region","hecke-l","cubic-characters","mellin"],"sum":"There is a fixed $\\theta < 1$ with no zeros in $\\operatorname{Re}s > \\theta$. An OpenAI manuscript dated 30 September 2026 claims every Dirichlet $L$-function, $\\zeta$ included, is zero-free in $\\operatorname{Re}s > \\tfrac78$, using Hecke $L$-functions over $\\mathbb Q(\\sqrt{-3})$ and cubic theta sums. The 7/8 version was reported as Lean-verified; a second proof gives $\\tfrac{11}{12}$. Community verification is ongoing.","key":["L(s,\\chi) \\ne 0 \\quad \\text{for } \\operatorname{Re}s > \\tfrac78","\\tfrac18 \\le \\operatorname{Re}\\rho \\le \\tfrac78 \\ \\text{ for all nontrivial zeros}"],"why":"A width that does not shrink with height changes the error term in the prime number theorem from $e^{-c\\sqrt{\\log x}}$-type savings to a power saving.","msc":["11M26"],"links":[{"field":"formal-verification","note":"The 7/8 manuscript was reported as checked in Lean."},{"field":"ai-research","note":"Produced by an unreleased internal AI model; part of the 722-manuscript release."}],"refs":[],"status":"claimed","aliases":["quasi Riemann","7/8","zero-free half-plane"],"fields":["number-theory"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":16,"checks":7,"fixed":0}},{"id":"no-siegel","band":"analytic","title":"Exclusion of Siegel zeros","short":"No Siegel zeros","pre":["siegel-zeros","l-functions"],"sum":"A short paper in the 6 October 2026 release separately claims there are no exceptional zeros near $1$. The quasi-RH claim gives the same conclusion, so two independent routes were offered. Independent checking is under way.","key":["L(\\beta, \\chi) \\ne 0 \\quad \\text{for } \\beta \\text{ near } 1,\\ \\chi \\text{ real}"],"why":"If confirmed, ineffective constants in many theorems, Siegel–Walfisz included, become effective.","msc":["11M20"],"links":[{"field":"ai-research","note":"Claimed in the October 2026 AI-generated release."}],"refs":[],"status":"claimed","aliases":["Landau-Siegel zeros","exceptional zero"],"fields":["number-theory"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":14,"checks":5,"fixed":1}},{"id":"twin-primes","band":"analytic","title":"The twin prime conjecture","short":"Twin primes","pre":["bounded-gaps"],"sum":"There are infinitely many primes $p$ with $p + 2$ prime. Hardy and Littlewood conjectured the count up to $x$ is about $2C_2\\,x/(\\log x)^2$ with $C_2 \\approx 0.6602$. Bounded gaps (246) is the best unconditional result.","key":["\\pi_2(x) \\sim 2 C_2 \\frac{x}{(\\log x)^2}, \\qquad C_2 = \\prod_{p > 2}\\Bigl(1 - \\frac{1}{(p-1)^2}\\Bigr)"],"why":"Sieve theory's parity problem is the known barrier.","msc":["11N05"],"links":[],"refs":["Friedlander & Iwaniec, Opera de Cribro"],"status":"open","aliases":["twin primes","Hardy-Littlewood conjecture"],"fields":["number-theory"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":10,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":15,"checks":5,"fixed":0}},{"id":"goldbach","band":"analytic","title":"Goldbach's conjecture","short":"Goldbach conjecture","pre":["ternary-goldbach","sieve-basics"],"sum":"Every even integer greater than $2$ is a sum of two primes (Goldbach to Euler, 1742). Verified by computer up to $4\\cdot 10^{18}$; the ternary version was proved by Helfgott in 2013.","key":["2N = p + q"],"why":"The circle method handles three primes; two primes falls on the wrong side of the minor-arc barrier.","msc":["11P32"],"links":[{"field":"computer-science","note":"Exhaustive verification projects."}],"refs":["Vaughan, The Hardy–Littlewood Method"],"status":"open","aliases":["binary Goldbach"],"fields":["number-theory"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":10,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":15,"checks":6,"fixed":0}},{"id":"diophantine-approx","band":"analytic","title":"Diophantine approximation and irrationality","short":"Diophantine approximation","pre":["continued-fractions"],"sum":"How well can a real number be approximated by $p/q$? For irrational $\\alpha$, Dirichlet gives $|\\alpha - p/q| < 1/q^2$ infinitely often; Roth (1955) shows algebraic irrationals cannot do much better. Irrationality proofs (Apéry's $\\zeta(3)$) are quantitative statements of this kind.","key":["\\Big|\\alpha-\\frac pq\\Big| < \\frac{1}{q^{2+\\varepsilon}} \\ \\text{has finitely many solutions for algebraic irrational } \\alpha \\ \\text{(Roth)}"],"why":"Transcendence, the abc conjecture and the irrationality of zeta values all reduce to how small a linear form in numbers can be.","msc":["11J68","11J72"],"links":[{"field":"dynamics","note":"Badly approximable numbers are bounded orbits of the geodesic flow on the modular surface."}],"refs":["Hardy & Wright, An Introduction to the Theory of Numbers","Bugeaud, Approximation by Algebraic Numbers"],"status":null,"aliases":["irrationality","Roth's theorem","Liouville","Apéry"],"fields":["number-theory","real-analysis"],"stage":"graduate","np":{"textbook":0,"olympiad":5,"bridge":10,"research":23,"examples":0},"nprob":5,"lesson":{"minutes":25,"checks":9,"fixed":0}},{"id":"smooth-powerful","band":"analytic","title":"Smooth, powerful and squarefree numbers","short":"Smooth & powerful numbers","pre":["fta","asymptotics"],"sum":"$n$ is $y$-smooth if all its prime factors are $\\le y$, powerful if $p\\mid n \\Rightarrow p^2 \\mid n$, squarefree if no $p^2$ divides it. Their counts are governed by Dickman's function, $\\zeta(3/2)/\\zeta(3)\\cdot\\sqrt x$ and $6x/\\pi^2$.","key":["\\Psi(x, x^{1/u}) \\sim \\rho(u)\\,x","\\#\\{n\\le x \\text{ squarefree}\\} \\sim \\frac{6}{\\pi^2}x"],"why":"Smooth numbers are the engine of the fastest factoring algorithms; powerful numbers are where the abc conjecture bites.","msc":["11N25"],"links":[{"field":"cryptography","note":"The quadratic and number field sieves factor by collecting smooth values."},{"field":"computer-science","note":"Running times of index-calculus algorithms are $L$-functions of smoothness probabilities."}],"refs":["Tenenbaum, Introduction to Analytic and Probabilistic Number Theory","Crandall & Pomerance, Prime Numbers: A Computational Perspective"],"status":null,"aliases":["Dickman","squarefree","abc","friable"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":10,"research":13,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":8,"fixed":0}},{"id":"prime-patterns","band":"analytic","title":"Primes in sequences and gaps","short":"Prime patterns","pre":["pnt","sieve-basics"],"sum":"Which sequences contain infinitely many primes, how large gaps between consecutive primes can be, and how often primes fall in short intervals. Most such questions are open; sieves and the circle method give the partial results.","key":["\\limsup \\frac{p_{n+1}-p_n}{\\log p_n} = \\infty \\ \\text{(Westzynthius 1931)}","\\max_{p_n\\le x}(p_{n+1}-p_n) \\gg \\frac{\\log x\\,\\log\\log x\\,\\log\\log\\log\\log x}{\\log\\log\\log x}\\ \\text{(Ford–Green–Konyagin–Maynard–Tao)}"],"why":"Large gaps are built by covering an interval with residue classes, so this topic shares a toolkit with covering systems.","msc":["11N05","11N13"],"links":[{"field":"combinatorics","note":"Large-gap constructions use hypergraph covering lemmas (Rödl nibble)."}],"refs":["Guy, Unsolved Problems in Number Theory","Friedlander & Iwaniec, Opera de Cribro"],"status":null,"aliases":["prime gaps","large gaps","primes of the form"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":10,"research":12,"examples":0},"nprob":0,"lesson":{"minutes":24,"checks":8,"fixed":0}},{"id":"probabilistic-nt","band":"analytic","title":"Probabilistic number theory","short":"Probabilistic NT","pre":["arithmetic-functions","pnt","limit-theorems"],"sum":"Arithmetic functions behave like sums of independent random variables. Erdős–Kac: $\\omega(n)$, the number of prime factors, is normally distributed with mean and variance $\\log\\log n$.","key":["\\frac{1}{x}\\#\\Big\\{n\\le x : \\frac{\\omega(n)-\\log\\log n}{\\sqrt{\\log\\log n}} \\le t\\Big\\} \\to \\Phi(t)"],"why":"It turned heuristics such as Cramér's model of the primes into theorems where it could, and tells you what to expect where it cannot.","msc":["11K65","11N37"],"links":[{"field":"probability","note":"The proofs are moment and characteristic-function arguments from probability theory."}],"refs":["Tenenbaum, Introduction to Analytic and Probabilistic Number Theory"],"status":null,"aliases":["Erdős–Kac","Turán–Kubilius","normal order"],"fields":["number-theory","probability"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":1,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":8,"fixed":0}},{"id":"gaussian-integers","band":"algebraic","title":"Gaussian integers","short":"Gaussian integers","pre":["quadratic-residues","fta"],"sum":"$\\mathbb Z[i]$ has unique factorization with norm $N(a+bi) = a^2 + b^2$. A prime $p \\equiv 1 \\pmod 4$ splits as $\\pi\\bar\\pi$, $p \\equiv 3 \\pmod 4$ stays prime, and $2 = -i(1+i)^2$ ramifies.","key":["p = a^2 + b^2 = (a+bi)(a-bi) \\iff p \\equiv 1 \\pmod 4 \\ \\text{or}\\ p = 2"],"why":"The cleanest proof of the two-squares theorem, and the first number ring beyond $\\mathbb Z$.","msc":["11R11"],"links":[{"field":"geometry","note":"The square lattice in the plane."}],"refs":["Ireland & Rosen, A Classical Introduction to Modern Number Theory","Marcus, Number Fields"],"status":null,"aliases":["Z[i]","Gaussian primes"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":9,"fixed":0}},{"id":"eisenstein-integers","band":"algebraic","title":"Eisenstein integers","short":"Eisenstein integers","pre":["quadratic-residues","fta"],"sum":"$\\mathbb Z[\\omega]$ with $\\omega = e^{2\\pi i/3}$ is the ring of integers of $\\mathbb Q(\\sqrt{-3})$. It has unique factorization, six units, and norm $a^2 - ab + b^2$; primes $p \\equiv 1 \\pmod 3$ split.","key":["N(a + b\\omega) = a^2 - ab + b^2"],"why":"The arena of cubic reciprocity, and of the claimed 2026 quasi-RH proof.","msc":["11R11"],"links":[{"field":"geometry","note":"The hexagonal lattice."}],"refs":["Ireland & Rosen, A Classical Introduction to Modern Number Theory"],"status":null,"aliases":["Z[omega]","Q(sqrt -3)"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":18,"checks":10,"fixed":1}},{"id":"ideals","band":"algebraic","title":"Ideals and rings of integers","short":"Ideals","pre":["gaussian-integers","rings","ufds"],"sum":"In a ring of integers $\\mathcal O_K$ elements may factor non-uniquely, but ideals factor uniquely into prime ideals (Dedekind, 1871). Kummer's ideal numbers (1847) were the precursor.","key":["(6) = (2, 1+\\sqrt{-5})^2\\,(3, 1+\\sqrt{-5})(3, 1-\\sqrt{-5}) \\ \\text{ in } \\mathbb Z[\\sqrt{-5}]"],"why":"Ideal factorization is what number fields have instead of unique factorization.","msc":["11R04"],"links":[{"field":"algebra","note":"Dedekind domains."}],"refs":["Marcus, Number Fields","Neukirch, Algebraic Number Theory"],"status":null,"aliases":["Dedekind domain","prime ideal","Kummer"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":10,"fixed":1}},{"id":"class-group","band":"algebraic","title":"Class groups","short":"Class groups","pre":["ideals","quadratic-forms"],"sum":"The ideal class group measures the failure of unique factorization; its order is the class number $h_K$. The imaginary quadratic fields $\\mathbb Q(\\sqrt{-d})$ with $h = 1$ are exactly $d = 1,2,3,7,11,19,43,67,163$.","key":["h(-163) = 1, \\qquad e^{\\pi\\sqrt{163}} \\approx 640320^3 + 744"],"why":"Class numbers of imaginary quadratic fields grow, but how fast is tied to Siegel zeros.","msc":["11R29"],"links":[{"field":"algebra","note":"Finite abelian groups attached to number fields."}],"refs":["Cox, Primes of the Form x² + ny²","Marcus, Number Fields"],"status":null,"aliases":["class number","Heegner numbers"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":11,"fixed":1}},{"id":"cyclotomic","band":"algebraic","title":"Cyclotomic fields","short":"Cyclotomic fields","pre":["ideals","order-primroot"],"sum":"$\\mathbb Q(\\zeta_n)$ has degree $\\varphi(n)$, and $p \\nmid n$ splits into $\\varphi(n)/f$ primes, where $f$ is the order of $p$ modulo $n$. Gauss used $\\mathbb Q(\\zeta_{17})$ in 1796 to construct the regular 17-gon.","key":["\\Phi_n(x) = \\prod_{\\substack{1 \\le k \\le n \\\\ \\gcd(k,n)=1}} \\bigl(x - e^{2\\pi i k/n}\\bigr), \\qquad [\\mathbb Q(\\zeta_n):\\mathbb Q] = \\varphi(n)"],"why":"By Kronecker–Weber every abelian extension of $\\mathbb Q$ lies in a cyclotomic field.","msc":["11R18"],"links":[{"field":"algebra","note":"Galois groups $(\\mathbb Z/n\\mathbb Z)^\\times$."},{"field":"geometry","note":"Constructible regular polygons."}],"refs":["Washington, Introduction to Cyclotomic Fields","Ireland & Rosen, A Classical Introduction to Modern Number Theory"],"status":null,"aliases":["cyclotomic polynomial","roots of unity","17-gon"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":1,"lesson":{"minutes":22,"checks":11,"fixed":2}},{"id":"cubic-characters","band":"algebraic","title":"Cubic characters and cubic reciprocity","short":"Cubic reciprocity","pre":["eisenstein-integers","gauss-sums"],"sum":"For $p \\equiv 1 \\pmod 3$ there are two characters of order $3$ modulo $p$. Eisenstein proved cubic reciprocity in $\\mathbb Z[\\omega]$ in 1844; cubic Gauss sums satisfy $g(\\chi)^3 = p\\,J(\\chi,\\chi)$ with a Jacobi sum $J$.","key":["g(\\chi)^3 = p\\,J(\\chi,\\chi), \\qquad |J(\\chi,\\chi)| = \\sqrt p"],"why":"Cubic theta sums built from these characters drive the claimed 2026 quasi-RH proof.","msc":["11A15","11L05"],"links":[],"refs":["Ireland & Rosen, A Classical Introduction to Modern Number Theory"],"status":null,"aliases":["cubic Gauss sum","Jacobi sum","Eisenstein reciprocity"],"fields":["number-theory"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":10,"fixed":0}},{"id":"dedekind-zeta","band":"algebraic","title":"Dedekind zeta functions","short":"Dedekind zeta","pre":["ideals","zeta"],"sum":"$\\zeta_K(s) = \\sum_{\\mathfrak a} N\\mathfrak a^{-s}$ over nonzero ideals of $\\mathcal O_K$. For a quadratic field it factors as $\\zeta(s)L(s,\\chi_D)$, and its residue at $s=1$ carries the class number.","key":["\\zeta_{\\mathbb Q(\\sqrt D)}(s) = \\zeta(s)\\, L(s, \\chi_D) \\quad (D \\text{ the discriminant},\\ \\chi_D = (\\tfrac{D}{\\cdot}))"],"why":"The factorization moves questions about a number field down to $\\mathbb Q$.","msc":["11R42"],"links":[{"field":"algebra","note":"Factorizations of $\\zeta_K$ mirror the Galois representation theory of $K$."}],"refs":["Neukirch, Algebraic Number Theory","Marcus, Number Fields"],"status":null,"aliases":["ideal counting"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":11,"fixed":2}},{"id":"hecke-l","band":"algebraic","title":"Hecke L-functions","short":"Hecke L-functions","pre":["dedekind-zeta","l-functions","functional-equation"],"sum":"$L$-functions of Hecke characters (Größencharaktere) on ideals of a number field. Hecke (1918) proved their analytic continuation and functional equation. Over $\\mathbb Q$ they are Dirichlet $L$-functions, up to a shift $s\\mapsto s-i\\tau$.","key":["L(s, \\xi) = \\sum_{\\mathfrak a} \\frac{\\xi(\\mathfrak a)}{N\\mathfrak a^{s}}"],"why":"A 2026 AI-produced manuscript claims a zero-free half-plane for finite-order Hecke $L$-functions over $\\mathbb Q(\\sqrt{-3})$ and transfers it to Dirichlet $L$-functions.","msc":["11R42"],"links":[{"field":"algebra","note":"Class field theory identifies them with Artin L-functions of abelian extensions."}],"refs":["Neukirch, Algebraic Number Theory"],"status":null,"aliases":["Grossencharacter","Hecke character"],"fields":["number-theory"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":8,"fixed":1}},{"id":"elliptic-curves","band":"algebraic","title":"Elliptic curves","short":"Elliptic curves","pre":["congruences","quadratic-residues"],"sum":"Curves $y^2 = x^3 + ax + b$ with a group law on their points. Hasse (1933) proved $|\\#E(\\mathbb F_p) - (p+1)| \\le 2\\sqrt p$. Wiles's 1995 proof of Fermat's Last Theorem went through elliptic curves.","key":["\\bigl|\\#E(\\mathbb F_p) - (p + 1)\\bigr| \\le 2\\sqrt p"],"why":"The birth of modern arithmetic geometry; the Birch–Swinnerton-Dyer conjecture is about them.","msc":["11G05"],"links":[{"field":"cryptography","note":"Elliptic-curve cryptography (ECDH, ECDSA) secures most web traffic."},{"field":"geometry","note":"Algebraic curves of genus 1."}],"refs":["Silverman & Tate, Rational Points on Elliptic Curves"],"status":null,"aliases":["Hasse bound","Fermat's last theorem","BSD"],"fields":["number-theory","algebra","geometry"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":1,"examples":0},"nprob":0,"lesson":{"minutes":26,"checks":9,"fixed":0}},{"id":"bsd","band":"algebraic","title":"The Birch and Swinnerton-Dyer conjecture","short":"BSD conjecture","pre":["elliptic-curves","l-functions"],"sum":"The rank of the group of rational points of an elliptic curve $E/\\mathbb Q$ equals the order of vanishing of $L(E,s)$ at $s=1$. Known when that order is $0$ or $1$ (Gross–Zagier, Kolyvagin).","key":["\\operatorname{rank} E(\\mathbb Q) = \\operatorname{ord}_{s=1} L(E,s)"],"why":"It is one of the seven Millennium Prize Problems and would give an algorithm for deciding whether an elliptic curve over $\\mathbb Q$ has infinitely many rational points.","msc":["11G40","14G10"],"links":[{"field":"algebraic-geometry","note":"Elliptic curves are abelian varieties of dimension one."}],"refs":["Silverman & Tate, Rational Points on Elliptic Curves","Carlson, Jaffe & Wiles (eds.), The Millennium Prize Problems"],"status":"open","aliases":["Birch–Swinnerton-Dyer","rank","Millennium"],"fields":["number-theory","algebraic-geometry"],"stage":"research","np":{"textbook":0,"olympiad":0,"bridge":0,"research":1,"examples":0},"nprob":0,"lesson":{"minutes":17,"checks":5,"fixed":1}},{"id":"p-adic-numbers","band":"algebraic","title":"The p-adic numbers","short":"p-adic numbers","pre":["p-adic-valuation","hensel","metric-spaces"],"sum":"For a prime $p$, the field $\\mathbb{Q}_p$ of $p$-adic numbers is the completion of $\\mathbb{Q}$ for the absolute value $|x|_p = p^{-v_p(x)}$, in which a number is small when it is divisible by a high power of $p$. Its elements are series $\\sum_{i \\ge n} a_i p^i$ with digits $0 \\le a_i < p$ running infinitely to the left, and the $p$-adic integers $\\mathbb{Z}_p = \\{|x|_p \\le 1\\}$ package all congruences modulo $p, p^2, p^3, \\dots$ into a single compact ring.","key":["|x+y|_p \\le \\max(|x|_p, |y|_p),\\qquad \\sum a_n \\text{ converges in } \\mathbb{Q}_p \\iff |a_n|_p \\to 0","\\mathbb{Z}_p = \\Bigl\\{ \\sum_{i\\ge 0} a_i p^i : 0 \\le a_i \\le p-1 \\Bigr\\},\\qquad \\mathbb{Z}_p/p^n\\mathbb{Z}_p \\cong \\mathbb{Z}/p^n\\mathbb{Z}","\\mathbb{Q}_p^\\times = p^{\\mathbb{Z}} \\times \\mathbb{Z}_p^\\times,\\qquad \\mathbb{Z}_p^\\times = \\{x : |x|_p = 1\\}"],"why":"Solving an equation in $\\mathbb{Q}_p$ is the same as solving it modulo every power of $p$ at once, so p-adic numbers are the natural home for congruence arguments and for local-to-global principles such as the Hasse–Minkowski theorem; they are basic tools throughout modern number theory.","msc":["12J25"],"links":[{"field":"topology","note":"The ring $\\mathbb{Z}_p$ is compact son":{"minutes":20,"checks":9,"fixed":0}},{"id":"additive-combinatorics","band":"combinatorial","title":"Sumsets and additive combinatorics","short":"Additive combinatorics","pre":["combinatorial-nt","fourier-poisson"],"sum":"The study of $A+B = \\{a+b\\}$ for finite sets. Small doubling $|A+A| \\le K|A|$ forces structure (Freiman), and Fourier analysis on $\\mathbb Z/N$ measures how random a set is.","key":["|A+B| \\ge \\min(p,\\ |A|+|B|-1) \\ \\text{in } \\mathbb Z/p","|A+A| \\le K|A| \\Rightarrow A \\subset \\text{a generalised progression of size } O_K(|A|)"],"why":"It connected number theory to ergodic theory and theoretical computer science, and produced the Green–Tao theorem.","msc":["11B13","11P70","05D99"],"links":[{"field":"harmonic-analysis","note":"Roth's proof and its successors run on Fourier coefficients of indicator functions."},{"field":"computer-science","note":"Property testing and pseudorandomness use the same inverse theorems."}],"refs":["Tao & Vu, Additive Combinatorics"],"status":null,"aliases":["sumset","Freiman","Cauchy–Davenport","Plünnecke"],"fields":["combinatorics","number-theory","harmonic-analysis"],"stage":"graduate","np":{"textbook":0,"olympiad":3,"bridge":10,"research":30,"examples":0},"nprob":3,"lesson":{"minutes":26,"checks":11,"fixed":0}},{"id":"ramsey-arithmetic","band":"combinatorial","title":"Arithmetic Ramsey theory","short":"Arithmetic Ramsey","pre":["combinatorial-nt","ramsey"],"sum":"Colour the integers with finitely many colours; some colour class contains a given structure. Schur: a monochromatic $x+y=z$. Van der Waerden: arbitrarily long monochromatic progressions. Rado: exactly which linear systems are partition regular.","key":["\\forall\\, r\\ \\exists\\, N:\\ [1,N] = C_1\\cup\\cdots\\cup C_r \\Rightarrow \\exists i,\\ x,y,z\\in C_i,\\ x+y=z"],"why":"Colouring statements are the qualitative form of density statements, and the gap between the two is where most of the difficulty lies.","msc":["05D10","11B25"],"links":[ h $r_A(n) \\asymp \\log n$."}],"refs":["Tao & Vu, Additive Combinatorics","Erdős & Graham, Old and New Problems and Results in Combinatorial Number Theory"],"status":null,"aliases":["basis of order h","complete sequence","Erdős–Turán conjecture for bases"],"fields":["number-theory","combinatorics"],"stage":"graduate","np":{"textbook":0,"olympiad":1,"bridge":10,"research":33,"examples":0},"nprob":1,"lesson":{"minutes":25,"checks":10,"fixed":1}},{"id":"unit-fractions","band":"combinatorial","title":"Egyptian fractions","short":"Unit fractions","pre":["divisibility","combinatorial-nt"],"sum":"Writing rationals as sums of distinct $1/n$. Every positive rational has such representations; the questions are how short, how small the denominators, and which colourings or dense sets must contain a representation of $1$.","key":["\\frac{4}{n} = \\frac1x+\\frac1y+\\frac1z \\ \\ (\\text{Erdős–Straus, open})","\\text{any } r\\text{-colouring of } \\{2,3,4,\\dots\\} \\text{ has a monochromatic } \\textstyle\\sum 1/n_i = 1 \\ \\text{(Croot 2003)}"],"why":"Bloom's 2021 density theorem, built on Croot's method, is a model of how analytic tools enter elementary-looking questions.","msc":["11D68"],"links":[{"field":"combinatorics","note":"Croot's and Bloom's results are Ramsey- and density-type theorems for the equation $\\sum 1/n_i = 1$."}],"refs":["Guy, Unsolved Problems in Number Theory","Erdős & Graham, Old and New Problems and Results in Combinatorial Number Theory"],"status":null,"aliases":["Egyptian fraction","Erdős–Straus"],"fields":["number-theory","combinatorics"],"stage":"graduate","np":{"textbook":0,"olympiad":2,"bridge":10,"research":33,"examples":0},"nprob":2,"lesson":{"minutes":20,"checks":10,"fixed":1}},{"id":"covering-systems","band":"combinatorial","title":"Covering systems","short":"Covering systems","pre":["crt","combinatorial-nt"],"sum":"A finite set of congruences $a_i \\bmod n_i$ covering every integer, such as $0\\bmod2,\\ 0\\bmod3,\\ 1\\bmod4,\\ 5\\bmod6,\\ 7\\bmod12$. Hough (2015) proved the smallest modulus of a covering with distinct moduli is bounded.","key":["\\textstyle\\bigcup_i \\{x : x\\equiv a_i \\bmod n_i\\} = \\mathbb Z,\\quad n_1<n_2<\\cdots<n_k"],"why":"Coverings produce Sierpiński numbers (odd $k$ with every $k2^n+1$ composite) and are a test case for the probabilistic method.","msc":["11B25","11A07"],"links":[{"field":"combinatorics","note":"Hough's proof and later work use the Lovász local lemma style of probabilistic argument."}],"refs":["Guy, Unsolved Problems in Number Theory","Erdős & Graham, Old and New Problems and Results in Combinatorial Number Theory"],"status":null,"aliases":["covering congruences","Sierpiński number","minimum modulus"],"fields":["number-theory","combinatorics"],"stage":"graduate","np":{"textbook":0,"olympiad":1,"bridge":9,"research":17,"examples":0},"nprob":1,"lesson":{"minutes":20,"checks":9,"fixed":1}},{"id":"primitive-sets","band":"combinatorial","title":"Primitive sets","short":"Primitive sets","pre":["combinatorial-nt","mertens"],"sum":"A set of integers $>1$ in which no element divides another. Erdős proved $\\sum 1/(a\\log a)$ is bounded over primitive sets and conjectured the primes maximise it; Lichtman proved this in 2022.","key":["\\sum_{a\\in A}\\frac{1}{a\\log a} \\le \\sum_{p}\\frac{1}{p\\log p} \\ \\ \\text{(Lichtman 2022)}"],"why":"It shows how a combinatorial condition (no divisibility) interacts with the multiplicative structure measured by Mertens-type sums.","msc":["11B83","11N25"],"links":[{"field":"combinatorics","note":"Primitive sets are antichains in the divisibility order."}],"refs":["Erdős & Graham, Old and New Problems and Results in Combinatorial Number Theory"],"status":null,"aliases":["antichain","Erdős primitive set conjecture"],"fields":["number-theory","combinatorics"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":8,"research":6,"examples":0},"nprob":0,"lesson":{"minutes":18,"checks":8,"fixed":0}},{"id":"discrepancy","band":"combi  + (a_1 - a_0)x}{1-x-x^2}"],"why":"They connect counting to analysis: singularities of the series give asymptotics, as in the Hardy–Ramanujan partition formula.","msc":["05A15"],"links":[{"field":"number-theory","note":"The partition generating function is a modular form, the source of the circle method."},{"field":"complex-analysis","note":"Coefficient asymptotics come from singularity analysis."}],"refs":["Stanley, Enumerative Combinatorics, Vol. 1"],"status":null,"aliases":["recurrence","partitions","Fibonacci"],"fields":["combinatorics","algebra"],"stage":"undergraduate","np":{"textbook":39,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":44,"lesson":{"minutes":19,"checks":8,"fixed":1}},{"id":"graph-basics","band":"discrete","title":"Graphs, trees and paths","short":"Graphs","pre":["counting"],"sum":"A graph is a set of vertices with edges between pairs. Degrees, paths, connectivity, trees (connected graphs with no cycles) and Euler tours are the basic notions.","key":["\\text{tree on } n \\text{ vertices} \\iff \\text{connected with } n-1 \\text{ edges}","\\text{Euler tour exists} \\iff \\text{all degrees even and all edges in one component}"],"why":"Graphs model any pairwise relation, so most of combinatorics and much of computer science is written in this language.","msc":["05C05","05C38"],"links":[{"field":"computer-science","note":"Graph search, shortest paths and network flow are the core algorithms."},{"field":"physics","note":"Lattice models and Feynman diagrams are graphs."}],"refs":["Diestel, Graph Theory","Bollobás, Modern Graph Theory"],"status":null,"aliases":["graph theory","tree","Euler","tournament","connectivity"],"fields":["combinatorics"],"stage":"undergraduate","np":{"textbook":9,"olympiad":5,"bridge":0,"research":5,"examples":0},"nprob":14,"lesson":{"minutes":17,"checks":7,"fixed":0}},{"id":"cycles-matchings","band":"discrete","title":"Cycles, matchings and Hamiltonicity","short":"Cycles & matchings","pre":["graph-basics"],"sum":"H ild & Spencer, Ramsey Theory","Bollobás, Modern Graph Theory"],"status":null,"aliases":["Ramsey number","R(k)","monochromatic"],"fields":["combinatorics"],"stage":"undergraduate","np":{"textbook":0,"olympiad":4,"bridge":10,"research":52,"examples":0},"nprob":4,"lesson":{"minutes":20,"checks":8,"fixed":0}},{"id":"probabilistic-method","band":"discrete","title":"The probabilistic method","short":"Probabilistic method","pre":["counting","random-variables"],"sum":"To show an object exists, pick one at random and show the probability it works is positive. Linearity of expectation, alterations, the Lovász local lemma and concentration inequalities are the main tools.","key":["\\Pr\\big[\\text{some } K_k \\text{ monochromatic}\\big] \\le \\binom nk 2^{1-\\binom k2} < 1 \\Rightarrow R(k) > n","\\mathbb E[X] \\ge t \\Rightarrow \\Pr[X\\ge t] > 0"],"why":"Erdős's 1947 Ramsey lower bound started it; it now drives coding theory, randomized algorithms and much of extremal combinatorics.","msc":["05D40","60C05"],"links":[{"field":"probability","note":"It applies probability to prove deterministic statements."},{"field":"computer-science","note":"Derandomisation turns these proofs into algorithms."}],"refs":["Alon & Spencer, The Probabilistic Method"],"status":null,"aliases":["random construction","Lovász local lemma","first moment","deletion method"],"fields":["combinatorics","probability"],"stage":"undergraduate","np":{"textbook":5,"olympiad":3,"bridge":0,"research":0,"examples":0},"nprob":8,"lesson":{"minutes":20,"checks":9,"fixed":1}},{"id":"set-systems","band":"discrete","title":"Extremal set theory","short":"Set systems","pre":["counting","pigeonhole"],"sum":"How large can a family of subsets of $[n]$ be under a restriction? Sperner bounds antichains, Erdős–Ko–Rado bounds intersecting families of $k$-sets, and the sunflower lemma finds structured subfamilies.","key":["|\\mathcal F| \\le \\binom{n}{\\lfloor n/2\\rfloor}\\ \\ \\text{(Sperner)}","|\\mathcal F| \\le \\binom{n-1}{k-1}\\ \\ \\text{if pairwise intersecting},\\ n\\ge 2k"],"why":"These bounds are the combinatorial core of results in coding theory, complexity lower bounds and the union-closed sets conjecture.","msc":["05D05"],"links":[{"field":"computer-science","note":"Sunflowers and set-system bounds give circuit lower bounds."}],"refs":["Jukna, Extremal Combinatorics"],"status":null,"aliases":["Sperner","Erdős–Ko–Rado","intersecting family","sunflower","antichain"],"fields":["combinatorics"],"stage":"undergraduate","np":{"textbook":1,"olympiad":4,"bridge":0,"research":13,"examples":0},"nprob":5,"lesson":{"minutes":20,"checks":9,"fixed":1}},{"id":"hypergraphs","band":"discrete","title":"Hypergraphs","short":"Hypergraphs","pre":["graph-basics","set-systems"],"sum":"Edges with any number of vertices. Turán and Ramsey questions become much harder: the Turán density of the $3$-uniform $K_4^{(3)}$ is still unknown.","key":["\\pi\\big(K_4^{(3)}\\big) \\overset{?}{=} \\tfrac59 \\ \\ \\text{(Turán's conjecture)}"],"why":"Hypergraph regularity and container methods power modern proofs of Szemerédi-type theorems.","msc":["05C65"],"links":[{"field":"number-theory","note":"Hypergraph removal lemmas prove multidimensional Szemerédi theorems."}],"refs":["Jukna, Extremal Combinatorics"],"status":null,"aliases":["uniform hypergraph","Turán density","containers"],"fields":["combinatorics"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":10,"research":27,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":9,"fixed":2}},{"id":"grids-tilings","band":"discrete","title":"Grids, tilings and board colourings","short":"Grids & tilings","pre":["invariants"],"sum":"Problems on chessboards and grids: tiling regions with dominoes or polyominoes, placing pieces, and colouring the board so a counting argument rules a configuration out.","key":["\\text{a mutilated } 8\\times8 \\text{ board (two opposite corners removed) has no domino tiling}"],"why":"The colouring trick is an invariant in disguise; domino tilings link to determinants and statistical physics.","msc":["05B45","52C20"],"links":[{"field":"physics","note":"Counting domino tilings is the dimer model (Kasteleyn, Temperley–Fisher)."}],"refs":["Engel, Problem-Solving Strategies"],"status":null,"aliases":["chessboard","domino","polyomino","tiling"],"fields":["combinatorics"],"stage":"olympiad","np":{"textbook":0,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":5,"lesson":{"minutes":16,"checks":7,"fixed":0}},{"id":"discrete-geometry","band":"discrete","title":"Combinatorial geometry","short":"Combinatorial geometry","pre":["pigeonhole","euclid-basics"],"sum":"Finite point sets in the plane: how many unit distances, how many distinct distances, when points must contain a convex $k$-gon, how lines and points can be incident.","key":["\\#\\text{unit distances} \\le O(n^{4/3})\\ \\ \\text{(Spencer–Szemerédi–Trotter)}","\\#\\text{distinct distances} \\ge c\\,\\frac{n}{\\log n}\\ \\ \\text{(Guth–Katz)}"],"why":"Erdős's distance problems pushed incidence geometry into polynomial methods; in May 2026 a counterexample to his unit distance conjecture, found by an AI model, was claimed.","msc":["52C10","52C35"],"links":[{"field":"combinatorics","note":"Incidence bounds are extremal graph theory on geometric graphs."},{"field":"ai-research","note":"OpenAI reported in May 2026 a counterexample to Erdős's 1946 unit distance conjecture."}],"refs":["Matoušek, Lectures on Discrete Geometry"],"status":null,"aliases":["unit distance","distinct distances","Erdős–Szekeres","Happy ending","incidences"],"fields":["geometry","combinatorics"],"stage":"graduate","np":{"textbook":0,"olympiad":5,"bridge":10,"research":55,"examples":0},"nprob":5,"lesson":{"minutes":20,"checks":9,"fixed":0}},{"id":"infinite-combinatorics","band":"discrete","title":"Infinite combinatorics and partition calculus","short":"Infinite combinatorics","pre":["ramsey"],"sum":"Ramsey theory for infinite sets and cardinals. The arrow notation $\\kappa \\to (\\lambda)^n_r$ asks whether every colouring of $n$-subsets of $\\kappa$ with $r$ colours has a homogeneous set of size $\\lambda$.","key":["\\aleph_0 \\to (\\aleph_0)^n_r \\ \\ \\text{(infinite Ramsey)}","2^{\\aleph_0} \\not\\to (\\aleph_1)^2_2 \\ \\ \\text{(Sierpiński)}"],"why":"Several of these questions are independent of ZFC, so the answer depends on the axioms.","msc":["03E02","05D10"],"links":[{"field":"logic","note":"Partition relations for large cardinals are set theory proper."}],"refs":["Graham, Rothschild & Spencer, Ramsey Theory"],"status":null,"aliases":["partition calculus","arrow notation","Erdős–Rado"],"fields":["combinatorics","logic"],"stage":"graduate","np":{"textbook":0,"olympiad":1,"bridge":10,"research":20,"examples":0},"nprob":1,"lesson":{"minutes":20,"checks":6,"fixed":1}},{"id":"partitions","band":"discrete","title":"Partitions of integers and sets","short":"Partitions","pre":["counting","generating-functions"],"sum":"A partition of an integer $n$ writes it as a sum of positive integers with order ignored, such as $4 = 2 + 1 + 1$; there are $p(n)$ of them, with generating function $\\prod_{k\\ge1}(1 - x^k)^{-1}$. A partition of a set splits it into nonempty blocks; Stirling numbers $S(n,k)$ count those with $k$ blocks and Bell numbers $B_n$ count all of them. The key tools are pictures (Ferrers diagrams), bijections, and products of generating functions.","key":["\\sum_{n\\ge0} p(n)\\,x^n = \\prod_{k\\ge1}\\frac{1}{1 - x^k}","\\prod_{k\\ge1}(1 + x^k) = \\prod_{k\\ge1}\\frac{1}{1 - x^{2k-1}} \\quad (\\text{distinct parts} = \\text{odd parts})","S(n,k) = S(n-1,k-1) + k\\,S(n-1,k), \\qquad B_n = \\sum_{k} S(n,k)"],"why":"Partitions count the ways of putting identical objects into identical boxes, which makes them basic to counting; they also index the conjugacy classes and irreducible representations of symmetric groups, and their arithmetic led to some of Ramanujan's most famous discoveries.","msc":["05A17","05A18","11P81"],"links":[{"field":"algebra","note":"Conjugacy classes of the symmetric group $S_n$ correspond to partitions of $n$ by cycle type, and abelian groups of order $p^n$ correspond to partitions of $n$, so both are counted by $p(n)$."},{"field":"representation-theory","note":"The irreducible representations of $S_n$ are indexed by partitions of $n$ through Young diagrams, and the hook length formula gives their dimensions."}],"refs":["Andrews, The Theory of Partitions","Andrews & Eriksson, Integer Partitions","Stanley, Enumerative Combinatorics, Volume 1"],"status":null,"aliases":["integer partitions","partition function","p(n)","Ferrers diagram","Young diagram","conjugate partition","Euler's partition theorem","pentagonal number theorem","set partitions","Stirling numbers of the second kind","Bell numbers","Ramanujan congruences"],"fields":["combinatorics","number-theory"],"stage":"olympiad","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":14,"fixed":0}},{"id":"planar-graphs","band":"discrete","title":"Planar graphs and Euler's formula","short":"Planar graphs","pre":["graph-basics"],"sum":"A graph is planar if it can be drawn in the plane without edges crossing; such a drawing divides the plane into faces. Euler's formula $V - E + F = 2$ holds for every connected plane drawing, and it forces planar graphs to be sparse: a simple planar graph with $V \\ge 3$ vertices has at most $3V - 6$ edges. This shows that $K_5$ and $K_{3,3}$ are not planar, and Kuratowski's theorem says these two are the only obstructions.","key":["V - E + F = 2 \\quad \\text{(connected plane graph)}","E \\le 3V - 6 \\quad (\\text{simple planar},\\ V \\ge 3), \\qquad E \\le 2V - 4 \\ \\ \\text{if there are no triangles}","G \\text{ planar} \\iff G \\text{ contains no subdivision of } K_5 \\text{ or } K_{3,3}"],"why":"Planarity decides whether a circuit can be printed on one layer and whether a map can be drawn without bridges, and Euler's formula is the first topological invariant most people meet; it explains why there are exactly five Platonic solids and why a football needs exactly twelve pentagons.","msc":["05C10"],"links":[{"field":"geometry","note":"Steinitz's theorem says the graphs of convex polyhedra are exactly the 3-connected planar graphs, so Euler's formula applies to every convex polyhedron and yields the classification of the Platonic solids."},{"field":"computer-science","note":"Planarity can be tested in linear time (Hopcroft and Tarjan, 1974), and planar separator theorems give fast divide-and-conquer algorithms for road networks and circuit layout."},{"field":"formal-verification","note":"The four colour theorem for planar maps, first proved with computer help in 1976, was fully formalised and machine-checked in the Coq proof assistant by Gonthier in 2005."}],"refs":["Diestel, Graph Theory","Rosen, Discrete Mathematics and Its Applications","Bondy & Murty, Graph Theory"],"status":null,"aliases":["planar graph","plane graph","Euler's formula","Euler characteristic","faces of a graph","Kuratowski's theorem","Wagner's theorem","K5","K3,3","utilities problem","five colour theorem","four colour theorem","dual graph"],"fields":["combinatorics","topology"],"stage":"school","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":10,"fixed":0}},{"id":"graph-algorithms","band":"discrete","title":"Shortest paths, spanning trees and graph search","short":"Graph algorithms","pre":["graph-basics","algorithms"],"sum":"Three basic questions about a network are answered by short greedy or layer-by-layer procedures: breadth-first and depth-first search decide reachability, Dijkstra's algorithm finds shortest paths when edge weights are non-negative, and Kruskal's and Prim's algorithms find a minimum spanning tree. The idea to remember is that each algorithm is correct because of one invariant: settled distances never change, and every edge chosen is

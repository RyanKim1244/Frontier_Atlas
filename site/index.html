s of convergence completely.","msc":["30B10","40A30"],"links":[{"field":"combinatorics","note":"Generating functions encode a sequence as the coefficients of a power series, so that recurrences become algebraic equations."},{"field":"complex-analysis","note":"Holomorphic functions are exactly those given locally by convergent power series, and the Taylor series at a point converges on the largest disc about that point to which the function extends holomorphically."},{"field":"differential-equations","note":"Linear equations with analytic coefficients have power-series solutions near ordinary points (and Frobenius series near regular singular points); this is how Legendre, Airy and Bessel functions arise."}],"refs":["Rudin, Principles of Mathematical Analysis","Spivak, Calculus","Abbott, Understanding Analysis"],"status":null,"aliases":["power series","radius of convergence","interval of convergence","Cauchy–Hadamard formula","termwise differentiation","analytic function","Maclaurin series"],"fields":["calculus","real-analysis"],"stage":"undergraduate","np":{"textbook":27,"olympiad":3,"bridge":0,"research":0,"examples":0},"nprob":30,"lesson":{"minutes":20,"checks":8,"fixed":1}},{"id":"partial-derivatives","band":"calculus","title":"Partial derivatives and the gradient","short":"Partial derivatives","pre":["diff-rules","vectors-plane"],"sum":"A partial derivative of a function of several variables is its ordinary derivative in one variable while the others are held fixed. The partial derivatives assemble into the gradient vector $\\nabla f$, which, for a differentiable $f$, gives the rate of change in every direction by a dot product, points (when nonzero) in the direction of steepest increase, and is perpendicular to the level sets.","key":["\\frac{\\partial f}{\\partial x}(a,b) = \\lim_{h\\to 0}\\frac{f(a+h,b) - f(a,b)}{h}","\\nabla f = \\Big(\\frac{\\partial f}{\\partial x_1}, \\dots, \\frac{\\partial f}{\\partial x_n}\\Big), \\qquad D_{\\mathbf u} f(\\mathbf a) = \\nabla f(\\mathbf a)\\cdot\\mathbf u","\\frac{d}{dt} f(\\mathbf r(t)) = \\nabla f(\\mathbf r(t)) \\cdot \\mathbf r'(t)"],"why":"Almost every quantity in science depends on more than one variable, and partial derivatives are how its sensitivity to each one is measured. Gradients drive optimisation, from Lagrange multipliers to the gradient descent that trains neural networks, and the laws of physics are written as partial differential equations.","msc":["26B05"],"links":[{"field":"pde","note":"Partial differential equations such as the heat, wave and Laplace equations are relations between the partial derivatives of an unknown function."},{"field":"ai-research","note":"Neural networks are trained by gradient descent, moving parameters against the gradient of a loss function computed by the multivariable chain rule (backpropagation)."},{"field":"physics","note":"A conservative force is minus the gradient of a potential energy, and thermodynamics is largely a calculus of partial derivatives with specified variables held fixed."}],"refs":["Apostol, Calculus, Vol. 2","Marsden & Tromba, Vector Calculus","Courant & John, Introduction to Calculus and Analysis, Vol. 2"],"status":null,"aliases":["partial derivative","gradient","directional derivative","multivariable chain rule","tangent plane","Hessian","Clairaut's theorem","Schwarz's theorem","critical point"],"fields":["calculus"],"stage":"undergraduate","np":{"textbook":21,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":26,"lesson":{"minutes":20,"checks":9,"fixed":1}},{"id":"multiple-integrals","band":"calculus","title":"Multiple integrals and change of variables","short":"Multiple integrals","pre":["ftc","partial-derivatives","determinants"],"sum":"A double or triple integral adds up a quantity over a region of the plane or of space, as a limit of sums over small rectangles or boxes. Fubini's theorem computes it as iterated one-variable integrals, and the change of variables formula lets you switch to coordinates adapted to the region, at the cost of a factor $|\\det DT|$ that measures how the substitution stretches area or volume.","key":["\\iint_{[a,b]\\times[c,d]} f\\,dA = \\int_a^b\\!\\!\\int_c^d f(x,y)\\,dy\\,dx = \\int_c^d\\!\\!\\int_a^b f(x,y)\\,dx\\,dy","\\iint_{T(D)} f(x,y)\\,dx\\,dy = \\iint_D f(T(u,v))\\,\\big|\\det DT(u,v)\\big|\\,du\\,dv","dx\\,dy = r\\,dr\\,d\\theta, \\qquad dV = \\rho^2\\sin\\varphi\\,d\\rho\\,d\\varphi\\,d\\theta"],"why":"Masses, centres of mass, moments of inertia, probabilities of events involving several random variables, and fluxes are all multiple integrals. The polar-coordinate computation of $\\int_{-\\infty}^\\infty e^{-x^2}\\,dx = \\sqrt\\pi$ is how the constant $\\frac{1}{\\sqrt{2\\pi}}$ in the normal density is found.","msc":["26B15"],"links":[{"field":"probability","note":"Probabilities and expectations for jointly continuous random variables are double or triple integrals of a joint density, and changes of variables give the densities of sums and ratios."},{"field":"physics","note":"Mass, centre of mass, moments of inertia and gravitational or electric potentials of extended bodies are computed as triple integrals, usually in cylindrical or spherical coordinates."},{"field":"special-functions","note":"Changing variables in a double integral proves Gamma(1/2) = sqrt(pi) and the relation between the beta and gamma functions."}],"refs":["Apostol, Calculus, Vol. 2","Marsden & Tromba, Vector Calculus","Spivak, Calculus on Manifolds"],"status":null,"aliases":["double integral","triple integral","iterated integral","Fubini's theorem","change of variables","Jacobian","polar coordinates","spherical coordinates","Gaussian integral"],"fields":["calculus"],"stage":"undergraduate","np":{"textbook":19,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":24,"lesson":{"minutes":20,"checks":9,"fixed":2}},{"id":"vector-calculus","band":"calculus","title":"Line integrals and the theorems of Green, Stokes and Gauss","short":"Vector calculus","pre":["multiple-integrals"],"sum":"Vector calculus integrates vector fields along curves (work, circulation) and across surfaces (flux), and its three great theorems, Green's, Stokes' and the divergence theorem of Gauss, each say that the integral of a derivative over a region equals an integral over the region's boundary. They are the higher-dimensional versions of the fundamental theorem of calculus.","key":["\\oint_{\\partial D} P\\,dx + Q\\,dy = \\iint_D \\Big(\\frac{\\partial Q}{\\partial x} - \\frac{\\partial P}{\\partial y}\\Big)\\,dA","\\oint_{\\partial S} \\mathbf F\\cdot d\\mathbf r = \\iint_S (\\nabla\\times\\mathbf F)\\cdot\\mathbf n\\,dS","\\iint_{\\partial E} \\mathbf F\\cdot\\mathbf n\\,dS = \\iiint_E \\nabla\\cdot\\mathbf F\\,dV"],"why":"Maxwell's equations of electromagnetism, the conservation laws of fluid dynamics and the heat equation are all derived and usually stated with these theorems. In mathematics, Green's theorem gives Cauchy's theorem in complex analysis, and the general Stokes theorem for differential forms is a basic tool of differential geometry and topology.","msc":["26B20","26B12"],"links":[{"field":"pde","note":"Conservation laws such as the heat, continuity and Navier–Stokes equations are derived by applying the divergence theorem to an arbitrary small region."},{"field":"complex-analysis","note":"Green's theorem combined with the Cauchy–Riemann equations gives a short proof of Cauchy's integral theorem for functions with continuous derivative."},{"field":"topology","note":"A curl-free field that is not a gradient, such as the winding field around a puncture, detects a hole in the domain; this is the simplest example of de Rham cohomology."}],"refs":["Marsden & Tromba, Vector Calculus","Schey, Div, Grad, Curl, and All That","Apostol, Calculus, Vol. 2"],"status":null,"aliases":["line integral","surface integral","flux","circulation","Green's theorem","Stokes' theorem","divergence theorem","Gauss's theorem","curl","divergence","conservative field"],"fields":["calculus","physics"],"stage":"undergraduate","np":{"textbook":10,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":11,"lesson":{"minutes":20,"checks":10,"fixed":4}},{"id":"lagrange-multipliers","band":"calculus","title":"Constrained optimisation and Lagrange multipliers","short":"Lagrange multipliers","pre":["partial-derivatives"],"sum":"To find the largest or smallest value of $f(\\mathbf x)$ among the points satisfying a constraint $g(\\mathbf x) = c$, look among the points where the two gradients are parallel, $\\nabla f = \\lambda \\nabla g$, together with any points of the constraint set where $\\nabla g = \\mathbf 0$. Geometrically, at a constrained extremum the level set of $f$ touches the constraint set tangentially; when the optimum depends smoothly on $c$, the multiplier $\\lambda$ is the rate at which the optimal value changes with $c$.","key":["\\nabla f(\\mathbf a) = \\lambda\\, \\nabla g(\\mathbf a), \\qquad g(\\mathbf a) = c \\qquad (\\nabla g(\\mathbf a) \\ne \\mathbf 0)","\\mathcal L(\\mathbf x, \\lambda) = f(\\mathbf x) - \\lambda\\,\\bigl(g(\\mathbf x) - c\\bigr), \\qquad \\nabla_{\\mathbf x,\\lambda}\\, \\mathcal L = \\mathbf 0","\\nabla f(\\mathbf a) = \\lambda_1 \\nabla g_1(\\mathbf a) + \\dots + \\lambda_m \\nabla g_m(\\mathbf a) \\quad \\text{for } m \\text{ constraints with independent gradients}"],"why":"It turns a constrained optimisation problem into a system of equations, which is how one finds optimal designs, equilibrium states of physical systems and maximum-entropy probability distributions, and it gives a quick route to many inequalities.","msc":[],"links":[{"field":"linear-algebra","note":"Maximising $\\mathbf x^{T} A \\mathbf x$ on the unit sphere leads to $A\\mathbf x = \\lambda \\mathbf x$, so the extreme values of a quadratic form are the extreme eigenvalues of its symmetric matrix."},{"field":"physics","note":"Maximising entropy subject to fixed total probability and fixed mean energy produces the Boltzmann distribution, with the inverse temperature appearing as a Lagrange multiplier."},{"field":"ai-research","note":"Constrained training objectives and support vector machines are analysed through Lagrangians and their inequality-constraint extension, the Karush–Kuhn–Tucker conditions."}],"refs":["Apostol, Calculus, Volume II","Marsden & Tromba, Vector Calculus","Stewart, Calculus"],"status":null,"aliases":["Lagrange multiplier","method of Lagrange multipliers","constrained extremum","constrained optimization","Lagrangian"],"fields":["calculus"],"stage":"undergraduate","np":{"textbook":0,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":1,"lesson":{"minutes":17,"checks":10,"fixed":0}},{"id":"integral-applications","band":"calculus","title":"Applications of the integral: area, volume, length and work","short":"Applications of integrals","pre":["ftc"],"sum":"Many quantities (area, volume, length, work, total change) are built by cutting an object into thin pieces, approximating each piece by something simple, and adding: in the limit the sum becomes an integral. The one idea to remember is the recipe 'slice, approximate, sum, take the limit', for example $V = \\int_a^b A(x)\\,dx$ where $A(x)$ is the area of the cross-section at $x$.","key":["\\text{Area between curves: } \\int_a^b \\bigl(f(x)-g(x)\\bigr)\\,dx \\quad (f \\ge g)","V = \\int_a^b A(x)\\,dx, \\qquad L = \\int_a^b \\sqrt{1+f'(x)^2}\\,dx, \\qquad W = \\int_a^b F(x)\\,dx","\\bar f = \\frac{1}{b-a}\\int_a^b f(x)\\,dx, \\qquad x(b) - x(a) = \\int_a^b v(t)\\,dt"],"why":"These formulas are how calculus is actually used: the volume of a tank, the work needed to pump it empty, the distance travelled from a speedometer record, and the average temperature over a day are all integrals of this kind.","msc":["26A06"],"links":[{"field":"geometry","note":"Volumes of solids such as cones, balls and tori, and Cavalieri's principle, follow from integrating areas of cross-sections."},{"field":"probability","note":"Probabilities and expected values of continuous random variables are areas and weighted averages computed as integrals of a density."}],"refs":["Stewart, Calculus: Early Transcendentals","Apostol, Calculus, Vol. 1","Spivak, Calculus"],"status":null,"aliases":["applications of integration","area between curves","volume of revolution","disc method","washer method","shell method","arc length","work integral","average value of a function","net change","displacement and distance","accumulation function"],"fields":["calculus","physics"],"stage":"school","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":9,"fixed":0}},{"id":"parametric-polar","band":"calculus","title":"Parametric curves and polar coordinates","short":"Parametric & polar curves","pre":["trig","derivative"],"sum":"A parametric curve gives both coordinates as functions of a parameter, $(x(t), y(t))$, which lets a curve loop, cross itself and record how it is traced; polar coordinates locate a point by its distance $r$ from the origin and its angle $\\theta$. Calculus carries over through the chain rule: slopes are ratios of rates, $dy/dx = \\dot y/\\dot x$, and areas in polar coordinates are swept out by thin sectors, $\\tfrac12 r^2\\,d\\theta$.","key":["\\frac{dy}{dx} = \\frac{dy/dt}{dx/dt}, \\qquad L = \\int_a^b \\sqrt{x'(t)^2 + y'(t)^2}\\,dt","x = r\\cos\\theta,\\quad y = r\\sin\\theta, \\qquad A = \\frac12\\int_\\alpha^\\beta r(\\theta)^2\\,d\\theta","L = \\int_\\alpha^\\beta \\sqrt{r^2 + \\left(\\frac{dr}{d\\theta}\\right)^2}\\,d\\theta"],"why":"Motion is naturally parametric (position as a function of time), and many curves with rotational symmetry, from spirals and roses to planetary orbits $r = \\ell/(1 + e\\cos\\theta)$, have simple polar equations but messy Cartesian ones.","msc":["53A04"],"links":[{"field":"physics","note":"Trajectories of projectiles and planets are parametric curves, and Kepler's second law says a planet's polar area rate $\\tfrac12 r^2\\dot\\theta$ is constant."},{"field":"complex-analysis","note":"The polar form $re^{i\\theta}$ of a complex number is polar coordinates in the plane, and contour integrals are taken along parametrised curves."}],"refs":["Stewart, Calculus: Early Transcendentals","Apostol, Calculus, Vol. 1"],"status":null,"aliases":["parametric equations","parametrized curve","polar coordinates","polar graphs","cardioid","rose curve","cycloid","polar area","arc length of parametric curve","slope of polar curve"],"fields":["calculus","geometry"],"stage":"school","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":8,"fixed":4}},{"id":"real-numbers","band":"realanalysis","title":"The real numbers and completeness","short":"Completeness of the reals","pre":[],"sum":"The real numbers form an ordered field with one extra property that the rationals lack: every nonempty set of reals that is bounded above has a least upper bound, its supremum. This completeness axiom fills the gaps in $\\mathbb Q$ (such as the missing $\\sqrt2$), and every existence theorem of analysis, from the intermediate value theorem to the convergence of monotone sequences, ultimately rests on it.","key":["S \\subseteq \\mathbb R,\\ S \\ne \\varnothing,\\ S \\text{ bounded above} \\;\\Longrightarrow\\; \\sup S \\text{ exists in } \\mathbb R","s = \\sup S \\iff \\bigl(x \\le s \\text{ for all } x \\in S\\bigr) \\text{ and } \\bigl(\\forall \\varepsilon > 0\\ \\exists x \\in S:\\ x > s - \\varepsilon\\bigr)","\\forall x \\in \\mathbb R\\ \\exists n \\in \\mathbb N:\\ n > x \\qquad \\text{(Archimedean property)}"],"why":"Without completeness, $x^2 - 2$ would change sign on $[1, 2]$ without ever being zero, increasing bounded sequences need not converge, and numbers such as $\\sqrt2$, $e$ and $\\pi$ would not exist; completeness is what makes calculus work.","msc":["26A03"],"links":[{"field":"logic","note":"Dedekind cuts and Cauchy sequences construct $\\mathbb R$ from $\\mathbb Q$ inside set theory, and the completeness axiom is the one axiom of the reals that is not first-order."},{"field":"number-theory","note":"The Archimedean property and the pigeonhole principle give Dirichlet's approximation theorem, the starting point of Diophantine approximation, and completing $\\mathbb Q$ with other absolute values gives the $p$-adic numbers."},{"field":"topology","note":"Completeness is what makes intervals connected and closed bounded intervals compact, the two properties of the line that topology generalises."}],"refs":["Rudin, Principles of Mathematical Analysis","Abbott, Understanding Analysis","Spivak, Calculus"],"status":null,"aliases":["least upper bound property","supremum","infimum","completeness axiom","Archimedean property","Dedekind completeness","real number system"],"fields":["real-analysis"],"stage":"undergraduate","np":{"textbook":22,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":22,"lesson":{"minutes":20,"checks":10,"fixed":2}},{"id":"seq-limits","band":"realanalysis","title":"Convergence of sequences","short":"Convergent sequences","pre":["real-numbers"],"sum":"A sequence $(a_n)$ converges to $L$ if for every $\\varepsilon > 0$ there is an $N$ such that $|a_n - L| < \\varepsilon$ for all $n \\ge N$: however small a tolerance you name, the terms eventually stay within it. Limits are unique and respect arithmetic, and by the completeness of $\\mathbb R$ every bounded monotone sequence converges, every bounded sequence has a convergent subsequence, and a sequence converges exactly when it is Cauchy.","key":["a_n \\to L \\iff \\forall \\varepsilon > 0\\ \\exists N\\ \\forall n \\ge N:\\ |a_n - L| < \\varepsilon","(a_n) \\text{ increasing and bounded above} \\;\\Longrightarrow\\; a_n \\to \\sup_n a_n","(a_n) \\text{ converges} \\iff \\forall \\varepsilon > 0\\ \\exists N\\ \\forall m, n \\ge N:\\ |a_m - a_n| < \\varepsilon"],"why":"Derivatives, integrals, infinite sums and numbers such as $e$ and $\\sqrt 2$ are all defined as limits of sequences, so this definition is the foundation on which the rest of analysis is built.","msc":["40A05","26A03"],"links":[{"field":"computer-science","note":"Iterative algorithms such as Newton's method are judged by how fast their sequences of approximations converge; the Babylonian square-root iteration roughly doubles the number of correct digits at each step."},{"field":"probability","note":"The laws of large numbers say that sequences of sample averages converge, in senses built on this definition, to the expected value."},{"field":"number-theory","note":"Irrational numbers are studied through sequences of rational approximations, such as continued fraction convergents, and the speed of convergence measures how well a number can be approximated."}],"refs":["Abbott, Understanding Analysis","Rudin, Principles of Mathematical Analysis","Bartle & Sherbert, Introduction to Real Analysis"],"status":null,"aliases":["limit of a sequence","epsilon-N definition","monotone convergence theorem","Bolzano–Weierstrass theorem","Cauchy sequence","Cauchy criterion"],"fields":["real-analysis"],"stage":"undergraduate","np":{"textbook":44,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":49,"lesson":{"minutes":17,"checks":9,"fixed":0}},{"id":"metric-spaces","band":"realanalysis","title":"Metric spaces","short":"Metric spaces","pre":["seq-limits"],"sum":"A metric space is a set $X$ with a distance function $d$ that is zero exactly when the two points coincide (and positive otherwise), symmetric, and satisfies the triangle inequality. Once distance is available, convergence, open and closed sets, continuity and Cauchy sequences all make sense, whether the points are vectors, functions, strings or $p$-adic integers. In a complete metric space every contraction has a unique fixed point (Banach's theorem), which is a basic tool for proving that equations have solutions.","key":["d(x, y) \\ge 0,\\quad d(x, y) = 0 \\iff x = y,\\quad d(x, y) = d(y, x),\\quad d(x, z) \\le d(x, y) + d(y, z)","x_n \\to x \\iff d(x_n, x) \\to 0, \\qquad U \\text{ open} \\iff \\forall x \\in U\\ \\exists r > 0:\\ B(x, r) \\subseteq U","X \\text{ complete},\\ d(Tx, Ty) \\le q\\, d(x, y),\\ 0 \\le q < 1 \\;\\Longrightarrow\\; \\exists!\\, x^* \\in X:\\ Tx^* = x^*"],"why":"Metric spaces let one theory of limits cover numbers, vectors and functions at once; the contraction principle is the core of the standard proofs of the existence theorem for differential equations and of the inverse function theorem, and it explains the convergence of many numerical iterations.","msc":["54E35","54E50"],"links":[{"field":"number-theory","note":"The $p$-adic distance $|x - y|_p = p^{-v_p(x - y)}$ makes integers close when their difference is divisible by a high power of $p$; completing $\\mathbb Q$ for it gives the $p$-adic numbers."},{"field":"computer-science","note":"The Hamming distance between strings measures how many symbols differ, and error-correcting codes are sets of strings that are far apart in this metric."},{"field":"geometry","note":"Changing the metric on $\\mathbb R^2$ changes the shape of circles, from the round Euclidean disc to the diamond of the taxicab metric and the square of the maximum metric."}],"refs":["Sutherland, Introduction to Metric and Topological Spaces","Rudin, Principles of Mathematical Analysis","Kaplansky, Set Theory and Metric Spaces"],"status":null,"aliases":["metric","distance function","triangle inequality","complete metric space","Banach fixed-point theorem","contraction mapping principle"],"fields":["real-analysis","topology"],"stage":"undergraduate","np":{"textbook":39,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":39,"lesson":{"minutes":20,"checks":10,"fixed":1}},{"id":"compactness","band":"realanalysis","title":"Compactness","short":"Compactness","pre":["metric-spaces","continuity"],"sum":"A metric space $K$ is compact if every sequence in $K$ has a subsequence converging to a point of $K$; equivalently, every cover of $K$ by open sets has a finite subcover. In $\\mathbb R^n$ the compact sets are exactly the closed and bounded ones (Heine–Borel). Continuous real functions on a nonempty compact set are bounded, attain a maximum and a minimum, and are uniformly continuous.","key":["K \\text{ compact} \\iff \\text{every sequence in } K \\text{ has a subsequence converging in } K \\quad (K \\text{ a metric space})","K \\subseteq \\mathbb R^n:\\quad K \\text{ compact} \\iff K \\text{ closed and bounded}","f : K \\to \\mathbb R \\text{ continuous},\\ K \\ne \\varnothing \\text{ compact} \\;\\Longrightarrow\\; \\exists\\, a, b \\in K:\\ f(a) = \\max_K f,\\ f(b) = \\min_K f"],"why":"Compactness is what guarantees that optimisation problems have solutions and that local estimates can be made global; it is behind the extreme value theorem, the integrability of continuous functions, and countless existence proofs.","msc":["54D30"],"links":[{"field":"logic","note":"The compactness theorem of first-order logic (a set of sentences has a model if every finite subset does) is named for the same finite-subcover phenomenon and is equivalent to the compactness of a certain topological space."},{"field":"combinatorics","note":"Compactness arguments such as König's lemma pass from finite to infinite statements, for example from $k$-colourings of every finite subgraph to a $k$-colouring of an infinite graph."},{"field":"linear-algebra","note":"Compactness of the unit sphere in $\\mathbb R^n$ shows that all norms on a finite-dimensional space are equivalent and that a symmetric matrix attains its largest eigenvalue as the maximum of $\\mathbf x^T A \\mathbf x$ on the sphere."}],"refs":["Rudin, Principles of Mathematical Analysis","Abbott, Understanding Analysis","Munkres, Topology"],"status":null,"aliases":["compact set","Heine–Borel theorem","sequential compactness","extreme value theorem","open cover","Heine–Cantor theorem","finite subcover"],"fields":["real-analysis","topology"],"stage":"undergraduate","np":{"textbook":15,"olympiad":2,"bridge":0,"research":0,"examples":0},"nprob":17,"lesson":{"minutes":18,"checks":9,"fixed":2}},{"id":"uniform-convergence","band":"realanalysis","title":"Uniform convergence","short":"Uniform convergence","pre":["seq-limits","series","continuity"],"sum":"A sequence of functions $f_n$ converges uniformly to $f$ on a set $E$ when the worst-case error $\\sup_{x \\in E}|f_n(x) - f(x)|$ tends to $0$, so that one $N$ works for every point at once. Unlike pointwise convergence, uniform convergence preserves continuity and lets limits pass through integrals over bounded intervals.","key":["f_n \\to f \\text{ uniformly on } E \\iff \\sup_{x \\in E} |f_n(x) - f(x)| \\to 0","f_n \\text{ continuous},\\ f_n \\to f \\text{ uniformly} \\implies f \\text{ continuous}","|f_k(x)| \\le M_k \\text{ on } E,\\ \\sum_k M_k < \\infty \\implies \\sum_k f_k \\text{ converges uniformly on } E"],"why":"It is the condition to check before swapping a limit with an integral, a sum or another limit, which is how power series, Fourier series and approximate solutions of differential equations are handled rigorously.","msc":["40A30"],"links":[{"field":"complex-analysis","note":"A limit of holomorphic functions that is uniform on compact sets is holomorphic (Weierstrass), which is how functions defined by series, such as the zeta function, are shown to be analytic."},{"field":"harmonic-analysis","note":"A Fourier series whose coefficients are absolutely summable converges uniformly by the M-test, so it sums to a continuous function; finer convergence questions for Fourier series shaped much of analysis."},{"field":"differential-equations","note":"Picard iteration produces approximations that converge uniformly to the solution of an initial value problem, which is how existence of solutions is proved."}],"refs":["Rudin, Principles of Mathematical Analysis","Abbott, Understanding Analysis","Spivak, Calculus"],"status":null,"aliases":["uniform limit","sup-norm convergence","Weierstrass M-test","pointwise versus uniform convergence","uniformly Cauchy"],"fields":["real-analysis"],"stage":"undergraduate","np":{"textbook":32,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":32,"lesson":{"minutes":20,"checks":11,"fixed":1}},{"id":"lebesgue","band":"realanalysis","title":"Measure and the Lebesgue integral","short":"Lebesgue integral","pre":["riemann-integral","compactness"],"sum":"Lebesgue measure extends length from intervals to a vast class of subsets of $\\mathbb R$ while keeping countable additivity, and the Lebesgue integral is built by slicing the range of a function rather than its domain. The payoff is a theory in which limits and integrals can be interchanged under simple hypotheses, above all the dominated convergence theorem.","key":["m^*(A) = \\inf\\Big\\{ \\sum_{k=1}^\\infty \\ell(I_k) : A \\subseteq \\bigcup_{k=1}^\\infty I_k,\\ I_k \\text{ open intervals} \\Big\\}","\\int f\\,d\\mu = \\sup\\Big\\{ \\int s\\,d\\mu : 0 \\le s \\le f,\\ s \\text{ simple} \\Big\\} \\quad (f \\ge 0)","f_n \\text{ measurable},\\ f_n \\to f \\text{ a.e.},\\ |f_n| \\le g,\\ \\int g\\,d\\mu < \\infty \\implies \\int f_n\\,d\\mu \\to \\int f\\,d\\mu"],"why":"It is the integral of modern analysis and probability: $L^p$ spaces, Fourier analysis, partial differential equations and the definition of expectation all rest on it, mainly because its convergence theorems make limiting arguments routine.","msc":["28A25","28A12"],"links":[{"field":"harmonic-analysis","note":"The Riesz–Fischer theorem, that $L^2$ is complete, makes Fourier coefficients an isometry from $L^2$ of the circle onto square-summable sequences (Parseval's identity)."},{"field":"pde","note":"Weak solutions and Sobolev spaces are defined through Lebesgue integrals, and the completeness of $L^p$ spaces is what makes existence proofs work."},{"field":"physics","note":"The wave functions of quantum mechanics are elements of $L^2$, the space of functions whose square is Lebesgue integrable."}],"refs":["Folland, Real Analysis: Modern Techniques and Their Applications","Stein & Shakarchi, Real Analysis: Measure Theory, Integration, and Hilbert Spaces","Royden, Real Analysis"],"status":null,"aliases":["Lebesgue measure","measure theory","outer measure","dominated convergence theorem","monotone convergence theorem","Fatou's lemma","almost everywhere","null set"],"fields":["real-analysis","probability"],"stage":"graduate","np":{"textbook":15,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":15,"lesson":{"minutes":24,"checks":13,"fixed":3}},{"id":"inverse-function-theorem","band":"realanalysis","title":"The inverse and implicit function theorems","short":"Inverse function theorem","pre":["partial-derivatives","linear-maps","contraction-mapping"],"sum":"If a $C^1$ map $f:\\mathbb{R}^n\\to\\mathbb{R}^n$ has an invertible derivative matrix at a point, then near that point it has a $C^1$ inverse, whose derivative is the inverse matrix. The implicit function theorem is the equation-solving form: $F(x,y)=0$ can be solved locally as $y=g(x)$ when $\\partial F/\\partial y$ is invertible. Both are local statements: an invertible linearisation controls the map only nearby.","key":["\\det Df(a)\\neq 0 \\;\\Longrightarrow\\; f \\text{ is a } C^1 \\text{ diffeomorphism near } a,\\quad D(f^{-1})(f(x)) = Df(x)^{-1}","F(a,b)=0,\\ \\det D_yF(a,b)\\neq 0 \\;\\Longrightarrow\\; F(x,y)=0 \\iff y=g(x) \\text{ near } (a,b)","Dg(x) = -\\big(D_yF(x,g(x))\\big)^{-1} D_xF(x,g(x))"],"why":"They justify treating nondegenerate level sets as smooth curves and surfaces, underlie Lagrange multipliers and changes of variables, and are the basic tool for building charts on manifolds and for showing that solutions of equations depend smoothly on parameters.","msc":["26B10"],"links":[{"field":"differential-geometry","note":"Regular level sets of submersions are smooth manifolds by the implicit function theorem, and the inverse function theorem produces local coordinates from immersions and submersions."},{"field":"optimisation","note":"The Lagrange multiplier rule for equality-constrained optimisation is proved by using the implicit function theorem to write the constraint set locally as a graph."}],"refs":["Rudin, Principles of Mathematical Analysis","Spivak, Calculus on Manifolds","Lee, Introduction to Smooth Manifolds"],"status":null,"aliases":["inverse function theorem","implicit function theorem","Jacobian","local diffeomorphism","local inverse","regular value","implicit differentiation","constant rank theorem"],"fields":["real-analysis","calculus"],"stage":"undergraduate","np":{"textbook":17,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":17,"lesson":{"minutes":22,"checks":8,"fixed":0}},{"id":"contraction-mapping","band":"realanalysis","title":"The contraction mapping principle and Picard's theorem","short":"Contraction mapping","pre":["metric-spaces","ode-first"],"sum":"A contraction is a map $T$ of a metric space with $d(Tx,Ty)\\le q\\,d(x,y)$ for a fixed $q<1$. On a complete metric space it has exactly one fixed point, and iterating $T$ from any start converges to it geometrically. Applied to the integral form of $y'=f(t,y)$ on a space of continuous functions, it gives Picard's theorem: a Lipschitz right-hand side yields a unique local solution.","key":["d(Tx,Ty)\\le q\\,d(x,y),\\ q<1,\\ X \\text{ complete} \\;\\Longrightarrow\\; \\exists!\\,x^*:\\ Tx^*=x^*","d(x_n,x^*)\\le \\frac{q^n}{1-q}\\,d(x_1,x_0)","y(t)=y_0+\\int_{t_0}^{t} f(s,y(s))\\,ds"],"why":"It turns 'solve this equation' into 'iterate this map', with explicit error bounds: it proves existence and uniqueness for ODEs, underlies the inverse function theorem, and justifies fixed-point methods in numerical analysis.","msc":["47H10","54H25","34A12"],"links":[{"field":"numerical-analysis","note":"Fixed-point iterations for nonlinear equations, and implicit time-stepping schemes for ODEs, are analysed by showing the iteration is a contraction, which also gives computable error bounds."},{"field":"functional-analysis","note":"In Banach spaces the principle solves nonlinear integral and operator equations of the form x = Tx, for example Volterra and Fredholm equations with small kernels."}],"refs":["Kreyszig, Introductory Functional Analysis with Applications","Süli & Mayers, An Introduction to Numerical Analysis","Lee, Introduction to Smooth Manifolds"],"status":null,"aliases":["Banach fixed point theorem","contraction mapping theorem","fixed-point iteration","Picard–Lindelöf theorem","Picard's theorem","Picard iteration","Cauchy–Lipschitz theorem","existence and uniqueness theorem","Lipschitz condition"],"fields":["real-analysis","differential-equations"],"stage":"undergraduate","np":{"textbook":17,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":17,"lesson":{"minutes":20,"checks":10,"fixed":0}},{"id":"arzela-ascoli","band":"realanalysis","title":"The Arzelà–Ascoli and Stone–Weierstrass theorems","short":"Arzelà–Ascoli & Stone–Weierstrass","pre":["uniform-convergence","compactness"],"sum":"On a compact metric space $K$, a family of continuous functions has a uniformly convergent subsequence from every sequence exactly when it is uniformly bounded and equicontinuous (Arzelà–Ascoli). Complementing this, any algebra of continuous functions on $K$ that contains the constants and separates points is dense in $C(K)$ for the sup norm (Stone–Weierstrass); in particular polynomials approximate every continuous function on $[a,b]$ uniformly.","key":["\\mathcal{F}\\subseteq C(K) \\text{ relatively compact} \\iff \\mathcal{F} \\text{ uniformly bounded and equicontinuous}","\\forall f\\in C[a,b],\\ \\forall \\varepsilon>0\\ \\exists \\text{ polynomial } p:\\ \\|f-p\\|_\\infty<\\varepsilon","B_nf(x)=\\sum_{k=0}^n f\\!\\left(\\tfrac kn\\right)\\binom nk x^k(1-x)^{n-k}\\ \\rightrightarrows\\ f"],"why":"Arzelà–Ascoli is the standard tool for producing solutions as limits (Peano's theorem, compact integral operators, normal families in the Riemann mapping theorem), and Stone–Weierstrass justifies approximating continuous functions by polynomials or trigonometric polynomials.","msc":["41A10"],"links":[{"field":"differential-equations","note":"Peano's existence theorem for $y'=f(t,y)$ with continuous $f$ is proved by extracting a uniformly convergent subsequence of Euler polygons using Arzelà–Ascoli."},{"field":"complex-analysis","note":"Montel's theorem on normal families of holomorphic functions, a key step in the Riemann mapping theorem, is Arzelà–Ascoli combined with the Cauchy estimates."},{"field":"numerical-analysis","note":"The Weierstrass theorem guarantees that polynomial approximation of a continuous function can be made uniformly accurate, the starting point of approximation theory."}],"refs":["Rudin, Principles of Mathematical Analysis","Folland, Real Analysis: Modern Techniques and Their Applications","Munkres, Topology"],"status":null,"aliases":["Arzelà–Ascoli theorem","Ascoli's theorem","Arzela-Ascoli","equicontinuity","equicontinuous family","Stone–Weierstrass theorem","Weierstrass approximation theorem","Bernstein polynomials","uniform approximation","relatively compact subsets of C(K)"],"fields":["real-analysis","topology"],"stage":"undergraduate","np":{"textbook":19,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":19,"lesson":{"minutes":22,"checks":8,"fixed":0}},{"id":"lp-spaces","band":"realanalysis","title":"L^p spaces","short":"L^p spaces","pre":["lebesgue","normed-spaces"],"sum":"For $1\\le p<\\infty$, $L^p(X,\\mu)$ is the space of measurable functions with $\\|f\\|_p=(\\int|f|^p\\,d\\mu)^{1/p}<\\infty$, modulo equality almost everywhere; $L^\\infty$ uses the essential supremum. Hölder's and Minkowski's inequalities make each $L^p$ a normed space, the Riesz–Fischer theorem makes it complete, and $L^2$ is a Hilbert space. The exponent $p$ trades off penalising tall spikes (large $p$) against penalising slow decay (small $p$).","key":["\\|fg\\|_1 \\le \\|f\\|_p\\,\\|g\\|_q,\\qquad \\tfrac1p+\\tfrac1q=1","\\|f+g\\|_p \\le \\|f\\|_p+\\|g\\|_p","\\mu(X)<\\infty,\\ p<q \\;\\Longrightarrow\\; \\|f\\|_p \\le \\mu(X)^{\\frac1p-\\frac1q}\\,\\|f\\|_q"],"why":"They are the standard complete function spaces of analysis: Fourier analysis lives in $L^2$, PDE estimates and Sobolev spaces are built on $L^p$, and in probability $L^p$ norms are moments and $L^2$ is the space of finite-variance random variables.","msc":["46E30"],"links":[{"field":"probability","note":"Moments are $L^p$ norms of random variables, $L^2$ convergence is mean-square convergence, and Hölder and Jensen-type inequalities on a probability space bound expectations of products."},{"field":"harmonic-analysis","note":"Plancherel makes the Fourier transform an isometry of $L^2$, and interpolation between $L^1$ and $L^2$ gives the Hausdorff–Young inequality for $1\\le p\\le 2$."},{"field":"pde","note":"Weak solutions and energy estimates are formulated in Sobolev spaces, whose norms are $L^p$ norms of a function and its derivatives."}],"refs":["Folland, Real Analysis: Modern Techniques and Their Applications","Brezis, Functional Analysis, Sobolev Spaces and Partial Differential Equations","Rudin, Real and Complex Analysis"],"status":null,"aliases":["Lp space","L^p space","Lebesgue spaces","lp sequence spaces","Hölder's inequality","Minkowski's inequality","Riesz–Fischer theorem","essential supremum","conjugate exponent","Young's inequality"],"fields":["real-analysis","functional-analysis"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":24,"checks":9,"fixed":1}},{"id":"complex-numbers","band":"complex","title":"Complex numbers and functions","short":"Complex numbers","pre":["trig"],"sum":"$e^{i\\theta} = \\cos\\theta + i\\sin\\theta$; multiplication rotates and scales the plane. The variable of the zeta function is complex, $s = \\sigma + it$, and its real part $\\sigma$ is what the main conjectures are about.","key":["e^{i\\theta} = \\cos\\theta + i \\sin\\theta"],"why":"Writing $n^{-s} = n^{-\\sigma} e^{-it\\log n}$ turns arithmetic into oscillation.","msc":["30"],"links":[{"field":"physics","note":"Complex exponentials are the language of waves and quantum amplitudes."}],"refs":["Ahlfors, Complex Analysis"],"status":null,"aliases":[],"fields":["complex-analysis","algebra"],"stage":"school","np":{"textbook":9,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":14,"lesson":{"minutes":20,"checks":9,"fixed":2}},{"id":"holomorphic","band":"complex","title":"Holomorphic functions and Cauchy's theorem","short":"Cauchy's theorem","pre":["complex-numbers","series","derivative"],"sum":"A complex-differentiable function on a simply connected domain has zero integral around closed loops, and Cauchy's integral formula recovers its values and all derivatives from boundary values. Holomorphic functions are locally power series.","key":["f^{(n)}(a) = \\frac{n!}{2\\pi i} \\oint_{|z-a|=r} \\frac{f(z)}{(z-a)^{n+1}}\\,dz \\quad (\\overline{D}(a,r) \\subset \\Omega)"],"why":"Rigidity of holomorphic functions is why the zeta function's values on a line control it everywhere.","msc":["30E20"],"links":[{"field":"complex-analysis","note":"The core theorem of the field; the Complex analysis strand will start here."}],"refs":["Ahlfors, Complex Analysis","Stein & Shakarchi, Complex Analysis"],"status":null,"aliases":["Cauchy integral formula"],"fields":["complex-analysis"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":30,"checks":10,"fixed":1}},{"id":"residues","band":"complex","title":"Residues and the argument principle","short":"Residue theorem","pre":["holomorphic"],"sum":"The integral of a meromorphic function around a positively oriented simple closed contour avoiding its poles equals $2\\pi i$ times the sum of the residues inside. The argument principle and Rouché's theorem count zeros inside a contour, which is how zeros of $\\zeta$ are counted.","key":["\\frac{1}{2\\pi i}\\oint_C \\frac{f'(z)}{f(z)}\\,dz = \\#\\text{zeros} - \\#\\text{poles} \\quad (\\text{inside } C, \\text{ with multiplicity; } f \\text{ meromorphic, no zeros or poles on } C, C \\text{ positively oriented})"],"why":"Perron's formula and the explicit formula are residue computations.","msc":["30E20"],"links":[{"field":"physics","note":"Contour integration evaluates the real integrals of scattering theory and signal analysis."}],"refs":["Ahlfors, Complex Analysis","Stein & Shakarchi, Complex Analysis"],"status":null,"aliases":["Rouche","argument principle"],"fields":["complex-analysis"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":28,"checks":11,"fixed":1}},{"id":"continuation","band":"complex","title":"Analytic continuation","short":"Analytic continuation","pre":["holomorphic"],"sum":"A holomorphic function is determined on a connected domain by its values on any small disc. $\\sum z^n$ converges only for $|z|<1$, but its sum $1/(1-z)$ continues to all $z \\ne 1$.","key":["\\sum_{n\\ge0} z^n = \\frac{1}{1-z} \\quad (|z| < 1)"],"why":"Values like $\\zeta(-1) = -\\tfrac1{12}$ come from continuation, not from summing the series.","msc":["30B40"],"links":[{"field":"physics","note":"Zeta-function regularization assigns finite values to divergent sums in quantum field theory; the Casimir effect uses $\\zeta(-3) = \\tfrac{1}{120}$."}],"refs":["Ahlfors, Complex Analysis"],"status":null,"aliases":[],"fields":["complex-analysis"],"stage":"graduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":26,"checks":11,"fixed":0}},{"id":"gamma","band":"complex","title":"The gamma function","short":"Gamma function","pre":["continuation","series","improper-integrals"],"sum":"$\\Gamma(s) = \\int_0^\\infty x^{s-1}e^{-x}\\,dx$ extends the factorial, $\\Gamma(n) = (n-1)!$, to a meromorphic function with poles at $0, -1, -2, \\dots$. Euler introduced it in 1729.","key":["\\Gamma(s+1) = s\\,\\Gamma(s), \\qquad \\Gamma(s)\\Gamma(1-s) = \\frac{\\pi}{\\sin \\pi s}"],"why":"It is the factor that makes the zeta function's functional equation symmetric.","msc":["33B15"],"links":[{"field":"probability","note":"Gamma and chi-squared distributions, and Stirling's formula for $n!$."},{"field":"special-functions","note":"The first special function; Beta, zeta and hypergeometric functions are built around it."}],"refs":["Stein & Shakarchi, Complex Analysis"],"status":null,"aliases":["factorial","Stirling","beta function"],"fields":["special-functions","complex-analysis"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":10,"fixed":1}},{"id":"entire-functions","band":"complex","title":"Entire functions and infinite products","short":"Entire functions","pre":["holomorphic","residues"],"sum":"An entire function is holomorphic on all of $\\mathbb{C}$; its growth rate governs its structure, from Liouville's theorem (bounded implies constant) to the order of growth. Like a polynomial, an entire function can be written as a product over its zeros, but with convergence factors and an extra zero-free factor $e^{g(z)}$; for finite order, Hadamard's theorem makes $g$ a polynomial, as in Euler's $\\sin\\pi z = \\pi z\\prod(1 - z^2/n^2)$.","key":["\\sin \\pi z = \\pi z \\prod_{n=1}^{\\infty}\\left(1-\\frac{z^2}{n^2}\\right)","|f(z)|\\le C(1+|z|)^N \\;\\Longrightarrow\\; f \\text{ is a polynomial of degree} \\le N","f(z) = e^{P(z)}\\, z^m \\prod_{n} E_k(z/a_n),\\quad \\rho<\\infty,\\ k=\\lfloor \\rho\\rfloor,\\ \\deg P\\le k"],"why":"Product formulas evaluate series such as $\\sum 1/n^2=\\pi^2/6$, give the reflection formula for the Gamma function, and, through Hadamard's product for the completed zeta function, connect the zeros of $\\zeta$ to the distribution of primes.","msc":["30D20"],"links":[{"field":"number-theory","note":"Hadamard's product for the completed Riemann zeta function over its nontrivial zeros underlies the explicit formula and the classical proof of the prime number theorem."},{"field":"special-functions","note":"The Weierstrass product $1/\\Gamma(z)=ze^{\\gamma z}\\prod(1+z/n)e^{-z/n}$ and the sine product together give the reflection formula $\\Gamma(z)\\Gamma(1-z)=\\pi/\\sin\\pi z$."}],"refs":["Stein & Shakarchi, Complex Analysis","Ahlfors, Complex Analysis","Conway, Functions of One Complex Variable I"],"status":null,"aliases":["entire function","integral function","infinite product","Weierstrass factorization theorem","Weierstrass product","Hadamard factorization theorem","order of growth","Jensen's formula","sine product","Euler's product for sine","Liouville's theorem","Wallis product"],"fields":["complex-analysis"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":9,"fixed":0}},{"id":"conformal-maps","band":"complex","title":"Conformal maps and the Riemann mapping theorem","short":"Conformal maps","pre":["holomorphic","arzela-ascoli"],"sum":"A conformal map is a bijective holomorphic map between open sets of the plane; near each point it acts like multiplication by the nonzero number $f'(z_0)$, so it rotates and scales infinitesimal pictures and preserves angles. The Riemann mapping theorem says that every simply connected open set other than $\\mathbb{C}$ itself is conformally equivalent to the unit disc $\\mathbb{D}$.","key":["\\Omega \\subsetneq \\mathbb{C} \\text{ simply connected},\\ z_0 \\in \\Omega \\;\\Longrightarrow\\; \\exists!\\, F:\\Omega \\xrightarrow{\\ \\sim\\ } \\mathbb{D},\\ F(z_0)=0,\\ F'(z_0)>0","\\operatorname{Aut}(\\mathbb{D}) = \\Big\\{\\, z \\mapsto e^{i\\theta}\\,\\frac{\\alpha - z}{1-\\overline{\\alpha}z} \\;:\\; \\theta \\in \\mathbb{R},\\ |\\alpha|<1 \\Big\\}","\\text{Cayley map: } z \\mapsto \\frac{i-z}{i+z} \\text{ sends } \\{\\operatorname{Im} z>0\\} \\text{ onto } \\mathbb{D}"],"why":"Conformal maps transport harmonic functions to harmonic functions, so a Dirichlet problem or a two-dimensional flow or electrostatics problem on an awkward region can be moved to the disc or half-plane, solved there, and moved back.","msc":["30C20","30C35"],"links":[{"field":"pde","note":"Because a harmonic function composed with a conformal map is again harmonic, conformal maps reduce Laplace's equation on a simply connected region to the same problem on the disc, where the Poisson integral solves it."},{"field":"physics","note":"Two-dimensional ideal fluid flow and electrostatics are described by harmonic potentials, and classical aerofoil calculations use the Joukowski map to turn flow past a disc into flow past a wing profile."}],"refs":["Stein & Shakarchi, Complex Analysis","Ahlfors, Complex Analysis","Needham, Visual Complex Analysis"],"status":null,"aliases":["conformal mapping","biholomorphism","Riemann mapping theorem","Schwarz lemma","Möbius transformation","Cayley transform","Blaschke factor","automorphisms of the disc","Schwarz–Pick lemma"],"fields":["complex-analysis","geometry"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":7,"fixed":0}},{"id":"fourier-poisson","band":"harmonic","title":"Fourier analysis and Poisson summation","short":"Poisson summation","pre":["series","complex-numbers","riemann-integral","trig","fourier-transform"],"sum":"Poisson summation says $\\sum_n f(n) = \\sum_n \\hat f(n)$. Since $e^{-\\pi x^2}$ is its own Fourier transform, the theta function $\\theta(t) = \\sum_n e^{-\\pi n^2 t}$ satisfies $\\theta(1/t) = \\sqrt t\\,\\theta(t)$; Riemann built the functional equation from this.","key":["\\sum_{n\\in\\mathbb Z} f(n) = \\sum_{n\\in\\mathbb Z} \\hat f(n), \\qquad \\theta(1/t) = \\sqrt t\\, \\theta(t)"],"why":"Duality between a function and its transform reappears in the large sieve and the circle method.","msc":["42A38"],"links":[{"field":"physics","note":"Fourier created the method in 1822 to solve the heat equation; the theta function is the heat kernel on a circle."},{"field":"harmonic-analysis","note":"The central tool of the field."},{"field":"computer-science","note":"The fast Fourier transform and the sampling theorem."}],"refs":["Stein & Shakarchi, Fourier Analysis"],"status":null,"aliases":["theta function","Fourier transform"],"fields":["harmonic-analysis"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":8,"fixed":0}},{"id":"fourier-series","band":"harmonic","title":"Fourier series","short":"Fourier series","pre":["riemann-integral","trig","series"],"sum":"A Fourier series writes a $2\\pi$-periodic function as a sum of sines and cosines, $f(x) \\sim \\tfrac{a_0}{2} + \\sum_{n\\ge1} (a_n \\cos nx + b_n \\sin nx)$, with each coefficient found by integrating against the matching wave. Orthogonality of the waves is what makes the coefficients easy to compute; for piecewise smooth functions the series converges to $f$, and to the midpoint of the jump at a discontinuity.","key":["a_n = \\frac1\\pi \\int_{-\\pi}^{\\pi} f(x)\\cos nx\\,dx,\\qquad b_n = \\frac1\\pi \\int_{-\\pi}^{\\pi} f(x)\\sin nx\\,dx","\\frac1\\pi \\int_{-\\pi}^{\\pi} f(x)^2\\,dx = \\frac{a_0^2}{2} + \\sum_{n=1}^\\infty \\left(a_n^2 + b_n^2\\right)","x^2 = \\frac{\\pi^2}{3} + 4\\sum_{n=1}^\\infty \\frac{(-1)^n}{n^2}\\cos nx \\ \\ (|x|\\le\\pi) \\;\\Longrightarrow\\; \\sum_{n=1}^\\infty \\frac1{n^2} = \\frac{\\pi^2}{6}"],"why":"Fourier introduced these series to solve the heat equation, and they remain the standard way to solve linear PDEs on intervals, to analyse sound and vibrations by frequency, and to compress signals. They also give slick evaluations of sums such as $\\sum 1/n^2$ and $\\sum 1/n^4$.","msc":["42A16","42A20"],"links":[{"field":"pde","note":"Separation of variables turns the heat, wave and Laplace equations on an interval into Fourier series whose coefficients come from the initial or boundary data."},{"field":"physics","note":"A musical tone is a sum of harmonics with frequencies $n f_0$; the Fourier coefficients are the amplitudes of the overtones that give an instrument its timbre."},{"field":"number-theory","note":"Parseval's identity applied to polynomials gives the values $\\zeta(2k)$, and Fourier expansion on $\\mathbb{R}/\\mathbb{Z}$ underlies exponential sums and the circle method."}],"refs":["Stein & Shakarchi, Fourier Analysis: An Introduction","Körner, Fourier Analysis","Tolstov, Fourier Series"],"status":null,"aliases":["Fourier expansion","trigonometric series","Fourier coefficients","harmonic analysis","Parseval's identity","Bessel's inequality","Dirichlet kernel","Gibbs phenomenon","Dirichlet's theorem","half-range expansion","sine series","cosine series","Basel problem"],"fields":["harmonic-analysis","calculus"],"stage":"undergraduate","np":{"textbook":62,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":62,"lesson":{"minutes":24,"checks":10,"fixed":2}},{"id":"fourier-transform","band":"harmonic","title":"The Fourier transform","short":"Fourier transform","pre":["fourier-series","improper-integrals"],"sum":"The Fourier transform $\\hat f(\\xi) = \\int_{-\\infty}^{\\infty} f(x)e^{-2\\pi i x\\xi}\\,dx$ is the continuous analogue of Fourier series for functions on the whole line: it measures how much of each frequency $\\xi$ a function contains, and $f$ is recovered by the inverse transform. It turns differentiation into multiplication by $2\\pi i\\xi$ and convolution into multiplication, which is why it solves linear constant-coefficient equations, and it preserves energy (Plancherel).","key":["\\hat f(\\xi) = \\int_{-\\infty}^{\\infty} f(x)\\,e^{-2\\pi i x\\xi}\\,dx,\\qquad f(x) = \\int_{-\\infty}^{\\infty} \\hat f(\\xi)\\,e^{2\\pi i x\\xi}\\,d\\xi","\\widehat{f'}(\\xi) = 2\\pi i\\xi\\,\\hat f(\\xi),\\qquad \\widehat{f * g} = \\hat f\\,\\hat g,\\qquad \\widehat{e^{-\\pi x^2}} = e^{-\\pi\\xi^2}","\\int_{-\\infty}^{\\infty} |f(x)|^2\\,dx = \\int_{-\\infty}^{\\infty} |\\hat f(\\xi)|^2\\,d\\xi"],"why":"It is the basic tool for solving the heat, wave and Schrödinger equations on unbounded domains, for designing filters and analysing signals (through its discrete version, computed by the fast Fourier transform), and for proving the central limit theorem via characteristic functions. The uncertainty principle of quantum mechanics is a theorem about it.","msc":["42A38"],"links":[{"field":"probability","note":"The characteristic function of a random variable is the Fourier transform of its distribution; sums of independent variables correspond to products, which gives the cleanest proof of the central limit theorem."},{"field":"numerical-analysis","note":"The discrete Fourier transform approximates $\\hat f$ from samples, and the fast Fourier transform computes it in $O(n\\log n)$ operations, which makes spectral methods and fast convolution practical."},{"field":"quantum-computing","note":"The quantum Fourier transform, a discrete Fourier transform on the amplitudes of a quantum register, is the key step in Shor's factoring algorithm."}],"refs":["Stein & Shakarchi, Fourier Analysis: An Introduction","Folland, Fourier Analysis and Its Applications","Dym & McKean, Fourier Series and Integrals"],"status":null,"aliases":["Fourier integral","Fourier inversion","Plancherel theorem","convolution theorem","Gaussian","sinc function","uncertainty principle","Heisenberg uncertainty","frequency domain","spectrum","Riemann–Lebesgue lemma","heat kernel"],"fields":["harmonic-analysis","pde","physics"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":24,"checks":10,"fixed":0}},{"id":"ode-first","band":"odes","title":"First-order differential equations","short":"First-order ODEs","pre":["integration-techniques"],"sum":"A first-order differential equation $y' = F(x, y)$ prescribes the slope of an unknown function at every point; a solution is a function whose graph follows these slopes. Two large classes can be solved exactly: separable equations, by integrating $\\frac{dy}{g(y)} = f(x)\\,dx$, and linear equations $y' + p(x)y = q(x)$, by multiplying with the integrating factor $e^{\\int p}$. Under mild conditions an initial value $y(x_0) = y_0$ determines the solution uniquely, at least near $x_0$.","key":["y' = f(x)\\,g(y) \\;\\Longrightarrow\\; \\int \\frac{dy}{g(y)} = \\int f(x)\\,dx \\quad (\\text{where } g(y) \\ne 0)","y' + p(x)\\,y = q(x), \\quad \\mu = e^{\\int p\\,dx} \\;\\Longrightarrow\\; (\\mu y)' = \\mu q","F,\\ \\partial F/\\partial y \\text{ continuous near } (x_0, y_0) \\;\\Longrightarrow\\; y' = F(x, y),\\ y(x_0) = y_0 \\text{ has a unique solution near } x_0"],"why":"Growth and decay, cooling, mixing, simple circuits and population models are all first-order equations, and they are the first place where one predicts the future of a system from its present state and its law of change.","msc":["34A05","34A12"],"links":[{"field":"physics","note":"Radioactive decay, Newton's law of cooling and the charging of a capacitor are first-order linear equations whose solutions are exponentials."},{"field":"dynamics","note":"An autonomous equation $y' = F(y)$ is the simplest continuous dynamical system: its equilibria and their stability can be read from the sign of $F$ on a phase line."},{"field":"computer-science","note":"Numerical integrators such as Euler's method and the Runge–Kutta methods are first designed and analysed on first-order equations."}],"refs":["Boyce & DiPrima, Elementary Differential Equations and Boundary Value Problems","Tenenbaum & Pollard, Ordinary Differential Equations","Arnold, Ordinary Differential Equations"],"status":null,"aliases":["first-order ODE","separable equation","integrating factor","initial value problem","Picard–Lindelöf theorem","slope field"],"fields":["differential-equations"],"stage":"undergraduate","np":{"textbook":107,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":112,"lesson":{"minutes":17,"checks":10,"fixed":0}},{"id":"ode-linear","band":"odes","title":"Linear differential equations","short":"Linear ODEs","pre":["ode-first","complex-numbers","eigen"],"sum":"A linear differential equation has the form $a_n(x)y^{(n)} + \\dots + a_1(x)y' + a_0(x)y = f(x)$. Its homogeneous solutions form an $n$-dimensional vector space, and every solution is one particular solution plus a homogeneous one. With constant coefficients the substitution $y = e^{rx}$ reduces everything to the roots of the characteristic polynomial, and a system $\\mathbf x' = A\\mathbf x$ is solved through the eigenvalues of $A$ and the matrix exponential $e^{tA}$.","key":["p(D)\\,e^{rx} = p(r)\\,e^{rx}, \\qquad p(r) = a_n r^n + \\dots + a_1 r + a_0","y = y_p + c_1 y_1 + \\dots + c_n y_n \\quad (y_1, \\dots, y_n \\text{ a basis of homogeneous solutions})","\\mathbf x' = A\\mathbf x,\\ \\mathbf x(0) = \\mathbf x_0 \\;\\Longrightarrow\\; \\mathbf x(t) = e^{tA}\\mathbf x_0, \\qquad A\\mathbf v = \\lambda\\mathbf v \\Rightarrow e^{tA}\\mathbf v = e^{\\lambda t}\\mathbf v"],"why":"Vibrating springs, electrical circuits, resonance and the behaviour of any system near an equilibrium are described by linear equations, and they are among the few differential equations that can be solved completely.","msc":["34A30"],"links":[{"field":"physics","note":"The damped, driven harmonic oscillator $my'' + cy' + ky = F(t)$ models springs, pendulums at small amplitude and RLC circuits, including resonance."},{"field":"linear-algebra","note":"The solution space is a vector space of dimension $n$, and systems $\\mathbf x' = A\\mathbf x$ are solved by diagonalising $A$ or by its Jordan form."},{"field":"dynamics","note":"Linearising a nonlinear system at an equilibrium gives $\\mathbf x' = A\\mathbf x$; when no eigenvalue of $A$ has zero real part, the signs of the real parts decide whether the equilibrium is stable."}],"refs":["Boyce & DiPrima, Elementary Differential Equations and Boundary Value Problems","Hirsch, Smale & Devaney, Differential Equations, Dynamical Systems, and an Introduction to Chaos","Arnold, Ordinary Differential Equations"],"status":null,"aliases":["linear ODE","characteristic equation","constant-coefficient differential equation","harmonic oscillator","matrix exponential","superposition principle"],"fields":["differential-equations"],"stage":"undergraduate","np":{"textbook":84,"olympiad":4,"bridge":0,"research":0,"examples":0},"nprob":88,"lesson":{"minutes":20,"checks":11,"fixed":1}},{"id":"ode-systems","band":"odes","title":"Systems of linear differential equations","short":"Linear systems of ODEs","pre":["ode-linear","eigen"],"sum":"A system of linear differential equations $\\mathbf x' = A\\mathbf x + \\mathbf g(t)$ describes several quantities whose rates of change depend linearly on all of them. For a constant matrix $A$, each eigenvector $\\mathbf v$ with eigenvalue $\\lambda$ gives a solution $e^{\\lambda t}\\mathbf v$ that simply grows or shrinks along a fixed direction, and every solution of the homogeneous system $\\mathbf x' = A\\mathbf x$ is $e^{At}\\mathbf x(0)$.","key":["\\mathbf x' = A\\mathbf x,\\quad A\\mathbf v = \\lambda\\mathbf v \\;\\Longrightarrow\\; \\mathbf x(t) = e^{\\lambda t}\\mathbf v","\\mathbf x(t) = e^{At}\\mathbf x(0) = \\sum_i c_i e^{\\lambda_i t}\\mathbf v_i \\quad (A \\text{ diagonalisable})","\\mathbf x(t) = e^{At}\\mathbf x_0 + \\int_0^t e^{A(t-s)}\\mathbf g(s)\\,ds"],"why":"Coupled oscillators, electrical networks, compartment models in pharmacology and chemistry, and the linearisation of any nonlinear system near an equilibrium all lead to $\\mathbf x' = A\\mathbf x$, and the eigenvalues of $A$ decide growth, decay and oscillation.","msc":["34A30"],"links":[{"field":"physics","note":"Small vibrations of coupled masses and springs decompose into independent normal modes, whose angular frequencies are the square roots of the eigenvalues of $M^{-1}K$ ($M$ the mass matrix, $K$ the stiffness matrix)."},{"field":"probability","note":"The transition probabilities of a finite-state continuous-time Markov chain with generator $Q$ solve the linear system $P' = PQ$, so $P(t) = e^{tQ}$."},{"field":"dynamics","note":"The eigenvalues of a linear system classify its equilibrium as a node, saddle, spiral or centre, the basic picture of local dynamics."}],"refs":["Boyce, DiPrima & Meade, Elementary Differential Equations and Boundary Value Problems","Strang, Introduction to Linear Algebra","Hirsch, Smale & Devaney, Differential Equations, Dynamical Systems, and an Introduction to Chaos"],"status":null,"aliases":["linear systems of ODEs","first-order systems","eigenvalue method","matrix exponential","fundamental matrix","Wronskian of a system","normal modes","generalised eigenvector","variation of parameters for systems","coupled differential equations"],"fields":["differential-equations","linear-algebra"],"stage":"undergraduate","np":{"textbook":79,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":79,"lesson":{"minutes":25,"checks":8,"fixed":3}},{"id":"laplace-transform","band":"odes","title":"The Laplace transform","short":"Laplace transform","pre":["ode-linear","improper-integrals"],"sum":"The Laplace transform $F(s) = \\int_0^\\infty e^{-st}f(t)\\,dt$ turns a function of time into a function of a new variable $s$. Its key property is that differentiation becomes multiplication, $\\mathcal L\\{f'\\} = sF(s) - f(0)$, so a linear differential equation with constant coefficients and its initial conditions becomes an algebraic equation for $F$, even when the forcing is switched on and off or is an impulse.","key":["F(s) = \\mathcal L\\{f\\}(s) = \\int_0^\\infty e^{-st}f(t)\\,dt","\\mathcal L\\{f'\\} = sF(s) - f(0), \\qquad \\mathcal L\\{f''\\} = s^2F(s) - sf(0) - f'(0)","\\mathcal L\\{u_c(t)f(t-c)\\} = e^{-cs}F(s), \\qquad \\mathcal L\\{f * g\\} = F(s)\\,G(s)"],"why":"Engineers analyse circuits, control systems and vibrations with it: the transfer function of a linear system is a Laplace transform, and the positions of its poles in the complex $s$-plane decide whether the system is stable.","msc":["44A10"],"links":[{"field":"physics","note":"Circuits and damped oscillators with switched or impulsive inputs are solved by transforming their equations of motion into algebra in $s$."},{"field":"probability","note":"For a nonnegative random variable $X$ with density $f$, the transform $\\mathbb E[e^{-sX}]$ is the Laplace transform of $f$, and the density of a sum of independent variables is a convolution."},{"field":"complex-analysis","note":"The inverse transform is a contour integral along a vertical line in the complex plane, usually evaluated by residues at the poles of $F$."}],"refs":["Boyce, DiPrima & Meade, Elementary Differential Equations and Boundary Value Problems","Schiff, The Laplace Transform: Theory and Applications","Widder, The Laplace Transform"],"status":null,"aliases":["Laplace transforms","inverse Laplace transform","s-domain","transfer function","Heaviside step function","unit step function","Dirac delta","impulse response","convolution theorem","shift theorems","operational calculus"],"fields":["differential-equations","harmonic-analysis"],"stage":"undergraduate","np":{"textbook":71,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":71,"lesson":{"minutes":25,"checks":8,"fixed":1}},{"id":"series-solutions-ode","band":"odes","title":"Power-series solutions and the method of Frobenius","short":"Series solutions","pre":["ode-linear","power-series"],"sum":"When a linear differential equation has non-constant coefficients, one can look for a solution as a power series $y = \\sum a_nx^n$: substituting turns the equation into a recurrence for the coefficients. Near an ordinary point this always works, and the series converges at least as far as the nearest singularity of the coefficients (complex singularities included); near a regular singular point the method of Frobenius uses $y = x^r\\sum a_nx^n$, with $r$ fixed by the indicial equation.","key":["y'' + p(x)y' + q(x)y = 0,\\ p, q \\text{ analytic at } x_0 \\;\\Longrightarrow\\; y = \\sum_{n\\ge0} a_n(x - x_0)^n","r(r-1) + p_0r + q_0 = 0, \\qquad p_0 = \\lim_{x\\to0}xp(x),\\ q_0 = \\lim_{x\\to0}x^2q(x)","J_0(x) = \\sum_{k=0}^\\infty \\frac{(-1)^k}{(k!)^2}\\Bigl(\\frac{x}{2}\\Bigr)^{2k}"],"why":"Many of the special functions of physics, such as Bessel functions for vibrating drums and Legendre polynomials for the hydrogen atom and gravitational potentials, are defined as series solutions of equations that cannot be solved in elementary terms.","msc":["34A25","33C10"],"links":[{"field":"physics","note":"Separating variables in Laplace's, the heat and the wave equations in polar or spherical coordinates produces Bessel and Legendre equations, solved by series."},{"field":"complex-analysis","note":"The radius of convergence of a series solution is governed by the complex singularities of the coefficients, and the Frobenius method is the start of the theory of Fuchsian equations in the complex plane."}],"refs":["Boyce, DiPrima & Meade, Elementary Differential Equations and Boundary Value Problems","Coddington, An Introduction to Ordinary Differential Equations","Bender & Orszag, Advanced Mathematical Methods for Scientists and Engineers"],"status":null,"aliases":["power series solutions","series solutions of differential equations","method of Frobenius","Frobenius method","ordinary point","regular singular point","indicial equation","Euler equation","Cauchy-Euler equation","Bessel's equation","Legendre's equation","Airy equation"],"fields":["differential-equations","special-functions"],"stage":"undergraduate","np":{"textbook":21,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":21,"lesson":{"minutes":25,"checks":9,"fixed":2}},{"id":"sturm-liouville","band":"odes","title":"Boundary value problems and Sturm–Liouville theory","short":"Sturm–Liouville","pre":["ode-linear","inner-products","fourier-series"],"sum":"A two-point boundary value problem asks for a solution of a differential equation with conditions at both ends of an interval, and, unlike an initial value problem, it may have no solution or infinitely many. Sturm–Liouville theory studies the eigenvalue problems $-(py')' + qy = \\lambda wy$ with separated boundary conditions on a bounded interval: in the regular case they behave like symmetric matrices, with real eigenvalues $\\lambda_1 < \\lambda_2 < \\cdots \\to \\infty$ and eigenfunctions that are orthogonal and complete, so that a function can be expanded in them like a Fourier series.","key":["-(p\\,y')' + q\\,y = \\lambda\\,w\\,y, \\qquad \\alpha_1y(a) + \\alpha_2y'(a) = 0,\\quad \\beta_1y(b) + \\beta_2y'(b) = 0","L[y] = -(p\\,y')' + q\\,y:\\quad \\int_a^b \\bigl(L[u]\\,v - u\\,L[v]\\bigr)\\,dx = -\\Bigl[p\\,(u'v - uv')\\Bigr]_a^b = 0 \\quad (u, v \\text{ satisfying the boundary conditions})","\\lambda_m \\ne \\lambda_n \\;\\Longrightarrow\\; \\int_a^b \\varphi_m(x)\\varphi_n(x)\\,w(x)\\,dx = 0"],"why":"Separating variables in the heat, wave and Laplace equations on an interval, a disc or a ball always produces a Sturm–Liouville problem, and its eigenfunctions (sines, Bessel functions, Legendre polynomials) are the natural modes in which the solution is expanded.","msc":["34B24","34L10"],"links":[{"field":"physics","note":"The eigenvalues give the frequencies of a vibrating string or the energy levels of a particle in a box, and the eigenfunctions give the shapes of the modes."},{"field":"functional-analysis","note":"The inverse of a regular Sturm–Liouville operator (when $0$ is not an eigenvalue) is a compact self-adjoint integral operator, and the spectral theorem for such operators is the abstract form of the eigenfunction expansion."},{"field":"special-functions","note":"Legendre polynomials and Bessel functions arise as eigenfunctions of singular Sturm–Liouville problems, which explains their orthogonality relations."}],"refs":["Boyce, DiPrima & Meade, Elementary Differential Equations and Boundary Value Problems","Coddington & Levinson, Theory of Ordinary Differential Equations","Birkhoff & Rota, Ordinary Differential Equations"],"status":null,"aliases":["Sturm-Liouville problem","Sturm-Liouville theory","two-point boundary value problem","eigenvalue problem for ODEs","eigenfunction expansion","self-adjoint boundary value problem","Rayleigh quotient","Lagrange identity","Green's identity","Fredholm alternative","singular Sturm-Liouville problem"],"fields":["differential-equations","pde","linear-algebra"],"stage":"undergraduate","np":{"textbook":25,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":25,"lesson":{"minutes":25,"checks":9,"fixed":2}},{"id":"phase-plane","band":"dynamics","title":"The phase plane, equilibria and stability","short":"Phase plane & stability","pre":["ode-systems","partial-derivatives"],"sum":"For an autonomous system $x' = f(x,y)$, $y' = g(x,y)$, one can understand every solution at once by drawing its trajectories in the $(x,y)$-plane, the phase plane. Equilibria are where $f = g = 0$; near a hyperbolic equilibrium the picture looks like that of the linearised system, whose type (saddle, node, spiral, centre) is read off from the trace and determinant of the Jacobian, and Lyapunov functions decide stability where linearisation is silent.","key":["\\lambda^2 - \\tau\\lambda + \\Delta = 0, \\qquad \\tau = \\operatorname{tr}J,\\ \\Delta = \\det J","\\Delta < 0:\\ \\text{saddle}; \\quad \\Delta > 0,\\ \\tau < 0:\\ \\text{asymptotically stable}; \\quad \\Delta > 0,\\ \\tau > 0:\\ \\text{unstable}","V(\\mathbf x^*) = 0,\\ V > 0 \\text{ and } \\dot V = \\nabla V\\cdot(f, g) < 0 \\text{ for } \\mathbf x \\ne \\mathbf x^* \\text{ near } \\mathbf x^* \\;\\Longrightarrow\\; \\mathbf x^* \\text{ asymptotically stable}"],"why":"Most nonlinear systems in physics, ecology and engineering cannot be solved in closed form, but the phase portrait still answers the practical questions: which states are steady, which are stable, and where solutions end up.","msc":["34D20","34C05"],"links":[{"field":"physics","note":"The pendulum's phase portrait, with centres at the hanging rest positions, saddles at the inverted positions and a separatrix energy level dividing swinging from rotating, is the model for conservative mechanical systems."},{"field":"optimisation","note":"Gradient descent is the discretisation of the gradient flow $\\mathbf x' = -\\nabla F(\\mathbf x)$, for which $F$ itself is a Lyapunov function and nondegenerate local minima (positive definite Hessian) are asymptotically stable equilibria."}],"refs":["Boyce, DiPrima & Meade, Elementary Differential Equations and Boundary Value Problems","Strogatz, Nonlinear Dynamics and Chaos","Hirsch, Smale & Devaney, Differential Equations, Dynamical Systems, and an Introduction to Chaos"],"status":null,"aliases":["phase portrait","phase plane analysis","equilibrium point","critical point","fixed point","linearization","Jacobian matrix","trace-determinant plane","saddle point","stable node","spiral point","centre","Lyapunov function","Lyapunov stability","Hartman-Grobman theorem","competing species","predator-prey","Lotka-Volterra"],"fields":["dynamics","differential-equations"],"stage":"undergraduate","np":{"textbook":24,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":24,"lesson":{"minutes":25,"checks":8,"fixed":3}},{"id":"bifurcations","band":"dynamics","title":"Bifurcations","short":"Bifurcations","pre":["phase-plane"],"sum":"A bifurcation is a qualitative change in the behaviour of a dynamical system as a parameter passes a critical value: equilibria are created or destroyed, exchange stability, or give birth to periodic orbits. Near a bifurcation the system looks like one of a few simple normal forms, such as $\\dot x = r + x^2$ (saddle-node), $\\dot x = rx - x^2$ (transcritical), $\\dot x = rx - x^3$ (pitchfork) and, in the plane, the Hopf bifurcation that creates a limit cycle.","key":["\\dot x = r + x^2:\\ \\text{two equilibria } x^* = \\pm\\sqrt{-r} \\text{ for } r<0,\\ \\text{none for } r>0","f(x_0,r_0)=0,\\ f_x(x_0,r_0)=0,\\ f_{xx}\\ne 0,\\ f_r \\ne 0 \\;\\Longrightarrow\\; \\text{saddle-node at } (x_0,r_0)","\\text{Hopf: } \\dot r = \\mu r - r^3,\\ \\dot\\theta = \\omega \\;\\Rightarrow\\; \\text{stable cycle of radius } \\sqrt{\\mu} \\text{ for } \\mu>0"],"why":"Bifurcations explain tipping points: a fishery that collapses when the harvest rate creeps past a threshold, a beam that buckles under a growing load, a laser that switches on, or a steady flow that starts to oscillate. They are also one route by which simple systems become chaotic, through cascades of period doublings.","msc":["37G10","34C23"],"links":[{"field":"physics","note":"Buckling of an elastic beam under compression is a pitchfork bifurcation, and the onset of oscillation in many physical and chemical systems is a Hopf bifurcation."},{"field":"probability","note":"Near a bifurcation the restoring force vanishes, so noisy systems show 'critical slowing down': larger and longer-lasting fluctuations, used as an early-warning signal of tipping points."},{"field":"numerical-analysis","note":"Numerical continuation methods follow branches of equilibria as a parameter varies and detect folds and Hopf points along the way."}],"refs":["Strogatz, Nonlinear Dynamics and Chaos","Guckenheimer & Holmes, Nonlinear Oscillations, Dynamical Systems, and Bifurcations of Vector Fields","Kuznetsov, Elements of Applied Bifurcation Theory"],"status":null,"aliases":["bifurcation theory","saddle-node bifurcation","fold bifurcation","transcritical bifurcation","pitchfork bifurcation","Hopf bifurcation","bifurcation diagram","normal form","tipping point","hysteresis","period-doubling bifurcation"],"fields":["dynamics","differential-equations"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":11,"fixed":2}},{"id":"limit-cycles","band":"dynamics","title":"Limit cycles and the Poincaré–Bendixson theorem","short":"Limit cycles","pre":["phase-plane"],"sum":"A limit cycle is an isolated closed orbit of a dynamical system: a periodic motion that nearby trajectories spiral towards (or away from). It models self-sustained oscillations whose amplitude is fixed by the system itself, not by the initial conditions. In the plane, the Poincaré–Bendixson theorem guarantees a closed orbit inside any bounded trapping region that contains no equilibria, which is also why planar flows can never be chaotic.","key":["\\dot r = r(1 - r^2),\\ \\dot\\theta = 1:\\quad r(t) \\to 1 \\text{ for every } r(0) > 0","\\text{trajectory trapped in compact } R \\subset \\mathbb{R}^2 \\text{ without equilibria} \\;\\Longrightarrow\\; R \\text{ contains a closed orbit}","\\operatorname{div}(\\varphi F) > 0 \\text{ (or } < 0) \\text{ throughout a simply connected region} \\;\\Longrightarrow\\; \\text{no closed orbits there}"],"why":"Heartbeats, the firing of neurons, predator-prey cycles, chemical clocks and electronic oscillators all repeat with a characteristic amplitude and period that return after a disturbance; limit cycles are the mathematical form of that robustness. The theory also tells you when such oscillations are impossible, which is often just as useful.","msc":["34C05","34C07"],"links":[{"field":"physics","note":"Self-excited oscillators such as the Van der Pol circuit, bowed violin strings and clocks have limit cycles whose amplitude is set by a balance of energy input and dissipation."},{"field":"topology","note":"The Poincaré–Bendixson theorem rests on the Jordan curve theorem, and the fact that a closed orbit must enclose an equilibrium is a case of index theory and the Brouwer fixed point theorem."},{"field":"numerical-analysis","note":"Periodic orbits are located numerically by shooting methods that find a fixed point of the Poincaré return map."}],"refs":["Strogatz, Nonlinear Dynamics and Chaos","Hirsch, Smale & Devaney, Differential Equations, Dynamical Systems, and an Introduction to Chaos","Perko, Differential Equations and Dynamical Systems"],"status":null,"aliases":["limit cycle","periodic orbit","closed orbit","Poincaré–Bendixson theorem","trapping region","Dulac's criterion","Bendixson's criterion","Van der Pol oscillator","Liénard's theorem","relaxation oscillation","self-sustained oscillation","Poincaré map"],"fields":["dynamics","differential-equations"],"stage":"undergraduate","np":{"textbook":8,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":8,"lesson":{"minutes":22,"checks":10,"fixed":3}},{"id":"chaos","band":"dynamics","title":"Chaos and strange attractors","short":"Chaos","pre":["limit-cycles","bifurcations"],"sum":"A deterministic system is chaotic when its long-term behaviour is aperiodic and depends sensitively on initial conditions: nearby states separate exponentially fast, at a rate measured by a positive Lyapunov exponent, so prediction fails beyond a short horizon even though nothing is random. Chaos already appears in one-dimensional maps such as $x \\mapsto 4x(1-x)$, and in flows from three dimensions up, where trajectories can settle onto a strange attractor such as the Lorenz attractor.","key":["|\\delta_n| \\approx |\\delta_0|\\, e^{\\lambda n},\\qquad \\lambda = \\lim_{n\\to\\infty} \\frac1n \\sum_{k=0}^{n-1} \\ln |f'(x_k)|","h(\\theta) = \\sin^2\\!\\left(\\tfrac{\\pi\\theta}{2}\\right):\\quad 4h(1-h) = h\\circ T,\\ \\ T = \\text{tent map};\\ \\ \\lambda = \\ln 2","\\dot x = \\sigma(y - x),\\ \\ \\dot y = x(\\rho - z) - y,\\ \\ \\dot z = xy - \\beta z"],"why":"Chaos sets a hard limit on prediction: weather forecasts lose skill after a week or two, not because the equations are unknown but because errors in the initial state grow exponentially. The same ideas explain irregular heartbeats, mixing of fluids and the long-term instability of some planetary orbits, and they underlie the use of chaotic maps as pseudo-random generators.","msc":["37D45"],"links":[{"field":"probability","note":"Chaotic maps have invariant probability measures, such as the density $1/(\\pi\\sqrt{x(1-x)})$ for $4x(1-x)$, so long time averages along a single orbit behave like expectations; ergodic theory makes this precise."},{"field":"number-theory","note":"The doubling map acts on binary expansions as a shift, so its periodic points are rationals with odd denominators and counting them uses Möbius inversion."},{"field":"computer-science","note":"Sensitive dependence means floating-point simulations of chaotic systems diverge from the true orbit quickly; shadowing theorems explain when computed orbits are still faithful to some true orbit."}],"refs":["Strogatz, Nonlinear Dynamics and Chaos","Devaney, An Introduction to Chaotic Dynamical Systems","Alligood, Sauer & Yorke, Chaos: An Introduction to Dynamical Systems"],"status":null,"aliases":["chaos theory","deterministic chaos","butterfly effect","sensitive dependence on initial conditions","strange attractor","Lorenz attractor","Lorenz equations","logistic map","Lyapunov exponent","period doubling","Feigenbaum constant","tent map","Hénon map","Devaney chaos","Sharkovskii's theorem","fractal"],"fields":["dynamics","physics"],"stage":"undergraduate","np":{"textbook":2,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":2,"lesson":{"minutes":24,"checks":12,"fixed":1}},{"id":"navier-stokes","band":"pde","title":"Navier–Stokes existence and smoothness","short":"Navier–Stokes","pre":["fourier-poisson","vector-calculus","heat-equation"],"sum":"Do smooth initial data for the three-dimensional incompressible Navier–Stokes equations always give a smooth solution for all time? Leray (1934) constructed weak solutions; their uniqu

/* Layout: a field guide. Warm paper, serif reading text, sans for apparatus. Concept pages carry a margin column;

:root {

}

:root[data-theme="dark"] {

  --accent: #ee8a63; --accent-tint: rgba(238, 138, 99, 0.12); --link: #f09872; --good: #6cc792; --good-tint: rgba(108, 199, 146, 0.12); --warn: #e8b552; --warn-tint: rgba(232, 181, 82, 0.13); --bad: #ff8a7c;

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 18px; line-height: 1.58; font-optical-sizing: auto; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; font-weight: 500; letter-spacing: -0.01em; }
p { margin: 0 0 14px; }
a { color: var(--link); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.sans { font-family: var(--sans); } .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); } .small { font-family: var(--sans); font-size: 13px; }
.eyebrow { font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

/* header */
.top { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--paper); }
.top .wrap { display: flex; align-items: center; gap: 8px 26px; min-height: 58px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font-family: var(--serif); font-size: 21px; font-weight: 500; }
.brand svg { flex: none; }
.brand span { text-box: trim-both cap alphabetic; }
@supports not (text-box: trim-both cap alphabetic) { .brand svg { transform: translateY(-2px); } }
.nav { display: flex; gap: 2px 18px; flex-wrap: wrap; font-family: var(--sans); font-size: 14.5px; }
.nav a { color: var(--ink-2); text-decoration: none; padding: 6px 0; position: relative; }
.nav a.on { color: var(--ink); font-weight: 600; }
.nav a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
.nav a small { font-family: var(--mono); font-size: 11.5px; color: var(--accent); margin-left: 4px; }
.themebtn { background: none; border: 1px solid var(--rule-2); color: var(--ink-2); border-radius: 999px; width: 34px; height: 34px; padding: 0; display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.themebtn:hover { color: var(--ink); border-color: var(--ink-3); }
.topsearch { margin-left: auto; } .topsearch input { width: 210px; }
main { padding-block: 40px 84px; min-height: 60vh; overflow-x: clip; }

/* inputs */
input[type="text"], input[type="search"], select, textarea { background: var(--raise); border: 1px solid var(--rule-2); border-radius: 4px; padding: 8px 11px; font-family: var(--sans); font-size: 15px; }
textarea { box-sizing: border-box; width: 100%; min-height: 96px; resize: vertical; line-height: 1.5; }
.btn { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: 4px; padding: 8px 15px; font-family: var(--sans); font-weight: 600; font-size: 14px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link); font-family: var(--sans); font-size: 13.5px; cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link) 40%, transparent); text-underline-offset: 3px; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 4px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-right: 1px solid var(--rule-2); background: var(--raise); padding: 5px 12px; font-family: var(--sans); font-size: 13px; cursor: pointer; color: var(--ink-2); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button .n { font-family: var(--mono); font-size: 11.5px; opacity: 0.7; margin-left: 5px; }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.hero h1 { font-size: clamp(36px, 5.2vw, 56px); line-height: 1.04; font-weight: 400; letter-spacing: -0.02em; }
.hero h1 em { font-style: italic; color: var(--accent); }
.hero .lede { font-size: 19px; color: var(--ink-2); margin-top: 20px; max-width: 34em; }
.search-big { display: flex; margin-top: 26px; max-width: 520px; border: 1px solid var(--ink); border-radius: 4px; background: var(--raise); overflow: hidden; }
.search-big input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; padding: 12px 14px; }
.search-big button { border: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); font-weight: 600; padding: 0 18px; cursor: pointer; }
.frontier { border-left: 3px solid var(--accent); padding-left: 20px; }
.frontier ol { list-style: none; padding: 0; margin: 10px 0 8px; }
.frontier li { padding: 10px 0; border-bottom: 1px solid var(--rule); }
.frontier li:last-child { border-bottom: 0; }
.frontier .d { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.frontier .t { font-size: 17px; line-height: 1.35; display: block; margin-top: 2px; }
.ledger { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 48px; }
.ledger div { background: var(--raise); border: 1px solid var(--rule); border-top: 3px solid var(--accent); border-radius: 0 0 4px 4px; padding: 22px 16px 20px; text-align: center; }
.ledger b { font-family: var(--serif); font-weight: 400; font-size: 48px; line-height: 1; display: block; font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.01em; }
.ledger span { display: block; margin-top: 8px; font-family: var(--sans); font-size: 13px; color: var(--ink-3); }
.section { margin-top: 64px; }
.section-h { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--rule-2); padding-bottom: 8px; }
.section-h h2 { font-size: 28px; }
.section .sub { color: var(--ink-2); max-width: 44em; margin-top: 10px; }
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; margin-top: 18px; }
.area { background: var(--raise); border: 1px solid var(--rule); border-top: 3px solid var(--c); padding: 14px 16px 12px; border-radius: 0 0 4px 4px; }
.area h3 { font-size: 20px; } .area h3 a { color: var(--ink); text-decoration: none; } .area h3 a:hover { text-decoration: underline; }
.area p { font-size: 15px; color: var(--ink-2); margin: 6px 0 10px; line-height: 1.45; }
.area .nums { font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); }
.area ul { list-style: none; padding: 0; margin: 8px 0 0; font-size: 15px; }
.area li { padding: 2px 0; }

/* tags */
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans); font-size: 12.5px; padding: 1px 8px; border: 1px solid var(--rule-2); border-radius: 3px; color: var(--ink-2); text-decoration: none; background: var(--raise); white-space: nowrap; line-height: 1.6; }
a.tag:hover { border-color: var(--ink-3); color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--c); flex: none; }
.tag.msc { font-family: var(--mono); font-size: 11.5px; }
.tag.open { border-color: var(--accent); color: var(--accent); }
.tag.claimed { border-color: var(--warn); color: var(--warn); background: var(--warn-tint); }
.tag.solved { border-color: var(--good); color: var(--good); background: var(--good-tint); }
.tag.ai { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tag.prize { font-family: var(--mono); font-size: 11.5px; }

/* map */
.map-box { overflow-x: auto; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: var(--raise); }
.map-box svg { display: block; }
.mlabel { font-family: var(--sans); font-size: 11.5px; fill: var(--ink-2); paint-order: stroke; stroke: var(--raise); stroke-width: 3px; stroke-linejoin: round; }
.mnode { cursor: pointer; } .mnode:hover .mlabel, .mnode:focus .mlabel { fill: var(--ink); text-decoration: underline; }
.medge { fill: none; stroke: var(--rule-2); stroke-width: 0.9; }
.dim .mnode { opacity: 0.2; } .dim .medge { opacity: 0.18; }
.dim .mnode.on { opacity: 1; } .dim .medge.on { opacity: 1; stroke: var(--accent); stroke-width: 1.3; }
.mnode.done .mlabel { fill: var(--good); }
.mnode.ghost .mlabel { fill: var(--ink-3); font-style: italic; }
.mnode.focus .mlabel { font-weight: 700; fill: var(--ink); }
.medge.ghost { stroke-dasharray: 3 3; }
.fnode { cursor: pointer; } .fnode:hover circle, .fnode:focus circle { stroke: var(--accent); stroke-width: 2.4; }
.fcount { font-family: var(--mono); font-size: 12px; fill: var(--ink-2); }
.flabel { font-family: var(--sans); font-size: 13px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--raise); stroke-width: 4px; stroke-linejoin: round; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--sans); font-size: 13px; color: var(--ink-2); margin-top: 12px; align-items: center; }
.legend svg { vertical-align: -2px; margin-right: 6px; }
.maptools { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; font-family: var(--sans); font-size: 14px; margin: 16px 0 12px; }
.maptools select { max-width: 100%; }
.caption { font-family: var(--sans); font-size: 13px; color: var(--ink-3); margin-top: 8px; }

/* concept list */
.page-h h1 { font-size: 40px; font-weight: 400; }
.page-h p { color: var(--ink-2); max-width: 44em; margin-top: 8px; }
.filters { display: grid; gap: 8px; margin-top: 16px; font-family: var(--sans); font-size: 13px; color: var(--ink-3); }
.filters .row { display: flex; gap: 8px 10px; flex-wrap: wrap; align-items: center; }
.filters .row > span:first-child { min-width: 58px; }
.fbtn { font-family: var(--sans); font-size: 13px; padding: 2px 10px; border-radius: 3px; border: 1px solid var(--rule-2); background: var(--raise); cursor: pointer; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.fbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.area-h { margin-top: 38px; display: flex; align-items: baseline; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--rule-2); }
.area-h h2 { font-size: 23px; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 18px; padding: 13px 0; border-bottom: 1px solid var(--rule); }
.crow h3 { font-size: 19px; } .crow h3 a { color: var(--ink); text-decoration: none; } .crow h3 a:hover { text-decoration: underline; }
.crow .desc { grid-column: 1 / 2; color: var(--ink-2); font-size: 16px; line-height: 1.5; }
.crow .meta { grid-column: 1 / 3; margin-top: 4px; }
.crow .count { font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); white-space: nowrap; text-align: right; }

/* concept page */
.crumbs { font-family: var(--sans); font-size: 13px; color: var(--ink-3); } .crumbs a { color: var(--ink-3); }
.chead { margin-top: 18px; max-width: 820px; }
.chead .eyebrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chead h1 { font-size: clamp(32px, 4.6vw, 48px); line-height: 1.1; font-weight: 400; margin-top: 8px; }
.chead .sum { font-size: 20px; color: var(--ink-2); margin-top: 16px; }
.chead .tags { margin-top: 16px; }
.cgrid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 56px; margin-top: 34px; align-items: start; }
.block { margin-top: 36px; } .block:first-child { margin-top: 0; }
.block > h2 { font-size: 24px; margin-bottom: 12px; }
.key { border-left: 3px solid var(--rule-2); padding: 2px 0 2px 18px; overflow-x: auto; }
.aside { font-size: 15.5px; }
.aside .block { margin-top: 26px; } .aside .block:first-child { margin-top: 0; }
.aside .block > h2 { font-family: var(--sans); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 6px; }
.aside ul { list-style: none; padding: 0; margin: 0; }
.aside li { padding: 5px 0; border-bottom: 1px solid var(--rule); line-height: 1.4; }
.aside .note-s { display: block; font-family: var(--sans); font-size: 13px; color: var(--ink-3); margin-top: 2px; line-height: 1.45; }
.meter { height: 4px; background: var(--rule); margin: 8px 0 6px; } .meter i { display: block; height: 100%; background: var(--good); }
/* lessons */
.lesson-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-family: var(--sans); font-size: 13px; color: var(--ink-3); padding: 10px 0 14px; border-bottom: 1px solid var(--rule); margin-bottom: 18px; }
.lesson-meta span:nth-child(2) { flex: 1 1 320px; }
.lesson-body { max-width: 44em; }
.lesson-body p { margin: 0 0 14px; }
.lb-intro p { font-size: 19px; color: var(--ink); }
.lb-h { font-size: 22px; margin: 30px 0 10px; scroll-margin-top: 80px; }
.lb-k { font-family: var(--sans); font-size: 11.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.lb-box { border: 1px solid var(--rule); border-left: 3px solid var(--c, var(--rule-2)); background: var(--raise); border-radius: 0 4px 4px 0; padding: 12px 16px 4px; margin: 16px 0; overflow-x: auto; }
.lb-chk { --c: var(--a-numerics, var(--accent)); } .lb-sum { --c: var(--ink-3); background: var(--sunk); }
.exl, .chkl { margin: 0 0 8px; padding-left: 22px; } .exl > li, .chkl > li { margin: 10px 0 14px; } .exl > li > p, .chkl > li > p { margin: 0 0 6px; }
.folds { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: flex-start; } .folds .fold { flex-basis: 100%; margin-top: 4px; }
.rv-btn { font-family: var(--sans); font-size: 13.5px; }
.lvl { float: right; margin-left: 8px; font-family: var(--sans); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); border: 1px solid var(--rule-2); border-radius: 999px; padding: 1px 8px; }
.lvl-challenging { color: var(--accent); border-color: var(--accent); }
.lb-def { --c: var(--a-foundations); } .lb-thm { --c: var(--accent); } .lb-pit { --c: var(--warn); } .lb-ex { --c: var(--good); }

ory":"Geometric group theory","automorphic-forms":"Automorphic forms and the Langlands programme","weil-conjectures":"The Weil conjectures"},"bands":[{"id":"logic","name":"Logic and foundations","blurb":"Sets, logic, proof and induction, up to Gödel's theorems.","fields":["logic"]},{"id":"precalc","name":"Functions","blurb":"Functions and their graphs: polynomials, exponentials, logarithms and trigonometric functions.","fields":["algebra","calculus"]},{"id":"calculus","name":"Calculus","blurb":"Limits, derivatives, integrals, series and differential equations, in one and several variables.","fields":["calculus"]},{"id":"realanalysis","name":"Real analysis","blurb":"Calculus made rigorous: completeness, convergence, compactness and measure.","fields":["real-analysis"]},{"id":"complex","name":"Complex analysis","blurb":"Holomorphic functions, contour integrals, continuation and conformal maps.","fields":["complex-analysis"]},{"id":"harmonic","name":"Fourier analysis","blurb":"Fourier series, the Fourier transform and Poisson summation.","fields":["harmonic-analysis"]},{"id":"odes","name":"Differential equations","blurb":"Ordinary differential equations: first order, linear, systems, transforms and boundary value problems.","fields":["differential-equations"]},{"id":"dynamics","name":"Dynamical systems","blurb":"Phase portraits, stability, bifurcations, limit cycles and chaos.","fields":["dynamics"]},{"id":"pde","name":"Partial differential equations","blurb":"The heat, wave and Laplace equations, variational problems and fluid flow.","fields":["pde"]},{"id":"functional","name":"Functional analysis","blurb":"Banach and Hilbert spaces and the operators on them.","fields":["functional-analysis"]},{"id":"linalg","name":"Linear algebra","blurb":"Vector spaces, matrices, eigenvalues and the spectral theorem.","fields":["linear-algebra"]},{"id":"abstract","name":"Abstract algebra","blurb":"Groups, rings and fields, up to Galois theory.","fields":["algebra"]},{"id":"lie","name":"Representations and Lie theory","blurb":"Groups acting linearly: representations, characters, Lie groups and Lie algebras.","fields":["representation-theory"]},{"id":"topology","name":"Topology","blurb":"Spaces up to continuous deformation: connectedness, the fundamental group, surfaces and homology.","fields":["topology"]},{"id":"diffgeo","name":"Differential geometry","blurb":"Curves, surfaces, manifolds and curvature.","fields":["differential-geometry"]},{"id":"foundations","name":"Elementary number theory","blurb":"Divisibility, congruences, primes and Diophantine equations.","fields":["number-theory"]},{"id":"analytic","name":"Analytic number theory","blurb":"Primes through zeta and L-functions, sieves and exponential sums.","fields":["number-theory"]},{"id":"algebraic","name":"Algebraic number theory","blurb":"Number fields, ideals, reciprocity and their L-functions.","fields":["number-theory","algebra"]},{"id":"combinatorial","name":"Combinatorial & additive","blurb":"Where number theory and combinatorics are the same subject: sumsets, progressions, colourings.","fields":["combinatorics","number-theory"]},{"id":"discrete","name":"Combinatorics","blurb":"Counting, graphs, extremal and probabilistic arguments.","fields":["combinatorics"]},{"id":"olyalg","name":"Algebra & inequalities","blurb":"Inequalities, functional equations, polynomials and sequences.","fields":["algebra","real-analysis"]},{"id":"geometry","name":"Geometry","blurb":"Plane geometry from angle chasing to inversion, and its discrete side.","fields":["geometry"]},{"id":"probability","name":"Probability","blurb":"Chance made precise: expectation, distributions, limit theorems, Markov chains.","fields":["probability"]},{"id":"statistics","name":"Statistics","blurb":"Describing data, designing studies, estimation, testing and regression.","fields":["statistics"]},{"id":"numerics","name":"Numerical analysis and optimisation","blurb":"Computing answers: root-finding, quadrature, numerical ODEs and optimisation.","fields":["numerical-analysis","optimisation"]},{"id":"computation","name":"Computation & cryptography","blurb":"Algorithms built on number theory.","fields":["number-theory","computer-science","cryptography"]}],"fields":[{"id":"number-theory","name":"Number theory","built":true},{"id":"real-analysis","name":"Real analysis"},{"id":"complex-analysis","name":"Complex analysis"},{"id":"harmonic-analysis","name":"Harmonic analysis"},{"id":"special-functions","name":"Special functions"},{"id":"algebra","name":"Algebra","built":"partial"},{"id":"combinatorics","name":"Combinatorics","built":"partial"},{"id":"geometry","name":"Geometry","built":"partial"},{"id":"dynamics","name":"Dynamical systems"},{"id":"probability","name":"Probability"},{"id":"physics","name":"Physics"},{"id":"computer-science","name":"Computer science"},{"id":"cryptography","name":"Cryptography"},{"id":"quantum-computing","name":"Quantum computing"},{"id":"formal-verification","name":"Formal verification"},{"id":"ai-research","name":"AI-assisted research"},{"id":"logic","name":"Logic & set theory"},{"id":"topology","name":"Topology"},{"id":"algebraic-geometry","name":"Algebraic geometry"},{"id":"pde","name":"Partial differential equations"},{"id":"calculus","name":"Calculus"},{"id":"linear-algebra","name":"Linear algebra"},{"id":"differential-equations","name":"Differential equations"},{"id":"statistics","name":"Statistics","built":true},{"id":"differential-geometry","name":"Differential geometry","built":true},{"id":"functional-analysis","name":"Functional analysis","built":true},{"id":"representation-theory","name":"Representation theory","built":true},{"id":"numerical-analysis","name":"Numerical analysis","built":true},{"id":"optimisation","name":"Optimisation","built":true},{"id":"category-theory","name":"Category theory","built":true}],"concepts":[{"id":"sets-relations","band":"logic","title":"Sets, relations and orderings","short":"Sets & relations","pre":[],"sum":"A set is a collection determined by its elements, and a relation on $A$ is just a set of ordered pairs $R \\subseteq A \\times A$. The two most important kinds are equivalence relations (reflexive, symmetric, transitive), which are the same thing as partitions, and partial orders (reflexive, antisymmetric, transitive), which formalise 'comes before'.","key":["(A \\cup B)^c = A^c \\cap B^c,\\quad (A \\cap B)^c = A^c \\cup B^c","\\text{equivalence relations on } A \\;\\longleftrightarrow\\; \\text{partitions of } A","|\\mathcal{P}(A)| = 2^{|A|},\\qquad \\#\\{\\text{relations on } A\\} = 2^{|A|^2}"],"why":"Every quotient construction in mathematics (residues mod $n$, cosets, identifying the edges of a square to get a torus) is a partition by an equivalence relation, and partial orders model dependencies, from inclusion of sets to task scheduling.","msc":["03E20","06A06"],"links":[{"field":"computer-science","note":"Relational databases store n-ary relations as tables, and reachability in a directed graph is the transitive closure of its edge relation."},{"field":"algebra","note":"Quotient groups and rings are built by partitioning a group or ring into the classes of an equivalence relation, such as the cosets of a subgroup."},{"field":"topology","note":"Quotient spaces, such as a torus obtained from a square, are defined by gluing points together along an equivalence relation."}],"refs":["Rosen, Discrete Mathematics and Its Applications","Halmos, Naive Set Theory","Davey & Priestley, Introduction to Lattices and Order"],"status":null,"aliases":["set theory basics","set operations","relations","equivalence relation","partition","partial order","poset","Hasse diagram","transitive closure","Venn diagram"],"fields":["logic","combinatorics"],"stage":"school","np":{"textbook":11,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":11,"lesson":{"minutes":20,"checks":10,"fixed":0}},{"id":"logic-basics","band":"logic","title":"Propositional and predicate logic","short":"Logic","pre":[],"sum":"Propositional logic studies how the truth of compound statements built with $\\neg, \\wedge, \\vee, \\to, \\leftrightarrow$ depends on the truth of their parts; predicate logic adds variables and the quantifiers $\\forall$ and $\\exists$. The key skills are reading the conditional correctly ($p \\to q$ is false only when $p$ is true and $q$ false) and negating quantified statements by swapping $\\forall$ and $\\exists$.","key":["p \\to q \\;\\equiv\\; \\neg p \\vee q \\;\\equiv\\; \\neg q \\to \\neg p","\\neg \\forall x\\, P(x) \\equiv \\exists x\\, \\neg P(x), \\qquad \\neg \\exists x\\, P(x) \\equiv \\forall x\\, \\neg P(x)","\\forall x\\, \\exists y\\, \\varphi \\text{ and } \\exists y\\, \\forall x\\, \\varphi \\text{ are in general different}"],"why":"Every definition in analysis, such as continuity or convergence, is a nest of quantifiers that must be negated correctly in proofs, and satisfiability of propositional formulas is the core problem that SAT solvers and hardware verification tools attack.","msc":["03B05","03B10"],"links":[{"field":"real-analysis","note":"Limits, continuity and uniform convergence are defined by nested quantifiers, and the difference between pointwise and uniform convergence is exactly a swap of quantifier order."},{"field":"formal-verification","note":"Proof assistants and SAT/SMT solvers check propositional and first-order formulas mechanically to verify hardware and software."},{"field":"algebra","note":"The propositional connectives obey the laws of a Boolean algebra, the same laws satisfied by union, intersection and complement of sets."}],"refs":["Rosen, Discrete Mathematics and Its Applications","Enderton, A Mathematical Introduction to Logic","Velleman, How to Prove It"],"status":null,"aliases":["propositional logic","predicate logic","first-order logic","truth tables","quantifiers","logical connectives","rules of inference","contrapositive","Boolean logic","disjunctive normal form"],"fields":["logic","computer-science"],"stage":"school","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":9,"fixed":0}},{"id":"proof-methods","band":"logic","title":"Methods of proof","short":"Proof methods","pre":["logic-basics","sets-relations"],"sum":"A proof is a chain of justified steps from hypotheses and definitions to a conclusion. The standard shapes are direct proof, proof of the contrapositive ($\\neg q \\to \\neg p$ in place of $p \\to q$), proof by contradiction, proof by cases, constructive and non-constructive existence, and disproof by counterexample; the logical form of the statement tells you which shapes fit.","key":["(p \\to q) \\equiv (\\neg q \\to \\neg p)","\\big(\\neg P \\to (Q \\wedge \\neg Q)\\big) \\;\\Longrightarrow\\; P","\\neg\\, \\forall x\\, P(x) \\equiv \\exists x\\, \\neg P(x) \\quad \\text{(one counterexample disproves)}"],"why":"Every theorem on this site is established by combining these few patterns; recognising them turns reading a proof into following a plan, and writing one into choosing a plan.","msc":[],"links":[{"field":"number-theory","note":"Parity and remainder case analysis, contradiction (irrationality of $\\sqrt 2$, infinitude of primes) and infinite descent are the basic tools of elementary number theory."},{"field":"combinatorics","note":"Combinatorics leans heavily on non-constructive existence proofs, such as the pigeonhole principle and probabilistic arguments, which show an object exists without exhibiting it."},{"field":"formal-verification","note":"Proof assistants such as Lean make these proof shapes explicit as tactics (intro, cases, by_contra, exact) that a computer checks step by step."}],"refs":["Velleman, How to Prove It","Rosen, Discrete Mathematics and Its Applications","Pólya, How to Solve It"],"status":null,"aliases":["proof techniques","direct proof","proof by contradiction","reductio ad absurdum","contrapositive","proof by cases","counterexample","existence proof","infinite descent","without loss of generality"],"fields":["logic"],"stage":"school","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":8,"fixed":0}},{"id":"induction","band":"logic","title":"Mathematical induction and recursion","short":"Induction","pre":["proof-methods"],"sum":"Mathematical induction proves a statement $P(n)$ for all $n \\ge n_0$ by checking a base case $P(n_0)$ and showing that $P(k)$ implies $P(k+1)$. Its variants (strong induction, structural induction on recursively defined objects) and its twin, recursive definition, rest on the fact that every nonempty set of natural numbers has a least element.","key":["\\Big(P(n_0) \\wedge \\forall k \\ge n_0\\, \\big(P(k) \\to P(k+1)\\big)\\Big) \\;\\Longrightarrow\\; \\forall n \\ge n_0\\; P(n)","\\text{strong: } \\Big(\\forall k \\ge n_0\\, \\big(P(n_0) \\wedge \\dots \\wedge P(k) \\to P(k+1)\\big)\\Big) \\wedge P(n_0) \\;\\Longrightarrow\\; \\forall n \\ge n_0\\; P(n)","1 + 3 + \\dots + (2n-1) = n^2"],"why":"Induction is how one proves anything about all natural numbers or about recursively built objects; in computing it is the standard tool for showing that recursive programs and loops are correct and for analysing their running times through recurrences.","msc":[],"links":[{"field":"computer-science","note":"Correctness of recursive algorithms and of loops (via loop invariants) is proved by induction, and running times are obtained by solving recurrence relations."},{"field":"number-theory","note":"Strong induction proves that every integer greater than 1 factors into primes, and divisibility statements such as $3 \\mid 4^n - 1$ are proved by ordinary induction."},{"field":"formal-verification","note":"Proof assistants generate an induction principle automatically for every recursively defined data type, and many verified-software proofs are structural inductions."}],"refs":["Rosen, Discrete Mathematics and Its Applications","Velleman, How to Prove It","Engel, Problem-Solving Strategies"],"status":null,"aliases":["proof by induction","strong induction","complete induction","structural induction","well-ordering principle","recursion","recursive definition","recurrence relation"],"fields":["logic","combinatorics"],"stage":"school","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":22,"checks":10,"fixed":0}},{"id":"ordinals-cardinals","band":"logic","title":"Countability, cardinals and ordinals","short":"Cardinals & ordinals","pre":["sets-relations","functions","induction"],"sum":"Two sets have the same cardinality when there is a bijection between them; $\\mathbb{N}$, $\\mathbb{Z}$ and $\\mathbb{Q}$ are countable, but by Cantor's diagonal argument $|A| < |\\mathcal{P}(A)|$ for every set, so $\\mathbb{R}$ is uncountable. Ordinals are the order types of well-ordered sets, extending counting and induction beyond the natural numbers to $\\omega, \\omega+1, \\dots, \\omega^2, \\dots$.","key":["|A| < |\\mathcal{P}(A)| = 2^{|A|}","\\aleph_0 = |\\mathbb{N}| = |\\mathbb{Q}| = |\\mathbb{N} \\times \\mathbb{N}|, \\qquad |\\mathbb{R}| = 2^{\\aleph_0}","\\text{injections } A \\to B \\text{ and } B \\to A \\;\\Longrightarrow\\; \\text{a bijection } A \\to B"],"why":"Countability arguments show that most real numbers are transcendental and that most sets of integers cannot be decided by any program, and ordinals supply the transfinite induction used to build objects step by step past the natural numbers.","msc":["03E10"],"links":[{"field":"real-analysis","note":"Countable sets have Lebesgue measure zero, and the uncountability of $\\mathbb{R}$ is why the rationals and algebraic numbers form only a negligible part of the line."},{"field":"computer-science","note":"There are only countably many programs but uncountably many sets of natural numbers, so most sets are undecidable; the halting problem is proved by the same diagonal argument as Cantor's theorem."},{"field":"algebra","note":"Zorn's lemma and transfinite recursion give every vector space a basis, and cardinality comparisons show that $\\mathbb{R}$ as a vector space over $\\mathbb{Q}$ has dimension $2^{\\aleph_0}$."}],"refs":["Halmos, Naive Set Theory","Enderton, Elements of Set Theory","Jech, Set Theory"],"status":null,"aliases":["countable","uncountable","cardinality","cardinal numbers","ordinal numbers","Cantor's diagonal argument","Cantor's theorem","Schröder–Bernstein theorem","Cantor–Bernstein theorem","transfinite induction","continuum hypothesis","aleph"],"fields":["logic","combinatorics"],"stage":"undergraduate","np":{"textbook":6,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":6,"lesson":{"minutes":25,"checks":10,"fixed":0}},{"id":"completeness-theorem","band":"logic","title":"Gödel's completeness and compactness theorems","short":"Completeness theorem","pre":["logic-basics","induction"],"sum":"Gödel's completeness theorem says that in first-order logic semantic consequence and formal provability coincide: $\\Gamma \\models \\varphi$ if and only if $\\Gamma \\vdash \\varphi$; equivalently, every consistent set of sentences has a model. Its corollary, the compactness theorem, says a set of sentences has a model as soon as each of its finite subsets does, which yields nonstandard models of arithmetic and shows that properties like finiteness or connectedness are not first-order expressible.","key":["\\Gamma \\vdash \\varphi \\iff \\Gamma \\models \\varphi","\\Gamma \\text{ is consistent} \\iff \\Gamma \\text{ has a model}","\\Gamma \\text{ has a model} \\iff \\text{every finite } \\Gamma_0 \\subseteq \\Gamma \\text{ has a model}"],"why":"Soundness lets one prove non-provability by exhibiting a countermodel, and completeness guarantees that every non-provable sentence has one, so provability questions can be settled by building structures; compactness is the basic construction tool of model theory, producing infinitesimals, nonstandard integers and colourings of infinite graphs from finite information.","msc":["03B10","03C07"],"links":[{"field":"real-analysis","note":"Applying compactness to the theory of the real numbers produces ordered fields with infinitesimals, on which Robinson's nonstandard analysis rebuilds calculus."},{"field":"combinatorics","note":"Propositional compactness shows that an infinite graph is k-colourable whenever all its finite subgraphs are (the de Bruijn–Erdős theorem), and similar arguments transfer finite Ramsey-type results to infinite ones and back."},{"field":"algebra","note":"Compactness shows that a first-order statement true in every field of characteristic 0 holds in characteristic p for all large primes p, a transfer principle used in algebra and algebraic geometry."}],"refs":["Enderton, A Mathematical Introduction to Logic","Mendelson, Introduction to Mathematical Logic","Ebbinghaus, Flum & Thomas, Mathematical Logic"],"status":null,"aliases":["completeness theorem","Gödel's completeness theorem","compactness theorem","soundness theorem","Henkin construction","Löwenheim–Skolem theorem","nonstandard models","first-order logic","model theory"],"fields":["logic"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":9,"fixed":1}},{"id":"incompleteness","band":"logic","title":"Gödel's incompleteness theorems","short":"Incompleteness","pre":["completeness-theorem","computability"],"sum":"Gödel's first incompleteness theorem says that every consistent, effectively axiomatised theory that contains a modest amount of arithmetic leaves some arithmetical sentence $G$ undecided: $T \\nvdash G$ and $T \\nvdash \\neg G$. The second says such a theory (extending PA) cannot prove its own consistency $\\mathrm{Con}_T$. Both rest on coding formulas by numbers and on a diagonal construction of a sentence that says 'I am not provable'.","key":["T \\vdash G \\leftrightarrow \\neg\\mathrm{Prov}_T(\\ulcorner G \\urcorner)","T \\text{ consistent, effectively axiomatised},\\ T \\supseteq Q \\;\\Longrightarrow\\; T \\nvdash G \\text{ and } T \\nvdash \\neg G","T \\supseteq \\mathrm{PA} \\text{ consistent, effectively axiomatised} \\;\\Longrightarrow\\; T \\nvdash \\mathrm{Con}_T"],"why":"The theorems set permanent limits on axiomatic mathematics and on mechanical theorem proving, and they explain why concrete statements like Goodstein's theorem need methods beyond Peano arithmetic.","msc":["03F40","03F30"],"links":[{"field":"number-theory","note":"By the Matiyasevich–Robinson–Davis–Putnam theorem, for any such theory there is a polynomial Diophantine equation with no solutions in natural numbers whose unsolvability the theory cannot prove."},{"field":"combinatorics","note":"The Paris–Harrington strengthening of the finite Ramsey theorem (1977) is the classic example of a natural combinatorial statement that is true but unprovable in Peano arithmetic."},{"field":"formal-verification","note":"A proof assistant whose logic is consistent, effectively axiomatised and strong enough to encode arithmetic cannot verify its own consistency from within, so trust in its kernel ultimately rests on a stronger or external argument."}],"refs":["Enderton, A Mathematical Introduction to Logic","Smith, An Introduction to Gödel's Theorems","Boolos, Burgess & Jeffrey, Computability and Logic"],"status":null,"aliases":["Gödel's incompleteness theorem","first incompleteness theorem","second incompleteness theorem","Gödel numbering","Gödel sentence","diagonal lemma","fixed-point lemma","Rosser's theorem","Hilbert's programme","Peano arithmetic","Goodstein's theorem"],"fields":["logic","computer-science"],"stage":"undergraduate","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":7,"fixed":0}},{"id":"functions","band":"precalc","title":"Functions and their graphs","short":"Functions","pre":[],"sum":"A function $f\\colon A \\to B$ assigns to every input $x$ in its domain $A$ exactly one output $f(x)$. Its graph, the set of points $(x, f(x))$, turns algebraic properties into pictures. The idea to remember is one output per input, which is why a vertical line meets a graph at most once.","key":["f\\colon A \\to B,\\quad x \\mapsto f(x)","y = f(x - h) + k \\text{ is the graph of } y = f(x) \\text{ moved } h \\text{ right and } k \\text{ up}","(g \\circ f)(x) = g(f(x)), \\qquad f^{-1} \\text{ exists} \\iff f \\text{ is a bijection}"],"why":"Every quantity that depends on another, such as a fare depending on distance or a position depending on time, is a function. Calculus, algebra and probability are all written in this language.","msc":[],"links":[{"field":"computer-science","note":"A program that returns one output for each input computes a function, and the injective maps are exactly the encodings that can be decoded without loss."},{"field":"physics","note":"Physical laws are stated as functions, such as position as a function of time or pressure as a function of volume."},{"field":"linear-algebra","note":"Linear maps are the functions between vector spaces that respect addition and scaling, and matrices are how they are written down."}],"refs":["Gelfand, Glagoleva & Shnol, Functions and Graphs","Spivak, Calculus"],"status":null,"aliases":["function","graph of a function","domain and range","inverse function","composition of functions","injective","surjective","bijection","even and odd functions","vertical line test"],"fields":["algebra","calculus"],"stage":"school","np":{"textbook":0,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":1,"lesson":{"minutes":14,"checks":8,"fixed":2}},{"id":"exp-log","band":"precalc","title":"Exponentials and logarithms","short":"Exp & log","pre":["functions"],"sum":"The exponential function $a^x$ multiplies its value by the fixed factor $a$ each time $x$ increases by $1$; the logarithm $\\log_a$ is its inverse and turns products into sums. The natural base $e \\approx 2.71828$ is the one for which the graph of $e^x$ is exactly as steep as it is high.","key":["a^{x+y} = a^x a^y, \\qquad (a^x)^y = a^{xy}","\\log_a(xy) = \\log_a x + \\log_a y, \\qquad \\log_a x = \\dfrac{\\log_b x}{\\log_b a}","e = \\lim_{n\\to\\infty}\\left(1 + \\dfrac1n\\right)^n \\approx 2.71828"],"why":"Growth and decay by a constant factor per unit of time (populations, interest, radioactivity) is exponential, and logarithms measure quantities that span many orders of magnitude, such as the number of digits of a number.","msc":["26A09","33B10"],"links":[{"field":"number-theory","note":"The prime number theorem says that the number of primes up to $x$ is approximately $x/\\ln x$."},{"field":"computer-science","note":"Binary search and balanced search trees take about $\\log_2 n$ steps on $n$ items, and algorithms are often classified by whether their running time grows logarithmically, polynomially or exponentially."},{"field":"physics","note":"Radioactive decay and Newton's law of cooling are exponential laws, and the half-life of a decay $e^{-kt}$ is $(\\ln 2)/k$."}],"refs":["Maor, e: The Story of a Number","Spivak, Calculus","Courant & Robbins, What Is Mathematics?"],"status":null,"aliases":["exponential function","logarithm","natural logarithm","ln","Euler's number e","laws of logarithms","change of base","exponential growth","compound interest"],"fields":["calculus","algebra"],"stage":"school","np":{"textbook":8,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":8,"lesson":{"minutes":14,"checks":11,"fixed":0}},{"id":"trig","band":"precalc","title":"Trigonometric functions","short":"Trigonometry","pre":["functions","euclid-basics"],"sum":"Cosine and sine are the coordinates of the point $P(\\theta)$ reached by travelling a distance $\\theta$ around the unit circle from $(1, 0)$; for acute angles they agree with the ratios of sides in a right triangle. The addition formulas, from which most other identities follow, come from the fact that rotations preserve distances.","key":["P(\\theta) = (\\cos\\theta, \\sin\\theta), \\qquad \\cos^2\\theta + \\sin^2\\theta = 1","\\sin(\\alpha + \\beta) = \\sin\\alpha\\cos\\beta + \\cos\\alpha\\sin\\beta","\\cos(\\alpha + \\beta) = \\cos\\alpha\\cos\\beta - \\sin\\alpha\\sin\\beta"],"why":"They convert between angles and lengths in triangles, and they are the basic periodic functions, used to describe rotations, oscillations and waves.","msc":["33B10","26A09"],"links":[{"field":"physics","note":"Simple harmonic motion, alternating current and waves are described by sines and cosines of $\\omega t$."},{"field":"harmonic-analysis","note":"Fourier series write a periodic function as a sum of sines and cosines of multiples of a basic frequency."},{"field":"complex-analysis","note":"Euler's formula $e^{i\\theta} = \\cos\\theta + i\\sin\\theta$ turns the addition formulas into the rule $e^{i\\alpha}e^{i\\beta} = e^{i(\\alpha + \\beta)}$."}],"refs":["Gelfand & Saul, Trigonometry","Andreescu & Feng, 103 Trigonometry Problems"],"status":null,"aliases":["trigonometry","sine","cosine","tangent","unit circle","radian","addition formulas","double angle formulas","law of cosines","law of sines"],"fields":["calculus","geometry"],"stage":"school","np":{"textbook":0,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":5,"lesson":{"minutes":15,"checks":11,"fixed":0}},{"id":"ap-gp","band":"precalc","title":"Arithmetic and geometric sequences","short":"Arithmetic & geometric sequences","pre":["functions"],"sum":"An arithmetic progression adds a fixed difference $d$ at each step; a geometric progression multiplies by a fixed ratio $r$. Their sums have closed forms, found by pairing terms from the two ends (arithmetic) or by multiplying by $r$ and subtracting (geometric), and a geometric series with $|r| < 1$ has a finite sum even with infinitely many terms.","key":["a_n = a_1 + (n - 1)d, \\qquad a_1 + a_2 + \\cdots + a_n = \\dfrac{n(a_1 + a_n)}{2}","b_n = b_1 r^{n-1}, \\qquad b_1 + b_1 r + \\cdots + b_1 r^{n-1} = b_1\\dfrac{1 - r^n}{1 - r} \\quad (r \\ne 1)","\\sum_{k=0}^{\\infty} b_1 r^k = \\dfrac{b_1}{1 - r} \\quad (|r| < 1)"],"why":"They model steady additive and multiplicative change, such as instalments, interest and repeated halving, and the geometric series is the benchmark against which other infinite series are compared.","msc":["11B25","40A05"],"links":[{"field":"number-theory","note":"Dirichlet's theorem says that an arithmetic progression $a, a + d, a + 2d, \\ldots$ with $\\gcd(a, d) = 1$ contains infinitely many primes."},{"field":"combinatorics","note":"Van der Waerden's theorem gives arbitrarily long arithmetic progressions inside one colour class of any colouring of the positive integers with finitely many colours, and Szemerédi's theorem gives them in every set of positive upper density."},{"field":"real-analysis","note":"The ratio and root tests decide the convergence of many series by comparing them with a geometric series."}],"refs":["Gelfand & Shen, Algebra","Graham, Knuth & Patashnik, Concrete Mathematics"],"status":null,"aliases":["arithmetic progression","geometric progression","arithmetic sequence","geometric sequence","AP","GP","geometric series","arithmetic series","common difference","common ratio","repeating decimal"],"fields":["algebra"],"stage":"school","np":{"textbook":0,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":1,"lesson":{"minutes":14,"checks":9,"fixed":1}},{"id":"quadratics","band":"precalc","title":"Quadratic equations and quadratic functions","short":"Quadratics","pre":["functions"],"sum":"A quadratic function $f(x) = ax^2 + bx + c$ with $a \\ne 0$ has a parabola as its graph, with vertex at $x = -\\tfrac{b}{2a}$. Completing the square turns any quadratic into the form $a(x-h)^2 + k$, from which the quadratic formula, the maximum or minimum value, and the number of real roots (decided by the discriminant $b^2 - 4ac$) all follow.","key":["ax^2 + bx + c = 0,\\ a \\ne 0 \\iff x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}","ax^2 + bx + c = a\\left(x + \\frac{b}{2a}\\right)^2 - \\frac{b^2 - 4ac}{4a}","\\Delta = b^2 - 4ac:\\quad \\Delta > 0 \\text{ two real roots},\\ \\Delta = 0 \\text{ one repeated root},\\ \\Delta < 0 \\text{ no real roots}"],"why":"Quadratics are the first nonlinear functions everyone meets, and they model projectile heights, areas, and profits that rise and then fall. The discriminant trick, that a quadratic which is never negative cannot have two distinct real roots, proves inequalities as strong as Cauchy–Schwarz.","msc":["97H30"],"links":[{"field":"physics","note":"Under constant gravity the height of a projectile is a quadratic function of time, so its maximum height and landing time come from the vertex and the roots."},{"field":"optimisation","note":"Minimising a quadratic by completing the square is the one-variable case of least-squares and quadratic programming, where the minimum of a convex quadratic is found exactly."},{"field":"geometry","note":"Intersecting a line with a circle or a parabola leads to a quadratic equation, and the sign of its discriminant says whether the line misses, touches or cuts the curve."}],"refs":["Gelfand & Shen, Algebra","Rusczyk, Introduction to Algebra","Stewart, Redlin & Watson, Precalculus: Mathematics for Calculus"],"status":null,"aliases":["quadratic equation","quadratic function","quadratic formula","parabola","completing the square","discriminant","vertex form","roots of a quadratic","factorising quadratics"],"fields":["algebra"],"stage":"school","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":9,"fixed":1}},{"id":"solving-inequalities","band":"precalc","title":"Solving inequalities","short":"Solving inequalities","pre":["quadratics"],"sum":"Solving an inequality means finding the set of all values that make it true, usually a union of intervals. The key rules are that adding anything preserves an inequality while multiplying by a negative number reverses it; polynomial and rational inequalities are solved by finding where each factor changes sign and reading off a sign chart, never by multiplying through by an expression of unknown sign.","key":["a < b \\text{ and } c < 0 \\implies ac > bc","a > 0,\\ r < s:\\quad a(x - r)(x - s) < 0 \\iff r < x < s","|x - a| < d \\iff a - d < x < a + d \\quad (d > 0)"],"why":"Inequalities describe constraints: budgets, tolerances, safe ranges of a dose, feasible production plans. Solving them exactly, including the sign-chart method for rational expressions, is the everyday tool behind estimates in analysis and the feasible regions of linear programming.","msc":["97H30"],"links":[{"field":"optimisation","note":"A system of linear inequalities in several variables defines a convex feasible region, and linear programming optimises a linear objective over it."},{"field":"real-analysis","note":"Limit and continuity proofs consist of solving inequalities such as $|x - a| < \\delta$ to guarantee $|f(x) - L| < \\varepsilon$."}],"refs":["Rusczyk, Introduction to Algebra","Gelfand & Shen, Algebra","Stewart, Redlin & Watson, Precalculus: Mathematics for Calculus"],"status":null,"aliases":["inequalities","linear inequalities","quadratic inequalities","rational inequalities","absolute value inequalities","sign chart","sign diagram","interval notation","systems of inequalities","compound inequalities"],"fields":["algebra"],"stage":"school","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":9,"fixed":1}},{"id":"rational-functions","band":"precalc","title":"Rational functions and partial fractions","short":"Rational functions","pre":["polynomials-roots","functions"],"sum":"A rational function is a quotient $f(x) = p(x)/q(x)$ of polynomials, defined wherever $q(x) \\ne 0$. After cancelling common factors, the zeros of the denominator give vertical asymptotes, cancelled factors leave holes, and the degrees of $p$ and $q$ decide the end behaviour. Every proper rational function splits uniquely into partial fractions, simple pieces with one linear or irreducible quadratic factor (or a power of one) in each denominator.","key":["\\frac{p(x)}{(x - a_1)\\cdots(x - a_n)} = \\sum_{i=1}^{n} \\frac{A_i}{x - a_i}, \\quad A_i = \\frac{p(a_i)}{\\prod_{j \\ne i}(a_i - a_j)} \\quad (\\deg p < n,\\ a_i \\text{ distinct})","\\deg p < \\deg q \\implies \\lim_{x \\to \\pm\\infty} \\frac{p(x)}{q(x)} = 0","\\frac{1}{k(k+1)} = \\frac1k - \\frac{1}{k+1}"],"why":"Rational functions are the simplest functions with asymptotes, and they model quantities like average cost or the strength of a lens. Partial fractions turn them into pieces that are easy to integrate, sum telescopically, or expand as power series, which is how one solves linear recurrences and inverts Laplace transforms.","msc":["26C15"],"links":[{"field":"complex-analysis","note":"Over the complex numbers a rational function is meromorphic, and the coefficients of the terms $A/(z - a)$ in its partial fraction expansion are its residues at the poles $a$."},{"field":"combinatorics","note":"A sequence satisfying a linear recurrence with constant coefficients has a rational generating function, and partial fractions turn it into an explicit formula such as Binet's formula for Fibonacci numbers."},{"field":"differential-equations","note":"Solving linear ODEs by the Laplace transform ends with a rational function of $s$, which partial fractions break into terms whose inverse transforms are known exponentials and sinusoids."}],"refs":["Stewart, Calculus: Early Transcendentals","Stewart, Redlin & Watson, Precalculus: Mathematics for Calculus","Gelfand & Shen, Algebra"],"status":null,"aliases":["rational function","partial fractions","partial fraction decomposition","asymptote","vertical asymptote","horizontal asymptote","oblique asymptote","slant asymptote","hole in a graph","removable discontinuity","cover-up rule"],"fields":["algebra","calculus"],"stage":"school","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":25,"checks":9,"fixed":0}},{"id":"hyperbolic-functions","band":"precalc","title":"Hyperbolic functions","short":"Hyperbolic functions","pre":["exp-log","diff-rules"],"sum":"The hyperbolic functions $\\cosh x = \\frac{e^x + e^{-x}}{2}$ and $\\sinh x = \\frac{e^x - e^{-x}}{2}$ are the even and odd parts of $e^x$. They satisfy $\\cosh^2 x - \\sinh^2 x = 1$, so $(\\cosh t, \\sinh t)$ traces the hyperbola $x^2 - y^2 = 1$ just as $(\\cos t, \\sin t)$ traces the circle, and their identities mirror the trigonometric ones with some signs changed; their inverses are logarithms.","key":["\\cosh^2 x - \\sinh^2 x = 1, \\qquad \\frac{d}{dx}\\sinh x = \\cosh x, \\qquad \\frac{d}{dx}\\cosh x = \\sinh x","\\operatorname{arsinh} x = \\ln\\left(x + \\sqrt{x^2 + 1}\\right), \\qquad \\operatorname{arcosh} x = \\ln\\left(x + \\sqrt{x^2 - 1}\\right)\\ (x \\ge 1)","\\cosh(ix) = \\cos x, \\qquad \\sinh(ix) = i \\sin x"],"why":"A hanging chain takes the shape of a cosh curve, the solutions of $y'' = y$ are combinations of cosh and sinh, and integrals like $\\int \\frac{dx}{\\sqrt{x^2 + 1}}$ are inverse hyperbolic functions. In special relativity, velocities combine by the addition formula for tanh.","msc":[],"links":[{"field":"physics","note":"A uniform chain hanging under gravity takes the shape $y = a\\cosh(x/a)$, and in special relativity the rapidity $\\phi$ with $v = c\\tanh\\phi$ adds under successive boosts."},{"field":"complex-analysis","note":"Since $\\cosh z = \\cos(iz)$ and $\\sinh z = -i\\sin(iz)$, the hyperbolic and trigonometric functions are the same entire functions viewed along different directions in the complex plane."},{"field":"differential-equations","note":"The general solution of $y'' = k^2 y$ is $A\\cosh kx + B\\sinh kx$, a convenient basis when boundary conditions are given at $x = 0$."}],"refs":["Stewart, Calculus: Early Transcendentals","Spivak, Calculus","Abramowitz & Stegun, Handbook of Mathematical Functions"],"status":null,"aliases":["hyperbolic sine","hyperbolic cosine","hyperbolic tangent","sinh","cosh","tanh","sech","cosech","coth","inverse hyperbolic functions","arsinh","arcosh","artanh","catenary","Osborn's rule"],"fields":["calculus","special-functions"],"stage":"school","np":{"textbook":0,"olympiad":0,"bridge":0,"research":0,"examples":0},"nprob":0,"lesson":{"minutes":20,"checks":10,"fixed":0}},{"id":"series","band":"calculus","title":"Series and convergence","short":"Series","pre":["seq-limits"],"sum":"When an infinite series converges, and how fast. $\\sum 1/n^s$ converges for real $s>1$ and diverges at $s=1$; that boundary is where the zeta function's story begins.","key":["\\sum_{n \\ge 1} \\frac{1}{n^s} < \\infty \\iff s > 1 \\quad (s \\in \\mathbb{R})"],"why":"Convergence questions decide where Dirichlet series define functions at all.","msc":["40A05"],"links":[],"refs":["Stein & Shakarchi, Complex Analysis"],"status":null,"aliases":["convergence","p-series"],"fields":["real-analysis"],"stage":"undergraduate","np":{"textbook":25,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":30,"lesson":{"minutes":22,"checks":11,"fixed":0}},{"id":"limits","band":"calculus","title":"Limits of functions","short":"Limits","pre":["functions"],"sum":"$\\lim_{x\\to a} f(x) = L$ means that $f(x)$ is as close to $L$ as you like for all $x$ close enough to $a$, with $x \\ne a$; the value of $f$ at $a$ plays no role. The epsilon–delta definition makes this precise, and the limit laws and the squeeze theorem do most of the computing.","key":["\\lim_{x\\to a} f(x) = L \\iff \\forall \\varepsilon > 0\\ \\exists \\delta > 0:\\ 0 < |x - a| < \\delta \\implies |f(x) - L| < \\varepsilon","\\lim_{x\\to a}\\big(f(x) + g(x)\\big) = L + M, \\qquad \\lim_{x\\to a} f(x)g(x) = LM","\\lim_{x\\to 0}\\dfrac{\\sin x}{x} = 1"],"why":"Derivatives, integrals, continuity and infinite sums are all defined as limits, so this is the idea on which the whole of calculus rests.","msc":["26A03"],"links":[{"field":"real-analysis","note":"Real analysis is built on the epsilon–delta definition, extending it to sequences, series and uniform convergence of functions."},{"field":"probability","note":"The law of large numbers and the central limit theorem are limit statements about averages of many random variables."},{"field":"computer-science","note":"Running times of algorithms are compared through limits of ratios as the input size tends to infinity."}],"refs":["Spivak, Calculus","Apostol, Calculus, Volume 1","Courant & John, Introduction to Calculus and Analysis, Volume I"],"status":null,"aliases":["limit","limit of a function","epsilon-delta definition","one-sided limit","limit at infinity","squeeze theorem","sandwich theorem","limit laws","sin x over x"],"fields":["calculus"],"stage":"school","np":{"textbook":9,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":10,"lesson":{"minutes":15,"checks":8,"fixed":0}},{"id":"continuity","band":"calculus","title":"Continuity and the intermediate value theorem","short":"Continuity","pre":["limits"],"sum":"A function is continuous at $a$ when $\\lim_{x\\to a} f(x) = f(a)$: small changes in the input produce small changes in the output. The intermediate value theorem says that a function continuous on $[a, b]$ takes every value between $f(a)$ and $f(b)$; its proof needs the completeness of the real numbers.","key":["f \\text{ is continuous at } a \\iff \\lim_{x\\to a} f(x) = f(a)","f \\text{ continuous on } [a, b],\\ f(a) < y < f(b) \\implies \\exists\\, c \\in (a, b):\\ f(c) = y","f \\text{ continuous on } [a, b] \\implies f \\text{ attains a largest and a smallest value on } [a, b]"],"why":"Continuity lets finitely many values tell you about a whole function: it guarantees that equations have solutions, that optimisation problems on closed intervals have answers, and that bisection finds roots.","msc":["26A15"],"links":[{"field":"topology","note":"Topology defines continuity through open sets, and the intermediate value theorem becomes the statement that a continuous image of a connected space is connected."},{"field":"computer-science","note":"Bisection, the simplest root-finding algorithm, is the intermediate value theorem turned into a procedure that halves the search interval at each step."},{"field":"differential-equations","note":"Peano's existence theorem says that if $f$ is continuous near $(x_0, y_0)$, then $y' = f(x, y)$ with $y(x_0) = y_0$ has a solution on some interval around $x_0$, though not necessarily a unique one."}],"refs":["Spivak, Calculus","Abbott, Understanding Analysis"],"status":null,"aliases":["continuous function","intermediate value theorem","IVT","Bolzano's theorem","extreme value theorem","bisection method","removable discontinuity","jump discontinuity","fixed point","universal chord theorem"],"fields":["calculus","real-analysis"],"stage":"school","np":{"textbook":54,"olympiad":2,"bridge":0,"research":0,"examples":0},"nprob":56,"lesson":{"minutes":15,"checks":10,"fixed":2}},{"id":"derivative","band":"calculus","title":"The derivative","short":"Derivative","pre":["limits"],"sum":"The derivative $f'(a)$ is the instantaneous rate of change of $f$ at $a$: the limit of the slopes of chords through $(a, f(a))$ as the second point approaches the first. Geometrically it is the slope of the tangent line, and the idea to remember is that near $a$ a differentiable function looks like a straight line of slope $f'(a)$.","key":["f'(a) = \\lim_{h \\to 0} \\frac{f(a+h) - f(a)}{h}","f(a+h) = f(a) + f'(a)\\,h + E(h), \\qquad \\frac{E(h)}{h} \\to 0 \\ (h \\to 0)","f \\text{ differentiable at } a \\implies f \\text{ continuous at } a"],"why":"Velocity, acceleration, growth rates and marginal cost are all derivatives, and the derivative is the basic tool for optimisation, approximation and differential equations.","msc":["26A24"],"links":[{"field":"physics","note":"Velocity and acceleration are the first and second derivatives of position, so Newton's second law F = ma is an equation involving a second derivative."},{"field":"differential-equations","note":"A differential equation is a relation between an unknown function and its derivatives, such as y' = ky for growth and decay."},{"field":"real-analysis","note":"Real analysis makes the limit in the definition rigorous and studies how badly differentiability can fail, down to continuous functions with no derivative anywhere."}],"refs":["Spivak, Calculus","Apostol, Calculus, Volume 1","Stewart, Calculus: Early Transcendentals"],"status":null,"aliases":["differentiation","rate of change","slope of the tangent","difference quotient","instantaneous velocity","differentiable function"],"fields":["calculus"],"stage":"school","np":{"textbook":13,"olympiad":2,"bridge":0,"research":0,"examples":0},"nprob":15,"lesson":{"minutes":16,"checks":8,"fixed":0}},{"id":"diff-rules","band":"calculus","title":"Rules of differentiation","short":"Differentiation rules","pre":["derivative","exp-log","trig"],"sum":"A short list of rules (linearity, the product, quotient and chain rules, and the derivatives of powers, exponentials, logarithms and trigonometric functions) lets you differentiate any formula built from elementary functions without going back to limits. The rule to understand deeply is the chain rule: rates of change multiply along a chain of dependencies.","key":["(fg)' = f'g + fg', \\qquad \\left(\\frac fg\\right)' = \\frac{f'g - fg'}{g^2}","(f \\circ g)'(x) = f'(g(x))\\,g'(x)","\\frac{d}{dx}x^r = rx^{r-1} \\ (x > 0), \\quad \\frac{d}{dx}e^x = e^x, \\quad \\frac{d}{dx}\\ln x = \\frac1x \\ (x > 0), \\quad \\frac{d}{dx}\\sin x = \\cos x"],"why":"These rules turn differentiation into routine algebra, which is what makes optimisation, related rates, Taylor expansions and the solution of differential equations practical; read backwards they give the main methods of integration.","msc":["26A24"],"links":[{"field":"ai-research","note":"Training a neural network by backpropagation is the chain rule applied systematically through a long composition of simple functions."},{"field":"physics","note":"Differentiating the energy E = ½mv² + V(x) of a moving particle with the chain rule gives E′ = v(ma + V′(x)), so Newton's law ma = −V′(x) implies that energy is conserved."}],"refs":["Spivak, Calculus","Apostol, Calculus, Volume 1","Stewart, Calculus: Early Transcendentals"],"status":null,"aliases":["product rule","quotient rule","chain rule","power rule","implicit differentiation","logarithmic differentiation","derivative of inverse function","table of derivatives"],"fields":["calculus"],"stage":"school","np":{"textbook":0,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":1,"lesson":{"minutes":16,"checks":8,"fixed":0}},{"id":"mvt","band":"calculus","title":"The mean value theorem","short":"Mean value theorem","pre":["derivative","continuity"],"sum":"If $f$ is continuous on $[a, b]$ and differentiable on $(a, b)$, then at some point $c$ strictly inside the interval the instantaneous rate of change equals the average rate: $f'(c) = \\frac{f(b) - f(a)}{b - a}$. It is the bridge that turns information about $f'$ into information about $f$, and it rests on Rolle's theorem and the extreme value theorem.","key":["f'(c) = \\frac{f(b) - f(a)}{b - a} \\quad \\text{for some } c \\in (a, b)","f(a) = f(b) \\implies f'(c) = 0 \\text{ for some } c \\in (a, b) \\quad \\text{(Rolle)}","|f'| \\le M \\text{ on an interval } I \\implies |f(x) - f(y)| \\le M|x - y| \\text{ for } x, y \\in I"],"why":"It justifies the facts used everywhere in calculus (zero derivative means constant, positive derivative means increasing) and is the engine behind L'Hôpital's rule, Taylor's theorem, the fundamental theorem of calculus and most error estimates.","msc":["26A24"],"links":[{"field":"differential-equations","note":"If the partial derivative of f(t, y) with respect to y is bounded, the mean value theorem makes f Lipschitz in y, which is the hypothesis of the standard uniqueness theorem for y' = f(t, y)."},{"field":"number-theory","note":"Liouville's theorem, that an algebraic number α of degree d ≥ 2 satisfies |α − p/q| > c/q^d for some c > 0 and all fractions p/q, is proved by applying the mean value theorem to the minimal polynomial of α."},{"field":"complex-analysis","note":"The equality form fails for complex-valued functions (e^{it} on [0, 2π] has average rate of change 0 while |f'| = 1), but the inequality |f(b) − f(a)| ≤ |b − a| max|f'| along a segment survives and is a standard estimate for holomorphic functions."}],"refs":["Spivak, Calculus","Rudin, Principles of Mathematical Analysis","Abbott, Understanding Analysis"],"status":null,"aliases":["MVT","Lagrange mean value theorem","Rolle's theorem","Cauchy mean value theorem","Fermat's theorem on stationary points","interior extremum theorem"],"fields":["calculus","real-analysis"],"stage":"undergraduate","np":{"textbook":8,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":13,"lesson":{"minutes":16,"checks":8,"fixed":0}},{"id":"deriv-applications","band":"calculus","title":"Applications of the derivative","short":"Optimisation & curve sketching","pre":["diff-rules","mvt"],"sum":"The sign of $f'$ tells where $f$ rises and falls, and the sign of $f''$ tells which way its graph bends; together they locate maxima, minima and inflection points. An optimisation problem is solved by writing the quantity as a function of one variable on its natural domain, finding the critical points, and comparing the values there with the values at the endpoints.","key":["f'(c) = 0,\\ f''(c) > 0 \\implies f \\text{ has a strict local minimum at } c","\\text{a continuous } f \\text{ on } [a, b] \\text{ attains its maximum at an endpoint or at a critical point}","f'' > 0 \\text{ on an interval} \\implies \\text{the graph of } f \\text{ is convex there}"],"why":"Finding the best value of a quantity (least cost, greatest area, shortest time) is one of the main practical uses of calculus, and sign tables of $f'$ and $f''$ turn a formula into an accurate picture.","msc":["26A06"],"links":[{"field":"physics","note":"Fermat's principle that light takes the path of least time, combined with the first derivative test, yields Snell's law of refraction."},{"field":"computer-science","note":"Newton's method, which replaces a curve by its tangent line to find roots, is a standard algorithm of scientific computing."}],"refs":["Stewart, Calculus: Early Transcendentals","Spivak, Calculus","Courant & John, Introduction to Calculus and Analysis I"],"status":null,"aliases":["optimisation","optimization","curve sketching","maxima and minima","critical point","stationary point","first derivative test","second derivative test","inflection point","concavity"],"fields":["calculus"],"stage":"school","np":{"textbook":0,"olympiad":3,"bridge":0,"research":0,"examples":0},"nprob":3,"lesson":{"minutes":15,"checks":9,"fixed":1}},{"id":"lhopital","band":"calculus","title":"Indeterminate forms and L'Hôpital's rule","short":"L'Hôpital's rule","pre":["mvt","diff-rules"],"sum":"Limits of the forms $\\frac00$ and $\\frac\\infty\\infty$ are not determined by the limits of numerator and denominator separately. L'Hôpital's rule says that, for such a quotient with $g' \\ne 0$ near the limit point, $\\lim f/g = \\lim f'/g'$ whenever the limit of $f'/g'$ exists (finite or infinite); the other indeterminate forms $0\\cdot\\infty$, $\\infty - \\infty$, $1^\\infty$, $0^0$ and $\\infty^0$ are first rewritten as quotients.","key":["\\lim_{x \\to a}\\frac{f(x)}{g(x)} = \\lim_{x \\to a}\\frac{f'(x)}{g'(x)} \\quad \\text{if } f, g \\to 0 \\text{ (or } |g| \\to \\infty\\text{)}, \\ g' \\ne 0 \\text{ near } a, \\text{ and the right side exists in } [-\\infty, \\infty]","f^g = e^{g\\ln f}: \\quad 1^\\infty,\\ 0^0,\\ \\infty^0 \\ \\text{reduce to the form } 0\\cdot\\infty"],"why":"It settles the limits that compare growth rates, for instance that $\\ln x$ grows more slowly than every positive power of $x$ and every power more slowly than $e^x$, which are used constantly in asymptotic analysis.","msc":["26A24"],"links":[{"field":"computer-science","note":"Comparing running times such as n log n and n^1.1 comes down to limits of quotients of the kind the rule evaluates."},{"field":"number-theory","note":"The rule shows that li(x) and x/ln x are asymptotically equal, so the two usual forms of the prime number theorem are equivalent."}],"refs":["Spivak, Calculus","Rudin, Principles of Mathematical Analysis","Stewart, Calculus: Early Transcendentals"],"status":null,"aliases":["L'Hospital's rule","l'Hôpital's rule","Bernoulli's rule","indeterminate forms","0/0","infinity over infinity"],"fields":["calculus"],"stage":"undergraduate","np":{"textbook":0,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":1,"lesson":{"minutes":16,"checks":9,"fixed":0}},{"id":"riemann-integral","band":"calculus","title":"The definite integral","short":"Definite integral","pre":["limits"],"sum":"The definite integral $\\int_a^b f(x)\\,dx$ is the signed area between the graph of $f$ and the $x$-axis, defined by squeezing it between lower and upper sums of rectangles; equivalently, it is the limit of Riemann sums $\\sum f(t_i)\\,\\Delta x_i$ as the subdivision gets finer. Monotone and continuous functions on a closed interval are integrable, and the integral is linear, monotone and additive over intervals.","key":["\\int_a^b f(x)\\,dx = \\lim_{n \\to \\infty}\\sum_{i=1}^n f\\!\\left(a + i\\,\\tfrac{b - a}{n}\\right)\\frac{b - a}{n} \\quad (f \\text{ continuous})","L(f, P) \\le \\int_a^b f(x)\\,dx \\le U(f, P) \\quad \\text{for every partition } P","\\int_a^c f + \\int_c^b f = \\int_a^b f"],"why":"Areas, volumes, work, distance travelled at a varying speed, probabilities from densities and averages of functions are all integrals, and the definition as a limit of sums is what tells you how to set them up.","msc":["26A42"],"links":[{"field":"probability","note":"A continuous random variable is described by a density, and the probability of an interval is the integral of the density over it."},{"field":"physics","note":"Work, mass, charge and displacement are integrals of a varying force, density or velocity."},{"field":"number-theory","note":"Comparing sums with integrals, for example the harmonic sum with ln n, is a basic estimate in analytic number theory."}],"refs":["Spivak, Calculus","Apostol, Calculus, Volume 1","Abbott, Understanding Analysis"],"status":null,"aliases":["Riemann integral","Darboux integral","Riemann sum","upper and lower sums","area under a curve","integrability"],"fields":["calculus","real-analysis"],"stage":"school","np":{"textbook":23,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":28,"lesson":{"minutes":17,"checks":8,"fixed":0}},{"id":"ftc","band":"calculus","title":"The fundamental theorem of calculus","short":"Fundamental theorem of calculus","pre":["riemann-integral","derivative","mvt"],"sum":"Differentiation and integration undo each other. If $f$ is continuous, the accumulated area $F(x) = \\int_a^x f(t)\\,dt$ has derivative $f(x)$; and if $G$ is any antiderivative of an integrable $f$, then $\\int_a^b f(x)\\,dx = G(b) - G(a)$.","key":["\\frac{d}{dx}\\int_a^x f(t)\\,dt = f(x) \\quad (f \\text{ continuous})","\\int_a^b G'(x)\\,dx = G(b) - G(a) \\quad (G' \\text{ integrable})"],"why":"It replaces the limit of sums that defines an integral by the far easier task of finding an antiderivative, and it is why the total change of a quantity can be computed from its rate of change.","msc":["26A06"],"links":[{"field":"physics","note":"Displacement is the integral of velocity and the work done equals the change in kinetic energy, both instances of integrating a derivative."},{"field":"differential-equations","note":"Solving y' = f(x), and separable equations more generally, is integration made possible by the theorem."},{"field":"probability","note":"A distribution function is the integral of its density, so by the first form of the theorem the density is the derivative of the distribution function at every point where the density is continuous."}],"refs":["Spivak, Calculus","Apostol, Calculus, Volume 1","Courant & John, Introduction to Calculus and Analysis I"],"status":null,"aliases":["FTC","Newton–Leibniz formula","antiderivative","primitive","indefinite integral","evaluation theorem","differentiating an integral"],"fields":["calculus"],"stage":"school","np":{"textbook":10,"olympiad":1,"bridge":0,"research":0,"examples":0},"nprob":11,"lesson":{"minutes":16,"checks":8,"fixed":2}},{"id":"integration-techniques","band":"calculus","title":"Techniques of integration","short":"Integration techniques","pre":["ftc","diff-rules"],"sum":"Techniques of integration are the methods for finding antiderivatives in closed form: substitution reverses the chain rule, integration by parts reverses the product rule, and partial fractions and trigonometric substitutions reduce harder integrands to a short table of known ones. Once an antiderivative $F$ of $f$ is found, the fundamental theorem of calculus gives $\\int_a^b f = F(b) - F(a)$.","key":["\\int_a^b f(g(x))\\,g'(x)\\,dx = \\int_{g(a)}^{g(b)} f(u)\\,du","\\int_a^b u\\,v'\\,dx = \\Big[u\\,v\\Big]_a^b - \\int_a^b u'\\,v\\,dx","\\frac{1}{(x-p)(x-q)} = \\frac{1}{p-q}\\left(\\frac{1}{x-p} - \\frac{1}{x-q}\\right), \\quad p \\ne q"],"why":"Areas, volumes, probabilities, work and the solutions of differential equations all come down to evaluating integrals, and these few methods handle most of the integrals with elementary answers that one meets in practice. Integration by parts in particular reappears throughout analysis, from Taylor's remainder to the gamma function.","msc":["26A36"],"links":[{"field":"differential-equations","note":"Solving separable and linear first-order equations amounts to computing two antiderivatives, usually by substitution or partial fractions."},{"field":"physics","note":"Work, centres of mass, moments of inertia and potentials are computed as integrals that are evaluated with these techniques."},{"field":"probability","note":"Expectations of continuous random variables are integrals; for example the mean $1/\\lambda$ of an exponential variable with rate $\\lambda$ comes from one integration by parts."}],"refs":["Spivak, Calculus","Apostol, Calculus, Vol. 1","Stewart, Calculus"],"status":null,"aliases":["antiderivatives","integration by substitution","u-substitution","integration by parts","partial fractions","trigonometric substitution","reduction formula"],"fields":["calculus"],"stage":"school","np":{"textbook":0,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":5,"lesson":{"minutes":20,"checks":11,"fixed":2}},{"id":"improper-integrals","band":"calculus","title":"Improper integrals","short":"Improper integrals","pre":["integration-techniques"],"sum":"An improper integral is an integral over an unbounded interval, or of a function that is unbounded near an endpoint, defined as a limit of ordinary integrals: $\\int_a^\\infty f = \\lim_{b \\to \\infty} \\int_a^b f$. It converges when the limit exists and is finite. The basic yardstick is the $p$-test, and most convergence questions are settled by comparing with $x^{-p}$.","key":["\\int_a^\\infty f(x)\\,dx = \\lim_{b\\to\\infty} \\int_a^b f(x)\\,dx","\\int_1^\\infty \\frac{dx}{x^p} \\text{ converges} \\iff p > 1, \\qquad \\int_0^1 \\frac{dx}{x^p} \\text{ converges} \\iff p < 1","0 \\le f \\le g,\\ \\int_a^\\infty g < \\infty \\implies \\int_a^\\infty f < \\infty"],"why":"Many of the most important integrals in mathematics run over infinite ranges: the Gaussian integral, the gamma function, Fourier and Laplace transforms, and the expected values of continuous random variables. The integral test also turns questions about infinite series into questions about integrals.","msc":["26A42","40A10"],"links":[{"field":"probability","note":"A probability density must have total integral 1 over the real line, and expectations such as the mean of an exponential distribution are improper integrals."},{"field":"special-functions","note":"The gamma, beta and zeta functions are defined or represented by convergent improper integrals."},{"field":"number-theory","note":"The integral test and comparisons like the sum of 1/(n log n) against the integral of 1/(x log x) are basic tools for estimating sums over integers and primes."}],"refs":["Spivak, Calculus","Apostol, Mathematical Analysis","Abbott, Understanding Analysis"],"status":null,"aliases":["improper integral","integral over an infinite interval","convergent integral","p-test","comparison test for integrals","integral test","Dirichlet integral"],"fields":["calculus","real-analysis"],"stage":"undergraduate","np":{"textbook":11,"olympiad":5,"bridge":0,"research":0,"examples":0},"nprob":16,"lesson":{"minutes":18,"checks":11,"fixed":1}},{"id":"taylor","band":"calculus","title":"Taylor polynomials and Taylor's theorem","short":"Taylor's theorem","pre":["mvt","diff-rules"],"sum":"The Taylor polynomial of degree $n$ of $f$ at $a$ is the unique polynomial of degree at most $n$ whose value and first $n$ derivatives at $a$ agree with those of $f$. Taylor's theorem measures the error: if $|f^{(n+1)}| \\le M$ between $a$ and $x$, the error is at most $\\frac{M}{(n+1)!}|x - a|^{n+1}$, so near $a$ the polynomial is a very good approximation.","key":["P_n(x) = \\sum_{k=0}^{n} \\frac{f^{(k)}(a)}{k!}(x-a)^k","f(x) - P_n(x) = \\frac{f^{(n+1)}(\\xi)}{(n+1)!}(x-a)^{n+1} \\quad \\text{for some } \\xi \\text{ between } a \\text{ and } x","f(x) = P_n(x) + o\\big((x-a)^n\\big) \\quad (x \\to a)"],"why":"Taylor expansions are how functions such as $\\sin$, $e^x$ and $\\ln$ are computed, how limits and asymptotic formulas are found, and how physicists linearise a problem near equilibrium. The remainder estimate is what turns a heuristic approximation into a proof with an explicit error.","msc":["26A24","41A58"],"links":[{"field":"physics","note":"Small-oscillation and linear approximations, such as replacing sin(theta) by theta for a pendulum, are first-order Taylor expansions with a controlled error."},{"field":"computer-science","note":"Numerical methods for derivatives, integrals and differential equations are designed and analysed by matching Taylor expansions, and library routines evaluate functions by truncated expansions."},{"field":"number-theory","note":"Taylor's theorem with remainder gives irrationality proofs, such as that of e, and asymptotic expansions used in analytic number theory."}],"refs":["Spivak, Calculus","Apostol, Calculus, Vol. 1","Rudin, Principles of Mathematical Analysis"],"status":null,"aliases":["Taylor polynomial","Maclaurin polynomial","Taylor expansion","Lagrange remainder","Peano remainder","Taylor's formula"],"fields":["calculus","real-analysis"],"stage":"undergraduate","np":{"textbook":7,"olympiad":4,"bridge":0,"research":0,"examples":0},"nprob":11,"lesson":{"minutes":18,"checks":10,"fixed":1}},{"id":"power-series","band":"calculus","title":"Power series","short":"Power series","pre":["series","taylor"],"sum":"A power series $\\sum c_n (x - a)^n$ is a polynomial of infinite degree. It converges absolutely inside an interval $|x - a| < R$ and diverges outside it, where the radius $R$ is determined by how fast the coefficients grow. Inside that interval the sum can be differentiated and integrated term by term, so it behaves like a polynomial and is its own Taylor series.","key":["f(x) = \\sum_{n=0}^\\infty c_n (x - a)^n, \\qquad \\frac{1}{R} = \\limsup_{n\\to\\infty} |c_n|^{1/n}","f'(x) = \\sum_{n=1}^\\infty n\\,c_n (x - a)^{n-1} \\quad (|x - a| < R)","c_n = \\frac{f^{(n)}(a)}{n!}"],"why":"Power series are how $e^x$, $\\sin x$ and $\\cos x$ are defined rigorously and computed, how many differential equations are solved, and, as generating functions, how sequences in combinatorics are counted. They are also the gateway to complex analysis, where they explain the radiu
